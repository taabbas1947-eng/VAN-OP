async function renderProject(hash, id){
  shell('<p class="sub">Loading…</p>', hash);
  const d = await api('GET','/api/pd/projects/'+id);
  const p = d.project, edit = d.caps.edit;
  const problemCard = d.problem
    ? '<div class="card" style="border-color:var(--green);background:var(--green-soft)"><b>Answers '+d.problem.p_label+' — '+esc(d.problem.title)+'</b><div class="sub" style="margin-top:4px">'+esc(d.problem.statement)+'</div></div>'
    : '<div class="card" style="background:var(--amber-soft);border-color:var(--amber)"><span class="sub" style="margin:0">This project does not point at a registered problem yet. Every product concept must answer one.</span></div>';
  const brief = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Product Brief</h2><table>'
    + [['Why — the problem, and why now', p.brief_why],['How — the thesis', p.brief_how],['Routes to explore', p.brief_routes],['Success target (written before the work)', p.brief_target]].map(([k,v])=>'<tr><th style="width:230px">'+k+'</th><td>'+(v&&String(v).trim()?esc(v):'<span class="sub">— not written yet —</span>')+'</td></tr>').join('')
    + '<tr><th>Owner</th><td>'+esc(p.owner_name||'—')+'</td></tr></table></div>';
  const routes = d.routes.length
    ? '<div style="overflow-x:auto"><table><tr><th>Route</th><th>ID</th><th>Title</th><th>Lane</th><th>Stage</th><th>G1</th>'+(edit?'<th></th>':'')+'</tr>'
      + d.routes.map(r=>'<tr><td><b>'+esc(r.route||'—')+'</b></td><td>'+r.h_label+'</td><td><a href="#idea/'+r.id+'">'+esc(r.title)+'</a></td><td class="sub">'+esc(r.lane)+'</td><td><span class="chip stage">'+esc(r.stage_label)+'</span></td><td class="sub">'+(r.screen_decision?esc(r.screen_decision.toUpperCase()):'awaiting screen')+'</td>'+(edit?'<td><button class="btn ghost" data-detach="'+r.id+'">Detach</button></td>':'')+'</tr>').join('')
      + '</table></div>'
    : '<p class="sub" style="margin:0">No routes attached yet. A project with one route is just a route — attach the second one and the grouping starts earning its keep.</p>';
  let attach = '', editForm = '';
  if (edit) {
    const fOpts = d.free.map(f=>'<option value="'+f.id+'">'+f.h_label+' — '+esc(f.title)+(f.route?' ['+esc(f.route)+']':'')+'</option>').join('');
    attach = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 6px">Attach a route</h2><p class="sub" style="margin:0 0 10px">Grouping only. The route keeps its own H-number, Development Record, G2 and beaker gate.</p>'
      + '<div class="row" style="gap:10px;align-items:flex-end"><div style="flex:1;min-width:240px"><label>Idea / route</label><select id="at_hyp"><option value="">—</option>'+fOpts+'</select></div><button class="btn" id="at_submit">Attach</button></div></div>';
    const pOpts = d.problems.map(pb=>'<option value="'+pb.id+'"'+(p.problem_id===pb.id?' selected':'')+'>'+esc(pb.label)+'</option>').join('');
    const uOpts = d.users.map(u=>'<option value="'+u.id+'"'+(p.owner_id===u.id?' selected':'')+'>'+esc(u.name)+'</option>').join('');
    const sOpts = Object.keys(d.projectStatus).map(k=>'<option value="'+k+'"'+(p.status===k?' selected':'')+'>'+esc(d.projectStatus[k])+'</option>').join('');
    editForm = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Edit the Brief</h2>'
      + '<div class="row" style="gap:12px"><div style="flex:1;min-width:130px"><label>Code</label><input id="e_code" value="'+esc(p.code)+'"></div>'
      + '<div style="flex:2;min-width:220px"><label>Title</label><input id="e_title" value="'+esc(p.title)+'"></div>'
      + '<div style="flex:1;min-width:170px"><label>Problem</label><select id="e_prob"><option value="">—</option>'+pOpts+'</select></div>'
      + '<div style="flex:1;min-width:150px"><label>Owner</label><select id="e_owner"><option value="">—</option>'+uOpts+'</select></div>'
      + '<div style="flex:1;min-width:130px"><label>Status</label><select id="e_status">'+sOpts+'</select></div></div>'
      + '<label>Why</label><textarea id="e_why">'+esc(p.brief_why||'')+'</textarea>'
      + '<label>How — the thesis</label><textarea id="e_how">'+esc(p.brief_how||'')+'</textarea>'
      + '<label>Routes to explore</label><textarea id="e_routes">'+esc(p.brief_routes||'')+'</textarea>'
      + '<label>Success target</label><textarea id="e_target">'+esc(p.brief_target||'')+'</textarea>'
      + '<div style="margin-top:12px"><button class="btn" id="e_submit">Save brief</button> <span id="e_msg"></span></div></div>';
  }
  setMain('<h1>'+p.prj_label+' — '+esc(p.code)+' <span class="sub">'+esc(p.status_label)+'</span></h1><p class="sub">'+esc(p.title)+' · <a href="#projects">all projects</a></p>'
    + problemCard + brief + '<h2 style="font-family:var(--serif);font-size:1.2rem">Routes under this project ('+d.routes.length+')</h2><div class="card">'+routes+'</div>' + attach + editForm);
  document.querySelectorAll('[data-detach]').forEach(btn => btn.onclick = async () => {
    try { await api('POST','/api/pd/projects/'+id+'/detach', { hypothesis_id: btn.getAttribute('data-detach') }); renderProject(hash, id); } catch(e){ alert(e.message); }
  });
  if (edit) {
    document.getElementById('at_submit').onclick = async () => {
      const v = document.getElementById('at_hyp').value; if(!v){ return; }
      try { await api('POST','/api/pd/projects/'+id+'/attach', { hypothesis_id: v }); renderProject(hash, id); } catch(e){ alert(e.message); }
    };
    document.getElementById('e_submit').onclick = async () => {
      const g = i => document.getElementById(i).value;
      try { await api('POST','/api/pd/projects/'+id+'/save', { code:g('e_code'), title:g('e_title'), problem_id:g('e_prob'), owner_id:g('e_owner'), status:g('e_status'), brief_why:g('e_why'), brief_how:g('e_how'), brief_routes:g('e_routes'), brief_target:g('e_target') }); renderProject(hash, id); }
      catch(e){ document.getElementById('e_msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
    };
  }
}

async function renderPortfolio(hash){
  shell('<h1>Portfolio</h1><p class="sub">Loading…</p>', hash);
  const d = await api('GET','/api/pd/portfolio');
  const gk = Object.keys(d.conceptGates);
  const productCard = p => {
    const c = p.counts;
    const gates = gk.map(g => { const st = (p.gates[g]||{}).status || 'open'; const col = st==='pass'?'var(--green)':(st==='fail'?'var(--red)':'var(--muted)');
      const note = (p.gates[g]||{}).note; return '<span class="chip" title="'+esc(d.conceptGates[g]+(note?' — '+note:''))+'" style="color:'+col+';border:1px solid '+col+';margin-right:4px">'+g+' '+st+'</span>'; }).join('');
    let gateForm = '';
    if (d.caps.gate) {
      const gOpts = gk.map(g=>'<option value="'+g+'">'+esc(d.conceptGates[g])+'</option>').join('');
      gateForm = '<details style="margin-top:8px"><summary class="sub" style="cursor:pointer">Record a concept gate (A–E)</summary>'
        + '<div class="row" style="gap:10px;margin-top:8px;align-items:flex-end"><div style="flex:2;min-width:220px"><label>Gate</label><select data-gate-sel="'+p.id+'">'+gOpts+'</select></div>'
        + '<div style="flex:1;min-width:110px"><label>Status</label><select data-gate-st="'+p.id+'"><option>open</option><option>pass</option><option>fail</option></select></div>'
        + '<div style="flex:2;min-width:200px"><label>Evidence / note</label><input data-gate-note="'+p.id+'"></div>'
        + '<button class="btn ghost" data-gate="'+p.id+'">Record</button></div></details>';
    }
    let linkForm = '';
    if (d.caps.manage && !p.problem_id) {
      const pOpts = d.problems.map(pr=>'<option value="'+pr.id+'">'+pr.p_label+' '+esc(pr.title)+'</option>').join('');
      linkForm = '<div class="sub" style="margin-top:6px">link to problem: <select data-link="'+p.id+'"><option value=""></option>'+pOpts+'</select></div>';
    }
    return '<div class="card" style="margin-left:18px"><b style="font-size:15px">'+esc(p.code)+'</b> — '+esc(p.name)+' <span class="sub">('+esc(p.status)+')</span>'
      + '<div class="sub" style="margin-top:4px"><b>Ideas:</b> '+c.proposed+' awaiting screen · '+c.alive+' alive · '+c.killed+' killed · '+c.parked+' parked · '+c.validated+' validated</div>'
      + (p.current ? '<div class="sub"><b>Current formulation:</b> v'+p.current.version+' '+esc(p.current.name)+'</div>' : '<div class="sub">No current formulation yet.</div>')
      + '<div style="margin-top:6px">'+gates+' <span class="sub">(hover a gate for its question)</span></div>'+gateForm+linkForm+'</div>';
  };
  let body = '';
  for (const pr of d.problems) {
    body += '<div class="card" style="background:var(--green-soft)"><b style="font-size:15px">'+pr.p_label+' — '+esc(pr.title)+'</b> <span class="sub">('+esc(pr.status)+')</span><div class="sub" style="margin-top:4px">'+esc(pr.statement)+'</div></div>';
    const prods = d.products.filter(p => p.problem_id === pr.id);
    if (prods.length) body += prods.map(productCard).join('');
    else body += '<div class="sub" style="margin:0 0 10px 18px">No product concept attacks this problem yet.</div>';
    if (pr.direct) body += '<div class="sub" style="margin:0 0 10px 18px">'+pr.direct+' idea(s) address this problem directly, not yet attached to a product concept.</div>';
  }
  const orphans = d.products.filter(p => !p.problem_id);
  if (orphans.length) body += '<h2 style="font-family:var(--serif);font-size:1.2rem">Product concepts not yet linked to a problem</h2>' + orphans.map(productCard).join('');
  let newProd = '';
  if (d.caps.manage) {
    const pOpts = d.problems.map(pr=>'<option value="'+pr.id+'">'+pr.p_label+' — '+esc(pr.title)+'</option>').join('');
    newProd = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 6px">New product concept</h2><p class="sub" style="margin:0 0 10px">Created when an idea is judged a distinct product answer to a problem — not for every recipe.</p>'
      + '<div class="row" style="gap:12px"><div style="flex:1;min-width:130px"><label>Code</label><input id="pr_code" placeholder="NP 5-40"></div>'
      + '<div style="flex:2;min-width:220px"><label>Name</label><input id="pr_name"></div>'
      + '<div style="flex:1;min-width:180px"><label>Problem it attacks</label><select id="pr_prob"><option value="">—</option>'+pOpts+'</select></div></div>'
      + '<div style="margin-top:12px"><button class="btn" id="pr_submit">Create concept</button> <span id="pr_msg"></span></div></div>';
  }
  setMain('<h1>Portfolio — problem → product concepts → ideas</h1>'
    + '<p class="sub">A problem is stated in the field; a product concept is stated on a bag (an analysis + a claim answering one problem); an idea is stated at the bench. Ideas run gates G1–G6; concepts are judged on Gates A–E.</p>'
    + (d.problems.length||d.products.length?body:'<div class="card"><p class="sub" style="margin:0">Nothing in the portfolio yet. Register a problem, then create a product concept for it.</p></div>') + newProd);

  document.querySelectorAll('[data-gate]').forEach(btn => btn.onclick = async () => {
    const pid = btn.getAttribute('data-gate');
    const body = { gate: document.querySelector('[data-gate-sel="'+pid+'"]').value, status: document.querySelector('[data-gate-st="'+pid+'"]').value, note: document.querySelector('[data-gate-note="'+pid+'"]').value };
    try { await api('POST','/api/pd/portfolio/products/'+pid+'/gate', body); renderPortfolio(hash); } catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-link]').forEach(sel => sel.onchange = async () => {
    try { await api('POST','/api/pd/portfolio/products/'+sel.getAttribute('data-link')+'/link', { problem_id: sel.value }); renderPortfolio(hash); } catch(e){ alert(e.message); }
  });
  if (d.caps.manage) document.getElementById('pr_submit').onclick = async () => {
    const g = i => document.getElementById(i).value;
    if(!g('pr_code').trim() || !g('pr_name').trim()){ document.getElementById('pr_msg').innerHTML='<span class="err">Code and name are required.</span>'; return; }
    try { await api('POST','/api/pd/portfolio/products', { code:g('pr_code'), name:g('pr_name'), problem_id:g('pr_prob') }); renderPortfolio(hash); }
    catch(e){ document.getElementById('pr_msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
  };
}

async function renderLearnings(hash, search){
  shell('<h1>Learnings</h1><p class="sub">Loading…</p>', hash);
  const d = await api('GET','/api/pd/learnings'+(search?('?s='+encodeURIComponent(search)):''));
  let form = '';
  if (d.caps.add) {
    const hOpts = d.hyps.map(h=>'<option value="'+h.id+'">'+h.h_label+' — '+esc(h.title.slice(0,50))+'</option>').join('');
    form = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Add a learning</h2>'
      + '<label>The fact (1–2 sentences)</label><textarea id="ln_fact"></textarea>'
      + '<div class="row" style="gap:12px"><div style="flex:1;min-width:200px"><label>Evidence level</label><select id="ln_ev"><option value="verified">VERIFIED — proven on VAN bench or field</option><option value="validate" selected>VALIDATE — observed once, needs confirmation</option><option value="open">OPEN — plausible, untested</option></select></div>'
      + '<div style="flex:1;min-width:160px"><label>Tag</label><input id="ln_tag" placeholder="chemistry / process / agronomy / market"></div>'
      + '<div style="flex:1;min-width:150px"><label>Source</label><input id="ln_src" placeholder="DR-0001, T-0003…"></div>'
      + '<div style="flex:1;min-width:180px"><label>Linked idea</label><select id="ln_hyp"><option value="">—</option>'+hOpts+'</select></div></div>'
      + '<div style="margin-top:12px"><button class="btn" id="ln_submit">Save learning</button> <span id="ln_msg"></span></div></div>';
  }
  const rows = d.learnings.map(l=>'<tr><td>'+esc(l.fact)+'</td><td>'+esc((l.evidence||'').toUpperCase())+'</td><td>'+esc(l.tag||'')+'</td><td>'+esc(l.source||'')+(l.h_label?' · '+l.h_label:'')+'</td><td class="sub">'+esc(l.added_by_name)+'</td><td class="sub">'+esc(fmtDate(l.added_at))+'</td></tr>').join('');
  setMain('<h1>Learnings — what VAN knows</h1>'
    + '<p class="sub">One verified fact per entry, written so it is useful without opening the record it came from. Tag entries so the system can surface them next to new ideas.</p>'
    + form
    + '<div class="card" style="display:flex;gap:8px;align-items:flex-end"><div style="flex:1"><label>Search learnings</label><input id="ln_search" value="'+esc(search||'')+'"></div><button class="btn ghost" id="ln_go">Search</button></div>'
    + '<div class="card">'+(d.learnings.length?'<div style="overflow-x:auto"><table><tr><th>Fact</th><th>Evidence</th><th>Tag</th><th>Source</th><th>By</th><th>When</th></tr>'+rows+'</table></div>':'<p class="sub" style="margin:0">No learnings yet'+(search?' matching that search':'')+'.</p>')+'</div>');

    const g = i => document.getElementById(i).value;

      + '<div style="flex:1;min-width:180px"><label>Parent version</label><select id="fm_parent"><option value="">—</option>'+fOpts+'</select></div>'
      + '<div style="flex:1;min-width:180px"><label>Born from idea</label><select id="fm_hyp"><option value="">—</option>'+hOpts+'</select></div>'
      + '<div style="flex:1;min-width:150px"><label>Proven by record</label><select id="fm_rec"><option value="">—</option>'+rOpts+'</select></div>'

    body += '<div class="card"><div style="overflow-x:auto"><table><tr><th>Ver</th><th>Name</th><th>Status</th><th>Parent</th><th>From idea / record</th><th>Change &amp; why</th>'+(d.caps.add?'<th></th>':'')+'</tr>'
      + vers.map(f=>'<tr><td>v'+f.version+'</td><td>'+esc(f.name)+'</td><td>'+(f.status==='current'?'<span class="chip light">current</span>':esc(f.status))+'</td><td>'+(f.parent_version?'v'+f.parent_version:'—')+'</td><td>'+(f.h_label||'—')+(f.record_no?' / '+esc(f.record_no):'')+'</td><td class="sub">'+(d.seesComposition?esc((f.change_reason||'').slice(0,120)):'<i>restricted</i>')+'</td>'+(d.caps.add?'<td>'+(f.status!=='current'?'<button class="btn ghost" data-current="'+f.id+'">Make current</button>':'')+'</td>':'')+'</tr>').join('')
      + '</table></div></div>';
  }
  setMain('<h1>Formulation register — why the product is the way it is</h1>'
    + (d.seesComposition?'':'<div class="card" style="background:var(--amber-soft);border-color:var(--amber)"><span class="sub" style="margin:0">Compositions and change details are restricted to senior technical roles — you can see the version chain and status.</span></div>')
    + '<p class="sub">Every version of every product formulation, with its parent, the idea that changed it, and the record that proved it. Nothing is overwritten: superseded versions keep their place in the chain.</p>'
    + form + (d.products.length?body:'<div class="card"><p class="sub" style="margin:0">No products yet — create a product concept in the Portfolio first.</p></div>'));

    try { await api('POST','/api/pd/formulations', { product_id:g('fm_prod'), name:g('fm_name'), parent_formulation_id:g('fm_parent'), hypothesis_id:g('fm_hyp'), dev_record_id:g('fm_rec'), status:g('fm_status'), composition:g('fm_comp'), change_reason:g('fm_change') }); renderFormulations(hash); }

/* ---------- Pipeline board (kanban) ---------- */
async function renderBoard(hash){
  shell('<h1>Pipeline board</h1><p class="sub">Loading…</p>', hash);
  const d = await api('GET','/api/pd/board');
  const cols = [['proposed','G1 · Awaiting screen'],['screened','Screened → design'],['designed','G2 · Design signed'],['sampled','G3 · Bench open'],['tested','Tested (lab)'],['evaluated','G4 · Evaluated'],['field_trial','G5 · Field trial'],['validated','G6 · Validated']];
  const byStage = {}; d.items.forEach(x => (byStage[x.stage] = byStage[x.stage] || []).push(x));
  const card = x => {
    let flag = '';
    if (x.stage === 'proposed' && x.age_days > d.slaDays) flag = '<br><b style="color:var(--red);font-size:12px">'+x.age_days+' days — over target</b>';
    const st = (x.stage==='parked'||x.stage==='killed') ? ' <span class="chip stage">'+x.stage+'</span>' : '';
    return '<a class="clickable" style="display:block;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;text-decoration:none;color:inherit;background:var(--surface)" href="#idea/'+x.id+'"><b>'+x.h_label+'</b>'+(x.lane==='light'?' <span class="sub">light</span>':'')+st+'<br>'+esc(x.title)+flag+'</a>';
  };
  const col = (key, label, items) => '<div style="min-width:210px;max-width:230px;flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px">'
    + '<div style="display:flex;justify-content:space-between;font-weight:600;font-size:.85rem;margin-bottom:10px"><span>'+esc(label)+'</span><span class="sub">'+items.length+'</span></div>'
    + (items.length ? items.map(card).join('') : '<span class="sub">—</span>') + '</div>';
  const parked = [...(byStage.parked||[]), ...(byStage.killed||[])];
  const board = '<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px">'
    + cols.map(([k,l]) => col(k, l, byStage[k]||[])).join('')
    + col('parked', 'Parked / closed', parked) + '</div>';
  const total = d.items.length;
  const stale = d.stale.length ? '<h2 style="font-family:var(--serif);font-size:1.2rem">Needs a decision — untouched 4+ weeks</h2>'
    + '<div class="card"><ul style="margin:0;padding-left:18px">'+d.stale.map(s=>'<li><a href="#idea/'+s.id+'">'+s.h_label+'</a> — '+esc(s.title)+' <span class="sub">('+esc(s.stage_label)+', last touched '+esc(fmtDate(s.updated_at))+')</span></li>').join('')+'</ul><p class="sub" style="margin:8px 0 0">A gate that cannot yet be answered is explicitly PARKED with a reason — never left pending in silence.</p></div>' : '';
  setMain('<h1>Pipeline board</h1>'
    + (total ? '<p class="sub">The pipeline, left to right by stage. Ideas enter at G1 and move right <b>only</b> through a gate — no card drifts forward on its own. Scroll sideways for later stages. Click a card to open it.</p>' : '<div class="card"><p class="sub" style="margin:0">Nothing logged yet. That is normal for day one — bring something in from <a href="#new">New idea</a>.</p></div>')
    + (total ? board : '') + stale);
}

async function renderDropbox(hash){
  shell('<h1>Drop box</h1><p class="sub">Loading…</p>', hash);
  const d = await api('GET','/api/pd/dropbox');
  const rows = d.entries.map(e => {
    let status, action;

      action = '<div style="display:flex;flex-direction:column;gap:6px;min-width:200px"><input id="dbt_'+e.id+'" placeholder="Short title for the idea" maxlength="200"><button class="btn" data-convert="'+e.id+'">Log as idea</button><button class="btn ghost" data-dismiss="'+e.id+'">Dismiss</button></div>'; }
    else if (e.status==='converted') { status='converted'+(e.h_label?' → '+e.h_label:'')+'<br><span class="sub">by '+esc(e.handler||'')+'</span>'; action='—'; }
    else { status='dismissed<br><span class="sub">by '+esc(e.handler||'')+'</span>'; action='—'; }
    return '<tr><td class="sub" style="white-space:nowrap">'+esc(fmtDate(e.created_at))+'</td>'
      + '<td><b>'+esc(e.name)+'</b>'+(e.contact?'<br><span class="sub">'+esc(e.contact)+'</span>':'')+'<br><span class="sub">from: '+esc(e.source_label)+'</span></td>'
      + '<td class="sub" style="white-space:pre-wrap;max-width:340px">'+esc(e.text)+'</td><td class="sub">'+status+'</td><td>'+action+'</td></tr>';
  }).join('');
  setMain('<h1>Drop box — the open door</h1>'
    + '<p class="sub">Anyone — factory staff, a dealer, a farmer, a regulator — can drop an idea or problem in <b>without an account</b> at <a href="/pd/drop" target="_blank">/pd/drop</a>. Triage them here: convert the good ones into logged ideas (H-numbers), dismiss the rest. Nothing is deleted.</p>'
    + '<div class="card">'+(d.entries.length?'<div style="overflow-x:auto"><table><tr><th>When</th><th>Who / source</th><th>Text</th><th>Status</th><th>Action</th></tr>'+rows+'</table></div>':'<p class="sub" style="margin:0">Nothing in the box yet.</p>')+'</div>');
  document.querySelectorAll('[data-convert]').forEach(b => b.onclick = async () => {
    const eid = b.getAttribute('data-convert'); const title = document.getElementById('dbt_'+eid).value;
    try { await api('POST','/api/pd/dropbox/'+eid+'/convert', { title }); renderDropbox(hash); } catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-dismiss]').forEach(b => b.onclick = async () => {
    try { await api('POST','/api/pd/dropbox/'+b.getAttribute('data-dismiss')+'/dismiss', {}); renderDropbox(hash); } catch(e){ alert(e.message); }
  });
}

/* ---------- The Library ---------- */
function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function openLibFile(id){
  try {
    const r = await fetch('/api/pd/library/'+id+'/file', { headers: authHdr() });
    if (!r.ok) { alert('Could not open the file.'); return; }
    const url = URL.createObjectURL(await r.blob());
    window.open(url, '_blank');
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  } catch(e){ alert(e.message); }
}
const EVCOL = { verified:'var(--green)', validate:'var(--amber)', open:'var(--muted)' };

async function renderLibrary(hash, kind, ev, qy){
  shell('<h1>Library</h1><p class="sub">Loading…</p>', hash);
  const qs = []; if (kind) qs.push('kind='+encodeURIComponent(kind)); if (ev) qs.push('ev='+encodeURIComponent(ev)); if (qy) qs.push('q='+encodeURIComponent(qy));
  const d = await api('GET','/api/pd/library'+(qs.length?('?'+qs.join('&')):''));
  const f = d.filters;
  const kindOpts = '<option value="">all</option>'+Object.keys(d.kinds).map(k=>'<option value="'+k+'"'+(f.kind===k?' selected':'')+'>'+esc(d.kinds[k].split(' — ')[0])+'</option>').join('');
  const evOpts = '<option value="">all</option>'+Object.keys(d.evidenceShort).map(k=>'<option value="'+k+'"'+(f.ev===k?' selected':'')+'>'+esc(d.evidenceShort[k])+'</option>').join('');
  const filter = '<div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'
    + '<div style="flex:1;min-width:200px"><label>Search</label><input id="lb_q" value="'+esc(f.q||'')+'" placeholder="title, why, body, tag, source"></div>'
    + '<div><label>Kind</label><select id="lb_kind">'+kindOpts+'</select></div>'
    + '<div><label>Evidence</label><select id="lb_ev">'+evOpts+'</select></div>'
    + '<button class="btn ghost" id="lb_filter">Filter</button>'
    + ((f.q||f.kind||f.ev)?'<button class="btn ghost" id="lb_clear">clear</button>':'')+'</div>';

  const items = d.items.length ? d.items.map(r => '<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:baseline">'
    + '<b>'+r.l_label+'</b><a href="#libitem/'+r.id+'" style="font-weight:600;font-size:15px">'+esc(r.title)+'</a>'
    + '<span class="sub" style="color:'+(EVCOL[r.evidence]||'')+';font-weight:600">'+esc(r.evidence_short)+'</span>'
    + '<span class="sub">'+esc(r.kind_label)+(r.kind==='document'?' · '+esc((r.file_ext||'').toUpperCase())+' · '+esc(r.size_h||''):'')+'</span>'
    + (r.tag?'<span class="sub">#'+esc(r.tag)+'</span>':'')+'</div>'
    + '<div class="sub" style="margin-top:6px;color:var(--text)">'+esc(r.why)+'</div>'
    + '<div class="sub" style="margin-top:6px">added by '+esc(r.aname)+' · '+esc(fmtDate(r.added_at))+' · '+r.ncom+' comment'+(r.ncom===1?'':'s')
    + (r.npin?' · pinned to '+r.npin+' place'+(r.npin===1?'':'s'):'')+' · <a href="#libitem/'+r.id+'">open</a>'
    + (r.kind==='link'?' · <a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer nofollow">go to source</a>':'')
    + (r.kind==='document'?' · <a href="javascript:void(0)" data-file="'+r.id+'">open file</a>':'')+'</div></div>').join('')
    : '<div class="card"><p class="sub" style="margin:0">Nothing here yet'+((f.q||f.kind||f.ev)?' matching that filter':'')+'.</p></div>';

  const storeCard = d.store ? '<div class="card" style="background:var(--surface-2)"><span class="sub" style="margin:0"><b>File store:</b> '+esc(d.store.totalH)+' across '+d.store.documents+' documents, in <code>'+esc(d.store.dir)+'</code> (outside the web folder). The daily DB backup does <b>not</b> include these files — back that folder up separately.</span></div>' : '';

  // add form
  const kindAdd = Object.keys(d.kinds).filter(k => k!=='document' || d.mayUpload).map(k=>'<option value="'+k+'">'+esc(d.kinds[k])+'</option>').join('');
  const evAdd = Object.keys(d.evidence).map(k=>'<option value="'+k+'"'+(k==='open'?' selected':'')+'>'+esc(d.evidence[k])+'</option>').join('');
  const pinOpts = '<option value="">— nowhere in particular —</option>'
    + d.pins.hyps.map(x=>'<option value="'+x.value+'">'+esc(x.label)+'</option>').join('')
    + d.pins.projects.map(x=>'<option value="'+x.value+'">'+esc(x.label)+'</option>').join('')
    + d.pins.problems.map(x=>'<option value="'+x.value+'">'+esc(x.label)+'</option>').join('');
  const addForm = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 6px">Add something</h2>'
    + '<p class="sub" style="margin:0 0 10px">Prefer a <b>note</b> or a <b>link</b> over an upload — a note can be read on a phone and costs nothing; a link raises no copyright question.'+(d.mayUpload?'':' Uploading is an operator action; you can add notes and links.')+'</p>'
    + '<div class="row" style="gap:12px"><div style="flex:1;min-width:170px"><label>Kind</label><select id="la_kind">'+kindAdd+'</select></div>'
    + '<div style="flex:2;min-width:220px"><label>Title</label><input id="la_title"></div>'
    + '<div style="flex:1;min-width:200px"><label>Evidence tag</label><select id="la_ev">'+evAdd+'</select></div>'
    + '<div style="flex:1;min-width:160px"><label>Source</label><input id="la_src" placeholder="Author, journal, supplier"></div>'
    + '<div style="flex:1;min-width:140px"><label>Tag</label><input id="la_tag" placeholder="phosphate, zinc…"></div>'
    + '<div style="flex:1;min-width:200px"><label>Pin it to</label><select id="la_pin">'+pinOpts+'</select></div></div>'
    + '<label>Why should the team read this?</label><input id="la_why" placeholder="One line. If you cannot say why it matters, it does not belong in the library.">'

  setMain('<h1>Library</h1><p class="sub">Everything worth reading, in one place. Every item says <b>why</b> it is here and what kind of evidence it is — VERIFIED, VALIDATE, or OPEN. Anyone signed in can read anything here and comment on it.</p>'
    + filter + storeCard + items + addForm);

  const go = () => renderLibrary(hash, document.getElementById('lb_kind').value, document.getElementById('lb_ev').value, document.getElementById('lb_q').value);
  document.getElementById('lb_filter').onclick = go;
  document.getElementById('lb_q').onkeydown = e => { if(e.key==='Enter') go(); };
  const clr = document.getElementById('lb_clear'); if (clr) clr.onclick = () => renderLibrary(hash);
  document.querySelectorAll('[data-file]').forEach(a => a.onclick = () => openLibFile(a.getAttribute('data-file')));
  const swap = () => { const k = document.getElementById('la_kind').value;
    document.getElementById('la_note').style.display = k==='note'?'':'none';
    document.getElementById('la_link').style.display = k==='link'?'':'none';
    document.getElementById('la_doc').style.display = k==='document'?'':'none'; };
  document.getElementById('la_kind').onchange = swap; swap();
  document.getElementById('la_submit').onclick = async () => {
    const g = i => document.getElementById(i).value;
    const kind = g('la_kind');
    const body = { kind, title:g('la_title'), why:g('la_why'), evidence:g('la_ev'), source:g('la_src'), tag:g('la_tag'), pin:g('la_pin'), body:g('la_body'), url:g('la_url') };
    if (kind==='document') { const fi = document.getElementById('la_file'); if(!fi.files[0]){ document.getElementById('la_msg').innerHTML='<span class="err">Choose a file.</span>'; return; } body.file_data = await fileToBase64(fi.files[0]); body.file_name = fi.files[0].name; }
    try { await api('POST','/api/pd/library', body); renderLibrary(hash); }
    catch(e){ document.getElementById('la_msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
  };
}

async function renderLibItem(hash, id){

  const archived = Number(it.archived) ? '<div class="card" style="background:var(--amber-soft);border-color:var(--amber)"><span class="sub" style="margin:0"><b>Archived.</b> '+esc(it.archived_reason||'')+' — off the shelf, not deleted.</span></div>' : '';

    + '<tr><th style="width:180px">Why it is here</th><td>'+esc(it.why)+'</td></tr>'
    + '<tr><th>Evidence</th><td style="color:'+(EVCOL[it.evidence]||'')+';font-weight:600">'+esc(it.evidence_label)+'</td></tr>'
    + '<tr><th>Kind</th><td>'+esc(it.kind_label)+'</td></tr>'

    + (it.tag?'<tr><th>Tag</th><td>#'+esc(it.tag)+'</td></tr>':'')
    + '<tr><th>Added by</th><td>'+esc(it.aname)+' · '+esc(it.role_label)+' · '+esc(fmtDate(it.added_at))+'</td></tr></table></div>';
  let content = '';
  if (it.kind==='link') content = '<div class="card"><a class="btn" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer nofollow">Open the source →</a><p class="sub" style="margin:8px 0 0">'+esc(it.url)+'</p></div>';
  if (it.kind==='document') content = '<div class="card"><button class="btn" id="li_file">Open '+esc(it.file_name||'file')+'</button><p class="sub" style="margin:8px 0 0">'+esc((it.file_ext||'').toUpperCase())+' · '+esc(it.size_h||'')+' · not reachable except through this system, and only when signed in.</p></div>';
  if (it.kind==='note' && (it.body||'').trim()) content = '<h2 style="font-family:var(--serif);font-size:1.2rem">The note</h2><div class="card"><div style="white-space:pre-wrap">'+esc(it.body)+'</div></div>';

  const pinRows = d.pins.length ? '<div class="card"><table>'+d.pins.map(p=>'<tr><td>'+(p.href?'<a href="'+p.href+'">'+esc(p.label)+'</a>':esc(p.label))+'</td><td style="width:80px"><button class="btn ghost" data-unpin="'+p.id+'">unpin</button></td></tr>').join('')+'</table></div>' : '<div class="card"><p class="sub" style="margin:0">Nowhere yet. Pin it to a route, project or problem so the reading sits next to the work.</p></div>';
  const pinOpts = '<option value="">—</option>'+d.targets.hyps.map(x=>'<option value="'+x.value+'">'+esc(x.label)+'</option>').join('')+d.targets.projects.map(x=>'<option value="'+x.value+'">'+esc(x.label)+'</option>').join('')+d.targets.problems.map(x=>'<option value="'+x.value+'">'+esc(x.label)+'</option>').join('');
  const pinForm = '<div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end"><div style="flex:1;min-width:240px"><label>Pin it somewhere</label><select id="li_pin">'+pinOpts+'</select></div><button class="btn ghost" id="li_pinbtn">Pin</button></div>';

  const comments = d.comments.map(c=>'<div class="card" style="padding:10px 12px"><div class="sub">'+esc(c.name)+' · '+esc(c.role_label)+' · '+esc(fmtDate(c.added_at))+'</div><div style="margin-top:4px;white-space:pre-wrap">'+esc(c.body)+'</div></div>').join('');
  const commentBlock = '<h2 style="font-family:var(--serif);font-size:1.2rem">Discussion ('+d.comments.length+')</h2>'
    + '<p class="sub">Anyone signed in can comment. This is discussion, not a decision — gate decisions stay in the Gate log. Comments are permanent.</p>'
    + (d.comments.length?comments:'<div class="card"><p class="sub" style="margin:0">Nothing said yet.</p></div>')
    + '<div class="card"><label>Add a comment</label><textarea id="li_comment" placeholder="What do you make of this? Disagreement is welcome."></textarea><div style="margin-top:10px"><button class="btn" id="li_cbtn">Post comment</button> <span id="li_cmsg"></span></div></div>';

  let registrar = '';
  if (d.caps.archive) {
    registrar = Number(it.archived)
      ? '<h2 style="font-family:var(--serif);font-size:1.2rem">Registrar</h2><div class="card"><button class="btn ghost" id="li_restore">Put it back on the shelf</button></div>'
      : '<h2 style="font-family:var(--serif);font-size:1.2rem">Registrar</h2><div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end"><div style="flex:1;min-width:240px"><label>Take it off the shelf (never deleted)</label><input id="li_reason" placeholder="Why — superseded, wrong file, duplicate of L-0xx"></div><button class="btn ghost" id="li_archive">Archive</button></div>';
  }

  setMain('<h1>'+it.l_label+' · '+esc(it.title)+'</h1><p class="sub"><a href="#library">back to the library</a></p>'
    + archived + detail + content
    + '<h2 style="font-family:var(--serif);font-size:1.2rem">Pinned to</h2>'+pinRows+pinForm
    + commentBlock + registrar);

  const fileBtn = document.getElementById('li_file'); if (fileBtn) fileBtn.onclick = () => openLibFile(id);
  document.querySelectorAll('[data-unpin]').forEach(b => b.onclick = async () => { try { await api('POST','/api/pd/library/'+id+'/unpin', { pin_id: b.getAttribute('data-unpin') }); renderLibItem(hash, id); } catch(e){ alert(e.message); } });
  document.getElementById('li_pinbtn').onclick = async () => { const v = document.getElementById('li_pin').value; if(!v) return; try { await api('POST','/api/pd/library/'+id+'/pin', { pin: v }); renderLibItem(hash, id); } catch(e){ alert(e.message); } };
  document.getElementById('li_cbtn').onclick = async () => { const v = document.getElementById('li_comment').value; if(!v.trim()){ document.getElementById('li_cmsg').innerHTML='<span class="err">Write something first.</span>'; return; } try { await api('POST','/api/pd/library/'+id+'/comment', { body: v }); renderLibItem(hash, id); } catch(e){ document.getElementById('li_cmsg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; } };
  if (d.caps.archive) {
    const ar = document.getElementById('li_archive'); if (ar) ar.onclick = async () => { try { await api('POST','/api/pd/library/'+id+'/archive', { reason: document.getElementById('li_reason').value }); renderLibItem(hash, id); } catch(e){ alert(e.message); } };
    const rs = document.getElementById('li_restore'); if (rs) rs.onclick = async () => { try { await api('POST','/api/pd/library/'+id+'/restore', {}); renderLibItem(hash, id); } catch(e){ alert(e.message); } };
  }
}

/* ---------- Guide + Doctrine (static content pages) ---------- */
async function renderGuide(hash){
  shell('<h1>How VAN R&amp;D works</h1><p class="sub">Loading…</p>', hash);
  const d = await api('GET','/api/pd/guide');
  const SLA = d.slaDays, REV = d.reversalDays;
  const HOWTO = {
    coo:{ line:'You own the framework and screen new-product ideas — the HEAVY lane.', go:'#board', goLabel:'Go to the Board', first:'Open the Board and look at "Awaiting screen".',
      does:['Open the <b>Board</b> each day and clear anything in "Awaiting screen".','Screen every new-product idea within '+SLA+' days: LOG, PARK or CLOSE — always with a reason.','Chair the committee at G3–G6 and record each decision in the <b>Gate log</b>.','Skim the weekly light-lane digest; you may reverse a PD-Lead decision within '+REV+' days.'] },
    ceo:{ line:'You are the independent voice at the expensive gates — not a routine approver.', go:'#gatelog', goLabel:'Go to the Gate log', first:'Open the Gate log to see how decisions are recorded.',
      does:['Advise and challenge at G5 (field trial) and G6 (launch).','Read the Gate log when you want the full decision history — every reason is kept forever.'] },
    qc_head:{ line:'You own the chemistry, and you wear the PD Lead hat to screen the LIGHT lane (improvements, variants, reformulations, product-fixes).', go:'#ideas', goLabel:'Go to Ideas', first:'Open Ideas to see what has passed the screen and needs a record.',
      does:['Screen light-lane items in the weekly triage — LOG, PARK or CLOSE with a reason.','Write the <b>Development Record</b> for each route — the chemistry, on paper, with pass/kill numbers — BEFORE any sample is made.','Never sign G2 on your own team\'s design; the Plant Manager (or COO) signs.','Propose the winning experiment run for promotion to Formulation v1.'] },
    rta:{ line:'You are the Plant Manager — the technical reviewer, and the on-site signer when the COO is not there.', go:'#records', goLabel:'Go to Dev Records', first:'Open Dev Records to see what is waiting for your review.',
      does:['Review every Development Record: is the chemistry sound and the record honest?','Sign <b>G2</b> on site under delegated authority (the COO ratifies within 48 h).','Deputise as the light-lane screener when the PD Lead is away.','<b>Backup G1 screener:</b> when the COO is unavailable, you screen — provisional, ratified by the COO, but the submitter gets their answer on time.'] },
    production:{ line:'You are the voice of "can we actually make it?" — at triage and before any scale-up.', go:'#board', goLabel:'Go to the Board', first:'Open the Board to see what is in the pipeline.',
      does:['Give a quick manufacturability read at triage (kills unmakeable ideas for free).','Do the full feasibility & costing review before G6 — that review is the ticket to launch.'] },
    agronomy:{ line:'You design and run the field trials that prove a product beats DAP in the ground.', go:'#trials', goLabel:'Go to Field Trials', first:'Open Field Trials to see what is planned or running.',
      does:['Design each trial with a real DAP control, replication, and measures fixed before sowing.','Record the trial and its result against the criteria written before the season.'] },
    custodian:{ line:'You are the Registrar — you keep the memory whole and keep the queue moving.', go:'#board', goLabel:'Go to the Board', first:'Open the Board and check "Awaiting screen" for anything ageing.',
      does:['Check the intake queue <b>every working day</b>; nudge the screener on anything waiting more than 2 working days so nothing breaches the '+SLA+'-day target.','Minute every committee decision in the Gate log; run the monthly parked-idea re-look.','Keep accounts, run backups, and watch data quality.'] },
    lab_tech:{ line:'You run the bench: every sample and every lab test you make gets an ID and lives forever.', go:'#samples', goLabel:'Go to Samples', first:'Open Samples and check what is awaiting bench work.',
      does:['Log each sample the day it is made — failed batches too; a failed batch with honest notes is data.','Log each measurement on Lab Tests against its sample, with method and pass/fail.','Samples only start after the committee opens the beaker gate (G3) — the system enforces this.'] },
    consultant:{ line:'You are an outside pair of eyes — you can read everything and suggest anything, and decisions stay with the committee.', go:'#portfolio', goLabel:'See the Portfolio', first:'Open the Portfolio for the current state of play.',
      does:['Read the Portfolio, Dev Records and Gate log to see the state of play and the reasons behind each decision.','Put suggestions or challenges in through the Ideas page — they are screened like everything else.'] },
    member:{ line:'You can share a problem, an idea, or a challenge with a product we already make — and you will always get an answer with a reason.', go:'#new', goLabel:'Share an idea', first:'Share your first idea.',
      does:['Share anything through the New idea page — you never need permission.','You will be told the decision and the reason within '+SLA+' days. A killed idea is still a contribution.'] },
  };
  const r = HOWTO[d.role] || HOWTO.member;
  const gatesRows = Object.keys(d.gates).map(gk => '<tr><td><b>'+esc(d.gates[gk])+'</b></td><td>'+(d.outcomes[gk]||[]).map(o=>esc(o[1])).join('<br>')+'</td></tr>').join('');
  const H = t => '<h2 style="font-family:var(--serif);font-size:1.15rem;margin:20px 0 8px">'+t+'</h2>';
  setMain(
    '<h1>How VAN R&amp;D works — and how to use it</h1>'
    + '<p class="sub">The working guide — the <i>how</i> and the <i>why</i> in one place. It speaks in role titles; the people behind each role are set on the platform\'s access page.</p>'
    + '<div class="card" style="background:var(--green-soft);border-color:var(--green)"><div class="sec" style="margin-top:0">Why this exists — read once, then get on with it</div>'
    + '<p style="margin:0 0 8px"><b>Buy the discipline, not the system.</b> No software makes an organisation careful. Three habits do:</p>'
    + '<ol style="margin:0 0 8px 18px"><li><b>Every idea is logged and answered with a reason.</b></li><li><b>Every decision names an outcome and a reason.</b> "We discussed it" is not a decision.</li><li><b>Every claim cites evidence, not memory.</b></li></ol>'
    + '<p class="sub" style="margin:0">The longer version is on the <a href="#doctrine"><b>Why this exists</b></a> page.</p></div>'
    + '<div class="card" style="border:2px solid var(--green)"><div class="sec" style="margin-top:0">Your part — '+esc(d.roleLabel)+'</div><p>'+r.line+'</p><ul style="margin:0 0 10px 18px">'+r.does.map(x=>'<li style="margin-bottom:4px">'+x+'</li>').join('')+'</ul>'
    + '<p style="margin:0"><b>Start here:</b> '+esc(r.first)+' <a class="btn" href="'+d.landingHash+'" style="margin-left:6px">Start</a>'+(r.go!==d.landingHash?' <a class="btn ghost" href="'+r.go+'">'+esc(r.goLabel)+'</a>':'')+'</p></div>'
    + H('1. The one goal')
    + '<div class="card"><p style="margin:0">Catch and kill weak ideas at the cheapest possible stage — on paper — so time, energy and money are only invested in ideas that survive scrutiny. Ideas come in freely; money goes out slowly through gates; every decision is kept forever. <b>The gates scrutinise ideas, never people.</b></p></div>'
    + H('2. How the work is shaped — four levels')
    + '<div class="card" style="padding:2px 0"><div style="overflow-x:auto"><table><tr><th>Level</th><th>What it is</th><th>Example</th></tr>'
      + '<tr><td><b>Problem</b></td><td>A pain in the field or market, in farmer terms — never chemistry.</td><td>P fixation locks up 80% of applied P.</td></tr>'
      + '<tr><td><b>Development Project</b></td><td>A product concept answering a problem, opened by a Brief. Runs several routes at once.</td><td>The "NP 5-40 project", running R1–R8.</td></tr>'
      + '<tr><td><b>Route</b></td><td>One named approach. Gets ONE signed Development Record.</td><td>R3 — humate-coated granule.</td></tr>'
      + '<tr><td><b>Experiment run</b></td><td>One recipe-and-test cycle. Many per route; most fail — that is their job.</td><td>Batch #37: humate 15%, acid 52%.</td></tr></table></div></div>'
    + H('3. Two lanes — not everything needs the COO')
    + '<div class="card" style="padding:2px 0"><div style="overflow-x:auto"><table><tr><th>Lane</th><th>What\'s in it</th><th>Who screens</th></tr>'
      + '<tr><td><span class="chip light">light</span></td><td>Improvement · variant · reformulation · process · product challenge</td><td>PD Lead (the QC Head\'s hat), in weekly triage. The COO sees every one and may reverse within '+REV+' days.</td></tr>'
      + '<tr><td><span class="chip heavy">heavy</span></td><td>A brand-new product concept</td><td>The COO, directly.</td></tr></table></div></div>'
    + H('4. The six gates — and the possible decisions at each')
    + '<div class="card"><p class="sub" style="margin:0 0 8px">A gate never ends "pending". It ends in exactly one of a fixed, named set — always with a written reason kept forever.</p><div style="overflow-x:auto"><table><tr><th>Gate</th><th>Possible decisions</th></tr>'+gatesRows+'</table></div></div>'
    + H('5. The rules that never bend')
    + '<div class="card"><ul style="margin:0 0 0 18px"><li>No advance without a gate; every decision carries a reason.</li><li>The writer never approves their own design — the QC Head never signs G2 on their own team\'s work.</li><li>Nothing is ever deleted — killed and parked ideas keep their number and reason forever.</li><li>When a step\'s holder is away, a named deputy covers.</li><li>The system speaks in role titles; names live only on the access page.</li></ul></div>'
    + '<p class="sub">Questions about the process go to the COO. Questions about your account or the record go to the Registrar.</p>'
  );
}

function renderDoctrine(hash){
  const thesis = t => '<div style="border-left:4px solid var(--green);padding:2px 0 2px 16px;margin:20px 0;font-size:16px;color:var(--text)">'+t+'</div>';
  const h2 = t => '<h2 style="font-family:var(--serif);font-size:1.2rem;margin:22px 0 8px">'+t+'</h2>';
  const p = t => '<div class="card"><p style="margin:0;font-size:15px;line-height:1.6">'+t+'</p></div>';
  shell('<div style="max-width:680px;margin:0 auto">'
    + '<h1 style="font-size:1.6rem;line-height:1.25;margin:6px 0 4px">Why we built this</h1>'
    + '<p class="sub" style="font-size:15px;margin:0 0 16px">Read this once, slowly. It is not the rules — it is the reason. If it does not feel true to you, tell us; a doctrine only works if the people living it believe it. &nbsp;<a href="#guide">← back to the Guide</a></p>'
    + thesis('We are small, and that is our advantage — not our excuse.<br>Everyone here wears three hats. So we will not build a heavy machine that needs a full-time crew to feed it. We will build the lightest possible discipline, and let it earn the right to grow.')
    + p('<b>Buy the discipline, not the system.</b> Discipline is what every one of us adopts on day one — a few honest habits that take a sentence to perform. The system is only the place those habits live. If we ever get that order backwards — a rich system first, and hope discipline follows — the weight will kill it. A small, disciplined core earns the right to grow.')
    + h2('The three habits — this is the whole foundation')
    + '<div style="background:var(--green);color:#fff;border-radius:12px;padding:18px 20px;margin:14px 0"><p style="margin:0 0 10px;font-size:15px;line-height:1.5"><b>1. Every idea is logged, and every idea gets an answer with a reason.</b> No idea is ever killed in silence. A killed idea, answered honestly, is still a contribution.</p><p style="margin:0 0 10px;font-size:15px;line-height:1.5"><b>2. Every decision names its outcome and its reason.</b> We do not say only "no." We say which door it went through and why. The gates weigh ideas, never people.</p><p style="margin:0;font-size:15px;line-height:1.5"><b>3. Every claim that moves an idea forward points at evidence — not memory, not a feeling.</b> A note, a number, a study, a past result.</p></div>'
    + p('That is it. Those three habits are the foundation. Everything else — the boards, the records, the trials, the drop box — is scaffolding around them, and any of it can change. The habits cannot.')
    + h2('What we believe about ideas')
    + p('Good ideas do not only come from senior people, and they rarely arrive fully formed. A rough note from the packing line, a complaint a dealer passed on, a question a farmer asked — these are the raw material. The door is open to everyone, always, and you never need permission to put something in.')
    + h2('What we believe about memory')
    + p('A company our size cannot afford to forget. When a person leaves, their judgment should not leave with them. Every idea, every reason, every dead end we log is memory we keep — so the next person does not pay again for a lesson we already bought.')
    + h2('Why the process speaks in roles, not names')
    + p('The process describes a <i>chair</i>, a <i>custodian</i>, a <i>reviewer</i> — not people. Roles outlive the people in them, and a role can be shared or handed over without rewriting how we work. Your name lives in one place; everywhere else, you are the part you are playing that day.')
    + thesis('If you do only one thing after reading this: the next time you see a problem, or half an idea, put it in. That single act — logged, answered, remembered — is the entire company working the way it is meant to.')
    + '<p class="sub" style="margin-top:6px">This is our doctrine. It is deliberately short. Argue with it, improve it, make it yours. — The VAN R&amp;D system</p>'
    + '</div>', hash);
}

/* ---------- boot ---------- */
async function boot(){
  const u = decodeToken(_token);
  if(!u){ renderLogin(); return; }
  try{
    me = await api('GET','/api/pd/me');
    if(!me.pd_role){
      app.innerHTML = '<div class="center"><div class="loginbox"><div class="row" style="margin-bottom:14px;gap:11px"><img class="brandlogo lg" src="/assets/van-logo.png" alt="VAN — Vital Agri Nutrients (Pvt) Ltd"><span class="platlbl">Product Development</span></div>'
        + '<p>Signed in as '+esc(me.name)+', but this account has no Product Development role yet.</p>'
        + '<p class="sub">Ask the COO or Data Custodian to grant one, then reload this page.</p>'
        + '<button class="ghost btn" onclick="location.href=\'/launcher\'">Back to launcher</button></div></div>';
      return;
    }
    route();
  }catch(e){
    if(e.status===401){ setToken(''); renderLogin('Session expired — sign in again.'); return; }
    if(e.status===503){ app.innerHTML = '<div class="center"><div class="loginbox"><p class="err">'+esc(e.message)+'</p></div></div>'; return; }
    app.innerHTML = '<div class="center"><div class="loginbox"><p class="err">'+esc(e.message)+'</p></div></div>';
  }
}
boot();
</script>
