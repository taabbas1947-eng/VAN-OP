<html lang="en">

<style>
/* C2M · O2S Queue Shell skin (ruled 14 Oct 2026). Header with the person's words, then 1 screen.
   Every screen opens with what it answers and the next step. */
:root{--bg:#EDF0F5;--surface:#FFFFFF;--ink:#172033;--muted:#566074;--line:#E1E6EE;--kraft:#8C6532;--blue:#2F6DB5;--ok:#1F7A45;--late:#8F5F00;--over:#B3261E;--okbg:#E3F1E8;--latebg:#F7ECD3;--overbg:#F8E3E1;
 --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
 --railbg:#1F2A3C;--railink:#D3DBE8;--wbcost:#1F2A3C;--tabbg:#E4E9F0;--tabline:#C3CCDA}
/* 4 looks, one per person: Silver cool is the default; the choice is kept in this browser */
:root[data-skin="slate"]{--bg:#E8ECEF;--surface:#F7F9FA;--ink:#1B2630;--muted:#566570;--line:#D6DDE3;--blue:#34607F;--ok:#25703F;--late:#8A5A00;--over:#A3302A;--okbg:#E1EEE5;--latebg:#F3E9D3;--overbg:#F4E0DE;--railbg:#2B3A47;--railink:#D0DAE3;--wbcost:#2B3A47;--tabbg:#DAE0E5;--tabline:#B6C0C8}
:root[data-skin="stone"]{--bg:#EFEBE4;--surface:#FBF9F5;--ink:#25211B;--muted:#6A6358;--line:#E3DCCF;--blue:#3F6A8C;--ok:#2B6E3F;--late:#8A5A00;--over:#A3302A;--okbg:#E5EEE3;--latebg:#F4EAD4;--overbg:#F5E1DF;--railbg:#3A332B;--railink:#DDD5C8;--wbcost:#3A332B;--tabbg:#E3DDD0;--tabline:#C4BBA9}
:root[data-skin="dusk"]{--bg:#151A22;--surface:#1E2530;--ink:#E6EAF0;--muted:#9AA6B8;--line:#2F3947;--kraft:#c39a5f;--blue:#7FB0E0;--ok:#6FC28A;--late:#E0B25C;--over:#F08A80;--okbg:#1C3326;--latebg:#3A3020;--overbg:#3D2321;--railbg:#0D1219;--railink:#A9B8CA;--wbcost:#7FB0E0;--tabbg:#1B212B;--tabline:#3A4656;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hdr{position:fixed;left:0;top:0;bottom:0;width:224px;z-index:5;background:var(--railbg);color:var(--railink);display:flex;flex-direction:column;gap:2px;padding:14px 10px 12px;overflow-y:auto}
.hdr .brand{display:flex;align-items:center;gap:9px;padding:2px 6px 12px;color:#fff;text-decoration:none}.hdr .brand i{display:block;width:38px;height:27px;border-radius:3px;background:#fff url(/c2m/assets/van-logo.png) center/86% no-repeat;flex:none}
.hdr .brand b{display:block;font-size:15px;line-height:1.1;font-weight:600}.hdr .brand small{display:block;font-size:11px;color:var(--railink)}
.hdr .findbtn{font:inherit;display:flex;align-items:center;gap:7px;width:100%;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:6px 8px;color:var(--railink);font-size:12.5px;cursor:pointer;margin:0 0 8px;text-align:left}
.hdr .findbtn:hover{border-color:rgba(255,255,255,.4);color:#fff}.hdr .findbtn kbd{margin-left:auto;font-family:var(--mono);font-size:10px;opacity:.75}
.hdr svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hdr nav{display:flex;flex-direction:column;gap:2px}
.hdr nav .g{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;padding:10px 8px 3px}
.hdr nav button{font:inherit;display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;border-radius:5px;padding:7px 8px;color:var(--railink);cursor:pointer;text-align:left;font-size:14px}
.hdr nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.hdr nav button[aria-current="true"]{background:rgba(255,255,255,.14);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #fff}
.hdr .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:#E5262A;color:#fff;border-radius:9px;padding:0 6px;font-weight:500}
.hdr .foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding:10px 8px 0;font-size:12.5px;display:grid;gap:2px}.hdr .foot b{color:#fff;font-weight:600}
.hdr .foot a{color:var(--railink)}.hdr .foot a:hover{color:#fff}
.hdr .more{display:none}
.shell{margin-left:224px;min-height:100vh}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.hdr :focus-visible{outline-color:#fff}
main{max-width:1160px;margin:0 auto;padding:18px 16px 64px}
h1{font-size:21px;font-weight:600;margin:0 0 2px;text-wrap:balance}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:24px 0 8px}
.ans{color:var(--muted);margin:0 0 12px;max-width:90ch}
.next{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:3px;padding:10px 12px;margin:0 0 16px}
.next>span{flex:1 1 260px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:3px}
.wrapx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
table.cards td[data-l="To do"],table.cards td[data-l="State"]{white-space:nowrap}
tr.go{cursor:pointer}tr.go:hover td,tr.go:focus td{background:color-mix(in srgb,var(--blue) 8%,transparent)}
.btn{font:inherit;font-size:13px;font-weight:500;background:var(--blue);color:var(--surface);border:1px solid var(--blue);border-radius:3px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--blue)}.btn.warn{background:var(--over);border-color:var(--over)}.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr.go:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pill{font-family:var(--mono);font-size:11px;padding:0 6px;border-radius:3px;white-space:nowrap;display:inline-block;border:1px solid currentColor}
.p-red{background:var(--overbg);color:var(--over)}.p-amber{background:var(--latebg);color:var(--late)}.p-green{background:var(--okbg);color:var(--ok)}.p-none{background:var(--bg);color:var(--muted)}
.over{color:var(--over)}.late{color:var(--late)}.ok{color:var(--ok)}
.jobs .job{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.jobs .job:last-child{border-bottom:0}.job>div:first-child{min-width:0;flex:1 1 320px}.job .t{font-weight:500}.job .d{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 12px}.tile .v{font-family:var(--mono);font-size:22px}.tile .l{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--line);position:relative;margin-top:6px}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--over)}.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.kam{display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid var(--line);border-radius:3px;background:var(--surface);margin:0 0 12px}
.kam-l{border-right:1px solid var(--line);background:var(--bg)}
.kam-i{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;padding:10px 12px;cursor:pointer}
.kam-i small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.kam-i[aria-current="true"]{background:var(--surface);border-left-color:var(--blue);font-weight:600}
.kam-n{padding:10px 12px;font-size:12px;color:var(--muted)}
.kam-r{padding:14px 16px;min-width:0}
.kam-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.kam-h b{font-size:16px}.kam-h .pill{margin-left:auto}
.kam-s{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 0 4px}
.kam-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}.kam-row span{margin-left:auto;font-size:12px;color:var(--muted)}
.kam .chips{margin:0}.kam .chips button{min-height:34px;padding:5px 12px}
.kam-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.kam-f{margin-top:14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.pvbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--blue);background:var(--surface);padding:10px 12px;border-radius:3px;margin:0 0 12px}.pvbar .sp{flex:1 1 auto}
@media (max-width:760px){.kam{grid-template-columns:minmax(0,1fr)}.kam-l{border-right:0;border-bottom:1px solid var(--line)}.kam-i{min-height:44px}.kam-b .btn{min-height:44px}.kam .chips{flex-wrap:wrap;overflow:visible}.pvbar .btn{min-height:44px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button{font:inherit;font-size:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:3px 9px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);font-weight:600}
.crumb{font-size:13px;color:var(--muted);margin:0 0 8px}.crumb button{font:inherit;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.three>div,.two>div{min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.sev .h{padding:8px 10px;border-bottom:1px solid var(--line)}.sev .h b{display:block}.sev .h span{font-size:12px;color:var(--muted)}
/* Folder tabs (Tahir, 18 Oct 2026, 22:21: "do these look like tabs?"): each view is a bordered tab; the open one is light, marked in blue and joined to the line */
.subnav{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;align-items:flex-end;gap:3px;border-bottom:1px solid var(--tabline);margin:4px 0 16px;padding:3px 2px 0;scrollbar-width:thin}.subnav button{flex:0 0 auto}
.subnav button{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;background:var(--tabbg);border:1px solid var(--tabline);border-bottom:0;border-radius:6px 6px 0 0;padding:7px 11px;margin-bottom:-1px;color:var(--ink);cursor:pointer;white-space:nowrap}
.subnav button:hover{background:var(--surface)}
.subnav.grouped{flex-wrap:wrap;overflow:visible;gap:10px 24px;align-items:flex-start;padding:0 0 12px}.subnav.grouped .sg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.subnav.grouped .sgl{flex:1 0 100%;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.subnav.grouped button{border-bottom:1px solid var(--tabline);border-radius:6px;margin-bottom:0}

.subnav button[aria-current="true"],.subnav button[aria-selected="true"]{background:var(--surface);border-top:3px solid var(--blue);padding-top:5px;font-weight:600;box-shadow:0 1px 0 var(--surface);position:relative;z-index:1}
.subnav .tc{font-family:var(--mono);font-size:11px;font-weight:500;line-height:1;background:var(--line);color:var(--ink);border-radius:9px;padding:3px 7px}
.subnav button[aria-current="true"] .tc{background:var(--blue);color:var(--surface)}
@media (max-width:600px){.subnav{flex-wrap:nowrap;overflow-x:auto}.subnav button{flex:0 0 auto}}
.toast.err{background:var(--over)}.ask{border-left:3px solid var(--late)}
.form{display:grid;gap:8px;padding:12px;align-content:start}label .req{color:var(--late);font-size:11px;font-weight:600}.bad{outline:2px solid var(--late);outline-offset:1px}.ferr{display:block;color:var(--late);font-size:12px;margin-top:2px}th.srt{cursor:pointer;user-select:none}th.srt:hover{text-decoration:underline}th.srt[aria-sort=ascending]::after{content:' ▲';font-size:9px}th.srt[aria-sort=descending]::after{content:' ▼';font-size:9px}.wrapx.tall{max-height:72vh;overflow:auto}.wrapx.tall thead th,.wrapx.tall tr:first-child>th{position:sticky;top:0;z-index:2;background:var(--surface)}.lnk{white-space:normal;background:none;border:0;padding:0;color:var(--blue);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}.tline{margin:8px 0 6px;font-size:13px;color:var(--muted)}.tline b{color:var(--ink)}.q1{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:0;display:grid;gap:6px}.form .q1 label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}.form label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:start}.row>button,.row>.btn{align-self:end}
/* Phone (ruled 16 Oct 2026): approvals, jobs and price lists usable one-handed */
@media (max-width:600px){
  main{padding:12px 12px 40px}h1{font-size:19px;line-height:1.3}h2{font-size:13px;letter-spacing:.04em}
  table.cards thead,table.cards tr:has(>th){display:none}table.cards tfoot tr{display:block}table.cards td.r[data-l]{display:flex;justify-content:space-between;align-items:baseline;gap:12px;text-align:right}table.cards td.r[data-l]::before{display:inline;font-family:var(--sans)}table.wt.cards td:first-child{box-shadow:none!important}table.cards td{padding-right:10px!important}table.wt.cards td[data-l="Group"]{display:none}table.wt.cards td:first-child{padding-left:0!important}table.wt.cards tr.r-red{border-left:4px solid var(--over);padding-left:8px}table.wt.cards tr.r-amber{border-left:4px solid var(--late);padding-left:8px}table.wt.cards tr.r-green{border-left:4px solid var(--ok);padding-left:8px}table.cards td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}table.cards tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.cards td{display:block;border:0;padding:3px 0}
  table.cards select,table.cards input[type=number]{width:100%;min-height:40px}table.cards td .btn{min-height:44px}
  table.cards.short tr:not(.open)>td:not(.k){display:none}table.cards.short tr{cursor:pointer}table.cards.short tr:not(.open):not(.att)>td.k:first-child::after{content:'Tap for more';display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
  .jobs .job{flex-direction:column;align-items:stretch}.jobs .job>div:first-child{flex:0 0 auto}.jobs .job>div:last-child{display:flex;flex-wrap:wrap;gap:8px}
  .jobs .job .btn,.next .btn{flex:1 1 auto;min-height:44px}
  .row{flex-direction:column;align-items:stretch}.row label,.row input,.row select{width:100%}.row>label{flex:none!important}
  .tiles{grid-template-columns:1fr 1fr}.tile .v{font-size:20px}
  .three,.two{grid-template-columns:minmax(0,1fr)!important}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chips button{flex:0 0 auto}
  .doc{padding:14px 10px}.doc-h{flex-wrap:wrap;gap:8px}.doc-tb{font-size:11px}
  .hdr .who{width:100%;font-size:12px}
  table{font-size:12px}td,th{padding:6px 6px}
  .warnbox .btn{min-height:44px;margin-top:4px}
}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid #7d8478;border-radius:3px;padding:5px 8px;max-width:100%}
:root[data-skin="dusk"] input,:root[data-skin="dusk"] select,:root[data-skin="dusk"] textarea{border-color:#7d8aa0}
input[type=number]{appearance:textfield;-moz-appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
[aria-invalid="true"]{border-color:var(--over);outline:1px solid var(--over)}
.dw{display:block;font-size:12.5px;font-weight:600;color:var(--ink);min-height:1em}
.nw{white-space:nowrap}
.basisnote{font-size:12.5px;color:var(--late);background:var(--latebg);border-left:3px solid var(--late);padding:5px 10px;margin:-4px 0 12px;max-width:90ch}
.kick.meta{margin-bottom:4px}
.btn.armed{background:var(--ok);border-color:var(--ok);color:var(--surface)}
tr.go td:first-child::after{content:"›";color:var(--blue);margin-left:6px;opacity:0;transition:opacity .1s}tr.go:hover td:first-child::after,tr.go:focus td:first-child::after{opacity:1}
input[type=number]{width:120px}textarea{min-height:56px;width:100%}
.warnbox{border:1px solid var(--over);background:var(--overbg);padding:10px 12px;border-radius:3px;margin:8px 0}
.amberbox{border:1px solid var(--late);background:var(--latebg);padding:10px 12px;border-radius:3px;margin:8px 0}.notebox{border:1px solid var(--line);background:var(--surface);padding:10px 12px;border-radius:3px;margin:8px 0}
.assume{border-left:3px dashed var(--late);padding:4px 0 4px 12px;margin:10px 0;font-size:13px}.assume b{color:var(--late);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:3px;font-size:13px;max-width:calc(100% - 32px);z-index:9}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px;font-size:12px}.steps span{padding:3px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.steps span.done{background:var(--okbg);border-color:var(--ok)}.steps span.now{background:var(--latebg);border-color:var(--late);font-weight:600}
.cols{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:0 0 10px}
.doc{background:#fff;color:#14233a;border:1px solid var(--line);max-width:900px;margin:0 auto;padding:24px 28px 16px}
.preview{position:relative}.preview .doc{position:relative;overflow:hidden}.preview .doc::before{content:"PREVIEW, NOT ISSUED";position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font:600 44px var(--sans);letter-spacing:.08em;color:rgba(20,50,126,.07);white-space:nowrap;pointer-events:none}
.doc-h{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;border-bottom:3px solid #14327e;padding-bottom:12px}.doc-logo{width:90px;height:auto}
.doc-co{flex:1 1 220px;display:grid}.doc-co b{font-size:16px;color:#14327e}.doc-co span,.doc-ref{font-size:12px;color:#4a5a70}.doc-ref{display:grid;text-align:right}
.doc-t{margin:14px 0 10px}.doc-t h3{margin:0 0 4px;font-size:19px;color:#14327e}.doc-t div{font-size:13px}
.doc-tb{border-collapse:collapse;width:100%;font-size:12px;min-width:560px}.doc-tb th{background:#14327e;color:#fff;font-weight:500;padding:6px 8px}
.doc-tb td{padding:6px 8px;border-bottom:1px solid #d9dee8;color:#14233a;background:#fff}.doc-tb td.r{text-align:right;font-family:var(--mono)}.doc-tb tbody tr:nth-child(even) td{background:#f4f6fa}
.doc-n{font-size:12px;color:#4a5a70;margin:12px 0;padding-left:18px}.doc-s{display:flex;justify-content:flex-end;margin:18px 0 12px;font-size:12px}.doc-s div{border-top:1px solid #14233a;padding-top:4px;min-width:200px}
.doc-f{border-top:2px solid #e5262a;padding-top:8px;font-size:11px;color:#4a5a70;text-align:center}
.md{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px 18px;max-width:100%;overflow-x:auto}.md pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;margin:0}
.loading{padding:40px;text-align:center;color:var(--muted)}
/* 0.8.0 screens (Tahir's rulings, 18 Oct 2026): topic and 1 answer line, a "How this works" fold, work in a panel on Today, phone tabs at the bottom */
h1.topic{font-size:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:0}
.answer{font-size:16px;font-weight:500;margin:2px 0 10px;max-width:90ch;text-wrap:balance}

let dryKey = null;
function effectHtml(j, body) {

  const p = j.reapprovePct, n = j.count || 0; const ahead = body && body.validFrom && String(body.validFrom) > ST.today;
  if (ahead) return `<div class="warnbox effect"><b>Starts ${esc(fmtShort(body.validFrom))}.</b> Nothing moves today; C2M checks its effect on packs on that date.</div>`;
  if (!n) return `<div class="warnbox effect ok"><b>No pack moves more than ${p}%.</b> Smaller moves need no re-approval. Press Save again to save.</div>`;
  const rows = (j.items || []).slice(0, 8).map(i => `<tr><td>${esc(i.label)}</td><td class="r num">${i.from == null ? 'first cost' : n2(i.from)}</td><td class="r num">${n2(i.to)}</td><td class="r num">${i.pct == null ? '' : (i.pct > 0 ? '+' : '') + i.pct.toFixed(1) + '%'}</td></tr>`).join('');

}
let dryAt = 0, dryBusy = false;
async function effectFirst(path, body, slot) {
  const key = path + '|' + JSON.stringify(body) + '|' + slot; const el0 = document.getElementById(slot);
  /* Save only when this effect is still on the screen (a redraw or Cancel clears it) and was shown at least 1 second ago, so a double click never saves unseen (review 5 Nov, findings 2 to 4). */
  if (dryKey === key && el0 && el0.querySelector('.effect')) { if (Date.now() - dryAt < 1000) return false; dryKey = null; return true; }
  if (dryBusy) return false; dryBusy = true;
  let j; try { j = await api(path + '?dry=1', body); } catch (e) { toast(e.message, true); return false; } finally { dryBusy = false; }
  dryKey = key; dryAt = Date.now(); const el = document.getElementById(slot); if (el) { el.innerHTML = effectHtml(j, body); el.scrollIntoView({ block: 'nearest' }); }
  toast('Check the effect, then press Save again.'); return false;
}

/** The working, shown as he types: 860 ÷ 29 = Rs 29.66 per piece; on a 25 kg pack Rs 1.19 per kg. */
function buyWork(p) {
  const m = (document.getElementById(p + '-buy') || {}).value || (p === 'pi' ? pinBuy : (ptrial && ptrial.buy)) || 'piece';
