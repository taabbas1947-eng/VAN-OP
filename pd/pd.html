<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAN · Product Development</title>
<meta name="description" content="Vital Agri Nutrients — Product Development pipeline (idea intake, gates, gate log).">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Reskinned 2026-07-31 to match O2S (index.html): Inter/Space Grotesk, SaaS-dashboard components,
     light-only. Accent recolored 2026-08-03 to PD's green launcher-tile hue (#16a34a / leaf #22c55e) so
     the module interior matches its tile — each module is colour-coded, O2S cyan, PD green, etc.
     Same CSS-variable NAMES as before (the misleadingly-named --green* / --leaf carry the accent, so every
     inline var(--…) in the render code re-maps automatically); only the VALUES + component rules changed. */
  :root{
    --serif:'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif; /* headings — O2S --head */
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:'Geist Mono','SF Mono','Cascadia Code',Consolas,ui-monospace,monospace;
    --ground:#f8f9fb; --surface:#ffffff; --surface-2:#f1f3f6; --line2:#eef0f4; --leaf:#22c55e;
    --line:#e5e8ee; --line-strong:#dce2ec;
    --text:#161a20; --muted:#5a6675; --faint:#8a95a6;
    --green:#16a34a; --green-deep:#15803d; --green-soft:#e7f7ee;
    --amber:#c77b0e; --amber-soft:#faf0da; --red:#c0392b; --red-soft:#fbe7e4;
    --ink:#12291b;
    --shadow:0 1px 2px rgba(15,23,42,.07),0 1px 1px rgba(15,23,42,.04);
    --sh:0 3px 12px rgba(15,23,42,.10),0 1px 3px rgba(15,23,42,.06);
    --ring:0 0 0 3px rgba(22,163,74,.16); --radius:15px; --radius-sm:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);font-family:var(--sans);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  .wrap{min-height:100%;padding:0}
  a{color:var(--green-deep);text-decoration:none}
  a:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d6deea;border-radius:8px;border:2px solid var(--ground)}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brandlogo{height:32px;width:auto;display:block}
  .brandlogo.lg{height:44px}
  .platlbl{font-family:var(--serif);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-left:12px;border-left:1px solid var(--line)}
  main{flex:1;min-width:0;padding:clamp(16px,2.4vw,34px)}   /* full width — fills the panel beside the rail */

  /* ===== O2S-style left rail (added 2026-08-03) ===== */
  .app-shell{display:flex;min-height:100vh}
  .pdside{width:216px;flex:none;background:var(--surface-2);border-right:1px solid var(--line-strong);padding:11px 9px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;transition:width .18s ease,padding .18s ease;z-index:20}
  .pdside .brand{display:flex;align-items:center;gap:9px;padding:3px 6px 10px;border-bottom:1px solid var(--line2);margin-bottom:8px;text-decoration:none}
  .pdside .brandmark{height:30px;width:auto;display:block;flex:none}
  .pdside .nm{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--text);line-height:1.05;letter-spacing:-.02em}
  .pdside .nm span{display:block;font-family:var(--mono);font-size:8px;font-weight:600;color:var(--faint);letter-spacing:1.3px;text-transform:uppercase;margin-top:5px}
  .pdside .raillauncher{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;margin-bottom:8px;transition:.13s}
  .pdside .raillauncher svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .pdside .raillauncher:hover{background:var(--green-soft);color:var(--green-deep);border-color:#cdeed7}
  .pdside .nav{display:flex;flex-direction:column;gap:1px;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;margin:0 -3px;padding:0 3px}
  .pdside .nav::-webkit-scrollbar{width:8px}
  .pdside .nav::-webkit-scrollbar-thumb{background:#d0d8e2;border-radius:8px;border:2px solid var(--surface-2)}
  .pdside .navgrp{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);padding:11px 11px 4px}
  .pdside .nav a{display:flex;align-items:center;gap:10px;padding:6px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:12.5px;font-weight:600;transition:.13s;position:relative;white-space:nowrap}
  .pdside .nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
  .pdside .nav a:hover{background:var(--surface);color:var(--text)}
  .pdside .nav a.on{background:var(--green-soft);color:var(--green-deep);font-weight:700}
  .pdside .nav a.on::before{content:'';position:absolute;left:-9px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--green)}
  .pdside .railcollapse{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;margin-top:8px}
  .pdside .railcollapse svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
  .pdside .railcollapse:hover{background:var(--surface)}
  .pdside .foot{padding-top:10px;border-top:1px solid var(--line2);margin-top:8px}
  .pdside .usermenu{position:relative;width:100%}
  .pdside .usermenu>summary{list-style:none;width:100%;display:flex;align-items:center;gap:9px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  .pdside .usermenu>summary::-webkit-details-marker{display:none}
  .pdside .usermenu>summary:hover{background:var(--surface)}
  .pdside .av{width:28px;height:28px;border-radius:8px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
  .pdside .umeta{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;line-height:1.15}
  .pdside .un{font-weight:700;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pdside .ur{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pdside .umc{margin-left:auto;color:var(--faint);font-size:11px}
  .pdside .umpop{position:absolute;left:0;right:0;bottom:calc(100% + 7px);background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh);padding:8px;z-index:60}
  .pdside .pdsignout{font:inherit;font-weight:600;font-size:12.5px;width:100%;background:#fff;color:var(--green-deep);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer}
  .pdside .pdsignout:hover{background:var(--green-soft)}
  /* collapsed rail */
  .app-shell.nav-collapsed .pdside{width:56px;padding:10px 8px}
  .app-shell.nav-collapsed .pdside .nm,
  .app-shell.nav-collapsed .pdside .navgrp,
  .app-shell.nav-collapsed .pdside .nav a .nlbl,
  .app-shell.nav-collapsed .pdside .raillauncher .lb,
  .app-shell.nav-collapsed .pdside .railcollapse .lb,
  .app-shell.nav-collapsed .pdside .umeta,
  .app-shell.nav-collapsed .pdside .umc{opacity:0;width:0;overflow:hidden;white-space:nowrap;pointer-events:none}
  .app-shell.nav-collapsed .pdside .brand{justify-content:center;padding:4px 0 11px}
  .app-shell.nav-collapsed .pdside .nav a,
  .app-shell.nav-collapsed .pdside .raillauncher,
  .app-shell.nav-collapsed .pdside .railcollapse,
  .app-shell.nav-collapsed .pdside .usermenu>summary{justify-content:center;padding:7px 6px}
  .app-shell.nav-collapsed .pdside .navgrp{padding:6px 0 2px}
  .app-shell.nav-collapsed .pdside .railcollapse svg{transform:rotate(180deg)}
  /* responsive: rail becomes a top strip */
  @media(max-width:760px){
    .app-shell{flex-direction:column}
    .pdside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}
    .pdside .brand{border-bottom:none;margin-bottom:0;padding:3px 6px}
    .pdside .nav{flex-direction:row;flex-wrap:wrap;overflow:visible;flex-basis:100%;order:3}
    .pdside .navgrp{display:none}
    .pdside .raillauncher{width:auto;margin-bottom:0}
    .pdside .raillauncher .lb,.pdside .railcollapse{display:none}
    .pdside .foot{border-top:none;margin-top:0;margin-left:auto;padding-top:0}
  }
  h1{font-family:var(--serif);font-size:1.4rem;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;color:var(--text)}
  h2,h3{font-family:var(--serif);letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px;font-weight:500;line-height:1.5}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h2,.card h3{font-family:var(--serif)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;font:inherit;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;color:var(--text);outline:none;transition:.14s}
  input:hover,select:hover{border-color:var(--line-strong)}
  input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:var(--ring)}
  textarea{min-height:70px;resize:vertical}
  .btn,button.btn{font:inherit;font-weight:700;font-size:13px;border:none;border-radius:var(--radius-sm);padding:9px 16px;cursor:pointer;background:var(--green);color:#fff;box-shadow:var(--shadow);letter-spacing:-.01em;transition:.14s;text-decoration:none;display:inline-block}
  .btn:hover,button.btn:hover{background:var(--green-deep);transform:translateY(-1px);box-shadow:var(--sh);color:#fff;text-decoration:none}
  .btn:active,button.btn:active{transform:translateY(0)}
  .btn.ghost,button.ghost{background:#fff;color:var(--green-deep);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover,button.ghost:hover{background:var(--surface-2);border-color:var(--line-strong)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:#475569;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);color:var(--muted);vertical-align:middle}
  td b{color:var(--text)}
  tr.clickable{cursor:pointer;transition:.1s}
  tr.clickable:hover td{background:var(--green-soft)}
  .chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .chip.heavy{color:var(--red);background:var(--red-soft)}
  .chip.light{color:var(--green-deep);background:var(--green-soft)}
  .chip.stage{color:var(--muted);background:var(--surface-2)}
  .err{background:var(--red-soft);color:var(--red);border-radius:var(--radius-sm);padding:9px 13px;font-size:13px;margin:8px 0}
  .msg{background:var(--green-soft);color:var(--green-deep);border-radius:var(--radius-sm);padding:9px 13px;font-size:13px;margin:8px 0}
  .center{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .loginbox{width:350px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--sh)}
  .status-note{font-size:12px;color:var(--faint);margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .sec{font-family:var(--serif);font-size:12.5px;font-weight:700;color:var(--green);letter-spacing:.4px;text-transform:uppercase;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--green-soft)}
  .ro{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font-size:13px;min-height:20px;color:var(--text);white-space:pre-wrap}
  table.signoff td{vertical-align:top}
</style>
</head>

<script>
/* ---------- shared auth (same convention as O2S index.html: van_token in localStorage) ---------- */
let _token = (function(){ try{ return localStorage.getItem('van_token')||''; }catch(e){ return ''; } })();
function authHdr(){ return _token ? {'Authorization':'Bearer '+_token} : {}; }
function decodeToken(t){ try{ if(!t)return null; const p=t.split('.')[0]; const o=JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/'))); if(!o.exp||o.exp<Date.now())return null; return {name:o.n,username:o.u,role:o.r}; }catch(e){ return null; } }
function setToken(t){ _token=t||''; try{ t?localStorage.setItem('van_token',t):localStorage.removeItem('van_token'); }catch(e){} }

async function api(method, url, body){
  const r = await fetch(url, { method, headers: Object.assign({'Content-Type':'application/json'}, authHdr()), body: body?JSON.stringify(body):undefined });
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error((j&&j.error)||('HTTP '+r.status)), {status:r.status, body:j});
  return j;
}

let me = null; // /api/pd/me response
const app = document.getElementById('app');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ const n = Number(v); return Number.isFinite(n) ? String(n) : '0'; } // DECIMALs arrive as strings like "54.000"
function money(v){ const n = Number(v)||0; return 'Rs ' + Math.round(n).toLocaleString('en-US'); }

/* ---------- login ---------- */
function renderLogin(err){
  app.innerHTML =
    '<div class="center"><div class="loginbox">'
    + '<div class="row" style="margin-bottom:18px;gap:11px"><img class="brandlogo lg" src="/assets/van-logo.png" alt="VAN — Vital Agri Nutrients (Pvt) Ltd"><span class="platlbl">Product Development</span></div>'
    + (err ? '<div class="err">'+esc(err)+'</div>' : '')
    + '<label>Username</label><input id="lu" autocomplete="username">'
    + '<label>Password</label><input id="lp" type="password" autocomplete="current-password">'
    + '<div style="margin-top:16px"><button class="btn" id="lbtn" style="width:100%">Sign in</button></div>'
    + '<p class="status-note">One sign-in for the whole VAN Operations Platform — the same account you use for O2S.</p>'
    + '</div></div>';
  document.getElementById('lbtn').onclick = doLogin;
  document.getElementById('lp').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
async function doLogin(){
  const u = document.getElementById('lu').value.trim(), p = document.getElementById('lp').value;
  try{
    const j = await api('POST','/api/login',{username:u,password:p});
    setToken(j.token);
    boot();
  }catch(e){ renderLogin(e.message || 'Sign-in failed.'); }
}

function fmtDate(v){ return v ? String(v).slice(0,10) : ''; }
const GATES_LABEL = { G3:'G3 · Beaker gate', G4:'G4 · Bench evaluation', G5:'G5 · Field trial approval', G6:'G6 · Scale-up & production' };
const PD_SOURCES = { team:'Team / internal', farmer:'Farmer', dealer:'Dealer', regulator:'Regulator', consultant:'Consultant / outside reviewer', management:'Management', other:'Other' };
const PD_GATE_OUTCOMES = {
  G3:[['advance','ADVANCE — fund the bench, runs may begin'],['iterate','ITERATE — tighten the route before spending'],['park','PARK — budget/priority hold'],['kill','KILL — close before materials are committed']],
  G4:[['advance','ADVANCE — a run met the criteria, promote it to Formulation v1'],['iterate','ITERATE — near miss, another combination is worth a run'],['park','PARK — shelve for later'],['kill','KILL — no run met the bar, closed with reason']],
  G5:[['advance','ADVANCE — beat the DAP control, move toward launch'],['iterate','REPEAT — inconclusive, run another season/site'],['park','PARK — hold'],['kill','KILL — did not perform in the field']],
  G6:[['advance','LAUNCH — make it at the agreed margin, hand to Production'],['park','HOLD — registration/costing/supply must clear first'],['kill','STOP — not commercially viable']],
};
function shell(bodyHtml, activeHash){

      + '<svg viewBox="0 0 24 24">'+(NAV_ICONS[n.href]||'')+'</svg><span class="nlbl">'+esc(n.label)+'</span></a>';

  const initials = esc(((me.name||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2)||'?').toUpperCase());

      + '<nav class="nav">'+navHtml+'</nav>'
      + '<button class="railcollapse" id="pdCollapse" title="Collapse / expand menu"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span class="lb">Collapse</span></button>'
      + '<div class="foot"><details class="usermenu"><summary><span class="av">'+initials+'</span><span class="umeta"><span class="un">'+esc(me.name)+'</span><span class="ur">'+esc(me.label||'no PD role')+'</span></span><span class="umc">▴</span></summary><div class="umpop"><button class="pdsignout" id="out">Sign out</button></div></details></div>'

  if (!window._pdMenuInit){ window._pdMenuInit = true; document.addEventListener('click', (e) => { document.querySelectorAll('details.usermenu[open]').forEach(d => { if(!d.contains(e.target)) d.removeAttribute('open'); }); }); }
}

async function route(){
  if (!me) return; // signed out (or not yet booted) — the hashchange listener can fire after sign-out via location.hash=''; don't let it repaint a stale session
  const hash = location.hash || ('#'+me.landing);
  try{
    if (hash === '#home') return renderHome(hash);
    if (hash === '#mywork') return renderMyWork(hash);
    if (hash === '#ideas') return renderIdeas(hash);
    if (hash.startsWith('#idea/')) return renderIdea(hash, hash.split('/')[1]);
    if (hash === '#records') return renderRecords(hash);
    if (hash.startsWith('#record/')) return renderRecord(hash, hash.split('/')[1]);
    if (hash === '#candidates') return renderCandidates(hash);
    if (hash.startsWith('#route/')) return renderRoute(hash, hash.split('/')[1]);
    if (hash === '#materials') return renderMaterials(hash);
    if (hash === '#samples') return renderSamples(hash);
    if (hash === '#tests') return renderTests(hash);
    if (hash === '#trials') return renderTrials(hash);
    if (hash === '#gatelog') return renderGateLog(hash);
    if (hash === '#portfolio') return renderPortfolio(hash);
    if (hash === '#projects') return renderProjects(hash);
    if (hash.startsWith('#project/')) return renderProject(hash, hash.split('/')[1]);
    if (hash === '#problems') return renderProblems(hash);
    if (hash === '#newproblem') return renderNewProblem(hash);
    if (hash === '#formulations') return renderFormulations(hash);
    if (hash === '#regulatory') return renderRegulatory(hash);
    if (hash === '#learnings') return renderLearnings(hash);
    if (hash === '#audit') return renderAudit(hash);
    if (hash === '#dropbox') return renderDropbox(hash);
    if (hash === '#board') return renderBoard(hash);
    if (hash === '#library') return renderLibrary(hash);
    if (hash.startsWith('#libitem/')) return renderLibItem(hash, hash.split('/')[1]);
    if (hash === '#new') return renderNewIdea(hash);
    if (hash === '#challenge') return renderChallenge(hash);
    if (hash === '#guide') return renderGuide(hash);
    if (hash === '#doctrine') return renderDoctrine(hash);
    return renderHome(hash);
  } catch(e) {
    shell('<div class="err">'+esc(e.message)+'</div>', hash);
  }
}
window.addEventListener('hashchange', route);

      + '<div class="row" style="gap:12px"><div style="flex:1;min-width:170px"><label>Decision</label><select id="s_dec"><option value="log">LOG — worth designing (advance)</option><option value="park">PARK — not now</option><option value="kill">KILL — with reason, kept forever</option><option value="merge">MERGE — into an existing hypothesis</option></select></div>'
      + '<div style="flex:1;min-width:110px"><label>Priority</label><select id="s_prio"><option value=""></option><option>high</option><option>medium</option><option>low</option></select></div>'
      + '<div style="flex:1;min-width:120px"><label>Route (R1–R8)</label><input id="s_route"></div>'
      + '<div style="flex:1;min-width:160px"><label>Lever</label><input id="s_lever" placeholder="acidification / anti-fixation"></div>'
      + '<div style="flex:1;min-width:150px"><label>Owner</label><select id="s_owner"><option value=""></option>'+ownerOpts+'</select></div></div>'
      + '<label>Re-look condition (if parked)</label><input id="s_park" placeholder="e.g. revisit if rock price falls">'
      + '<label>Reason (told to the submitter)</label><textarea id="s_reason"></textarea>'
      + '<div style="margin-top:12px"><button class="btn" id="s_submit">Record G1 decision</button> <span id="s_msg"></span></div></div>';
  }

  const reversalCard = idea.reversal
    ? '<div class="card" style="border-color:var(--amber);background:var(--amber-soft)"><h2 style="font-size:1.05rem;margin:0 0 6px">Your reversal window — '+idea.reversal.daysLeft+' day'+(idea.reversal.daysLeft===1?'':'s')+' left</h2>'
      + '<p class="sub" style="margin:0 0 10px">The PD Lead screened this on the light lane. It stands unless you reverse it inside 7 days. A short veto, not a gate: use it when the call was wrong, not merely when you would have worded it differently.</p>'
      + '<label>Reason for reversing</label><textarea id="rev_reason" placeholder="What the screen missed. Both the submitter and the PD Lead read this."></textarea>'
      + '<div style="margin-top:10px"><button class="btn" id="rev_btn">Reverse this screen</button> <span id="rev_msg"></span></div></div>'
    : '';

  const cc = idea.candidateCounts || {total:0, selected:0};
  const candLink = (idea.screen_decision==='log' && me.surfaces.includes('candidates'))
    ? '<div class="card"><span class="sub" style="margin:0"><b>Pre-bench candidate screen</b> — '+(cc.total?cc.total+' combination'+(cc.total===1?'':'s')+' screened on paper, '+cc.selected+' selected for the bench.':'nothing screened yet: decide which combinations are worth making, on paper, before a beaker comes out.')+' <a href="#route/'+idea.id+'">Open the candidate screen →</a></span></div>' : '';
  const samplesTrials = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 6px">Samples &amp; trials</h2><div class="sub" style="margin:0">'
    + (idea.samples && idea.samples.length ? 'Samples: '+idea.samples.map(esc).join(', ') : 'No samples yet (created on the Samples page after G3).') + '<br>'
    + (idea.trials && idea.trials.length ? 'Trials: '+idea.trials.map(esc).join(', ') : 'No field trials yet.') + '</div></div>';

  const gatesHtml = idea.gates.map(g =>
    '<tr><td>'+g.gate+(g.is_site_quorum?'<br><span class="sub">site quorum</span>':'')+'</td><td><b>'+esc(g.decision)+'</b></td><td>'+esc(g.reason)+'</td><td>'+esc(g.decided_by_name)+'</td><td class="sub">'+esc(fmtDate(g.decided_at))+'</td><td class="sub">'+(g.ratified_by_name?esc(g.ratified_by_name):(g.provisional?'<b>pending</b>':'—'))+'</td></tr>').join('')
    || '<tr><td colspan="6" class="sub">No gate decisions yet.</td></tr>';

  // ---- tracker update (custodian) ----
  let tracker = '';
  if (idea.caps.update && idea.lists) {
    const st = Object.keys(idea.lists.stages).map(k=>'<option value="'+k+'"'+(idea.stage===k?' selected':'')+'>'+esc(idea.lists.stages[k])+'</option>').join('');
    const ow = '<option value=""></option>'+idea.lists.users.map(u=>'<option value="'+u.id+'"'+(idea.owner_id===u.id?' selected':'')+'>'+esc(u.name)+'</option>').join('');
    const pr = '<option value=""></option>'+idea.lists.products.map(p=>'<option value="'+p.id+'"'+(idea.parent_product_id===p.id?' selected':'')+'>'+esc(p.code)+'</option>').join('');
    const pb = '<option value=""></option>'+idea.lists.problems.map(p=>'<option value="'+p.id+'"'+(idea.problem_id===p.id?' selected':'')+'>'+esc(p.label)+'</option>').join('');
    const prio = ['','high','medium','low'].map(p=>'<option'+(idea.priority===p?' selected':'')+'>'+p+'</option>').join('');
    tracker = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Tracker update (Custodian)</h2><div class="row" style="gap:12px">'
      + '<div style="flex:1;min-width:140px"><label>Stage</label><select id="t_stage">'+st+'</select></div>'
      + '<div style="flex:1;min-width:110px"><label>Priority</label><select id="t_prio">'+prio+'</select></div>'
      + '<div style="flex:1;min-width:150px"><label>Owner</label><select id="t_owner">'+ow+'</select></div>'
      + '<div style="flex:2;min-width:200px"><label>Next action</label><input id="t_next" value="'+esc(idea.next_action||'')+'"></div>'
      + '<div style="flex:1;min-width:150px"><label>Product concept</label><select id="t_prod">'+pr+'</select></div>'
      + '<div style="flex:1;min-width:170px"><label>Problem</label><select id="t_prob">'+pb+'</select></div></div>'
      + '<div style="margin-top:12px"><button class="btn ghost" id="t_save">Save</button> <span id="t_msg"></span></div></div>';
  }

  // ---- pinned reading + discussion (operators) ----
  let pinned = '', comments = '';
  if (idea.canDiscuss) {
    pinned = '<h2 style="font-family:var(--serif);font-size:1.2rem">Reading pinned here ('+idea.pinned.length+')</h2>'
      + (idea.pinned.length ? '<div class="card">'+idea.pinned.map(i=>'<div style="padding:6px 0;border-bottom:1px solid var(--line)"><a href="#libitem/'+i.id+'"><b>'+i.l_label+'</b> '+esc(i.title)+'</a> <span class="sub" style="color:'+(EVCOL[i.evidence]||'')+';font-weight:600">'+esc(i.evidence_short)+'</span><div class="sub">'+esc(i.why)+'</div></div>').join('')+'</div>'
        : '<div class="card"><p class="sub" style="margin:0">Nothing pinned. Pin background / a paper / a spec from the <a href="#library">Library</a> so the reading sits next to the work.</p></div>');
    comments = '<h2 style="font-family:var(--serif);font-size:1.2rem">Discussion ('+idea.comments.length+')</h2>'
      + '<p class="sub">Discussion, not a decision — gate reasons stay in the gate log.</p>'
      + (idea.comments.length ? idea.comments.map(c=>'<div class="card" style="padding:10px 12px"><div class="sub">'+esc(c.name)+' · '+esc(c.role_label)+' · '+esc(fmtDate(c.added_at))+'</div><div style="margin-top:4px;white-space:pre-wrap">'+esc(c.body)+'</div></div>').join('') : '<div class="card"><p class="sub" style="margin:0">Nothing said yet.</p></div>')
      + '<div class="card"><label>Add a comment</label><textarea id="ic_body"></textarea><div style="margin-top:10px"><button class="btn" id="ic_btn">Post comment</button> <span id="ic_msg"></span></div></div>';
  }

  const nb = idea.next_step;
  const nextBar = (nb && nb.text) ? '<div class="card" style="background:var(--green-soft);border-color:var(--green);display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:220px"><b>Next step'+(nb.who && nb.who!=='—'?' · '+esc(nb.who):'')+':</b> '+esc(nb.text)+'</span>'+(nb.hash?'<a class="btn ghost" href="'+nb.hash+'">Go →</a>':'')+'</div>' : '';
  setMain(
    '<h1>'+idea.h_label+' · '+esc(idea.title)+'</h1>'
    + '<p class="sub">'+(op?'<span class="chip '+idea.lane+'">'+idea.lane+' lane</span> &nbsp; ':'')+'<span class="chip stage">'+esc(idea.stage_label)+'</span> &nbsp; submitted by '+esc(idea.submitted_by_name)+'</p>'
    + nextBar
    + detailsTable + memory + screenCard + reversalCard
    + (me.surfaces.includes('records') ? devRecordsSection(idea) : '')
    + candLink + samplesTrials
    + '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Gate history</h2><div style="overflow-x:auto"><table><tr><th>Gate</th><th>Decision</th><th>Reason</th><th>By</th><th>When</th><th>Ratified</th></tr>'+gatesHtml+'</table></div>'+(idea.caps.recordGate?'<div style="margin-top:10px"><a class="btn ghost" href="#gatelog">Record a gate decision →</a></div>':'')+'</div>'
    + tracker + pinned + comments
  );

  const on = (i, fn) => { const el = document.getElementById(i); if (el) el.onclick = fn; };
  on('rev_btn', async () => { try{ await api('POST','/api/pd/ideas/'+id+'/reverse', { reason: document.getElementById('rev_reason').value }); location.reload(); } catch(e){ document.getElementById('rev_msg').innerHTML = '<span class="err">'+esc(e.message)+'</span>'; } });
  on('s_submit', async () => {
    const g = i => document.getElementById(i).value;
    try{ await api('POST','/api/pd/ideas/'+id+'/screen', { decision:g('s_dec'), reason:g('s_reason'), screen_manuf_note:g('s_manuf'), screen_chem_note:g('s_chem'), park_condition:g('s_park'), priority:g('s_prio'), route:g('s_route'), lever:g('s_lever'), owner_id:g('s_owner') }); location.reload(); }
    catch(e){ document.getElementById('s_msg').innerHTML = '<span class="err">'+esc(e.message)+'</span>'; }
  });
  on('t_save', async () => {
    const g = i => document.getElementById(i).value;
    try{ await api('POST','/api/pd/ideas/'+id+'/update', { stage:g('t_stage'), priority:g('t_prio'), owner_id:g('t_owner'), next_action:g('t_next'), parent_product_id:g('t_prod'), problem_id:g('t_prob') }); renderIdea(hash, id); }
    catch(e){ document.getElementById('t_msg').innerHTML = '<span class="err">'+esc(e.message)+'</span>'; }
  });
  on('ic_btn', async () => {
    const v = document.getElementById('ic_body').value; if(!v.trim()){ document.getElementById('ic_msg').innerHTML='<span class="err">Write something first.</span>'; return; }
    try{ await api('POST','/api/pd/ideas/'+id+'/comment', { body:v }); renderIdea(hash, id); }
    catch(e){ document.getElementById('ic_msg').innerHTML = '<span class="err">'+esc(e.message)+'</span>'; }
  });
  on('newrec', async () => { try{ const j = await api('POST','/api/pd/records', {hypothesis_id: idea.id}); location.hash = '#record/'+j.id; } catch(e){ document.getElementById('newrec_msg').innerHTML = '<div class="err">'+esc(e.message)+'</div>'; } });
}

/* ---------- Development Records (G2) ---------- */
function devRecordsSection(idea){
  const rows = (idea.records||[]).map(r =>
    '<tr class="clickable" onclick="location.hash=\'#record/'+r.id+'\'"><td>'+esc(r.record_no)+'</td><td>'+esc(r.target_analysis||'—')+'</td><td><span class="chip stage">'+esc(r.status)+'</span></td><td>'+(r.approved_g2_at?'G2 ✓':'—')+'</td></tr>').join('');
  return '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Development Records</h2>'
    + ((idea.records&&idea.records.length)
        ? '<table><tr><th>Record</th><th>Target</th><th>Status</th><th>G2</th></tr>'+rows+'</table>'
        : '<p class="sub" style="margin:0">No Development Record yet.</p>')
    + (idea.can_create_record ? '<div style="margin-top:12px"><button class="btn" id="newrec">+ New Development Record</button><div id="newrec_msg"></div></div>' : '')
    + '</div>';
}

async function renderRecords(hash){
  shell('<h1>Development Records</h1><p class="sub">Loading…</p>', hash);
  const rows = await api('GET','/api/pd/records');
  const trs = rows.map(r =>
    '<tr class="clickable" onclick="location.hash=\'#record/'+r.id+'\'"><td>'+esc(r.record_no)+'</td>'
    + '<td>'+r.h_label+' '+esc((r.title||'').slice(0,40))+'</td><td>'+esc(r.target_analysis||'—')+'</td>'
    + '<td><span class="chip stage">'+esc(r.status)+'</span></td><td>'+(r.review_rta_at?'✔':'—')+'</td>'
    + '<td>'+(r.review_complete_at?'✔':'—')+'</td>'
    + '<td>'+(r.approved_g2_at?'✔'+(r.approved_g2_delegated?' <span class="chip stage">'+(r.ratified_by?'ratified':'RTA')+'</span>':''):'—')+'</td>'
    + '<td>'+esc(r.s5_decision||'')+'</td></tr>').join('');
  setMain('<h1>Development Records</h1>'
    + '<p class="sub">One record per recipe — a new molar ratio, ingredient role or target is a NEW record. Sections 1–3 before the beaker; RTA review + completeness + G2 unlock the bench; Sections 4–5 after. Records are created from the idea\'s page.</p>'
    + '<div class="card">'+(rows.length
        ? '<table><tr><th>Record</th><th>Hypothesis</th><th>Target</th><th>Status</th><th>RTA</th><th>Complete</th><th>G2</th><th>S5</th></tr>'+trs+'</table>'
        : '<p class="sub" style="margin:0">No records yet.</p>')+'</div>');
}

function collect(containerId){
  const out = {};
  document.querySelectorAll('#'+containerId+' [data-f]').forEach(el => { out[el.getAttribute('data-f')] = el.value; });
  return out;
}

async function renderRecord(hash, id){
  shell('<p class="sub">Loading…</p>', hash);
  const r = await api('GET','/api/pd/records/'+id);
  const c = r.caps;
  const sec = t => '<div class="sec">'+t+'</div>';
  const ta = (name, val, edit) => edit
    ? '<textarea data-f="'+name+'">'+esc(val||'')+'</textarea>'
    : '<div class="ro">'+(String(val==null?'':val).trim()!=='' ? esc(val) : '—')+'</div>';
  const inp = (name, val, edit, ph) => edit
    ? '<input data-f="'+name+'" value="'+esc(val||'')+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'
    : '<div class="ro">'+esc(String(val==null||val===''?'—':val))+'</div>';
  const sel = (name, val, opts) => '<select data-f="'+name+'">'+opts.map(o=>'<option'+(val===o?' selected':'')+'>'+o+'</option>').join('')+'</select>';

  const lighter = (r.change_type && r.change_type !== 'new')
    ? '<div class="card" style="border-color:var(--green);background:var(--green-soft)"><b>Lighter path — this is a '+esc(r.change_type)+' of an existing product.</b> Section 1 may inherit the parent product’s rationale: state only what THIS change improves and for whom. Sections 2–5 (chemistry, validation, bench, discussion) stay full-strength.</div>' : '';
  const statusLine = '<div class="card" style="padding:12px 16px"><span class="sub" style="margin:0"><b>The rule this form enforces:</b> no sample is made until Sections 1–3 are written, reviewed (RTA), checked complete (Custodian), and approved at G2. Status: <b>'+esc(r.status)+'</b>'
    + (c.locked_pre ? ' · Sections 1–3 locked (approved '+esc((r.approved_g2_at||'').slice(0,10))+(r.approved_g2_delegated?', delegated RTA sign-off':'')+')' : '')+'</span></div>';

  const preHtml = '<div id="preForm">'
    + '<div class="row" style="gap:16px">'
    + '<div style="flex:1;min-width:150px"><label>Target analysis (N-P-K)</label>'+inp('target_analysis', r.target_analysis, c.can_edit_pre)+'</div>'
    + '<div style="flex:1;min-width:170px"><label>Platform concept</label>'+inp('platform_concept', r.platform_concept, c.can_edit_pre, 'PAPR dual-release / humate / coated…')+'</div>'
    + '<div style="flex:1;min-width:110px"><label>Batch size</label>'+inp('batch_size', r.batch_size, c.can_edit_pre)+'</div></div>'
    + sec('Section 1 — Agronomic &amp; market rationale (pre-bench)')
    + '<label>1.1 Soil problem attacked, and by which lever (name the fixation pathway)</label>'+ta('s1_soil_problem', r.s1_soil_problem, c.can_edit_pre)
    + '<label>1.2 Target crop(s) and region — justify if universal</label>'+ta('s1_crop_region', r.s1_crop_region, c.can_edit_pre)
    + '<label>1.3 The farmer’s reason to switch vs DAP</label>'+ta('s1_farmer_reason', r.s1_farmer_reason, c.can_edit_pre)
    + '<label>1.4 Claims carried in, each tagged [VERIFIED]/[VALIDATE]/[OPEN]</label>'+ta('s1_claims_tags', r.s1_claims_tags, c.can_edit_pre)
    + sec('Section 2 — Chemistry &amp; formulation design (pre-bench)')
    + '<label>2.1 Reaction chemistry — balanced equation, molar ratio</label>'+ta('s2_reactions', r.s2_reactions, c.can_edit_pre)
    + '<label>2.2 Mass balance corrected for actual acid strength; predicted recovery</label>'+ta('s2_mass_balance', r.s2_mass_balance, c.can_edit_pre)
    + '<label>2.3 Water balance, moisture path, CO₂ evolution, neutralisation</label>'+ta('s2_water_balance', r.s2_water_balance, c.can_edit_pre)
    + '<label>2.4 Role of EVERY ingredient as a function (filler = flag it)</label>'+ta('s2_ingredient_roles', r.s2_ingredient_roles, c.can_edit_pre)
    + '<label>2.5 Predicted P-fraction split (water-sol / citrate-sol / residual)</label>'+ta('s2_predicted_split', r.s2_predicted_split, c.can_edit_pre)
    + sec('Section 3 — Validation design (pre-bench)')
    + '<label>3.1 Hypothesis in one sentence</label>'+ta('s3_hypothesis_one_line', r.s3_hypothesis_one_line, c.can_edit_pre)
    + '<label>3.2 Success criteria AND kill criteria, as numbers</label>'+ta('s3_success_kill_criteria', r.s3_success_kill_criteria, c.can_edit_pre)
    + '<label>3.3 Assays and named methods</label>'+ta('s3_assays_methods', r.s3_assays_methods, c.can_edit_pre)
    + '<label>3.4 Release-curve protocol (for any release claim)</label>'+ta('s3_release_protocol', r.s3_release_protocol, c.can_edit_pre)
    + (c.can_edit_pre ? '<div style="margin-top:12px"><button class="btn" id="savePre">Save Sections 1–3</button> <span id="pre_msg"></span></div>' : '')
    + '</div>';

  const signoff = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Pre-bench sign-off — the beaker gate path</h2>'
    + '<table class="signoff"><tr><th>Step</th><th>Status</th></tr>'
    + '<tr><td>RTA technical review</td><td>'+(r.review_rta_at ? '✔ '+esc(r.review_rta_by_name||'')+', '+esc((r.review_rta_at||'').slice(0,10))+(r.review_rta_note?' — '+esc(r.review_rta_note):'') : 'pending')+'</td></tr>'
    + '<tr><td>Completeness check</td><td>'+(r.review_complete_at ? '✔ '+esc(r.review_complete_by_name||'')+', '+esc((r.review_complete_at||'').slice(0,10)) : 'pending')+'</td></tr>'
    + '<tr><td>G2 design approval</td><td>'+(r.approved_g2_at ? '✔ '+esc(r.approved_g2_by_name||'')+', '+esc((r.approved_g2_at||'').slice(0,10))+(r.approved_g2_delegated?' — <b>delegated (RTA on site)</b>, COO ratifies within 48 h':'') : 'pending')+'</td></tr>'
    + '</table>'
    + (c.can_review_rta ? '<div style="margin-top:12px"><label>Review note (optional)</label><input id="rta_note"><div style="margin-top:8px"><button class="btn" id="doRta">Record technical review</button></div></div>' : '')
    + (c.can_complete ? '<div style="margin-top:12px"><button class="btn" id="doComplete">Confirm record is complete</button></div>' : '')
    + (c.can_approve_g2 ? '<div style="margin-top:12px"><button class="btn" id="doG2">Approve design (G2)</button> <span class="sub">'+(c.would_delegate?'You are signing on site under delegated authority — the COO ratifies in the Gate Log.':'')+(!c.g2_ready?' Needs the RTA review and completeness check first.':'')+'</span></div>' : '')
    + '<div id="sign_msg"></div></div>';

  const canPost = c.can_edit_post;
  const postHtml = '<div id="postForm">'
    + sec('Section 4 — Bench synthesis &amp; recording (post-bench)')
    + (!c.locked_pre ? '<div class="card" style="background:var(--amber-soft);border-color:var(--amber)"><span class="sub" style="margin:0">Locked until G2 is approved — no sample before sign-off.</span></div>' : '')
    + '<label>4.1 Actual quantities charged vs design, acid strength used</label>'+ta('s4_actual_charges', r.s4_actual_charges, canPost)
    + '<label>4.2 Observations (temperature, CO₂/foaming, free acid, granulation, drying)</label>'+ta('s4_observations', r.s4_observations, canPost)
    + '<label>4.3 Deviations from design, and why each was made</label>'+ta('s4_deviations', r.s4_deviations, canPost)
    + '<label>4.4 Recovered mass vs predicted; moisture achieved</label>'+ta('s4_recovery', r.s4_recovery, canPost)
    + sec('Section 5 — Analysis, discussion &amp; decision (post-bench)')
    + '<label>5.1 Measured P-fraction split vs Section 2 prediction</label>'+ta('s5_measured_vs_predicted', r.s5_measured_vs_predicted, canPost)
    + '<label>5.2 Result vs Section 3 criteria</label>'+(canPost ? sel('s5_result_vs_criteria', r.s5_result_vs_criteria, ['','pass','fail','ambiguous']) : '<div class="ro">'+esc(r.s5_result_vs_criteria||'—')+'</div>')
    + '<label>5.3 Discussion of the gap, with the likely chemical reason</label>'+ta('s5_discussion', r.s5_discussion, canPost)
    + '<label>5.4 Decision + single most informative next experiment</label>'+(canPost ? sel('s5_decision', r.s5_decision, ['','advance','iterate','stop']) : '<div class="ro">'+esc(r.s5_decision||'—')+'</div>')
    + ta('s5_next_experiment', r.s5_next_experiment, canPost)
    + (canPost ? '<div style="margin-top:12px"><button class="btn" id="savePost">Save Sections 4–5</button> <span id="post_msg"></span></div>' : '')
    + '</div>';

  setMain(
    '<h1>'+esc(r.record_no)+' — Development Record</h1>'
    + '<p class="sub">for '+r.h_label+' '+esc(r.title)+'</p>'
    + lighter + statusLine + preHtml + signoff + postHtml
    + '<p class="sub" style="margin-top:14px"><i>A recipe is a hypothesis about how phosphorus will behave in a calcareous soil — not a target number on a bag.</i></p>'
  );

  const on = (elId, fn) => { const el = document.getElementById(elId); if(el) el.onclick = fn; };
  const reload = () => renderRecord(hash, id);
  on('savePre', async () => { try{ await api('POST','/api/pd/records/'+id+'/pre', collect('preForm')); reload(); } catch(e){ const m=document.getElementById('pre_msg'); if(m) m.innerHTML='<span class="err">'+esc(e.message)+'</span>'; } });
  on('doRta', async () => { try{ await api('POST','/api/pd/records/'+id+'/rta-review', {note:(document.getElementById('rta_note')||{}).value||''}); reload(); } catch(e){ document.getElementById('sign_msg').innerHTML='<div class="err">'+esc(e.message)+'</div>'; } });
  on('doComplete', async () => { try{ await api('POST','/api/pd/records/'+id+'/complete', {}); reload(); } catch(e){ document.getElementById('sign_msg').innerHTML='<div class="err">'+esc(e.message)+'</div>'; } });
  on('doG2', async () => { try{ await api('POST','/api/pd/records/'+id+'/g2', {}); reload(); } catch(e){ document.getElementById('sign_msg').innerHTML='<div class="err">'+esc(e.message)+'</div>'; } });
  on('savePost', async () => { try{ await api('POST','/api/pd/records/'+id+'/post', collect('postForm')); reload(); } catch(e){ const m=document.getElementById('post_msg'); if(m) m.innerHTML='<span class="err">'+esc(e.message)+'</span>'; } });
}

async function renderGateLog(hash){
  shell('<h1>Gate log</h1><p class="sub">Loading…</p>', hash);
  const rows = await api('GET','/api/pd/gatelog');
  const role = me.pd_role;
  const canRecord = ['rta','custodian','coo'].includes(role);
  const isCoo = role === 'coo';
  let ideas = [];
  if (canRecord) { try { ideas = await api('GET','/api/pd/ideas'); } catch(e){ ideas = []; } }

  const pending = rows.filter(r => r.provisional && !r.ratified_by);
  let pendingHtml = '';
  if (isCoo && pending.length) {
    pendingHtml = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Awaiting your ratification (48-hour rule)</h2>'
      + '<table><tr><th>Gate</th><th>Idea</th><th>Decision</th><th>Reason</th><th>By</th><th>When</th><th></th></tr>'
      + pending.map(g => '<tr><td>'+g.gate+'</td><td>'+g.h_label+' '+esc(g.title)+'</td><td>'+esc(g.decision)+'</td><td>'+esc(g.reason)+'</td><td>'+esc(g.decided_by_name)+'</td><td class="sub" style="white-space:nowrap">'+esc((g.decided_at||'').slice(0,16).replace("T"," "))+'</td>'
        + '<td><button class="btn" data-ratify="'+g.id+'">Ratify</button></td></tr>').join('')
      + '</table></div>';
  }

  let recorderHtml = '';
  if (canRecord) {
    const hypOpts = ideas.filter(i => i.stage_label !== 'Killed').map(i => '<option value="'+i.id+'">'+i.h_label+' — '+esc(i.title)+'</option>').join('');
    const gateOpts = Object.keys(GATES_LABEL).map(g => '<option value="'+g+'">'+esc(GATES_LABEL[g])+'</option>').join('');
    recorderHtml = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Record a committee decision (G3–G6)</h2>'
      + '<div class="row" style="gap:14px">'
      + '<div style="flex:2;min-width:220px"><label>Idea / hypothesis</label><select id="g_hyp"><option value="">—</option>'+hypOpts+'</select></div>'
      + '<div style="flex:1;min-width:150px"><label>Gate</label><select id="g_gate">'+gateOpts+'</select></div>'
      + '<div style="flex:1;min-width:150px"><label>Decision</label><select id="g_dec"></select></div>'
      + '</div>'
      + '<label>Committee members present (roles)</label><input id="g_att" placeholder="COO, Plant Manager, QC Head…">'
      + '<label>Reason (recorded forever — the owner is told)</label><textarea id="g_reason"></textarea>'
      + '<label style="font-weight:400;display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" id="g_site" style="width:auto"> Site quorum — Plant Manager presiding under delegated authority (provisional until the COO ratifies within 48 h)</label>'
      + '<div style="margin-top:12px"><button class="btn" id="g_submit">Record decision</button> <span id="g_msg"></span></div></div>';
  }

  const logTable = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Decision log</h2>'
    + (rows.length ? '<table><tr><th>When</th><th>Gate</th><th>Idea</th><th>Decision</th><th>Reason</th><th>By</th><th>Ratified</th></tr>'
      + rows.map(r => '<tr class="clickable" onclick="location.hash=\'#idea/'+r.hypothesis_id+'\'"><td>'+esc((r.decided_at||'').slice(0,10))+'</td><td>'+r.gate+(r.is_site_quorum?'<br><span class="sub">site quorum</span>':'')+'</td><td>'+r.h_label+' '+esc(r.title)+'</td><td><b>'+esc(r.decision)+'</b></td><td>'+esc(r.reason)+'</td><td>'+esc(r.decided_by_name)+'</td><td class="sub">'+(r.ratified_by_name?esc(r.ratified_by_name):(r.provisional?'<b>pending</b>':'—'))+'</td></tr>').join('')
      + '</table>' : '<p class="sub" style="margin:0">No decisions yet.</p>')
    + '</div>';

  setMain('<h1>Gate log</h1><p class="sub">Every gate decision, with its reason, kept forever. G1 is on the idea, G2 on the Development Record; G3–G6 are recorded here.</p>'
    + '<details class="card"><summary style="cursor:pointer;font-weight:600">The possible decisions at each gate (G3–G6)</summary><p class="sub" style="margin:8px 0">A gate never ends "pending" — it ends in exactly one of these, always with a written reason kept forever.</p><table><tr><th>Gate</th><th>Possible decisions</th></tr>'
      + Object.keys(GATES_LABEL).map(g=>'<tr><td><b>'+esc(GATES_LABEL[g])+'</b></td><td>'+(PD_GATE_OUTCOMES[g]||[]).map(o=>esc(o[1])).join('<br>')+'</td></tr>').join('')+'</table></details>'
    + pendingHtml + recorderHtml + logTable);

  document.querySelectorAll('[data-ratify]').forEach(btn => btn.onclick = async () => {
    try { await api('POST','/api/pd/gates/'+btn.getAttribute('data-ratify')+'/ratify', {}); renderGateLog(hash); }
    catch(e){ alert(e.message); }
  });
  if (canRecord) {
    const gsel = document.getElementById('g_gate'), dsel = document.getElementById('g_dec');
    const sync = () => { dsel.innerHTML = (PD_GATE_OUTCOMES[gsel.value]||[]).map(o=>'<option value="'+o[0]+'">'+esc(o[1])+'</option>').join(''); };
    gsel.onchange = sync; sync();
    document.getElementById('g_submit').onclick = async () => {
      const body = { hypothesis_id: document.getElementById('g_hyp').value, gate: gsel.value, decision: dsel.value,
        reason: document.getElementById('g_reason').value, attendees: document.getElementById('g_att').value, is_site_quorum: document.getElementById('g_site').checked };
      if(!body.hypothesis_id){ document.getElementById('g_msg').innerHTML='<span class="err">Pick an idea.</span>'; return; }
      try { await api('POST','/api/pd/gates/decide', body); renderGateLog(hash); }
      catch(e){ document.getElementById('g_msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
    };
  }
}

  const matTable = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Materials</h2><div style="overflow-x:auto"><table><tr><th>Code</th><th>Material</th><th>N%</th><th>P2O5%</th><th>S%</th><th>Zn%</th><th>Rs/tonne</th><th>Basis</th>'+(edit?'<th></th>':'')+'</tr>'+matRows+'</table></div></div>';

      try { await api('POST','/api/pd/materials', body); renderMaterials(hash); } catch(e){ document.getElementById('am_msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; } };
    const fp = document.getElementById('fp_submit');
    if (fp) fp.onclick = async () => { const g = id => document.getElementById(id).value;
      try { await api('POST','/api/pd/materials/conflicts', { material_a_id:g('fp_a'), material_b_id:g('fp_b'), severity:g('fp_sev'), reason:g('fp_reason') }); renderMaterials(hash); }
      catch(e){ document.getElementById('fp_msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; } };
  }
}

/* ---------- Candidate screen: route picker + one route ---------- */
async function renderCandidates(hash){
  shell('<h1>Candidate screen</h1><p class="sub">Loading…</p>', hash);
  const rows = await api('GET','/api/pd/candidates');
  const trs = rows.map(r => '<tr class="clickable" onclick="location.hash=\'#route/'+r.id+'\'"><td><b>'+esc(r.route||'—')+'</b></td><td>'+r.h_label+'</td><td>'+esc(r.title)+'</td><td><span class="chip stage">'+esc(r.stage_label)+'</span></td><td>'+r.cands+'</td><td>'+r.sel+'</td><td class="sub">'+(r.g3_open?'open (G3 passed)':'<b>shut</b>')+'</td></tr>').join('');
  setMain('<h1>Pre-bench candidate screen</h1>'
    + '<p class="sub">The filter between opening a route and making anything: which combinations are worth physically making? Mass balance, the target window, a cost ceiling, and VAN\'s compatibility table. It is arithmetic — it does not predict soil behaviour.</p>'
    + '<div class="card">'+(rows.length?'<div style="overflow-x:auto"><table><tr><th>Route</th><th>ID</th><th>Title</th><th>Stage</th><th>Cands</th><th>Selected</th><th>Beaker gate</th></tr>'+trs+'</table></div>':'<p class="sub" style="margin:0">No open routes yet. A route appears here once its idea is screened LOG at G1.</p>')+'</div>'
    + '<p class="sub">Materials, prices and compatibility live in the <a href="#materials">materials register</a>.</p>');
}

async function renderRoute(hash, hid){
  shell('<p class="sub">Loading…</p>', hash);
  const d = await api('GET','/api/pd/candidates/'+hid);
  const { hyp, rs, materials, candidates, g3_open, caps } = d;
  const barInput = (id,label,val) => '<div style="flex:1;min-width:115px"><label>'+label+'</label><input id="'+id+'" value="'+esc(num(val))+'"></div>';

  const bar = caps.editBar
    ? '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 6px">The bar for this route</h2>'
      + '<p class="sub" style="margin:0 0 10px">The cost ceiling belongs to the DAP cost-parity model — its maximum ex-works cost at target E. Write down which E it assumes: a ceiling without its E is a number with no meaning.</p>'
      + '<div class="row" style="gap:12px">'
      + barInput('b_p2min','P2O5 % min', rs.target_p2o5_min) + barInput('b_p2max','P2O5 % max', rs.target_p2o5_max)
      + barInput('b_nmin','N % min', rs.target_n_min) + barInput('b_nmax','N % max', rs.target_n_max)
      + barInput('b_smin','S % min', rs.target_s_min) + barInput('b_znmin','Zn % min', rs.target_zn_min)
      + barInput('b_ceil','Ex-works ceiling Rs/t', rs.cost_ceiling_per_tonne) + barInput('b_conv','Conversion Rs/t', rs.conversion_cost_per_tonne) + barInput('b_loss','Process loss %', rs.process_loss_pct)
      + '</div><label>Where the ceiling came from</label><input id="b_basis" value="'+esc(rs.ceiling_basis||'')+'" placeholder="e.g. DAP cost-parity model v1, target E = 1.30">'
      + '<div style="margin-top:12px"><button class="btn" id="b_save">Save the bar and re-screen everything</button> <span id="b_msg"></span></div></div>'
    : '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">The bar for this route</h2><table>'
      + '<tr><th style="width:220px">P2O5 window</th><td>'+num(rs.target_p2o5_min)+'% – '+num(rs.target_p2o5_max)+'%</td></tr>'
      + '<tr><th>N window</th><td>'+num(rs.target_n_min)+'% – '+num(rs.target_n_max)+'%</td></tr>'
      + '<tr><th>Ex-works ceiling</th><td>'+(Number(rs.cost_ceiling_per_tonne)>0?money(rs.cost_ceiling_per_tonne)+' / tonne':'<b>not set</b>')+'</td></tr>'
      + '<tr><th>Ceiling basis</th><td class="sub">'+(rs.ceiling_basis?esc(rs.ceiling_basis):'— not stated —')+'</td></tr></table></div>';

  const vcol = { pass:'var(--green)', borderline:'var(--amber)', fail:'var(--red)' };
  let candHtml;
  if (!candidates.length) candHtml = '<div class="card"><p class="sub" style="margin:0">No candidates yet. A candidate is one combination on paper: the recipe, and one line saying what it tests.</p></div>';
  else {
    const rowsH = candidates.map(c => {
      const main = '<tr><td>'+c.c_label+'</td><td><b>'+esc(c.label)+'</b><br><span class="sub">'+esc(c.micro_hypothesis)+'</span></td>'
        + '<td>'+num(c.calc_n)+'</td><td><b>'+num(c.calc_p2o5)+'</b></td><td>'+num(c.calc_s)+'</td><td>'+num(c.calc_zn)+'</td>'
        + '<td>'+Math.round(Number(c.calc_exworks_cost)).toLocaleString('en-US')+'</td>'
        + '<td><b>'+(Number(c.calc_cost_per_kg_p)>0?Number(c.calc_cost_per_kg_p).toFixed(1):'—')+'</b></td>'
        + '<td style="color:'+(vcol[c.verdict]||'#666')+'"><b>'+esc((c.verdict||'').toUpperCase())+'</b>'+(c.provisional_pricing?'<br><span class="sub">provisional</span>':'')+'</td>'
        + '<td class="sub">'+esc(c.status)+(c.s_label?'<br>'+c.s_label:'')+'</td></tr>';
      let act = '';
      if (caps.decide && ['screened','rejected'].includes(c.status)) act += '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="dr_'+c.id+'" placeholder="Reason (kept forever)" style="flex:1;min-width:200px"><button class="btn" data-decide="'+c.id+'" data-want="selected">Select for bench</button><button class="btn ghost" data-decide="'+c.id+'" data-want="rejected">Rule out</button></div>';
      if (c.decision_reason) act += '<div class="sub" style="margin-top:6px"><b>'+esc((c.status||'').toUpperCase())+':</b> '+esc(c.decision_reason)+(c.decided_by_name?' — '+esc(c.decided_by_name):'')+'</div>';
      if (caps.make && c.status==='selected') act += '<div style="margin-top:8px"><button class="btn'+(g3_open?'':' ghost')+'" data-make="'+c.id+'">Make this — log a sample</button>'+(g3_open?'':' <span class="sub">the beaker gate is shut; this will be refused</span>')+'</div>';
      const reasons = '<tr><td colspan="10" style="background:var(--surface-2)"><span class="sub" style="white-space:pre-wrap">'+esc(c.verdict_reasons||'')+'</span>'+act+'</td></tr>';
      return main + reasons;
    }).join('');
    candHtml = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 6px">Candidates ('+candidates.length+')</h2>'
      + '<p class="sub" style="margin:0 0 10px">Ranked by <b>rupees per kg of P2O5</b> — a cheaper bag that carries less phosphorus is not cheaper. Failures stay on the list, with their reasons.</p>'
      + '<div style="overflow-x:auto"><table><tr><th>ID</th><th>Candidate</th><th>N%</th><th>P2O5%</th><th>S%</th><th>Zn%</th><th>Ex-works<br>Rs/t</th><th>Rs/kg<br>P2O5</th><th>Verdict</th><th>Status</th></tr>'+rowsH+'</table></div></div>';
  }

  let addForm = '';
  if (caps.addCandidate) {
    if (!materials.length) addForm = '<div class="card"><p class="sub" style="margin:0">The materials register is empty — <a href="#materials">add materials first</a>.</p></div>';
    else { const matRows = materials.map(m => '<tr><td>'+esc(m.code+' — '+m.name)+' <span class="sub">(N '+num(m.n_pct)+' · P2O5 '+num(m.p2o5_pct)+' · S '+num(m.s_pct)+' · Zn '+num(m.zn_pct)+' · '+money(m.cost_per_tonne)+'/t'+((m.cost_basis==='placeholder'||m.assay_basis==='placeholder')?' · placeholder':'')+')</span></td><td><input data-cl="'+m.id+'" value="0" style="width:90px"></td></tr>').join('');
      addForm = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 6px">Screen a candidate</h2>'
        + '<p class="sub" style="margin:0 0 10px">One combination, on paper. The analysis is computed from the recipe by <b>mass balance</b> — not a prediction of reaction yield. Treat it as a first approximation and measure the real assay at the bench.</p>'
        + '<div class="row" style="gap:12px"><div style="flex:1;min-width:180px"><label>Label</label><input id="c_label" placeholder="SSP + 3% Zn, 5% S"></div><div style="flex:2;min-width:240px"><label>One-line micro-hypothesis</label><input id="c_micro" placeholder="What this combination tests, and what you expect."></div></div>'
        + '<label>Recipe — inclusion % of each material (must total 100)</label><div style="overflow-x:auto"><table><tr><th>Material</th><th style="width:120px">Inclusion %</th></tr>'+matRows+'</table></div>'
        + '<div style="margin-top:12px"><button class="btn" id="c_submit">Screen it</button> <span id="c_msg"></span></div></div>'; }
  }

  setMain('<h1>Candidate screen — '+hyp.h_label+' '+esc(hyp.title)+(hyp.route?' <span class="sub">['+esc(hyp.route)+']</span>':'')+'</h1>'
    + '<p class="sub"><a href="#idea/'+hyp.id+'">back to the idea</a> · <a href="#candidates">all routes</a> · <a href="#materials">materials</a></p>'
    + '<div class="card" style="'+(g3_open?'border-color:var(--green);background:var(--green-soft)':'background:var(--amber-soft);border-color:var(--amber)')+'"><span class="sub" style="margin:0">'+(g3_open?'<b>Beaker gate open.</b> A selected candidate may be made — everything made carries its micro-hypothesis into the sample record.':'<b>Beaker gate shut.</b> Screen and rank as much as you like — nothing can be physically made until the committee records a G3 ADVANCE for this route.')+'</span></div>'
    + bar + candHtml + addForm);

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('b_save', async () => { const g = id => document.getElementById(id).value;
    const body = { target_p2o5_min:g('b_p2min'), target_p2o5_max:g('b_p2max'), target_n_min:g('b_nmin'), target_n_max:g('b_nmax'), target_s_min:g('b_smin'), target_zn_min:g('b_znmin'), cost_ceiling_per_tonne:g('b_ceil'), conversion_cost_per_tonne:g('b_conv'), process_loss_pct:g('b_loss'), ceiling_basis:g('b_basis') };
    try { await api('POST','/api/pd/candidates/'+hid+'/settings', body); renderRoute(hash, hid); } catch(e){ document.getElementById('b_msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; } });
  document.querySelectorAll('[data-decide]').forEach(btn => btn.onclick = async () => {
    const cid = btn.getAttribute('data-decide'), want = btn.getAttribute('data-want');
    const reason = (document.getElementById('dr_'+cid)||{}).value || '';
    try { await api('POST','/api/pd/candidates/'+hid+'/decide', { candidate_id:cid, decision:want, decision_reason:reason }); renderRoute(hash, hid); } catch(e){ alert(e.message); } });
  document.querySelectorAll('[data-make]').forEach(btn => btn.onclick = async () => {
    try { await api('POST','/api/pd/candidates/'+hid+'/make', { candidate_id: btn.getAttribute('data-make') }); renderRoute(hash, hid); } catch(e){ alert(e.message); } });
  on('c_submit', async () => {
    const label = document.getElementById('c_label').value, micro = document.getElementById('c_micro').value; const lines = [];
    document.querySelectorAll('[data-cl]').forEach(el => { const pct = Number(el.value)||0; if (pct>0) lines.push({ material_id: el.getAttribute('data-cl'), inclusion_pct: pct }); });
    try { await api('POST','/api/pd/candidates/'+hid+'/add', { label, micro_hypothesis:micro, lines }); renderRoute(hash, hid); } catch(e){ document.getElementById('c_msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; } });
}

/* ---------- Field trials (G5) ---------- */
async function renderTrials(hash){
  shell('<h1>Field trials</h1><p class="sub">Loading…</p>', hash);
  const d = await api('GET','/api/pd/trials');
  const caps = d.caps;

  let design = '';
  if (caps.design) {
    const hopts = d.hyps.map(h=>'<option value="'+h.id+'">'+h.h_label+' — '+esc(h.title)+'</option>').join('');
    design = '<div class="card"><h2 style="font-size:1.05rem;margin:0 0 10px">Design a trial</h2>'
      + '<div class="row" style="gap:12px">'
      + '<div style="flex:2;min-width:220px"><label>Hypothesis (bench survivors)</label><select id="ft_hyp"><option value="">—</option>'+hopts+'</select></div>'
      + '<div style="flex:1;min-width:150px"><label>Season</label><input id="ft_season" placeholder="Rabi 2026-27"></div>'
      + '<div style="flex:1;min-width:150px"><label>Crop &amp; variety</label><input id="ft_crop"></div>'
      + '<div style="flex:1;min-width:150px"><label>District / village</label><input id="ft_loc"></div></div>'
      + '<label>Soil (pH, CaCO₃, available P — pre-trial soil test required)</label><input id="ft_soil">'
      + '<label>Objective (one sentence: what this trial must answer)</label><textarea id="ft_obj"></textarea>'
      + '<label>Success / kill criteria (the number that decides)</label><textarea id="ft_sk"></textarea>'
      + '<label>Treatments (incl. DAP control at recommended rate; equal P rate unless rate is the variable)</label><textarea id="ft_treat"></textarea>'
      + '<label>Design &amp; layout</label><input id="ft_design" value="RCBD, 3 replications">'
      + '<label>Measurements &amp; timing (decide now, not at harvest)</label><textarea id="ft_meas" placeholder="Early vigour 2-4 wk; plant P% mid & harvest; grain yield; post-harvest soil P"></textarea>'
      + '<div style="margin-top:12px"><button class="btn" id="ft_submit">Save trial design</button> <span id="ft_msg"></span></div></div>';
  }

  let list;
  if (!d.trials.length) list = '<div class="card"><p class="sub" style="margin:0">No trials yet. Only hypotheses that survived the bench (G4) can be trialled; a trial needs a G5 approval before sowing.</p></div>';
  else list = d.trials.map(t => {
    const obs = (t.observations||[]).map(o=>'<li>'+esc(o.obs_date)+' — '+esc(o.obs_text)+' <i>('+esc(o.added_by_name)+')</i></li>').join('');
    const obsBlock = obs ? '<div style="margin-top:8px"><b class="sub">Season observations:</b><ul class="sub" style="margin:4px 0 0 18px">'+obs+'</ul></div>' : '';
    const detail = '<div class="sub" style="margin-top:6px">'
      + (t.objective?'<b>Objective:</b> '+esc(t.objective)+'<br>':'')
      + (t.success_kill?'<b>Decides:</b> '+esc(t.success_kill)+'<br>':'')
      + (t.treatments?'<b>Treatments:</b> '+esc(t.treatments)+'<br>':'')
      + '<b>Design:</b> '+esc(t.design_layout||'')+(t.sown?' · sown '+esc(t.sown):'')+(t.harvest?' · harvest '+esc(t.harvest):'')
      + (t.result_summary?'<br><b>Result:</b> '+esc(t.result_summary)+' → <b>'+esc(t.decision||'')+'</b>':'')
      + '</div>';
    const observe = caps.observe ? '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'
      + '<div style="flex:2;min-width:200px"><label>Add season observation</label><input id="ob_'+t.id+'" placeholder="What you saw in the field"></div>'
      + '<div style="flex:1;min-width:150px"><label>Date</label><input type="date" id="obd_'+t.id+'"></div>'
      + '<button class="btn ghost" data-observe="'+t.id+'">Save observation</button></div>' : '';
    const update = caps.update ? '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px"><div class="row" style="gap:12px">'
      + '<div style="flex:1;min-width:130px"><label>Status</label><select id="st_'+t.id+'">'+['designed','approved','running','harvested','analysed','closed'].map(s=>'<option'+(t.status===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div>'
      + '<div style="flex:1;min-width:150px"><label>Decision after harvest</label><select id="de_'+t.id+'">'+['','advance','repeat','stop'].map(s=>'<option'+(t.decision===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div>'
      + '<div style="flex:1;min-width:130px"><label>Sown</label><input type="date" id="sw_'+t.id+'" value="'+esc(t.sown||'')+'"></div>'
      + '<div style="flex:1;min-width:130px"><label>Harvest</label><input type="date" id="hv_'+t.id+'" value="'+esc(t.harvest||'')+'"></div></div>'
      + '<label>Result summary (a non-significant difference is not a result — say so)</label><textarea id="rs_'+t.id+'">'+esc(t.result_summary||'')+'</textarea>'
      + '<div style="margin-top:8px"><button class="btn ghost" data-update="'+t.id+'">Update trial</button></div></div>' : '';
    return '<div class="card"><div><b>'+esc(t.trial_code)+'</b> — '+t.h_label+' '+esc(t.title)+' · '+esc(t.crop||'')+' · '+esc(t.season||'')+' · status <b>'+esc(t.status)+'</b> · '
      + (t.g5ok?'<span class="chip light">G5 approved</span>':'<span class="chip heavy">awaiting G5</span>')+'</div>'
      + detail + obsBlock + observe + update + '</div>';
  }).join('');

  setMain('<h1>Field trials</h1><p class="sub">Only for hypotheses that survived the bench (G4). A trial is worth the season only with a real DAP control, enough replication (RCBD, 3–4 blocks), and measurements fixed before sowing. G5 approval in the gate log is required before sowing.</p>'
    + design + list);

  if (caps.design) document.getElementById('ft_submit').onclick = async () => {
    const g = id => document.getElementById(id).value;
    const body = { hypothesis_id:g('ft_hyp'), season:g('ft_season'), crop:g('ft_crop'), location:g('ft_loc'), soil_info:g('ft_soil'), objective:g('ft_obj'), success_kill:g('ft_sk'), treatments:g('ft_treat'), design_layout:g('ft_design'), measurements:g('ft_meas') };
    if(!body.hypothesis_id){ document.getElementById('ft_msg').innerHTML='<span class="err">Pick a hypothesis.</span>'; return; }
    try { await api('POST','/api/pd/trials', body); renderTrials(hash); } catch(e){ document.getElementById('ft_msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
  };
  document.querySelectorAll('[data-observe]').forEach(btn => btn.onclick = async () => {
    const tid = btn.getAttribute('data-observe');
    try { await api('POST','/api/pd/trials/'+tid+'/observe', { obs_text: document.getElementById('ob_'+tid).value, obs_date: document.getElementById('obd_'+tid).value }); renderTrials(hash); } catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-update]').forEach(btn => btn.onclick = async () => {
    const tid = btn.getAttribute('data-update');
    try { await api('POST','/api/pd/trials/'+tid+'/update', { status:document.getElementById('st_'+tid).value, decision:document.getElementById('de_'+tid).value, sown:document.getElementById('sw_'+tid).value, harvest:document.getElementById('hv_'+tid).value, result_summary:document.getElementById('rs_'+tid).value }); renderTrials(hash); } catch(e){ alert(e.message); }
  });
}

/* ---------- Registers: Problems, Projects, Portfolio ---------- */
function renderNewProblem(hash){
  const opts = Object.keys(PD_SOURCES).map(k=>'<option value="'+k+'">'+esc(PD_SOURCES[k])+'</option>').join('');
  shell('<h1>Register a problem</h1>'
    + '<p class="sub">A problem is stated in the field and in farmer economics, never in chemistry. "80% of applied P locks up in calcareous soil; farmers pay DAP prices for 15–20% efficiency" is a problem. "Make NP 5-40" is not — that is a product concept answering a problem.</p>'
    + '<div class="card">'
    + '<label>Title</label><input id="np_title">'
    + '<label>The problem, stated in field / farmer-economics terms</label><textarea id="np_stmt" placeholder="Who suffers, where, and what does it cost them today?"></textarea>'
    + '<label>Context (crop, region, soil, market size, what farmers currently do)</label><textarea id="np_ctx"></textarea>'
    + '<label>Where did this problem come from?</label><select id="np_src">'+opts+'</select>'
    + '<div style="margin-top:12px"><button class="btn" id="np_submit">Register problem</button> <span id="np_msg"></span></div></div>', hash);
  document.getElementById('np_submit').onclick = async () => {
    const g = id => document.getElementById(id).value;
    if(!g('np_title').trim() || !g('np_stmt').trim()){ document.getElementById('np_msg').innerHTML='<span class="err">Title and statement are required.</span>'; return; }
    try { await api('POST','/api/pd/problems', { title:g('np_title'), statement:g('np_stmt'), context:g('np_ctx'), source:g('np_src') });
      location.hash = me.surfaces.includes('registers') ? '#problems' : '#home'; }
    catch(e){ document.getElementById('np_msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
  };
}

async function renderProblems(hash){
  shell('<h1>Problem register</h1><p class="sub">Loading…</p>', hash);

      + '<td class="sub">'+workHtml+'</td><td class="sub">'+esc(p.added_by_name)+'</td></tr>';
  }).join('');
  setMain('<h1>Problem register — why products exist</h1>'
    + '<p class="sub">A problem is stated in the field and in farmer economics, never in chemistry. Problems are few, owned by management, and live for years. Every product concept must point at one. <a href="#newproblem">Register a problem →</a></p>'
    + '<div class="card">'+(d.problems.length?'<div style="overflow-x:auto"><table><tr><th>ID</th><th>Title</th><th>Statement</th><th>Status</th><th>Work aimed at it</th><th>By</th></tr>'+rows+'</table></div>':'<p class="sub" style="margin:0">No problems registered yet.</p>')+'</div>');

    try { await api('POST','/api/pd/problems/'+sel.getAttribute('data-status')+'/status', { status: sel.value }); renderProblems(hash); } catch(e){ alert(e.message); }
  });
}

async function renderProjects(hash){
  shell('<h1>Development Projects</h1><p class="sub">Loading…</p>', hash);
  const d = await api('GET','/api/pd/projects');
  const rows = d.projects.map(p => '<tr class="clickable" onclick="location.hash=\'#project/'+p.id+'\'"><td>'+p.prj_label+'</td><td><b>'+esc(p.code)+'</b><br>'+esc(p.title)+'</td><td class="sub">'+(p.problem_label?esc(p.problem_label):'—')+'</td><td>'+p.routes+'</td><td class="sub">'+esc(p.owner_name||'—')+'</td><td class="sub">'+esc(p.status_label)+'</td></tr>').join('');
  let open = '';
