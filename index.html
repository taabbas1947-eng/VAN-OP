<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O2S System</title>
<!-- VAN build: 2026-06-04 first-push test -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f8f9fb; --panel:#ffffff; --panel2:#f1f3f6; --line:#e5e8ee; --line2:#eef0f4; --rail:#eceef1; --rail-line:#dee1e6;
  --navy:#0891b2; --navy2:#0e7490; --navy-50:#e0f3f7; --navy-100:#b6e3ec;
  --green:#0891b2; --green2:#0e7490; --leaf:#22b8cf; --green-50:#e0f3f7;
  --teal:#0891b2; --amber:#c77b0e; --amber-50:#faf0da; --red:#c0392b; --red-50:#fbe7e4;
  --blue:#2563eb; --purple:#7a6cc0;
  --txt:#161a20; --txt2:#475063; --mut:#717a88;
  --head:'Space Grotesk','Inter',system-ui,sans-serif;
  --radius:15px; --radius-sm:10px;
  --sh-sm:0 1px 2px rgba(15,23,42,.07),0 1px 1px rgba(15,23,42,.04);
  --sh:0 3px 12px rgba(15,23,42,.10),0 1px 3px rgba(15,23,42,.06);
  --sh-lg:0 20px 50px rgba(15,23,42,.20);
  --ring:0 0 0 3px rgba(8,145,178,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
h1,h2,h3{margin:0;letter-spacing:-.02em;font-family:var(--head)}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d6deea;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#c2cdde}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:220px;background:var(--rail);border-right:1px solid var(--rail-line);padding:11px 9px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;padding:3px 6px 10px;border-bottom:1px solid var(--line2);margin-bottom:8px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--leaf),var(--navy));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(8,145,178,.28)}
.brand .nm{font-size:15.5px;font-weight:700;color:var(--txt);line-height:1.05;letter-spacing:-.02em;font-family:var(--head)}
.brand .nm span{display:block;font-size:9px;font-weight:700;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:1px;flex:1}
.nav a{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:8px;color:var(--txt2);cursor:pointer;font-size:12.5px;font-weight:600;transition:.13s;position:relative}
.nav a:hover{background:var(--panel2);color:var(--txt)}
.nav a.active{background:var(--navy-50);color:var(--navy);font-weight:700}
.nav a.active::before{content:'';position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--navy)}
.nav a .ic{width:17px;height:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--mut)}
.nav a.active .ic{color:var(--navy)}
.nav a .ic svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav a .lk{margin-left:auto;font-size:8.5px;color:var(--navy);background:#fff;border:1px solid var(--navy-100);border-radius:6px;padding:1px 6px;font-weight:700;letter-spacing:.3px}
.side .foot{padding-top:12px;border-top:1px solid var(--line2);margin-top:8px}
.navsearch{display:flex;align-items:center;gap:7px;width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 9px;color:var(--mut);font-size:12px;cursor:pointer;margin-bottom:6px}
.navsearch svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navsearch .nstxt{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navsearch kbd{flex-shrink:0;white-space:nowrap;font-size:9px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:inherit}
.navgrp{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);padding:8px 10px 2px}
.nav a .nlbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navct{margin-left:auto;font-size:10px;font-weight:700;background:var(--navy);color:#fff;border-radius:999px;min-width:18px;text-align:center;padding:0 6px;line-height:17px}
.usermenu{position:relative}
.usermenu>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
.usermenu>summary::-webkit-details-marker{display:none}
.usermenu .umeta{display:flex;flex-direction:column;line-height:1.15}
.usermenu .un{font-weight:700;font-size:12px;color:var(--txt)}
.usermenu .ur{font-size:10px;color:var(--mut)}
.usermenu .umc{color:var(--mut);font-size:11px;margin-left:2px}
.usermenu .umpop{position:absolute;right:0;top:calc(100% + 7px);background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh);padding:8px;min-width:150px;z-index:60}
.cmdk{display:none;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:200}
.cmdk.open{display:flex;align-items:flex-start;justify-content:center}
.cmdk .box{background:#fff;border-radius:13px;box-shadow:var(--sh-lg);width:520px;max-width:92vw;margin-top:12vh;overflow:hidden}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;border-radius:0;outline:none}
.cmdk .res{max-height:340px;overflow:auto;padding:6px}
.cmdk .ri{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt2)}
.cmdk .ri:hover,.cmdk .ri.sel{background:var(--navy-50);color:var(--navy)}
.cmdk .rk{font-size:10px;color:var(--mut);margin-left:auto;text-transform:uppercase;letter-spacing:.4px}
/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:7px 18px;background:#ffffff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h2{font-size:16px;font-weight:700;color:var(--txt);letter-spacing:-.02em}
.topbar .sub{font-size:11px;color:var(--mut);margin-top:1px;font-weight:500}
.rolebox{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px 4px;box-shadow:var(--sh-sm)}
.rolebox label{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.rolebox .av{width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}
.helpbar{display:flex;align-items:center;gap:9px;padding:6px 18px;background:var(--navy-50);border-bottom:1px solid var(--navy-100);color:var(--navy2);font-size:11.5px;line-height:1.4;font-weight:500}
.helpbar:empty{display:none}
.helpbar::before{content:'';flex-shrink:0;width:15px;height:15px;background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230891b2' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><line x1='12' y1='16' x2='12' y2='12'/><line x1='12' y1='8' x2='12.01' y2='8'/></svg>")}
.helpbar b{font-weight:700;color:var(--navy)}
.wrap{padding:16px 20px;flex:1;max-width:1440px;margin:0 auto;width:100%}
/* ---------- controls ---------- */
select,input,button,textarea{font-family:inherit}
select,input[type=text],input[type=number],input[type=date],textarea{background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;outline:none;transition:.14s}
select:hover,input:hover{border-color:#d3dceb}
select:focus,input:focus,textarea:focus{border-color:var(--navy);box-shadow:var(--ring)}
.rolebox select{background:transparent;border:none;padding:6px 6px;font-weight:700;color:var(--navy)}
.rolebox select:focus{box-shadow:none}
button{background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 17px;font-size:13px;font-weight:700;cursor:pointer;transition:.14s;box-shadow:var(--sh-sm);letter-spacing:-.01em}
button:hover{background:var(--navy2);transform:translateY(-1px);box-shadow:var(--sh)}
button:active{transform:translateY(0)}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
button.ghost:hover{background:var(--panel2);border-color:#d3dceb}
button.green{background:var(--green)}button.green:hover{background:var(--green2)}
button.sm{padding:7px 12px;font-size:12px;border-radius:9px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
/* ---------- cards & kpis ---------- */
.row{display:flex;gap:14px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.dgrid .card{margin:0}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh-sm)}
.card h3{font-size:14px;margin-bottom:14px;color:var(--txt);font-weight:700;display:flex;align-items:center;letter-spacing:-.02em}
.card h3 .hint{font-weight:500;color:var(--mut);font-size:11.5px;margin-left:auto}
.acard{padding:0;overflow:hidden}
.acard>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:11px;font-size:14px;font-weight:700;color:var(--txt);letter-spacing:-.02em;user-select:none}
.acard>summary::-webkit-details-marker{display:none}
.acard>summary::before{content:"\203A";display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:7px;background:var(--navy-50);color:var(--navy);font-size:18px;font-weight:800;line-height:1;transition:transform .15s,background .15s,color .15s;flex:none}
.acard[open]>summary::before{transform:rotate(90deg);background:var(--navy);color:#fff}
.acard>summary:hover{background:var(--navy-50)}
.acard>summary:hover::before{background:var(--navy-100)}
.acard[open]>summary:hover::before{background:var(--navy2)}
.acard>summary .hint{font-weight:500;color:var(--mut);font-size:11.5px;margin-left:auto}
.acard>summary::after{content:"Show";flex:none;font-size:10px;font-weight:800;color:var(--navy);background:var(--navy-50);border:1px solid var(--navy-100);border-radius:999px;padding:3px 11px;text-transform:uppercase;letter-spacing:.5px}
.acard[open]>summary::after{content:"Hide";background:var(--navy);color:#fff;border-color:var(--navy)}
.acard[open]>summary{border-bottom:1px solid var(--line)}
.acard>.acard-body{padding:14px 18px 16px}
.acard .acard-body table td,.acard .acard-body table th{padding:5px 8px}
.acard .acard-body input,.acard .acard-body select{padding:5px 8px;font-size:12px}
.acard .acard-body input.num{width:120px}
.sec{font-size:12.5px;font-weight:700;color:var(--navy);letter-spacing:.4px;margin:20px 2px 9px;padding-bottom:6px;border-bottom:2px solid var(--navy-100);font-family:var(--head)}
.subh{font-size:13px;font-weight:600;margin:10px 0 8px;color:var(--navy);letter-spacing:-.01em;font-family:var(--head)}
.viewonly{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#8a5712;background:var(--amber-50);border:1px solid #f0d6a8;border-radius:999px;padding:4px 13px;margin-bottom:12px}
/* ---- compact density mode (topbar toggle) ---- */
.app.compact .wrap{padding:12px 18px}
.app.compact .card{padding:11px 14px;margin-bottom:10px}
.app.compact .acard>summary{padding:9px 14px}
.app.compact .acard>.acard-body{padding:10px 14px 12px}
.app.compact .card h3{margin-bottom:10px}
.app.compact .kpis{gap:9px;margin-bottom:10px}
.app.compact .kpi{padding:9px 11px}
.app.compact .kpi .v{font-size:19px}
.app.compact table{font-size:11.5px}
.app.compact th{padding:6px 8px}
.app.compact td{padding:5px 8px}
.app.compact .banner{padding:7px 12px;margin-bottom:9px}
/* ---- official artifact (COA) prints clean — no on-screen toolbar ---- */
@media print{#coaFS .cofbar{display:none!important}}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;transition:.16s}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--navy),var(--leaf))}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kpi .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.kpi .v{font-size:23px;font-weight:700;margin-top:5px;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;font-family:var(--head)}
.kpi .d{font-size:10.5px;color:var(--mut);margin-top:6px;font-weight:500}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#475569;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel2);z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;color:var(--txt2)}
td b,td>b{color:var(--txt)}
tr.clk{cursor:pointer;transition:.1s}
tr.clk:hover td{background:var(--navy-50)}
.empty{text-align:center;padding:30px 18px;color:var(--mut);font-size:12.5px}
.empty .ei{width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:#94a3b8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}
th.num{text-align:right}th.ctr{text-align:center}
.muted{color:var(--mut)}
.barmini{height:7px;background:#eaeef5;border-radius:6px;overflow:hidden;min-width:60px;display:inline-block;vertical-align:middle}
.barmini>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--leaf));border-radius:6px}
.pill{padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block;letter-spacing:.1px;box-shadow:inset 0 0 0 1px rgba(15,23,42,.04)}
.tag{font-size:9.5px;color:var(--navy);border:1px solid var(--navy-100);background:var(--navy-50);border-radius:6px;padding:1px 7px;font-weight:700;text-transform:none;letter-spacing:0}
.tag2{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
/* ---------- banners ---------- */
.banner{border-radius:11px;padding:9px 14px;margin-bottom:13px;font-size:12px;line-height:1.5;border:1px solid var(--line);font-weight:500}
.banner.info{background:linear-gradient(90deg,var(--navy-50),#f1f8f3);border-color:var(--navy-100);color:#1f5e36}
.banner.warn{background:var(--amber-50);border-color:#f0d6a8;color:#8a5712}
.banner b{font-weight:700}
/* ---------- forms ---------- */
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld select,.fld input,.fld textarea{width:100%;min-width:0;box-sizing:border-box}
.fld select{text-overflow:ellipsis}
.fld label{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
/* ---------- PO parent / SKU rows ---------- */
tr.po-row>td{border-top:1px solid var(--line);font-weight:600;background:#fff}
tr.po-row:hover>td{background:var(--navy-50);cursor:pointer}
tr.po-row.exp>td{background:var(--navy-50)}
tr.sku-row>td{background:var(--panel2);font-size:12px;color:var(--txt2);border-bottom:1px solid var(--line2)}
tr.sku-row:hover>td{background:#eaf4ec;cursor:pointer}
td.skufirst{padding-left:10px;box-shadow:inset 3px 0 0 var(--navy)}
.skuarrow{color:var(--navy);opacity:.5;margin-right:5px}
.chev{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:6px;background:var(--navy-50);color:var(--navy);font-size:10px;transition:.12s}
.po-row:hover .chev{background:var(--navy-100)}
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.fixedtbl{table-layout:fixed}
.fixedtbl td,.fixedtbl th{overflow:hidden;text-overflow:ellipsis}
.tscroll{overflow:auto;max-width:100%}
.fixedtbl input,.fixedtbl select{width:100%;padding:7px 8px}
/* ---------- drawer ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(17,30,66,.42);display:none;z-index:50;backdrop-filter:blur(2px)}
.drawer-bg.open{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;height:100vh;width:1060px;max-width:97vw;background:var(--bg);border-left:1px solid var(--line);overflow:auto;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-lg);z-index:51}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);z-index:2}
.drawer .dh h2{color:var(--navy);font-size:17px}
.drawer .db{padding:22px 24px}
/* ---------- lifecycle field grid ---------- */
.ff{display:flex;flex-direction:column;gap:4px}
.ff label{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;font-weight:700;display:flex;gap:5px;align-items:center}
.ff .lk2{font-size:8px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;text-transform:none;letter-spacing:0;font-weight:600}
.ff input,.ff select{padding:7px 9px;font-size:12px;width:100%;border-radius:9px}
.fval{padding:7px 9px;font-size:12px;border-radius:9px;border:1px solid var(--line);min-height:32px;display:flex;align-items:center}
.f-input{background:#fff8d8;border-color:#e7cf6f}
.f-input:focus{box-shadow:0 0 0 3px rgba(201,154,0,.18)}
.f-done{background:var(--green-50);border-color:#b4e0c2}
.f-auto{background:#eef1f7;color:#6b778c;border-color:#e0e6f0}
.f-plant{background:#ffefdc;border-color:#edca93}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.fgroup{margin-bottom:15px}
.fgroup .gt{font-size:10.5px;font-weight:800;color:var(--navy);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.calcrow{display:flex;flex-wrap:wrap;gap:7px 18px;font-size:11.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-top:10px;box-shadow:var(--sh-sm)}
.calcrow b{color:var(--navy);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:10.5px;color:var(--mut);margin:6px 0 12px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1px solid rgba(0,0,0,.06)}
@media(max-width:760px){.fgrid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}}
.stp .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;background:#e8edf4;color:var(--mut)}
.stp.done .dot{background:var(--green);color:#fff}
.hide{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;border-radius:12px;padding:12px 22px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:.2s;box-shadow:var(--sh-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}

/* ===================== O2S DESIGN-SYSTEM THEME — render-only reskin (navy primary, modern type, sharper radius). Reversible: delete this block to restore the previous look. No logic/markup/data touched. ===================== */
:root{
  --bg:#f6f8fa; --panel:#ffffff; --panel2:#f4f6f9; --line:#e5e9ef; --line2:#edf0f4;
  --navy:#0891b2; --navy2:#0e7490; --navy-50:#e0f3f7; --navy-100:#b6e3ec;
  --green:#0891b2; --green2:#0e7490; --leaf:#22b8cf; --green-50:#e0f3f7;
  --teal:#0891b2; --amber:#c77d18; --amber-50:#faf1e0; --red:#e03127; --red-50:#fcebea;
  --blue:#2563eb; --purple:#7c5cfc;
  --txt:#17202e; --txt2:#586577; --mut:#8a95a6;
  --head:'Bricolage Grotesque','Space Grotesk','Inter',system-ui,sans-serif;
  --radius:8px; --radius-sm:5px;
}
body{font-family:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
.brand .logo{background:linear-gradient(135deg,#22b8cf,#0e7490)}

/* ---- O2S full visual overhaul (render-only; targets existing classes) ---- */
.app{background:var(--bg)}
.side{width:212px;padding:10px 8px;background:var(--rail);border-right:1px solid var(--rail-line)}
.brand{padding:4px 6px 11px}
.brand .nm{font-family:'Bricolage Grotesque',var(--head);font-weight:800;font-size:16px;letter-spacing:-.03em}
.brand .nm span{font-family:var(--font-mono,'Geist Mono',monospace);font-size:8px;letter-spacing:1.4px;margin-top:5px;color:var(--mut)}
.navgrp{font-size:8.5px;letter-spacing:1.2px;color:#9aa6b4;padding:11px 10px 3px}
.nav a{padding:6px 9px;font-size:12.5px;font-weight:500;border-radius:7px;color:var(--txt2)}
.nav a:hover{background:var(--panel2)}
.nav a.active{font-weight:700;background:var(--panel);color:var(--navy);box-shadow:var(--sh-sm)}
.nav a.active::before{left:-8px;top:6px;bottom:6px;width:3px}
.navct{background:var(--panel2);color:var(--txt2);font-weight:700}
.nav a.active .navct{background:var(--navy);color:#fff}
.navsearch{border-radius:7px;font-size:12px}
.navsearch kbd{font-family:var(--font-mono,monospace);font-size:9px}

.topbar{padding:8px 20px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px)}
.topbar h2{font-family:'Bricolage Grotesque',var(--head);font-weight:800;font-size:17px;letter-spacing:-.03em}
.topbar .sub{font-family:var(--font-mono,monospace);font-size:10px;letter-spacing:.02em;color:var(--mut)}
/* --- icon-rail port: width animation + collapsed affordances --- */
.side{transition:width .18s ease,padding .18s ease}
.side .brand .nm,.side .navgrp,.side .nav a .nlbl,
.side .navsearch .nstxt,.side .navsearch kbd{white-space:nowrap;transition:opacity .15s ease}
.side .railcollapse{margin-top:auto;display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;box-shadow:none}
.side .railcollapse:hover{background:var(--panel2,#f1f6f4);transform:none}
.side .railcollapse svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.app.nav-collapsed .side .railcollapse{justify-content:center;padding:7px 6px}
.app.nav-collapsed .side .railcollapse .lb{opacity:0;width:0;overflow:hidden}
.app.nav-collapsed .side .railcollapse svg{transform:rotate(180deg)}
/* --- header: contextual view tabs + passive live pill (prototype parity) --- */
.topbar{gap:12px}
.tbttl{min-width:0;flex:0 0 auto}
.tbtabs{display:inline-flex;gap:3px;background:var(--surface-2,#f1f6f4);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:nowrap}
.tbtabs:empty{display:none}
.tbtabs button{border:none;background:transparent;border-radius:6px;padding:5px 13px;font-size:12px;font-weight:700;color:var(--ink-2,#586577);cursor:pointer;white-space:nowrap;transition:background .12s}
.tbtabs button.on{background:#fff;color:var(--navy);box-shadow:var(--sh-sm)}
.tbspace{flex:1;min-width:0}
.livepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2,#586577);padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);white-space:nowrap}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--green2,#1d9e75);animation:livepulse 2s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(29,158,117,.45)}70%{box-shadow:0 0 0 6px rgba(29,158,117,0)}100%{box-shadow:0 0 0 0 rgba(29,158,117,0)}}
.periodsel{height:30px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 8px;font-size:12px;font-weight:600;color:var(--ink-2,#586577);cursor:pointer}
@media(max-width:900px){.tbtabs,.livepill,.periodsel{display:none}}
/* My Actions: in-content group bar is a fallback, shown only when header tabs are hidden */
.acviewbar .ac2gbar{display:none}
@media(max-width:900px){.acviewbar .ac2gbar{display:flex}}
/* --- Ops/Production port: segmented lens tabs + KPI grid + flex section heading (prototype parity) --- */
.kpis-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.kpis-4{grid-template-columns:repeat(2,1fr)}}
.kpi[style*="border-top"]::before{display:none}
.pvsub{background:var(--surface-2,#f1f6f4);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;display:inline-flex;flex-wrap:wrap}
.pvsub button{border:none;background:transparent;border-radius:6px;padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--ink-2,#586577)}
.pvsub button.on{background:var(--navy);color:var(--on-accent,#fff);box-shadow:var(--sh-sm);border-color:var(--navy)}
.sec.secflex{display:flex;align-items:center;gap:10px;border-bottom:none}
.sec.secflex .gr{flex:1}
.sec.secflex .hint{font-size:11.5px;color:var(--mut);font-weight:500}
/* --- PO Tracker port: KPI cards + labeled viewbar + pill facets + cards view --- */
.tkkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:2px 0 12px}
.kpi.tkkpi{padding:11px 13px;cursor:default;transition:.12s}
.tkkpi[onclick]{cursor:pointer}
.tkkpi[onclick]:hover{border-color:var(--navy);transform:translateY(-1px);box-shadow:0 4px 14px rgba(10,22,42,.10)}
.tkkpi.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.tkkpi .kl{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--mut)}
.tkkpi .kv{font-size:24px;font-weight:800;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.tkkpi .km{font-size:11px;color:var(--mut);margin-top:4px}
.tkkpi .km b{color:var(--navy)}
.viewbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px;box-shadow:var(--sh-sm);margin-bottom:11px}
.viewbar .ctl{display:flex;align-items:center;gap:8px}
.ctl-l{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.viewsw{display:inline-flex;background:var(--surface-2,#f1f6f4);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.viewsw button{display:flex;align-items:center;gap:6px;border:none;background:none;height:30px;padding:0 13px;border-radius:7px;font-size:12px;font-weight:700;color:var(--ink-2,#586577);cursor:pointer;transition:.12s}
.viewsw button:hover{color:var(--txt)}
.viewsw button.on{background:var(--navy);color:#fff;box-shadow:0 1px 3px rgba(8,145,178,.3)}
.viewsw button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wsel{height:30px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 7px;font-size:11.5px;font-weight:600;color:var(--ink-2,#586577);cursor:pointer}
.wsearch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2,#f1f6f4);border-radius:8px;height:30px;padding:0 9px;min-width:170px}
.wsearch input{border:none;background:none;outline:none;font:inherit;font-size:12px;color:var(--txt);flex:1}
.wsearch svg{width:13px;height:13px;stroke:var(--mut);fill:none;stroke-width:2}
.tkfacets{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.facet{display:flex;gap:5px;flex-wrap:wrap}
.fpill{border:1px solid var(--line);background:var(--panel);border-radius:999px;height:26px;padding:0 11px;font-size:11px;font-weight:700;color:var(--ink-2,#586577);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.fpill .d{width:6px;height:6px;border-radius:50%}
.fpill b{color:var(--mut);font-weight:800}
.fpill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fpill.on .d{background:#fff!important}
.fpill.on b{color:#fff}
/* PO Tracker flat Table view (prototype parity) */
.trktblwrap{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:auto}
.trktbl{width:100%;border-collapse:collapse;font-size:12.5px}
.trktbl thead th{text-align:left;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);padding:9px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.trktbl tbody td{padding:9px 14px;border-bottom:1px solid var(--line2);vertical-align:middle;color:var(--txt)}
.trktbl tbody tr{cursor:pointer;transition:background .1s}
.trktbl tbody tr:hover td{background:var(--navy-50)}
.trktbl .trkpo{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.trktbl .trksub{font-size:10.5px;color:var(--mut);margin-top:1px}
.trktbl .trkprogc{display:flex;align-items:center;gap:9px;min-width:140px}
.trktbl .trkprogc .tkprog{flex:1;height:7px;background:var(--surface-2,#f1f6f4);border-radius:5px;overflow:hidden}
.trktbl .trkprogc .tkprog span{display:block;height:100%;background:var(--navy);border-radius:5px}
.trktbl .trkpct{font-size:11.5px;font-weight:700;color:var(--ink-2,#586577);width:40px;text-align:right}
.trktbl .trkprom{font-family:var(--font-mono,monospace);font-size:11.5px;color:var(--ink-2,#586577);white-space:nowrap}
.trktbl .tkgrp td{background:var(--surface-2,#f1f6f4);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:6px 14px}
.rchip{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.rchip.ok{background:var(--green-50,#e3f6ee);color:var(--green-d,#0f7a52);border-color:#bfe7d4}
.rchip.od{background:var(--red-50,#fdeceb);color:var(--red,#e03127);border-color:#f6c9c4}
.rchip.stall,.rchip.pri{background:var(--amber-50,#fdf6e3);color:#9a6b08;border-color:#efdca0}
.tkcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:11px}
.tkocard{padding:12px;cursor:pointer;transition:.12s}

.tkocsub{font-size:11.5px;color:var(--mut);margin:5px 0}
.tkocfoot{font-size:10.5px;color:var(--mut);margin-top:7px}

.tuned{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy-50,#e0f3f7);border:1px solid var(--navy-100,#b6e3ec);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12.5px;color:var(--ink-2,#586577)}

.helpbar{padding:7px 20px;font-size:11.5px}
.wrap{padding:16px 20px;max-width:1560px}

h1,h2,h3,h4,.sec,.subh{font-family:'Bricolage Grotesque',var(--head)}
.sec{border-bottom:1px solid var(--line);color:var(--txt);font-weight:800;letter-spacing:-.01em;text-transform:none;font-size:13px;padding-bottom:7px}
.subh{color:var(--txt);font-weight:700}

.card{border-radius:9px;box-shadow:0 1px 2px rgba(23,32,46,.05);padding:16px 18px}

.card h3 .hint{font-family:var(--font-mono,monospace);font-size:11px}

button{border-radius:7px;padding:9px 15px;font-weight:600;box-shadow:0 1px 2px rgba(23,32,46,.08);letter-spacing:-.01em}

function authHdr(){ return _token ? {'Authorization':'Bearer '+_token} : {}; }
function decodeToken(t){ try{ if(!t)return null; const p=t.split('.')[0]; const o=JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/'))); if(!o.exp||o.exp<Date.now())return null; return {name:o.n,username:o.u,role:o.r}; }catch(e){ return null; } }
function setSession(token,user){ _token=token||''; try{ token?localStorage.setItem('van_token',token):localStorage.removeItem('van_token'); }catch(e){} if(typeof state!=='undefined'&&state){ state.currentUser=user||null; if(user) state.role=user.role; } }

let _rev=0,_saveTimer=null,_syncOn=false,_savePending=false;
async function bootState(){
  if(!decodeToken(_token)){ _token=''; try{localStorage.removeItem('van_token');}catch(e){} renderApp(); startSync(); return; }
  let resp=null, ok=false, status=0;
  try{ const r=await fetch('/api/state',{cache:'no-store',headers:authHdr()}); status=r.status; if(r.ok){ resp=await r.json(); ok=true; } }catch(e){}
  if(status===401){ _token=''; try{localStorage.removeItem('van_token');}catch(e){} renderApp(); startSync(); return; }
  if(!ok || !resp){ const a=$('authScreen'),sh=$('appShell'); if(sh)sh.style.display='none'; if(a){ a.style.display='flex'; renderLogin('Connecting to the server\u2026 if this stays, check your internet and refresh.'); } setTimeout(bootState,4000); return; }
  _rev=resp.rev||0;
  if(resp.data && resp.data.orders){ state=ensureState(resp.data); }
  else if((resp.rev||0)===0 && !resp.data){ state=buildFromSeed(); sessionInit(state); restoreSession(); await saveNow(); renderApp(); startSync(); return; }

/* 3-way merge so concurrent saves keep BOTH sides' edits (not just additions). */
let _baseSnapshot=null, _saveRetries=0;
function _snapBase(){ try{ _baseSnapshot=JSON.parse(JSON.stringify(dataOnly(state))); }catch(e){ _baseSnapshot=null; } }
function _arrId(a){ return Array.isArray(a)&&a.length>0&&a.every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.id!=null); }
function _eq(a,b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return a===b; } }
function merge3(base, local, srv){
  if(_arrId(local) && Array.isArray(srv)){
    const bm={},sm={}; (Array.isArray(base)?base:[]).forEach(x=>{ if(x&&x.id!=null) bm[x.id]=x; }); srv.forEach(x=>{ if(x&&x.id!=null) sm[x.id]=x; });
    const seen={}, out=[];
    local.forEach(l=>{ if(l&&l.id!=null){ seen[l.id]=1; const s=sm[l.id]; out.push(s!==undefined?merge3(bm[l.id], l, s):l); } });
    srv.forEach(s=>{ if(s&&s.id!=null && !seen[s.id]) out.push(s); });
    return out;
  }
  if(local&&srv&&typeof local==='object'&&!Array.isArray(local)&&typeof srv==='object'&&!Array.isArray(srv)){
    const out={}, keys={}; [base,local,srv].forEach(o=>{ if(o&&typeof o==='object'&&!Array.isArray(o)) for(const k in o) keys[k]=1; });
    for(const k in keys){ const bv=(base&&typeof base==='object')?base[k]:undefined, lv=local[k], sv=srv[k];
      if(lv===undefined&&sv===undefined) continue;
      if(lv===undefined){ out[k]=sv; continue; }
      if(sv===undefined){ out[k]=lv; continue; }
      out[k]=merge3(bv, lv, sv); }
    return out;
  }
  return _eq(local, base) ? srv : local;   // leaf: we changed it → ours; else take theirs
}
function save(){ _savePending=true; if(_saveTimer)clearTimeout(_saveTimer); _saveTimer=setTimeout(saveNow,400); }  // _savePending set synchronously so the auto-refresh can't pull over an unsaved change
async function saveNow(){ if(!_token) return; try{
    const r=await fetch('/api/state',{method:'POST',headers:Object.assign({'Content-Type':'application/json','X-Base-Rev':String(_rev)},authHdr()),body:JSON.stringify(dataOnly(state))});
    if(r.status===401){ setSession('',null); renderApp(); return; }
    if(r.status===409){
      // Someone else saved since we loaded. 3-way merge keeps THEIR edits AND ours
      // (field-level — not just records we added), then re-saves. No work is lost.
      const j=await r.json().catch(()=>null);
      if(j && j.data && j.data.orders){
        const base=_baseSnapshot||dataOnly(state);
        const merged=ensureState(merge3(base, dataOnly(state), j.data));
        const cu=state.currentUser, sc=state.screen, ro=state.role, ex=state.expanded;
        state=merged; state.currentUser=cu; state.role=ro; state.screen=sc; state.expanded=ex||{}; _rev=j.rev; _snapBase();
        const ae=document.activeElement, busy=(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))||($('modalBg')&&$('modalBg').classList.contains('open'));
        if(authed() && !busy) render();
        if(_saveRetries<5){ _saveRetries++; save(); }                 // re-save the merge against the latest rev
        else { _saveRetries=0; toast('Synced with the team’s latest changes.'); }
        return;
      }
      toast('Refreshed — please re-check your last change.');
      return;
    }
    if(r.ok){ const j=await r.json(); if(j&&typeof j.rev==='number') _rev=j.rev; _saveRetries=0; _savePending=false; _snapBase(); }
  }catch(e){} }
function hasUnsavedEntry(){ try{ const v=document.getElementById('view'); if(!v) return false;
  const els=v.querySelectorAll('input,textarea,select');
  for(const el of els){ if(el.disabled||el.readOnly) continue; const t=(el.type||'').toLowerCase();
    if(el.tagName==='SELECT'){ if(el.selectedIndex>0) return true; continue; }
    if(t==='checkbox'||t==='radio'){ if(el.checked) return true; continue; }
    if(t==='button'||t==='submit'||t==='hidden'||t==='file') continue;
    if(String(el.value||'').trim()!=='') return true; }
  return false; }catch(e){ return false; } }
function startSync(){ if(_syncOn)return; _syncOn=true; setInterval(async ()=>{
  if(!_token) return;
  if(document.hidden) return;
  const ae=document.activeElement; if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  if(($('modalBg')&&$('modalBg').classList.contains('open'))||($('drawerBg')&&$('drawerBg').classList.contains('open'))) return;
  if(hasUnsavedEntry()) return; // don't re-render over the user's in-progress data entry
  if(_savePending) return;      // a local change is still being saved — pulling now would overwrite it before it lands
  try{ const r=await fetch('/api/state',{cache:'no-store',headers:authHdr()}); if(r.status===401){ setSession('',null); renderApp(); return; } if(!r.ok) return; const j=await r.json();
    if(typeof j.rev==='number' && j.rev!==_rev && j.data && j.data.orders){
      const cu=state.currentUser, sc=state.screen, ro=state.role, ex=state.expanded;
      // MERGE the server's changes into local (3-way, same as the save-conflict path) rather than a blind
      // replace — so a not-yet-saved local order/edit can never be clobbered by the background refresh.
      const base=_baseSnapshot||dataOnly(state);
      state=ensureState(merge3(base, dataOnly(state), j.data)); state.currentUser=cu; state.role=ro; state.screen=sc; state.expanded=ex||{};
      _rev=j.rev; _snapBase(); if(authed()) render();
    }
  }catch(e){}
}, 7000); }


/* ===================== ENGINE A — RM ===================== */
function needFor(order){ // {rm: kg}
  const need={};
  order.lines.forEach(l=>{
    const rec = recipeFor(l.base);
    for(const rm in rec){ need[rm]=(need[rm]||0) + l.ordered*rec[rm]; }
  });
  return need;
}
function rmCheck(order, s){
  s=s||state; const need=needFor(order); const short=[];
  for(const rm in need){ const have=s.rawStock[rm]??0; if(need[rm]>have+0.001) short.push({rm, need:need[rm], have, gap:need[rm]-have}); }
  return { need, short, ok: short.length===0 };
}

/* ===================== ENGINE B — stage/fulfilment ===================== */
const sum=(arr,f)=>arr.reduce((a,x)=>a+f(x),0);
const STAGE_ORDER=['New','RM / Procurement','SO Created','PR Raised','RM Ready','In Production','Produced','QC Passed','Dispatched','Delivered'];
function agg(o){ return { ordered:sum(o.lines,l=>l.ordered), produced:sum(o.lines,l=>l.produced),
  packed:sum(o.lines,l=>l.packed), dispatched:sum(o.lines,l=>l.dispatched), delivered:sum(o.lines,l=>l.delivered) }; }
function lineStage(o,l){
  if(l.deliveredDate && (l.delivered||0)>=l.ordered-0.5) return 'Delivered';
  if(l.dispatchDate||(l.dispatched||0)>0) return 'Dispatched';
  if(l.qcPass) return 'QC Passed';
  if(l.prodComplete) return 'Produced';
  if(l.prodStart) return 'In Production';
  if(l.rmReady) return 'RM Ready';
  if(l.prRaised) return 'PR Raised';
  if(l.soCreated) return 'SO Created';
  return 'New';
}
function stageOf(o){ if(!o.lines||!o.lines.length) return 'New';
  const idx=o.lines.map(l=>STAGE_ORDER.indexOf(lineStage(o,l))); return STAGE_ORDER[Math.min.apply(null,idx)]; }
function lineOverdue(o,l){ if(!l.committed || (l.delivered||0)>=l.ordered-0.5 || !(new Date(l.committed)<TODAY)) return false; if(o.received && new Date(l.committed)<new Date(o.received)) return false; /* committed before the order was received = bad/imported date — not overdue */ return true; }
function isOverdue(o){ return o.lines.some(l=>lineOverdue(o,l)); }
function daysOver(o){ const ds=o.lines.filter(l=>lineOverdue(o,l)).map(l=>Math.round((TODAY-new Date(l.committed))/86400000));
  return ds.length?Math.max.apply(null,ds):(o.promised?Math.round((TODAY-new Date(o.promised))/86400000):0); }
/* ---- Attention = computed risk (reality) blended with manual priority (intent). READ-ONLY ----
   Risk tier leads (overdue → due-soon → on-track); manual priority orders WITHIN a tier.
   Pure compute: reads order state only — writes nothing, raises no alert, adds no action. */
const PRI_RANK={Critical:0,High:1,Normal:2,Low:3};
function attentionOf(o){
  const overdue=isOverdue(o);
  let dueSoon=false;
  if(!overdue) dueSoon=(o.lines||[]).some(function(l){ if((l.delivered||0)>=l.ordered-0.5) return false; if(!l.committed) return false; var d=Math.round((new Date(l.committed)-TODAY)/86400000); return d>=0&&d<=3; });
  const pr=o.priority||'Normal'; const prRank=(PRI_RANK[pr]!=null?PRI_RANK[pr]:2);
  const riskTier=overdue?0:(dueSoon?1:2);
  const risk=overdue?'Overdue':(dueSoon?'Due soon':'On track');
  const hot=(pr==='Critical'||pr==='High');
  let color=overdue?'--red':(dueSoon?'--amber':'--green2');
  if(hot && !overdue && !dueSoon) color=(pr==='Critical'?'--red':'--amber');
  return { overdue, dueSoon, pr, prRank, riskTier, hot,
    show:(overdue||dueSoon||hot),
    label: risk+(hot?(' · '+pr):''), color };
}
/* combined sort key for two orders already in the same stage (lower = more attention) */

/* ---- Capable-to-promise: per-line committed date from the lead-time model (make-to-order) ----
   committed = received + procurement + ceil(qty/rate) production + qcDays + dispatchDays,
   sequential (production starts after materials arrive), never sooner than received + minDays.
   PROCUREMENT = the SLOWEST required raw material that isn't in stock (bottleneck). Each
   material's lead = its master leadDays, else the global default (leadTime.rmProcureDays, ~7d).
   All materials in stock → procurement 0. Mostly uniform; override imported/long-lead materials
   per-material later. One global production rate today; split per base later without touching callers. */
function leadCfg(s){ var d=(((s||state).masters&&(s||state).masters.leadTime))||{}; return {
  rate:(+d.rateKgPerDay>0?+d.rateKgPerDay:8000), qc:(+d.qcDays>=0?+d.qcDays:1),
  disp:(+d.dispatchDays>=0?+d.dispatchDays:2), rm:(+d.rmProcureDays>=0?+d.rmProcureDays:7),
  min:(+d.minDays>=0?+d.minDays:3) }; }
function matLead(rm, s){ s=s||state; var def=leadCfg(s).rm;
  var m=((s.masters&&s.masters.rawMaterials)||[]).find(function(x){ return x&&String(x.name)===String(rm); });
  return (m&&+m.leadDays>0)?+m.leadDays:def; }
/* procurement days for a line = max lead among required materials not in stock (0 if all on hand) */
function procureDaysFor(brand, base, qty, s){ s=s||state;
  var r=rmCheck({lines:[{brand:brand,base:base||brand,ordered:+qty||0}]}, s);
  if(!r.short||!r.short.length) return 0;
  var mx=0; r.short.forEach(function(x){ mx=Math.max(mx, matLead(x.rm,s)); }); return mx; }
/* production rate for a brand = the daily rate of the production group it's assigned to
   (masters.groupOfBrand → masters.productionGroups), else the default rate. */
function groupOf(brand, s){ s=s||state; return ((s.masters&&s.masters.groupOfBrand)||{})[brand]||''; }
function groupRate(g, s){ s=s||state; var r=+(((s.masters&&s.masters.productionGroups)||{})[g]); return r>0?r:0; }
function rateForBrand(brand, s){ var r=groupRate(groupOf(brand,s),s); return r>0?r:leadCfg(s).rate; }
function leadDays(qty, procureDays, brand, s){ var c=leadCfg(s);
  var prod=Math.max(Math.ceil((+qty||0)/rateForBrand(brand,s)),1);
  return Math.max((+procureDays||0)+prod+c.qc+c.disp, c.min); }
function computeCommitted(received, qty, procureDays, brand, s){
  var d0=received?new Date(received):new Date(TODAY); if(isNaN(d0.getTime())) d0=new Date(TODAY);
  return new Date(d0.getTime()+leadDays(qty,procureDays,brand,s)*86400000).toISOString().slice(0,10); }
/* ---- Line-level roll-up for a PO (drives the tracker display & line/volume on-time) ---- */

/* ===== PO Tracker v2 helpers (read-only display; no data/master writes) ===== */
/* Stage dwell (aging): days since the order entered its CURRENT stage. Uses the
   milestone date that marks entry into each bucket; when missing, falls back to the
   order's received date and flags the value approximate (~) so a stall is never
   overstated. Among the lines that define the order's current (least-advanced)
   bucket, takes the LATEST entry date = shortest dwell = conservative reading. */
/* latest valid date from a list (handles 'YYYY-MM-DD' and full ISO); null if none */
function _maxDate(arr){ var best=null; (arr||[]).forEach(function(d){ if(d){ var t=new Date(d); if(!isNaN(t)&&(best===null||t>best)) best=t; } }); return best?best.toISOString().slice(0,10):null; }
function _lotsForLine(o,l){ return (state.packingLog||[]).filter(function(p){ return p&&p.po===o.po&&p.brand===l.brand&&(p.kg||0)>0; }); }
/* QA Pre-shipment entry = packing complete (latest lot date) */
function _linePackedDate(o,l){ return _maxDate(_lotsForLine(o,l).map(function(p){return p.date;})); }
/* Shipment entry = cleared for shipment = latest QA-pass date (else line qcPass) */
function _lineClearedDate(o,l){ return _maxDate(_lotsForLine(o,l).filter(function(p){return p.qa&&p.qa.pass;}).map(function(p){return p.qa.date||p.date;})) || (l.qcPass||null); }
function bucketEntryDate(o,l,b){

    case 'RM Check': return l.prRaised?{d:l.prRaised,exact:true}:{d:o.received||null,exact:false};
    case 'Production': return (l.prodStart||l.rmReady)?{d:(l.prodStart||l.rmReady),exact:true}:{d:o.received||null,exact:false};
    case 'Lab QC': return l.prodComplete?{d:l.prodComplete,exact:true}:{d:(l.prodStart||o.received||null),exact:false};
    case 'QA Pre-shipment': { var pk=_linePackedDate(o,l); if(pk) return {d:pk,exact:true}; return l.prodComplete?{d:l.prodComplete,exact:false}:{d:o.received||null,exact:false}; }

function orderAging(o){
  var b=orderBucket(o);

  var best=null, exact=true, any=false;
  controlling.forEach(function(l){ var e=bucketEntryDate(o,l,b); if(e.d){ var t=new Date(e.d); if(!isNaN(t)){ any=true; if(best===null||t>best)best=t; if(!e.exact)exact=false; } } });

function isStalled(o){ var a=orderAging(o); return a.days!=null && a.days>=7 && !isOverdue(o); }
var T2_SHORT=['PO','RM','Prod','Lab','QA','Ship','Done'];
var NEXT_ACT={'PO Created':'Acknowledge & run RM check','RM Check':'Confirm materials → mark RM Ready','Production':'Start / complete production','Lab QC':'Run lab QC','QA Pre-shipment':'QA pre-shipment check','Shipment':'Book & dispatch','Delivered':'Delivered — no action'};

function t2flag(o){

}
function t2spill(b){ var m=BUCKET_META[b]; return '<span class="t2spill" style="color:var('+m.c+');border-color:color-mix(in srgb,var('+m.c+') 35%,#fff);background:color-mix(in srgb,var('+m.c+') 9%,#fff)">'+b+'</span>'; }
function t2matrix(list){

    BUCKETS.forEach(function(s,i){ var cls,inner;

function tkRiskBadge(o){ var b=orderBucket(o); if(b==='Delivered')return '<span class="pill" style="background:var(--navy-50);color:var(--mut)">Delivered</span>'; if(isOverdue(o))return '<span class="pill" style="background:var(--red-50);color:var(--red)">Late</span>'; if(b==='RM Check')return '<span class="pill" style="background:var(--red-50);color:var(--red)">RM blocked</span>'; if(isStalled(o)||attentionOf(o).hot)return '<span class="pill" style="background:var(--amber-50);color:var(--amber)">Watch</span>'; return '<span class="pill" style="background:var(--navy-50);color:var(--navy)">On track</span>'; }
function closeTkDrawer(){ var h=document.getElementById('tkDrawerHost'); if(h)h.classList.remove('on'); }

function dfSubmitCorrect(){
  const o=state.orders.find(x=>x.id===dfForm.oid); if(!o) return toast('Pick a PO');
  const reason=(($('co_reason')&&$('co_reason').value)||'').trim(); if(!reason) return toast('Reason is required');
  let n=0;
  const setO=(field,val,label)=>{ const old=o[field]||''; val=(val==null?'':val); if(String(old)!==String(val)){ o[field]=val; reconLog(`CORRECT ${o.po} ${label}: ${old||'—'} → ${val||'—'} — ${reason}`); n++; } };
  setO('client',(($('co_client')&&$('co_client').value)||'').trim(),'customer');
  setO('channel',($('co_channel')&&$('co_channel').value),'channel');
  setO('priority',($('co_priority')&&$('co_priority').value),'priority');
  setO('received',($('co_received')&&$('co_received').value),'received date');
  setO('promised',($('co_promised')&&$('co_promised').value),'promised date');
  o.lines.forEach(l=>{ [['ordered','Ordered'],['produced','Produced'],['packed','Packed'],['dispatched','Dispatched'],['delivered','Delivered'],['invoicePrice','Invoice price']].forEach(([field,label])=>{
    const el=$('cl_'+field+'_'+l.id); if(!el) return; const nv=+el.value||0; const old=+l[field]||0;
    if(Math.abs(nv-old)>0.001){ l[field]=nv; reconLog(`CORRECT ${o.po} · ${l.brand} ${label}: ${fmt(old)} → ${fmt(nv)} — ${reason}`); n++; }
  }); });
  // Auto-sync: a line's committed date must not be EARLIER than the PO promised (prevents false 'late' from drifted line dates).
  if(o.promised){ o.lines.forEach(l=>{ const oldc=l.committed||''; if((!l.committed||l.committed<o.promised) && oldc!==o.promised){ l.committed=o.promised; reconLog(`CORRECT ${o.po} · ${l.brand} committed ${oldc||'(blank)'} → ${o.promised} (synced to PO promised) — ${reason}`); n++; } }); }
  if(!n) return toast('No changes to apply');
  save(); toast(n+' correction(s) applied'); dfBack();
}

  const recv=($('e_recv')&&$('e_recv').value)||TODAY.toISOString().slice(0,10);
  $('e_lines').innerHTML=entryLines.map((l,i)=>{
    const det=detailForBrand(l.brand);
    const packs=(+l.pack>0&&+l.qty>0)?Math.ceil(+l.qty/+l.pack):'';
    const procD=(l.brand&&+l.qty>0)?procureDaysFor(l.brand,det.base||l.brand,+l.qty):0;
    const autoCommit=(+l.qty>0)?computeCommitted(recv,+l.qty,procD,l.brand):'';
    const committedVal=l.committed||autoCommit||(($('e_prom')&&$('e_prom').value)||'');
    const recalled=recallPrintPrice(l.brand);
    if(entryPrintOn && l.brand && l.printPrice==null && recalled>0) l.printPrice=recalled;  // recall pre-fill (only when never touched)
    const printRow = entryPrintOn ? `<tr><td colspan="9" style="border-top:none;padding-top:0;padding-bottom:8px"><div style="display:flex;align-items:center;gap:8px;font-size:11px"><span class="muted" style="min-width:118px">Print price (MRP on pack):</span><input type="number" value="${l.printPrice!=null?l.printPrice:''}" placeholder="PKR / pack" oninput="entryLines[${i}].printPrice=this.value;validate()" style="width:150px"><span class="muted">PKR per pack${+l.pack>0?(' of '+fmt(l.pack)):''}${recalled>0?` · <span style="cursor:pointer;color:var(--navy)" title="recall last used" onclick="entryLines[${i}].printPrice=${recalled};renderEntryLines()">use last ${fmt(recalled)}</span>`:' · no previous price on file'}</span></div></td></tr>` : '';
    return `<tr>
     <td><select onchange="entryLines[${i}].brand=this.value;entryLines[${i}].pack=(detailForBrand(this.value).pack||'');renderEntryLines()">
       <option value="">— pick brand —</option>${brs.map(b=>`<option ${b.brand===l.brand?'selected':''}>${b.brand}</option>`).join('')}</select></td>
     <td class="muted">${det.form||'—'}</td>
     <td><input type="number" value="${l.pack}" placeholder="${det.pack||''}" oninput="entryLines[${i}].pack=this.value;updatePacks(${i})"></td>
     <td><input type="number" value="${l.qty}" placeholder="Kg/L" oninput="entryLines[${i}].qty=this.value;updatePacks(${i});updateCommitted(${i});validate()"></td>
     <td class="num"><b id="pk_${i}">${packs!==''?fmt(packs):'—'}</b></td>
     <td><input type="number" value="${l.inv||''}" placeholder="PKR/Kg·L" title="VAN invoice rate per Kg/L — must be under PKR 1000. The per-pack equivalent is shown so you can verify it against the client PO." oninput="entryLines[${i}].inv=this.value;invPerPack(${i});validate()"><div id="ipp_${i}" style="font-size:10px;margin-top:3px;color:${(+l.inv>=1000)?'#c0392b':'var(--mut)'}">${invPerPackText(l)}</div></td>
     <td><input type="date" id="cm_${i}" value="${committedVal}" onchange="entryLines[${i}].committed=this.value;updateCommitted(${i})"><div id="cmh_${i}" style="font-size:9px;color:var(--mut);margin-top:2px" title="Auto from the lead-time model — edit to override">${(!l.committed&&autoCommit)?('auto · '+leadDays(+l.qty,procD,l.brand)+'d lead'+(procD?' · incl '+procD+'d RM':'')):''}</div></td>
     <td><input type="text" value="${(l.note||'').replace(/"/g,'&quot;')}" placeholder="optional" oninput="entryLines[${i}].note=this.value" style="width:100%;font-size:11px"></td>
     <td>${entryLines.length>1?`<button class="ghost sm" onclick="entryLines.splice(${i},1);renderEntryLines()">✕</button>`:''}</td></tr>${printRow}`;
  }).join('');
  validate();

/* live order summary (display only) — total qty and order value (Σ qty × invoice) */

  const totQty=entryLines.reduce((a,l)=>a+(+l.qty>0?+l.qty:0),0);
  const totVal=entryLines.reduce((a,l)=>a+((+l.qty>0&&+l.inv>0)?(+l.qty*+l.inv):0),0);
  el.innerHTML = totQty>0 ? `Order: <b>${fmt(totQty)} Kg/L</b>${totVal>0?` · value <b>PKR ${fmt(Math.round(totVal))}</b>`:''}` : '';
}
function entryChecks(){
  const lines=entryLines.filter(l=>l.brand&&+l.qty>0);
  const recv=($('e_recv')&&$('e_recv').value)||'';
  const prom=($('e_prom')&&$('e_prom').value)||'';
  const poManual=isManualPO()?(($('e_po')&&$('e_po').value.trim())||''):'';
  const poDup=!!poManual && (state.orders||[]).some(o=>String(o.po)===String(poManual));
  return [
    ['Channel selected', !!entryChannel, 'e_chan'],
    ['Client / dealer selected', !!entryClient, 'e_client'],
    ['Vgreen Sub (if Vgreen)', entryChannel!=='Vgreen' || !!entryVsub, 'e_vsub'],
    ['KAM Name', !!($('e_kam')&&$('e_kam').value.trim()), 'e_kam'],
    ['PO Received date', !!recv, 'e_recv'],
    ['Promised Delivery date', !!prom, 'e_prom'],
    ['Promised Delivery ≥ PO Received', !recv || !prom || prom>=recv, 'e_prom'],
    ['Client PO # (manual channels)', !isManualPO() || !!poManual, 'e_po'],
    ['Client PO # not already used', !isManualPO() || (!!poManual && !poDup), 'e_po'],
    ['At least 1 line item (brand + qty)', lines.length>0, 'e_lines'],
    ['Pack size set on every line (> 0)', lines.length>0 && lines.every(l=>+l.pack>0), 'e_lines'],
    ['Each line committed date ≥ PO Received', lines.every(l=>!l.committed || !recv || l.committed>=recv), 'e_lines'],
    ['Invoice price set on every line (PKR/Kg·L)', lines.length>0 && lines.every(l=>+l.inv>0), 'e_lines'],
    ['Invoice price under PKR 1000/Kg', lines.length>0 && lines.every(l=>+l.inv>0 && +l.inv<1000), 'e_lines'],
    ['Print price set on every line (when printing)', !entryPrintOn || (lines.length>0 && lines.every(l=>+l.printPrice>0)), 'e_lines'],
  ];
}
function validate(){
  const checks=entryChecks(); const ok=checks.every(c=>c[1]) && canEdit(['KAM']);
  if($('e_checks')) $('e_checks').innerHTML=checks.map(c=>{ const fail=!c[1], fid=c[2], clk=fail&&fid;
    return `<div ${clk?`onclick="focusField('${fid}')" `:''}style="font-size:12px;padding:3px 0${clk?';cursor:pointer':''}">${c[1]?'<span style="color:var(--green2)">✓</span>':'<span style="color:var(--red)">✗</span>'} &nbsp;${c[0]}${clk?' <span class="muted" style="font-size:10px">→ fix</span>':''}</div>`; }).join('')
    + (canEdit(['KAM'])?'':'<div style="font-size:12px;color:var(--amber);padding-top:4px">Switch role to KAM to enable submit.</div>');
  if($('e_submit')) $('e_submit').disabled=!ok;
  updateEntryTotal();
  previewRM();
}
/* scroll to + focus the field a failed check points at (header field by id, or the lines table) */
function focusField(id){ var el=document.getElementById(id); if(!el)return;
  try{ el.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){}
  var t=(el.tagName==='INPUT'||el.tagName==='SELECT')?el:(el.querySelector&&el.querySelector('input,select'));
  if(t&&t.focus){ try{ t.focus(); }catch(e){} } }
function previewRM(){
  const tmp={lines:entryLines.filter(l=>l.brand&&+l.qty>0).map(l=>({brand:l.brand,base:detailForBrand(l.brand).base||l.brand,ordered:+l.qty}))};
  if(!$('e_preview'))return;
  if(!tmp.lines.length){ $('e_preview').innerHTML='Add a brand and qty to preview.'; return; }
  const need=Object.entries(rmCheck(tmp).need).filter(([k])=>!k.startsWith('(')).sort((a,b)=>b[1]-a[1]);
  $('e_preview').innerHTML = (need.length
    ? `<div class="muted" style="margin-bottom:5px">Estimated raw material (reference only):</div>`+need.map(([rm,kg])=>`<div style="padding:1px 0">${rm}: <b>${fmt(kg)} Kg/L</b></div>`).join('')
    : `<div class="muted">No recipe on file for this product.</div>`)
    + `<div class="muted" style="margin-top:7px;font-size:11px">Supply Chain confirms availability &amp; raises any PR in the PO Tracker.</div>`;
}
function submitPO(){
  if(!canEdit(['KAM'])){toast('Only KAM can submit a PO');return;}
  const lines=entryLines.filter(l=>l.brand&&+l.qty>0); if(!lines.length){toast('Add a line item');return;}
  if(lines.some(l=>!(+l.pack>0))){ toast('Set a pack size (> 0) on every product line.'); return; }
  if(lines.some(l=>!(+l.inv>0))){ toast('Enter the invoice price (PKR/Kg·L) for every product line.'); return; }
  if(lines.some(l=>+l.inv>=1000)){ toast('Invoice price must be under PKR 1000/Kg·L. A value ≥ 1000 usually means a per-pack price was entered in the per-Kg field.'); return; }
  const _recv=$('e_recv').value, _prom=$('e_prom').value;
  if(_recv&&_prom&&_prom<_recv){ toast('Promised Delivery cannot be before PO Received.'); return; }
  if(entryPrintOn && lines.some(l=>!(+l.printPrice>0))){ toast('Print price is ON — enter the print price (PKR/pack) for every line, or untick "Print price on pack".'); return; }
  if(!entryPrintOn && linesNormallyPrint() && typeof confirm==='function' && !confirm('These products normally carry a printed price on the pack, but "Print price on pack" is OFF.\n\nSubmit WITHOUT a printed price?')) return;
  if(typeof confirm==='function' && !confirm('Verify these prices match the client PO:\n\n'+lines.map(l=>{const pk=+l.pack||0;const ip=+l.inv||0;return '- '+l.brand+': PKR '+fmt(ip)+'/Kg'+(pk>0?(' = PKR '+fmt(ip*pk)+'/pack of '+fmt(pk)):'');}).join('\n')+'\n\nDo these per-pack prices match the client PO? Confirm to submit.')) return;
  state._lastKam=$('e_kam').value;
  const recv=$('e_recv').value; const po=isManualPO()?$('e_po').value.trim():genPO(recv);
  if((state.orders||[]).some(o=>String(o.po)===String(po))){ toast('A PO with number '+po+' already exists — open it in PO Tracker, or use a different client PO#.'); return; }
  const id='O'+(state.orders.length+1)+'_'+state.seq++;
  const ord={ id, po, client:entryClient, channel:entryChannel, vgreenSub:entryVsub||null, focalPerson:($('e_focal')&&$('e_focal').value)||'', kam:$('e_kam').value.trim(),
    priority:$('e_pri').value, promised:$('e_prom').value, received:recv, rmDecision:'pending', printOnPack:!!entryPrintOn,
    lines:lines.map((l,j)=>{const det=detailForBrand(l.brand);const procD=procureDaysFor(l.brand,det.base||l.brand,+l.qty);const autoCommit=computeCommitted(recv,+l.qty,procD,l.brand);return {id:id+'L'+j, brand:l.brand, base:det.base||l.brand, pack:+l.pack||det.pack||null, note:l.note||'', committed:l.committed||autoCommit||$('e_prom').value, ordered:+l.qty, printPrice:(entryPrintOn?(+l.printPrice||0):0), invoicePrice:+l.inv||0, produced:0,packed:0,dispatched:0,delivered:0};}) };
  ord.totalOrdered=ord.lines.reduce((a,l)=>a+l.ordered,0);
  ord.rmDecision='pending';
  state.orders.unshift(ord);
  logAction(`Created PO ${po} (${entryClient}, ${entryChannel}, ${fmt(ord.totalOrdered)} Kg/L)`);
  entryChannel='';entryClient='';entryVsub='';entryPrintOn=false;entryLines=[{brand:'',qty:'',pack:'',note:'',committed:''}]; save();
  toast('PO '+po+' created'); state.screen='tracker'; render();
}

function citiesFor(region){ return (SEED.geo&&SEED.geo.citiesByRegion&&SEED.geo.citiesByRegion[region])||[]; }

function addDealer(){
  if(!canEdit(['KAM'])){toast('Only KAM can onboard dealers');return;}

let trkFilter='all'; let trkStage=''; let trkChannel='all';
/* ===================== PO TRACKER — control tower (UI redesign) ===================== */
let trkSearch=''; let trkSort='risk_new'; let trkExpanded={};
const BUCKETS=['PO Created','RM Check','Production','Lab QC','QA Pre-shipment','Shipment','Delivered'];
const BUCKET_META={
 'PO Created':{c:'--mut',owner:'Supply Chain',where:'My Actions — Acknowledge & RM Check'},
 'RM Check':{c:'--amber',owner:'Supply Chain',where:'Open PO → RM Check'},
 'Production':{c:'--blue',owner:'Production',where:'Production screen'},
 'Lab QC':{c:'--purple',owner:'Lab Rep',where:'Lab QC'},
 'QA Pre-shipment':{c:'--amber',owner:'QA Inspector',where:'Pre-shipment QA'},
 'Shipment':{c:'--green2',owner:'Supply Chain',where:'Shipments screen'},
 'Delivered':{c:'--green',owner:'—',where:'—'}
};
const BUCKET_SCREEN={'PO Created':'approvals','RM Check':'approvals','Production':'prod','Lab QC':'qc','QA Pre-shipment':'qa','Shipment':'ship','Delivered':''};
function lineBucket(o,l){
 if(l.deliveredDate && (l.delivered||0)>=l.ordered-0.5) return 'Delivered';
 if((l.dispatched||0)>0||l.dispatchDate) return 'Shipment';
 if(lineCleared(o,l)>0.5) return 'Shipment';
 if(lineToInspect(o,l)>0.5) return 'QA Pre-shipment';
 if((l.packed||0)>=(l.ordered||0)-0.5) return 'QA Pre-shipment';
 if((l.produced||0)>0 && (l.produced||0)>=(l.ordered||0)-0.5) return 'Lab QC';
 if((l.produced||0)>0||l.prodStart) return 'Production';
 if(l.rmReady) return 'Production';
 if(l.prRaised) return 'RM Check';
 return 'PO Created';
}
function orderBucket(o){ if(!o.lines||!o.lines.length) return 'PO Created'; const idx=o.lines.map(l=>BUCKETS.indexOf(lineBucket(o,l))); return BUCKETS[Math.min.apply(null,idx)]; }

function trkMatch(o){ const b=orderBucket(o);
  switch(trkFilter){
    case 'risk':return (isOverdue(o)||isStalled(o)||attentionOf(o).hot)&&b!=='Delivered';
    case 'open':return b!=='Delivered';
    case 'delivered':return b==='Delivered';
    case 'delayed':return isOverdue(o)&&b!=='Delivered';
    case 'stalled':return isStalled(o);
    case 'priority':return attentionOf(o).hot;
    case 'rmblock':return b==='RM Check';
    case 'prod':return b==='Production';
    case 'qc':return b==='Lab QC';
    case 'qa':return b==='QA Pre-shipment';
    case 'qahold':return o.lines.some(l=>lineQA(o,l).anyFail);
    case 'ready':return o.lines.some(l=>lineCleared(o,l)>0.5);
    case 'myrole':return state.role==='COO'||BUCKET_META[b].owner===state.role;
    default:return true;
  }
}


function orderBal(o){ var ord=0,del=0; (o.lines||[]).forEach(function(l){ ord+=(+l.ordered||0); del+=(+l.delivered||0); }); return {ord:ord,del:del,rem:Math.max(0,ord-del),pct:ord>0?Math.min(100,Math.round(del/ord*100)):0}; }
function tkProg(pct){ return `<div class="tkprog"><span style="width:${pct}%"></span></div>`; }
function tkBalCell(o){ var x=orderBal(o); return `<div class="tkbalnum">${fmt(x.rem)} <span class="tkbalu">left</span></div><div class="tkbalsub">${fmt(x.del)} / ${fmt(x.ord)} delivered</div>${tkProg(x.pct)}`; }
function tkLineRow(o,l){ var ord=(+l.ordered||0), del=(+l.delivered||0), rem=Math.max(0,ord-del), pct=ord>0?Math.min(100,Math.round(del/ord*100)):0, done=rem<=0.5; return `<div class="tksubrow"><div class="tksubname">${l.brand}</div><div class="tksubbal">${done?'<b style="color:var(--green2)">✓ complete</b>':('<b>'+fmt(rem)+' left</b>')} <span class="muted">${fmt(del)} / ${fmt(ord)}</span></div>${tkProg(pct)}</div>`; }
function t2bars(o,mixed){ var idx=t2idx(o), sev=t2sev(o), segs=''; BUCKETS.forEach(function(s,i){ var c=i<idx?'done':(i===idx?('cur '+sev):''); segs+='<div class="t2seg '+c+'"></div>'; }); return `<div class="t2step ${mixed?'mixed':''}">${segs}</div>`; }
function toggleTrkRow(id){ trkExpanded[id]=!trkExpanded[id]; _trkPaint(); }
function orderCard(o){
  var b=orderBucket(o); var mixed=new Set(o.lines.map(function(l){return lineBucket(o,l);})).size>1;
  var multi=(o.lines||[]).length>1; var delivered=b==='Delivered';
  var rc=isOverdue(o)?'od':(isStalled(o)?'stall':'');
  var owner=BUCKET_META[b].owner;
  var next= delivered?'<span class="muted" style="font-size:11px">Delivered</span>':`<div class="tknext">${NEXT_ACT[b]||''}</div><div class="tkowner">${owner}</div>`;
  var exp=!!trkExpanded[o.id];
  var chev= multi?`<button class="tkexp" onclick="event.stopPropagation();toggleTrkRow('${o.id}')">${exp?'▾':'▸'} ${o.lines.length} products</button>`:'';
  var head=`<div class="tkrow ${rc}" onclick="openTkDrawer('${o.id}')">`
   +`<div class="tkcell"><div class="tkpo" title="${o.po}">${o.po}</div><div class="tkclient" title="${(o.client||'').replace(/"/g,'&quot;')}">${o.client||''}${t2flag(o)}</div>${multi?`<div class="tkmini muted">${o.lines.length} products</div>`:''}</div>`
   +`<div class="tkcell">${t2spill(b)}<div class="tkjourney">${t2bars(o,mixed)}</div></div>`
   +`<div class="tkcell">${t2ageText(o)}</div>`
   +`<div class="tkcell">${tkBalCell(o)}</div>`
   +`<div class="tkcell">${next}${chev}</div>`
   +`</div>`;
  var sub=(multi&&exp)?`<div class="tksub">${o.lines.map(function(l){return tkLineRow(o,l);}).join('')}</div>`:'';
  return head+sub;
}
function _trkRisk(o){ return isOverdue(o)?['Overdue','od']:(isStalled(o)?['Stalled','stall']:(attentionOf(o).hot?['Priority','pri']:['On track','ok'])); }
function trkTableWrap(rows){ return '<div class="tscroll trktblwrap"><table class="trktbl"><thead><tr><th>PO</th><th>Client</th><th>Brand</th><th>Stage</th><th>Progress</th><th>Risk</th><th>Promised</th></tr></thead><tbody>'+rows+'</tbody></table></div>'; }
function trkTrow(o){
  var b=orderBucket(o), x=orderBal(o), r=_trkRisk(o);
  var brands=(o.lines||[]).map(function(l){return l.brand;}).filter(Boolean);
  var brand=brands.length<=1?(brands[0]||'—'):(brands[0]+' <span class="muted">+'+(brands.length-1)+'</span>');
  return '<tr onclick="openTkDrawer(\''+o.id+'\')">'
    +'<td class="trkpo">'+(o.po||'')+'</td>'
    +'<td>'+(o.client||'')+'<div class="trksub">'+(o.channel||'')+'</div></td>'
    +'<td>'+brand+'</td>'
    +'<td>'+t2spill(b)+'</td>'
    +'<td><div class="trkprogc"><div class="tkprog"><span style="width:'+Math.max(0,Math.min(100,x.pct))+'%"></span></div><span class="trkpct">'+x.pct+'%</span></div></td>'
    +'<td><span class="rchip '+r[1]+'">'+r[0]+'</span></td>'
    +'<td class="trkprom">'+(o.promised||'—')+'</td>'
    +'</tr>';
}
