<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAN Order Control Tower</title>
<!-- VAN build: 2026-06-04 first-push test -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f3f6fb; --line:#dde3ec; --line2:#eaeef4;
  --navy:#1d4ed8; --navy2:#1e40af; --navy-50:#eef4ff; --navy-100:#d8e4fe;
  --green:#16a34a; --green2:#15803d; --leaf:#22c55e; --green-50:#ecfdf3;
  --teal:#0e9aa7; --amber:#f59e0b; --amber-50:#fef6e7; --red:#dc2626; --red-50:#fef2f2;
  --blue:#1d4ed8; --purple:#7a5bd0;
  --txt:#111827; --txt2:#334155; --mut:#64748b;
  --radius:15px; --radius-sm:10px;
  --sh-sm:0 1px 2px rgba(15,23,42,.07),0 1px 1px rgba(15,23,42,.04);
  --sh:0 3px 12px rgba(15,23,42,.10),0 1px 3px rgba(15,23,42,.06);
  --sh-lg:0 20px 50px rgba(15,23,42,.20);
  --ring:0 0 0 3px rgba(29,78,216,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
h1,h2,h3{margin:0;letter-spacing:-.02em}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d6deea;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#c2cdde}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:238px;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 15px;border-bottom:1px solid var(--line2);margin-bottom:12px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(155deg,var(--navy),#3b66e0);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(29,78,216,.28)}
.brand .nm{font-size:15.5px;font-weight:800;color:var(--txt);line-height:1.05;letter-spacing:-.02em}
.brand .nm span{display:block;font-size:9px;font-weight:700;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--txt2);cursor:pointer;font-size:13px;font-weight:600;transition:.13s;position:relative}
.nav a:hover{background:var(--panel2);color:var(--txt)}
.nav a.active{background:var(--navy-50);color:var(--navy);font-weight:700}
.nav a.active::before{content:'';position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--navy)}
.nav a .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--mut)}
.nav a.active .ic{color:var(--navy)}
.nav a .ic svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav a .lk{margin-left:auto;font-size:8.5px;color:var(--navy);background:#fff;border:1px solid var(--navy-100);border-radius:6px;padding:1px 6px;font-weight:700;letter-spacing:.3px}
.side .foot{padding-top:12px;border-top:1px solid var(--line2);margin-top:8px}
/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 24px;background:#ffffff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h2{font-size:18px;font-weight:800;color:var(--txt);letter-spacing:-.025em}
.topbar .sub{font-size:11.5px;color:var(--mut);margin-top:2px;font-weight:500}
.rolebox{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 5px;box-shadow:var(--sh-sm)}
.rolebox label{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.rolebox .av{width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}
.helpbar{display:flex;align-items:center;gap:9px;padding:7px 24px;background:var(--navy-50);border-bottom:1px solid var(--navy-100);color:#1e3a8a;font-size:12px;line-height:1.45;font-weight:500}
.helpbar:empty{display:none}
.helpbar::before{content:'';flex-shrink:0;width:15px;height:15px;background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d4ed8' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><line x1='12' y1='16' x2='12' y2='12'/><line x1='12' y1='8' x2='12.01' y2='8'/></svg>")}
.helpbar b{font-weight:700;color:var(--navy)}
.wrap{padding:18px 24px;flex:1;max-width:1440px;margin:0 auto;width:100%}
/* ---------- controls ---------- */
select,input,button,textarea{font-family:inherit}
select,input[type=text],input[type=number],input[type=date],textarea{background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;outline:none;transition:.14s}
select:hover,input:hover{border-color:#d3dceb}
select:focus,input:focus,textarea:focus{border-color:var(--navy);box-shadow:var(--ring)}
.rolebox select{background:transparent;border:none;padding:6px 6px;font-weight:700;color:var(--navy)}
.rolebox select:focus{box-shadow:none}
button{background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 17px;font-size:13px;font-weight:700;cursor:pointer;transition:.14s;box-shadow:var(--sh-sm);letter-spacing:-.01em}
button:hover{background:var(--navy2);transform:translateY(-1px);box-shadow:var(--sh)}
button:active{transform:translateY(0)}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
button.ghost:hover{background:var(--panel2);border-color:#d3dceb}
button.green{background:var(--green)}button.green:hover{background:var(--green2)}
button.sm{padding:7px 12px;font-size:12px;border-radius:9px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
/* ---------- cards & kpis ---------- */
.row{display:flex;gap:14px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.dgrid .card{margin:0}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh-sm)}
.card h3{font-size:14px;margin-bottom:14px;color:var(--txt);font-weight:700;display:flex;align-items:center;letter-spacing:-.02em}
.card h3 .hint{font-weight:500;color:var(--mut);font-size:11.5px;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;transition:.16s}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--navy),#5b8def)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kpi .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.kpi .v{font-size:23px;font-weight:800;margin-top:5px;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.kpi .d{font-size:10.5px;color:var(--mut);margin-top:6px;font-weight:500}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#475569;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel2);z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;color:var(--txt2)}
td b,td>b{color:var(--txt)}
tr.clk{cursor:pointer;transition:.1s}
tr.clk:hover td{background:var(--navy-50)}
.empty{text-align:center;padding:30px 18px;color:var(--mut);font-size:12.5px}
.empty .ei{width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:#94a3b8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}
th.num,th.ctr{text-align:inherit}
.muted{color:var(--mut)}
.barmini{height:7px;background:#eaeef5;border-radius:6px;overflow:hidden;min-width:60px;display:inline-block;vertical-align:middle}
.barmini>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--leaf));border-radius:6px}
.pill{padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block;letter-spacing:.1px;box-shadow:inset 0 0 0 1px rgba(15,23,42,.04)}
.tag{font-size:9.5px;color:var(--navy);border:1px solid var(--navy-100);background:var(--navy-50);border-radius:6px;padding:1px 7px;font-weight:700;text-transform:none;letter-spacing:0}
.tag2{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
/* ---------- banners ---------- */
.banner{border-radius:11px;padding:9px 14px;margin-bottom:13px;font-size:12px;line-height:1.5;border:1px solid var(--line);font-weight:500}
.banner.info{background:linear-gradient(90deg,var(--navy-50),#f3f8ff);border-color:var(--navy-100);color:#284b91}
.banner.warn{background:var(--amber-50);border-color:#f0d6a8;color:#8a5712}
.banner b{font-weight:700}
/* ---------- forms ---------- */
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
/* ---------- PO parent / SKU rows ---------- */
tr.po-row>td{border-top:1px solid var(--line);font-weight:600;background:#fff}
tr.po-row:hover>td{background:var(--navy-50);cursor:pointer}
tr.po-row.exp>td{background:var(--navy-50)}
tr.sku-row>td{background:var(--panel2);font-size:12px;color:var(--txt2);border-bottom:1px solid var(--line2)}
tr.sku-row:hover>td{background:#eef4ff;cursor:pointer}
td.skufirst{padding-left:10px;box-shadow:inset 3px 0 0 var(--navy)}
.skuarrow{color:var(--navy);opacity:.5;margin-right:5px}
.chev{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:6px;background:var(--navy-50);color:var(--navy);font-size:10px;transition:.12s}
.po-row:hover .chev{background:var(--navy-100)}
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.fixedtbl{table-layout:fixed}
.fixedtbl td,.fixedtbl th{overflow:hidden;text-overflow:ellipsis}
.fixedtbl input,.fixedtbl select{width:100%;padding:7px 8px}
/* ---------- drawer ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(17,30,66,.42);display:none;z-index:50;backdrop-filter:blur(2px)}
.drawer-bg.open{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;height:100vh;width:660px;max-width:97vw;background:var(--bg);border-left:1px solid var(--line);overflow:auto;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-lg);z-index:51}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);z-index:2}
.drawer .dh h2{color:var(--navy);font-size:17px}
.drawer .db{padding:22px 24px}
/* ---------- lifecycle field grid ---------- */
.ff{display:flex;flex-direction:column;gap:4px}
.ff label{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;font-weight:700;display:flex;gap:5px;align-items:center}
.ff .lk2{font-size:8px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;text-transform:none;letter-spacing:0;font-weight:600}
.ff input,.ff select{padding:7px 9px;font-size:12px;width:100%;border-radius:9px}
.fval{padding:7px 9px;font-size:12px;border-radius:9px;border:1px solid var(--line);min-height:32px;display:flex;align-items:center}
.f-input{background:#fff8d8;border-color:#e7cf6f}
.f-input:focus{box-shadow:0 0 0 3px rgba(201,154,0,.18)}
.f-done{background:var(--green-50);border-color:#b4e0c2}
.f-auto{background:#eef1f7;color:#6b778c;border-color:#e0e6f0}
.f-plant{background:#ffefdc;border-color:#edca93}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.fgroup{margin-bottom:15px}
.fgroup .gt{font-size:10.5px;font-weight:800;color:var(--navy);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.calcrow{display:flex;flex-wrap:wrap;gap:7px 18px;font-size:11.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-top:10px;box-shadow:var(--sh-sm)}
.calcrow b{color:var(--navy);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:10.5px;color:var(--mut);margin:6px 0 12px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1px solid rgba(0,0,0,.06)}
@media(max-width:760px){.fgrid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}}
.stp .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;background:#e8edf4;color:var(--mut)}
.stp.done .dot{background:var(--green);color:#fff}
.hide{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;border-radius:12px;padding:12px 22px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:.2s;box-shadow:var(--sh-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,30,66,.5);display:none;z-index:60;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex;align-items:center;justify-content:center;animation:fade .18s ease}
.modal{background:#fff;border-radius:16px;width:580px;max-width:95vw;max-height:90vh;overflow:auto;box-shadow:var(--sh-lg)}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal .mh h2{font-size:16px;color:var(--navy)}
.modal .mh .sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.modal .mb{padding:18px 22px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.seg{display:flex;gap:8px;margin-bottom:6px}
.seg .opt{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:12px 10px;text-align:center;cursor:pointer;font-weight:700;font-size:13px;transition:.12s;background:#fff;color:var(--txt2)}
.seg .opt:hover{border-color:#cdd8ea}
.seg .opt.on.full{border-color:var(--green);background:var(--green-50);color:var(--green2)}
.seg .opt.on.partial{border-color:var(--amber);background:var(--amber-50);color:var(--amber)}
.seg .opt.on.short{border-color:var(--red);background:var(--red-50);color:var(--red)}
.seg .opt .em{font-size:18px;display:block;margin-bottom:3px}
.prline{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.prline select{flex:1}.prline input{width:110px}
.prline .rmstk{font-size:10.5px;color:var(--mut);width:96px;text-align:right}
.prline .x{cursor:pointer;color:var(--red);font-weight:700;width:20px;text-align:center}
@media print{.side,.topbar,.helpbar,.seg,.filterbar,button{display:none!important}.wrap{padding:0;max-width:none}.card{box-shadow:none;break-inside:avoid}}
.authscreen{position:fixed;inset:0;background:linear-gradient(160deg,#e8f0ff,#f8fafc);display:none;align-items:center;justify-content:center;z-index:200}
.authcard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-lg);padding:30px 28px;width:360px;max-width:92vw}
.authcard .lhdr{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.authcard .lmark{width:44px;height:44px;border-radius:12px;background:linear-gradient(155deg,var(--navy),#3b66e0);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(29,78,216,.3)}
.authcard .lsub{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.authcard label{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin:14px 0 5px}
.authcard input{width:100%}
.authcard .lbtn{width:100%;margin-top:18px;padding:12px;font-size:14px}
.autherr{background:var(--red-50);color:var(--red);border:1px solid #f4c9c9;border-radius:9px;padding:9px 12px;font-size:12px;margin-top:13px;font-weight:600}
.rolebox{gap:9px}
.flowstrip{display:flex;align-items:stretch;gap:5px;flex-wrap:wrap}
.flowstrip .fstep{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;min-width:104px}
.flowstrip .fstep b{font-size:12px;color:var(--txt);font-weight:700}
.flowstrip .fstep i{font-style:normal;font-size:10px;color:var(--mut)}
.flowstrip .fdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-bottom:3px}
.flowstrip .farrow{display:flex;align-items:center;color:#9fb0c9;font-weight:800;font-size:15px}
.flowbar{display:flex;gap:7px;flex-wrap:wrap}
.flowstage{flex:1;min-width:104px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.flowstage .fs-c{font-size:23px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.flowstage .fs-n{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;font-weight:700;margin-top:6px}
.attngrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:1150px){.attngrid{grid-template-columns:repeat(3,1fr)}}
.attn{background:#fff;border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:11px;padding:13px 14px;cursor:pointer;transition:.13s}
.attn:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.attn.on{box-shadow:0 0 0 2px var(--navy)}
.attn .a-c{font-size:22px;font-weight:800;line-height:1}
.attn .a-n{font-size:11px;color:var(--mut);font-weight:600;margin-top:5px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--txt2)}
.chip:hover{border-color:#cdd8ea}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ordrow{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff;box-shadow:var(--sh-sm)}
.ohead{display:grid;grid-template-columns:1.1fr 1.7fr 0.9fr 1fr 1.4fr 0.9fr 1.4fr;gap:14px;align-items:center;padding:13px 16px;cursor:pointer}
.ohead>div{min-width:0;overflow:hidden}
.ohead:hover{background:var(--panel2)}
.ordrow .chev{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:6px;background:var(--navy-50);color:var(--navy);font-size:10px}
.rbadge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--navy-50);color:var(--navy);border:1px solid var(--navy-100)}
.pbar{height:9px;border-radius:6px;background:#eef1f6;overflow:hidden}

function ensureMasters(s){

function validateBatchNo(v){

function ensureProductionModel(s){
  s.shiftEntries = s.shiftEntries || [];

    if(b.kind==null)      b.kind = (b.po ? 'po' : 'bulk');

/* ===================== ENGINE A — RM ===================== */
function needFor(order){ // {rm: kg}
  const need={};
  order.lines.forEach(l=>{
    const rec = SEED.baseRecipes[l.base] || {};
    for(const rm in rec){ need[rm]=(need[rm]||0) + l.ordered*rec[rm]; }
  });
  return need;
}
function rmCheck(order, s){
  s=s||state; const need=needFor(order); const short=[];
  for(const rm in need){ const have=s.rawStock[rm]??0; if(need[rm]>have+0.001) short.push({rm, need:need[rm], have, gap:need[rm]-have}); }
  return { need, short, ok: short.length===0 };
}

/* ===================== ENGINE B — stage/fulfilment ===================== */
const sum=(arr,f)=>arr.reduce((a,x)=>a+f(x),0);

function agg(o){ return { ordered:sum(o.lines,l=>l.ordered), produced:sum(o.lines,l=>l.produced),
  packed:sum(o.lines,l=>l.packed), dispatched:sum(o.lines,l=>l.dispatched), delivered:sum(o.lines,l=>l.delivered) }; }
function lineStage(o,l){
  if(l.deliveredDate && (l.delivered||0)>=l.ordered-0.5) return 'Delivered';
  if(l.dispatchDate||(l.dispatched||0)>0) return 'Dispatched';
  if(l.qcPass) return 'QC Passed';
  if(l.prodComplete) return 'Produced';
  if(l.prodStart) return 'In Production';
  if(l.rmReady) return 'RM Ready';
  if(l.prRaised) return 'PR Raised';

  return 'New';
}

function lineOverdue(o,l){ return !!l.committed && (l.delivered||0)<l.ordered-0.5 && new Date(l.committed)<TODAY; }

function daysOver(o){ const ds=o.lines.filter(l=>lineOverdue(o,l)).map(l=>Math.round((TODAY-new Date(l.committed))/86400000));

function shipFor(o,l){ return (state.shipments||[]).filter(s=>s.po===o.po && (s.brand===l.brand)); }
function calcLine(o,l){
  const sh=shipFor(o,l);
  const deliveredQty=sh.reduce((a,s)=>a+(s.kg||0),0) || l.dispatched || 0;
  const lastDisp=sh.map(s=>s.dispatch).filter(Boolean).sort().slice(-1)[0]||l.dispatchDate||null;

function editField(oid,lid,key,val){

  state.audit.unshift({t:new Date().toISOString(), user:state.role, module:'PO Tracker', po:o.po, brand:l.brand, field:key, old:old||'', val:val||''});

function dfSubmitProduction(){
  if(!dfReasonOk()) return toast('Reason is required');
  const q=+dfForm.qty||0; if(q<=0) return toast('Enter a quantity');
  const d=dfForm.date||TODAY.toISOString().slice(0,10); const sh=dfForm.shift||'Morning'; const inc=dfForm.incharge||'';
  if(dfForm.kind==='bulk'){
    const base=dfForm.base; if(!base) return toast('Pick a base product');
    let b=(state.batches||[]).find(x=>x.base===base&&x.status==='open');
    if(b){ b.producedKg=(b.producedKg||0)+q; } else { state.batches.unshift({id:'B'+(state.seq++),batchNo:'',kind:'bulk',type:'stock',base,brand:null,plannedKg:q,producedKg:q,packedKg:0,status:'closed',openedDate:d,closedDate:d,by:state.role,recon:true}); }
    state.productionLog.unshift({date:d,base,kg:q,by:state.role,shift:sh,incharge:inc,recon:true});
    reconLog(`Added missing production: ${fmt(q)} Kg/L bulk ${base} — ${dfForm.reason}`, d);
  } else {
    const o=state.orders.find(x=>x.id===dfForm.oid); const l=o&&o.lines.find(x=>x.id===dfForm.lid);
    if(!l) return toast('Pick PO and product');
    l.produced=(l.produced||0)+q; l.prodStart=l.prodStart||d; if((l.produced||0)>=l.ordered-0.001) l.prodComplete=l.prodComplete||d;
    state.productionLog.unshift({date:d,base:l.base,kg:q,by:state.role,po:o.po,brand:l.brand,shift:sh,incharge:inc,recon:true});
    reconLog(`Added missing production: ${fmt(q)} Kg/L ${l.brand} on ${o.po} — ${dfForm.reason}`, d);
  }
  save(); toast('Production backfilled'); dfBack();
}
function dfSubmitPacking(){
  if(!dfReasonOk()) return toast('Reason is required');
  const q=+dfForm.qty||0; if(q<=0) return toast('Enter a quantity');
  const d=dfForm.date||TODAY.toISOString().slice(0,10);
  const o=state.orders.find(x=>x.id===dfForm.oid); const l=o&&o.lines.find(x=>x.id===dfForm.lid);
  if(!l) return toast('Pick PO and product');
  l.packed=(l.packed||0)+q; l.produced=Math.max(l.produced||0,l.packed); l.prodStart=l.prodStart||d; if((l.packed||0)>=l.ordered-0.5) l.prodComplete=l.prodComplete||d;
  (state.packingLog=state.packingLog||[]).unshift({date:d,base:l.base,brand:l.brand,kg:q,by:state.role,po:o.po,recon:true});
  reconLog(`Added missing packing: ${fmt(q)} Kg/L ${l.brand} on ${o.po} — ${dfForm.reason}`, d);
  save(); toast('Packing backfilled'); dfBack();
}
function dfSubmitShipment(){
  if(!dfReasonOk()) return toast('Reason is required');
  const q=+dfForm.qty||0; if(q<=0) return toast('Enter a quantity');
  const dd=dfForm.date||TODAY.toISOString().slice(0,10); const dl=dfForm.date2||dd;
  const o=state.orders.find(x=>x.id===dfForm.oid); const l=o&&o.lines.find(x=>x.id===dfForm.lid);

}
function dfSubmitPO(){
  if(!dfReasonOk()) return toast('Reason is required');
  const po=(dfForm.po||'').trim(), client=(dfForm.client||'').trim(), brand=(dfForm.brand||'').trim(), ord=+dfForm.ordered||0;
  if(!po) return toast('Enter PO #'); if(!client) return toast('Enter customer'); if(!brand) return toast('Enter product/brand'); if(ord<=0) return toast('Enter ordered qty');
  if(state.orders.some(o=>o.po===po)) return toast('A PO with that number already exists');
  const base=((typeof SEED!=='undefined'&&SEED.brandMap&&SEED.brandMap[brand]&&SEED.brandMap[brand].base))||brand;
  const id='O'+(state.seq++);
  state.orders.unshift({id,po,client,channel:dfForm.channel||'White Label',priority:dfForm.priority||'Normal',promised:dfForm.promised||'',received:dfForm.received||'',rmDecision:'pending',recon:true,
    lines:[{id:id+'L1',brand,base,ordered:ord,committed:dfForm.promised||'',produced:0,packed:0,dispatched:0,delivered:0,soCreated:'',prRaised:'',cfoApproved:'',rmCheck:'',rmReady:'',prodStart:'',prodComplete:'',qcPass:'',dispatchDate:'',deliveredDate:'',notes:'(reconcile backfill)'}]});
  reconLog(`Added missing PO ${po} · ${client} · ${brand} ${fmt(ord)} Kg/L (received ${dfForm.received||'—'}) — ${dfForm.reason}`, dfForm.received);
  save(); toast('PO added'); dfBack();
}
function dfSubmitCorrect(){
  const o=state.orders.find(x=>x.id===dfForm.oid); if(!o) return toast('Pick a PO');
  const reason=(($('co_reason')&&$('co_reason').value)||'').trim(); if(!reason) return toast('Reason is required');
  let n=0;
  const setO=(field,val,label)=>{ const old=o[field]||''; val=(val==null?'':val); if(String(old)!==String(val)){ o[field]=val; reconLog(`CORRECT ${o.po} ${label}: ${old||'—'} → ${val||'—'} — ${reason}`); n++; } };
  setO('client',(($('co_client')&&$('co_client').value)||'').trim(),'customer');
  setO('channel',($('co_channel')&&$('co_channel').value),'channel');
  setO('priority',($('co_priority')&&$('co_priority').value),'priority');
  setO('received',($('co_received')&&$('co_received').value),'received date');
  setO('promised',($('co_promised')&&$('co_promised').value),'promised date');
  o.lines.forEach(l=>{ [['ordered','Ordered'],['produced','Produced'],['packed','Packed'],['dispatched','Dispatched'],['delivered','Delivered']].forEach(([field,label])=>{
    const el=$('cl_'+field+'_'+l.id); if(!el) return; const nv=+el.value||0; const old=+l[field]||0;
    if(Math.abs(nv-old)>0.001){ l[field]=nv; reconLog(`CORRECT ${o.po} · ${l.brand} ${label}: ${fmt(old)} → ${fmt(nv)} — ${reason}`); n++; }
  }); });
  if(!n) return toast('No changes to apply');
  save(); toast(n+' correction(s) applied'); dfBack();
}

function clientsForChannel(ch){
  if(ch==='Dealer') return (state.dealers||[]).map(d=>({id:d.code+' | '+d.name, label:d.code+' | '+d.name, brandKey:'Dealers'}));
  if(ch==='Distributor') return [{id:'BKK',label:'BKK',brandKey:'BKK'}];
  if(ch==='Vgreen') return [{id:'Vgreen',label:'Vgreen',brandKey:'Vgreen'}];
  if(ch==='Cobo') return [{id:'VITAL AGRI NUTRIENTS (PVT) LTD',label:'Vital Agri Nutrients — Cobo outlets',brandKey:'VITAL AGRI NUTRIENTS (PVT) LTD'}];
  return SEED.catalog.clients.filter(c=>SEED.catalog.channelByClient[c]==='White Label').map(c=>({id:c,label:c,brandKey:c}));
}
function curClientObj(){ return clientsForChannel(entryChannel).find(c=>c.id===entryClient); }
function brandPool(){ const co=curClientObj(); return co?(SEED.catalog.brandsByClient[co.brandKey]||[]):[]; }
function detailForBrand(b){ return brandPool().find(x=>x.brand===b)||{}; }

function genPO(recv){
  const d=recv?new Date(recv):TODAY; const ym=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0');
  const seq=String(Math.floor(Math.random()*9000+1000));
  if(entryChannel==='Cobo') return 'COBO-'+ym+'-'+seq;
  if(entryChannel==='Vgreen') return 'VG-'+(entryVsub||'VC')+'-'+ym+'-'+seq;
  if(entryChannel==='Dealer'){ const code=(entryClient.split('|')[0]||'DLR').trim(); return code+'-'+ym+'-'+seq; }
  return null; // White Label & Distributor = manual
}

function entryChecks(){

function previewRM(){

  $('e_preview').innerHTML = (need.length
    ? `<div class="muted" style="margin-bottom:5px">Estimated raw material (reference only):</div>`+need.map(([rm,kg])=>`<div style="padding:1px 0">${rm}: <b>${fmt(kg)} Kg/L</b></div>`).join('')

function submitPO(){

let trkSearch='';
const BUCKETS=['PO Created','RM Check','Production','Lab QC','QA Pre-shipment','Shipment','Delivered'];
const BUCKET_META={
 'PO Created':{c:'--mut',owner:'Supply Chain',where:'My Actions — Acknowledge & RM Check'},
 'RM Check':{c:'--amber',owner:'Supply Chain',where:'Open PO → RM Check'},
 'Production':{c:'--blue',owner:'Production',where:'Production screen'},
 'Lab QC':{c:'--purple',owner:'Lab Rep',where:'QC · Pre-shipment → Lab QC'},
 'QA Pre-shipment':{c:'--amber',owner:'QA Inspector',where:'QC · Pre-shipment → QA Pre-shipment'},
 'Shipment':{c:'--green2',owner:'Supply Chain',where:'Shipments screen'},
 'Delivered':{c:'--green',owner:'—',where:'—'}
};
function lineBucket(o,l){
 if(l.deliveredDate && (l.delivered||0)>=l.ordered-0.5) return 'Delivered';
 if((l.dispatched||0)>0||l.dispatchDate) return 'Shipment';
 if(l.qcPass) return 'Shipment';
 if(l.qcLab&&l.qcLab.pass) return 'QA Pre-shipment';
 if((l.packed||0)>=l.ordered-0.5) return 'Lab QC';
 if((l.produced||0)>0||l.prodStart) return 'Production';

 if(l.prRaised) return 'RM Check';
 return 'PO Created';
}
function orderBucket(o){ if(!o.lines||!o.lines.length) return 'PO Created'; const idx=o.lines.map(l=>BUCKETS.indexOf(lineBucket(o,l))); return BUCKETS[Math.min.apply(null,idx)]; }
function attnCounts(){ let delayed=0,rmblock=0,prod=0,qc=0,qahold=0,ready=0;
  state.orders.forEach(o=>{ const b=orderBucket(o);
    if(isOverdue(o)&&b!=='Delivered')delayed++;
    if(b==='RM Check')rmblock++;
    if(b==='Production')prod++;
    if(b==='Lab QC'||b==='QA Pre-shipment')qc++;
    if(o.lines.some(l=>(l.qcLab&&l.qcLab.fail)||(l.qcPhys&&l.qcPhys.fail)))qahold++;
    if(o.lines.some(l=>l.qcPass&&(l.dispatched||0)<(l.packed||0)-0.5))ready++; });
  return {delayed,rmblock,prod,qc,qahold,ready};
}
function trkMatch(o){ const b=orderBucket(o);
  switch(trkFilter){
    case 'open':return b!=='Delivered';
    case 'delivered':return b==='Delivered';
    case 'delayed':return isOverdue(o)&&b!=='Delivered';
    case 'rmblock':return b==='RM Check';
    case 'prod':return b==='Production';
    case 'qc':return b==='Lab QC'||b==='QA Pre-shipment';
    case 'qahold':return o.lines.some(l=>(l.qcLab&&l.qcLab.fail)||(l.qcPhys&&l.qcPhys.fail));
    case 'ready':return o.lines.some(l=>l.qcPass&&(l.dispatched||0)<(l.packed||0)-0.5);

function screenTracker(){
  state.expanded=state.expanded||{};
  const counts={}; BUCKETS.forEach(b=>counts[b]=0); state.orders.forEach(o=>counts[orderBucket(o)]++);
  const A=attnCounts();
  let list=state.orders.filter(o=>trkMatch(o));
  if(trkSearch){ const q=trkSearch.toLowerCase(); list=list.filter(o=>((o.po||'')+' '+(o.client||'')).toLowerCase().indexOf(q)>-1); }
  // Sort: earliest stage (new POs) at top → progressing by stage → Delivered at the bottom.
  // Within a stage: most overdue first, then newer PO (by received date) first.
  list=list.slice().sort((a,b)=>{
    const ra=BUCKETS.indexOf(orderBucket(a)), rb=BUCKETS.indexOf(orderBucket(b));
    if(ra!==rb) return ra-rb;

    <div class="card"><h3>Orders <span class="hint">${list.length} shown</span></h3>${chipbar}<div>${rows}</div></div>`;
}

function trackerFlow(){
  const steps=[['1 Order & SO','KAM','var(--blue)'],['2 Materials (RM)','Supply Chain','var(--amber)'],['3 Production','Production','var(--purple)'],['4 Quality','Lab → QA','var(--leaf)'],['5 Dispatch','Supply Chain','var(--green2)'],['6 Delivered','done','var(--green)']];
  return `<div class="card" style="padding:14px 18px"><div style="font-weight:700;font-size:13px;margin-bottom:11px;color:var(--txt)">How an order moves <span style="font-weight:500;color:var(--mut);font-size:11.5px">\u2014 each step is done by that team on its own screen</span></div><div class="flowstrip">${steps.map((s,i)=>`<div class="fstep"><span class="fdot" style="background:${s[2]}"></span><b>${s[0]}</b><i>${s[1]}</i></div>${i<steps.length-1?'<span class="farrow">\u2192</span>':''}`).join('')}</div></div>`;
}
function trackerKPIs(){
  const os=state.orders; const open=os.filter(o=>stageOf(o)!=='Delivered').length;
  const closed=os.filter(o=>stageOf(o)==='Delivered').length;
  const overdue=os.filter(o=>isOverdue(o)).length;
  const rmblk=os.filter(o=>['short','procuring'].includes(o.rmDecision)&&stageOf(o)==='RM / Procurement').length;
  const orderedKg=os.reduce((a,o)=>a+agg(o).ordered,0);
  const shippedKg=os.reduce((a,o)=>a+agg(o).dispatched,0);
  const data=[['Orders',os.length,'in system'],['Open',open,'not yet closed'],['Closed',closed,'shipped'],
    ['Overdue',overdue,'past promised'],['RM-blocked',rmblk,'awaiting procurement'],['Shipped',fmt(shippedKg)+' Kg/L','of '+fmt(orderedKg)]];
  return data.map(d=>`<div class="kpi"><div class="l">${d[0]}</div><div class="v">${d[1]}</div><div class="d">${d[2]}</div></div>`).join('');
}

/* ===================== ORDER DRAWER (role-owned lifecycle) ===================== */
function fld(o,l,key,label,type){
  const v=l[key]||''; const auto=AUTO_FIELDS.includes(key); const ed=canEditField(key)&&!auto;
  const plant=(key==='delayReason'||key==='respDept');
  let cls = plant?'f-plant' : auto?'f-auto' : v?'f-done' : (canEditField(key)?'f-input':'f-auto');
  const owner = auto?'auto':(FIELD_OWNER[key]||'');
  let inner;
  if(ed){
    if(type.indexOf('select:')===0){ const opts=(state.masters&&state.masters[type.split(':')[1]])||(SEED.masters&&SEED.masters[type.split(':')[1]])||[];
      inner=`<select class="${cls}" onchange="editField('${o.id}','${l.id}','${key}',this.value)"><option value="">—</option>${opts.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`; }
    else if(type==='num') inner=`<input class="${cls}" type="number" value="${v}" onchange="editField('${o.id}','${l.id}','${key}',this.value)">`;
    else if(type==='text') inner=`<input class="${cls}" type="text" value="${v}" onchange="editField('${o.id}','${l.id}','${key}',this.value)">`;
    else inner=`<input class="${cls}" type="date" value="${v}" onchange="editField('${o.id}','${l.id}','${key}',this.value)">`;
  } else { inner=`<div class="fval ${cls}">${v||'—'}</div>`; }
  const tag = (canEditField(key)&&!auto) ? `<span class="lk2" style="background:#fff7d6;border-color:#e6cd72;color:#8a6d12">\u270e you</span>` : `<span class="lk2">${owner}</span>`;
  return `<div class="ff"><label>${label}${tag}</label>${inner}</div>`;
}
const LIFE_GROUPS=[
  ['Stage 1 — RM procurement',[['prRaised','PR Raised','date'],['cfoApproved','CFO Approved','date'],['rmCheck','RM Check','date'],['rmReady','RM Ready','date']]],
  ['Stage 2 — Production',[['prodStart','Prod Start','date'],['prodComplete','Prod Complete','date'],['qcPass','QC Pass','date']]],
  ['Stage 3 — Dispatch & Delivery',[['dispatchDate','Dispatch','date'],['deliveredDate','Delivered','date']]],
  ['Delay (Plant Manager)',[['delayReason','Delay Reason','select:delayReasons'],['respDept','Responsible Dept','select:respDepts']]],
];
const FIELD_LABEL={soNumber:'SO #',soCreated:'SO Created',prRaised:'PR Raised',cfoApproved:'CFO Approved',rmCheck:'RM Check',rmReady:'RM Ready',prodStart:'Prod Start',prodComplete:'Prod Complete',qcPass:'QC Pass',delayReason:'Delay Reason',respDept:'Responsible Dept',creditDays:'Credit Days',invSent:'Invoice Sent',invConfirmed:'Invoice Confirmed',payDue:'Payment Due',payReceived:'Payment Received',notes:'Notes'};
function myOpenFields(o,l){ return Object.keys(FIELD_OWNER).filter(k=>canEditField(k) && !l[k]).map(k=>FIELD_LABEL[k]||k); }
function openOrder(id){
  const o=state.orders.find(x=>x.id===id); if(!o)return;
  const a=agg(o); const st=stageOf(o); const admin=(state.role==='COO');
  const lineCards=o.lines.map(l=>{
    const ls=lineStage(o,l); const c=calcLine(o,l); const od=lineOverdue(o,l);
    const groups=LIFE_GROUPS.map(([gt,fields])=>`<div class="fgroup"><div class="gt">${gt}</div>
       <div class="fgrid">${fields.map(f=>fld(o,l,f[0],f[1],f[2])).join('')}</div></div>`).join('');
    const calc=`<div class="calcrow">
       <span>PO→SO <b>${c.poToSo??'—'}</b>d</span><span>RM <b>${c.rmDays??'—'}</b>d</span>
       <span>Prod <b>${c.prodDays??'—'}</b>d</span><span>QC→Deliv <b>${c.qcToDeliv??'—'}</b>d</span>
       <span>Cycle <b>${c.totalCycle??'—'}</b>d</span><span>Variance <b>${c.variance??'—'}</b>d</span>
       <span>${c.onTime==='Delayed'||c.onTime==='Late'?'<b style="color:var(--red)">'+c.onTime+'</b>':'<b style="color:var(--green2)">'+c.onTime+'</b>'}${c.daysOverdue?' ('+c.daysOverdue+'d)':''}</span>
       <span>Delivered <b>${fmt(c.deliveredQty)}</b>/${fmt(l.ordered)} Kg/L</span><span>Shipments <b>${c.shipments}</b></span></div>`;
    return `<div class="card" style="margin:0 0 12px;padding:13px 15px;border-color:${od?'var(--red)':'var(--line)'}">
       <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
         <b style="font-size:14px">${l.brand}</b> <span class="muted" style="font-size:11px">${l.base}</span>
         ${pill(ls,STAGE_COLOR[ls]||'--mut')} ${od?pill(c.daysOverdue+'d overdue','--red'):''}
         <span style="margin-left:auto;font-size:11px" class="muted">${fmt(l.ordered)} Kg/L ordered</span></div>
       ${canEditField('prRaised')?(true?`<div style="display:flex;align-items:center;gap:9px;background:#f4f7fc;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:11px;flex-wrap:wrap"><b style="font-size:11.5px">Raw materials:</b> ${rmStatusPill(l)} ${l.rmStatus==='partial'&&l.canMakeKg?`<span class="muted" style="font-size:11px">can make ${fmt(l.canMakeKg)} Kg/L now</span>`:''}${l.pr&&l.pr.lines&&l.pr.lines.length?`<span class="muted" style="font-size:11px">· PR ${l.pr.lines.length} item(s)</span>`:''}<button class="sm" style="margin-left:auto" onclick="openRMCheck(\'${o.id}\',\'${l.id}\')">RM Check / Raise PR</button></div>`:`<div style="background:#f4f7fc;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:11px;font-size:11.5px;color:var(--mut)">Raw materials: <b>create the SO first (Stage 1)</b> — RM check unlocks after that.</div>`):''}
       ${(function(){const mof=myOpenFields(o,l); return mof.length?`<div style="background:#fff8db;border:1px solid #e8d488;border-radius:9px;padding:8px 11px;margin-bottom:11px;font-size:11.5px;color:#6f5a12"><b>\u270e Your turn (${state.role}):</b> fill ${mof.slice(0,5).join(', ')}${mof.length>5?' …':''}</div>`:'';})()}
       ${groups}${calc}</div>`;
  }).join('');
  $('drawer').innerHTML=`
   <div class="dh"><div><h2 style="font-size:16px">${o.po}</h2>
     <div class="sub muted" style="font-size:11px">${o.client} · ${o.channel}${o.vgreenSub?' ('+o.vgreenSub+')':''} · ${o.priority}${o.kam?' · '+o.kam:''}</div></div>
     <button class="ghost sm" style="margin-left:auto" onclick="closeDrawer()">✕ Close</button></div>
   <div class="db">
     <div class="row" style="gap:18px;margin-bottom:12px">
       <div><div class="l muted" style="font-size:10px;text-transform:uppercase">PO promised</div><b>${o.promised||'—'}</b></div>
       <div><div class="l muted" style="font-size:10px;text-transform:uppercase">PO received</div><b>${o.received||'—'}</b></div>
       <div><div class="l muted" style="font-size:10px;text-transform:uppercase">Stage (rollup)</div>${pill(st,STAGE_COLOR[st]||'--mut')}</div>
       <div><div class="l muted" style="font-size:10px;text-transform:uppercase">Fulfilment</div><b>${pct(a.dispatched,a.ordered)}%</b></div>
     </div>
     <div class="legend">
       <span><i style="background:#fffada"></i>You can fill</span><span><i style="background:#e9f7ee"></i>Done</span>
       <span><i style="background:#eef1f6"></i>Read-only / auto</span><span><i style="background:#fff0e0"></i>Plant Manager</span>
       <span style="margin-left:auto">Acting as <b style="color:var(--navy)">${state.role}</b> — you can only edit your fields</span></div>
     <h3 style="font-size:13px;margin:2px 0 10px;color:var(--navy)">Products &amp; lifecycle <span class="muted" style="font-weight:400">(${o.lines.length})</span></h3>
     ${lineCards}
   </div>`;
  $('drawer').classList.add('open'); $('drawerBg').classList.add('open');
}
function closeDrawer(){ $('drawer').classList.remove('open'); $('drawerBg').classList.remove('open'); }
function advanceLine(o,l,kind){
  if(kind==='produce'){ const amt=l.ordered-l.produced; if(amt<=0.5)return; l.produced+=amt; l.prodStart=l.prodStart||TODAY.toISOString().slice(0,10); l.prodComplete=TODAY.toISOString().slice(0,10);
    state.productionLog.unshift({date:TODAY.toISOString().slice(0,10),base:l.base,kg:amt,by:state.role,po:o.po});
    logAction(`Produced ${fmt(amt)} Kg/L of ${l.brand} for ${o.po}`); }
  else if(kind==='pack'){ const amt=l.produced-l.packed; if(amt<=0.5)return; l.packed+=amt;
    state.packingLog.unshift({date:TODAY.toISOString().slice(0,10),po:o.po,brand:l.brand,kg:amt,by:state.role});
    logAction(`Packed ${fmt(amt)} Kg/L of ${l.brand} for ${o.po}`); }
  else if(kind==='ship'){ const amt=l.packed-l.dispatched; if(amt<=0.5)return; l.dispatched+=amt; l.delivered+=amt; l.dispatchDate=l.dispatchDate||TODAY.toISOString().slice(0,10); l.deliveredDate=TODAY.toISOString().slice(0,10);
    state.shipments.unshift({po:o.po,brand:l.brand,kg:amt,dispatch:TODAY.toISOString().slice(0,10),delivered:TODAY.toISOString().slice(0,10),warehouse:state.warehouses[0],by:state.role});
    logAction(`Shipped ${fmt(amt)} Kg/L of ${l.brand} for ${o.po}`+(l.dispatched>=l.ordered-0.001?' → product CLOSED':'')); }
}
function doLineStage(oid,lid,kind){ const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid);
  const wasClosed=o.lines.every(x=>lineStage(o,x)==='Delivered'); advanceLine(o,l,kind);
  if(!wasClosed && o.lines.every(x=>lineStage(o,x)==='Delivered')) logAction(`PO ${o.po} fully shipped → CLOSED`);
  save(); openOrder(oid); render(); }
function doStage(oid,kind){ const o=state.orders.find(x=>x.id===oid);
  const wasClosed=o.lines.every(x=>lineStage(o,x)==='Delivered'); o.lines.forEach(l=>advanceLine(o,l,kind));
  if(!wasClosed && o.lines.every(x=>lineStage(o,x)==='Delivered')) logAction(`PO ${o.po} fully shipped → CLOSED`);
  save(); render(); }
function setLineCommitted(oid,lid,v){ const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid);
  l.committed=v; logAction(`Set committed date for ${l.brand} on ${o.po} → ${v}`); save(); openOrder(oid); render(); }
function raiseProc(id){ const o=state.orders.find(x=>x.id===id); o.rmDecision='procuring';
  if(!state.rmRequests.find(r=>r.orderId===id)) state.rmRequests.unshift({id:'R'+state.seq++,orderId:id,po:o.po,short:rmCheck(o).short,status:'raised',ts:new Date().toISOString()});
  logAction(`Raised RM procurement for ${o.po}`); save(); openOrder(id); render(); }
function markRMok(id){ const o=state.orders.find(x=>x.id===id); o.rmDecision='ok'; logAction(`Marked RM arranged for ${o.po}`); save(); openOrder(id); render(); }
function rmReceived(id){ const o=state.orders.find(x=>x.id===id); const r=rmCheck(o);
  r.short.forEach(s=>{ const add=Math.ceil(s.gap); state.rawStock[s.rm]=(state.rawStock[s.rm]??0)+add; (state.rmMovements=state.rmMovements||[]).unshift({date:TODAY.toISOString().slice(0,10),mat:s.rm,kg:add,type:'received',by:state.role,note:'procurement for '+o.po}); });
  o.rmDecision='received'; const req=state.rmRequests.find(x=>x.orderId===id); if(req)req.status='received';
  logAction(`CFO approved & RM received for ${o.po} — ready to produce`); save(); openOrder(id); render(); }

/* ===================== RM CHECK / RAISE PR (manual) ===================== */
function rmStatusPill(l){ const s=l.rmStatus||'pending'; const m={pending:['Not checked','--mut'],full:['In stock','--green'],partial:['Partial','--amber'],short:['Short — PR raised','--red'],received:['RM received','--green']}; const x=m[s]||m.pending; return pill(x[0],x[1]); }
let rmForm={oid:null,lid:null,status:'full',canMake:'',lines:[]};
function recipePrefill(o,l){ const rec=SEED.baseRecipes[l.base]; if(!rec) return []; const ks=Object.keys(rec); if(!ks.length||ks[0].startsWith('(')) return []; return ks.map(rm=>({rm,kg:Math.round((l.ordered||0)*rec[rm])})); }
function openRMCheck(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid);
  const pre=(l.pr&&l.pr.lines&&l.pr.lines.length)?l.pr.lines.map(x=>({rm:x.rm,kg:x.kg})):recipePrefill(o,l);
  rmForm={oid,lid,status:(l.rmStatus&&l.rmStatus!=='pending'?l.rmStatus:'full'),canMake:l.canMakeKg||'',lines:pre};
  renderRMModal(); $('modalBg').classList.add('open'); }
function closeModal(){ $('modalBg').classList.remove('open'); }
function rmSetStatus(s){ rmForm.status=s; if((s==='partial'||s==='short')&&!rmForm.lines.length){ const o=state.orders.find(x=>x.id===rmForm.oid);const l=o.lines.find(x=>x.id===rmForm.lid); rmForm.lines=recipePrefill(o,l); if(!rmForm.lines.length) rmForm.lines=[{rm:'',kg:''}]; } renderRMModal(); }
function rmAddLine(){ rmForm.lines.push({rm:'',kg:''}); renderRMModal(); }
function rmDelLine(i){ rmForm.lines.splice(i,1); renderRMModal(); }
function rmPrefill(){ const o=state.orders.find(x=>x.id===rmForm.oid);const l=o.lines.find(x=>x.id===rmForm.lid); const p=recipePrefill(o,l); if(p.length) rmForm.lines=p; renderRMModal(); }
function renderRMModal(){ const o=state.orders.find(x=>x.id===rmForm.oid); const l=o.lines.find(x=>x.id===rmForm.lid);
  const rms=[...new Set([...(((typeof SEED!=='undefined'&&SEED.rawMaterials)||[]).map(r=>r.name)), ...Object.keys(state.rawStock||{})])].sort();
  const hasRecipe=(()=>{const r=SEED.baseRecipes[l.base];return r&&!Object.keys(r)[0].startsWith('(');})();
  const seg=`<div class="seg">
    <div class="opt full ${rmForm.status==='full'?'on':''}" onclick="rmSetStatus('full')"><span class="em">✅</span>In stock<span style="display:block;font-weight:500;font-size:10.5px">make full order</span></div>
    <div class="opt partial ${rmForm.status==='partial'?'on':''}" onclick="rmSetStatus('partial')"><span class="em">🟡</span>Partial<span style="display:block;font-weight:500;font-size:10.5px">make some now</span></div>
    <div class="opt short ${rmForm.status==='short'?'on':''}" onclick="rmSetStatus('short')"><span class="em">🔴</span>Short<span style="display:block;font-weight:500;font-size:10.5px">none / not enough</span></div></div>`;
  let body='';
  if(rmForm.status==='partial') body+=`<div class="fld" style="margin:14px 0"><label>How much can you make now? (Kg/L of ${l.brand})</label><input type="number" value="${rmForm.canMake}" oninput="rmForm.canMake=this.value" placeholder="Kg/L" style="max-width:240px"></div>`;
  if(rmForm.status==='partial'||rmForm.status==='short'){
    body+=`<div style="display:flex;align-items:center;margin:14px 0 9px"><b style="font-size:12.5px;color:var(--navy)">Purchase Requisition — raw materials required</b>${hasRecipe?`<button class="ghost sm" style="margin-left:auto" onclick="rmPrefill()">↺ Pre-fill from recipe</button>`:''}</div>`;
    body+=rmForm.lines.map((ln,i)=>`<div class="prline"><select onchange="rmForm.lines[${i}].rm=this.value;renderRMModal()"><option value="">— raw material —</option>${rms.map(r=>`<option ${r===ln.rm?'selected':''}>${r}</option>`).join('')}</select><span class="rmstk">${ln.rm?('have '+fmt(state.rawStock[ln.rm]||0)):''}</span><input type="number" value="${ln.kg}" placeholder="Kg/L req" oninput="rmForm.lines[${i}].kg=this.value"><span class="x" onclick="rmDelLine(${i})">✕</span></div>`).join('');
    body+=`<button class="ghost sm" style="margin-top:4px" onclick="rmAddLine()">+ Add raw material</button>`;
  }
  $('modal').innerHTML=`<div class="mh"><h2>RM Check — ${l.brand}</h2><div class="sub">${o.po} · ${o.client} · ${fmt(l.ordered)} Kg/L to make · base: ${l.base}</div></div>
   <div class="mb">${seg}${body}<div class="muted" style="font-size:11px;margin-top:14px">Recording only — stock balances are not changed here. Actual receipts are handled in Sowaan.</div></div>
   <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="${rmForm.status==='full'?'green':''}" onclick="rmSubmit()">${rmForm.status==='full'?'Confirm — materials ready':'Raise PR'}</button></div>`;
}
function rmSubmit(){ const o=state.orders.find(x=>x.id===rmForm.oid); const l=o.lines.find(x=>x.id===rmForm.lid); const today=TODAY.toISOString().slice(0,10);
  l.rmCheck=today; l.rmStatus=rmForm.status;
  if(rmForm.status==='full'){ l.rmReady=today; l.canMakeKg=null; l.pr=null; logAction(`RM check ${o.po}·${l.brand}: in stock — materials ready`);
    (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'RM Check',po:o.po,brand:l.brand,field:'RM status',old:'',val:'In stock — ready'}); }
  else { const lines=rmForm.lines.filter(x=>x.rm&&+x.kg>0).map(x=>({rm:x.rm,kg:+x.kg}));
    l.prRaised=today; l.pr={lines,by:state.role,date:today}; l.canMakeKg=(rmForm.status==='partial'?(+rmForm.canMake||0):0);
    logAction(`RM check ${o.po}·${l.brand}: ${rmForm.status}${rmForm.status==='partial'?' (can make '+fmt(l.canMakeKg)+' kg)':''} — PR raised, ${lines.length} material(s)`);
    (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'RM Check',po:o.po,brand:l.brand,field:'PR raised',old:'',val:lines.map(x=>x.rm+' '+x.kg+'kg').join(', ')}); }
  save(); closeModal(); openOrder(rmForm.oid); render();
}

<script>
/* ===================== PRODUCTION (PO-centric + to-stock) ===================== */

function logProdStock(){ const base=$('pb_base').value, kg=+$('pb_kg').value, date=($('pb_date')&&$('pb_date').value)||TODAY.toISOString().slice(0,10);

  state.batches.unshift({id:'B'+state.seq++,type:'stock',base,brand:null,producedKg:kg,packedKg:0,date,by:state.role});
  state.productionLog.unshift({date,base,kg,by:state.role}); logAction(`Produced ${fmt(kg)} Kg/L ${base} (bulk base)`); save(); toast('Logged'); render(); }
function logProdPO(){ const oid=$('pp_po').value, lid=$('pp_line').value, kg=+$('pp_kg').value, date=($('pp_date')&&$('pp_date').value)||TODAY.toISOString().slice(0,10);
  if(!oid||!lid||!kg){toast('Pick PO, product and Kg/L');return;}

  const q=Math.min(kg,cap); if(q<=0){toast('Already fully produced');return;}

  state.productionLog.unshift({date,base:l.base,kg:q,by:state.role,po:o.po,brand:l.brand});

/* COO-only: remove a mistaken production entry. Reverses the produced quantity
   (clamped so it never drops below what's already packed) and deletes the log row.
   Logged to the Action Log. Index maps directly to state.productionLog (recent = slice(0,15)). */
function voidProdEntry(i){
  if(state.role!=='COO'){ toast('Only COO can remove entries'); return; }
  const p=state.productionLog[i]; if(!p) return;
  const desc=`${p.date} · ${p.brand?p.brand+' ':''}${p.base||''}${p.po?(' · '+p.po):''} · ${fmt(p.kg)} Kg/L`;
  if(typeof confirm==='function' && !confirm('Remove this production entry?\n\n'+desc+'\n\nThis reverses the produced quantity. It cannot be undone here.')) return;
  if(p.po){
    const o=state.orders.find(x=>x.po===p.po);
    const l=o && (o.lines.find(x=>x.brand===p.brand) || o.lines.find(x=>x.base===p.base) || o.lines[0]);
    if(l){ l.produced=Math.max(l.packed||0,(l.produced||0)-(p.kg||0)); if((l.produced||0) < l.ordered-0.001) l.prodComplete=''; }
  } else {
    const b=(state.batches||[]).find(x=>x.base===p.base && ((x.producedKg||0)-(x.packedKg||0))>0.001) || (state.batches||[]).find(x=>x.base===p.base);
    if(b){ b.producedKg=Math.max(b.packedKg||0,(b.producedKg||0)-(p.kg||0)); }
  }
  state.productionLog.splice(i,1);
  logAction(`COO removed production entry: ${desc}`);
  save(); toast('Entry removed'); render();
}

function openBatch(kind){
  const today=TODAY.toISOString().slice(0,10);
  const fmtRule='2-4 capital letters then 3-9 digits, length 5-11';
  if(kind==='po'){
    const oid=$('pp_po')&&$('pp_po').value, lid=$('pp_line')&&$('pp_line').value;
    const batchNo=(($('nb_batch')&&$('nb_batch').value)||'').trim();
    if(!oid||!lid){toast('Pick PO and product');return;}
    if(!batchNo){toast('Enter a batch number');return;} if(batchTaken(batchNo)){toast('Batch # "'+batchNo+'" already exists — use a unique one.');return;}
    const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid);
    const _bb=(typeof SEED!=='undefined'&&SEED.brandMap&&SEED.brandMap[l.brand]&&SEED.brandMap[l.brand].base)||l.base||l.brand;
    if(_bb && _bb!==l.brand){ toast(l.brand+' is made from base "'+_bb+'" — produce '+_bb+' in Bulk Base, then pack it into '+l.brand+' for this PO.'); return; }
    if(!validateBatchNo(batchNo) && typeof confirm==='function' && !confirm(`Batch number "${batchNo}" doesn't match the usual format (${fmtRule}). Is it correct?`)) return;
    const cap=rmAllows(l); if(cap<=(l.produced||0)+0.001){ toast('No raw material confirmed yet — run RM Check first. (Partial RM lets you make the available qty.)'); return; } const planned=Math.max(0,Math.min(l.ordered-(l.produced||0), cap-(l.produced||0)));
    state.batches.unshift({id:'B'+(state.seq++),batchNo,kind:'po',po:o.po,lineId:l.id,base:l.base,brand:l.brand,plannedKg:planned,producedKg:0,packedKg:0,status:'open',openedDate:today,by:state.role});
    logAction(`Opened PO batch ${batchNo} for ${o.po} · ${l.brand} (planned ${fmt(planned)} Kg/L)`);
  } else {
    const base=$('pb_base')&&$('pb_base').value;
    const batchNo=(($('nb_batch_b')&&$('nb_batch_b').value)||'').trim();
    const planned=+(($('nb_planned')&&$('nb_planned').value))||0;
    if(!base){toast('Pick a base product');return;}
    if(!batchNo){toast('Enter a batch number');return;} if(batchTaken(batchNo)){toast('Batch # "'+batchNo+'" already exists — use a unique one.');return;}
    if(planned<=0){toast('Enter a planned quantity');return;}
    if(!validateBatchNo(batchNo) && typeof confirm==='function' && !confirm(`Batch number "${batchNo}" doesn't match the usual format (${fmtRule}). Is it correct?`)) return;
    state.batches.unshift({id:'B'+(state.seq++),batchNo,kind:'bulk',type:'stock',base,brand:null,plannedKg:planned,producedKg:0,packedKg:0,status:'open',openedDate:today,by:state.role});
    logAction(`Opened bulk batch ${batchNo} for ${base} (planned ${fmt(planned)} Kg/L)`);
  }
  save(); toast('Batch opened'); render();
}

function doPack(){ const b=state.batches.find(x=>x.id===packForm.bid); const rem=b.producedKg-b.packedKg; let kg=Math.min(+packForm.kg||0,rem); const brand=packForm.brand; const d=TODAY.toISOString().slice(0,10);

/* ===================== QC · PRE-SHIPMENT (2-layer gate) ===================== */
function qcLayerPill(layer){ if(!layer) return pill('Pending','--mut'); if(layer.fail) return pill('Failed','--red'); if(layer.pass) return pill('Passed','--green'); return pill('Pending','--mut'); }
function screenQC(){
  const isLab=canEdit(['Lab Rep']), isQA=canEdit(['QA Inspector']), isPM=canEdit(['Plant Manager']), isCOO=state.role==='COO', isSC=canEdit(['Supply Chain']);
  const inQC=[]; state.orders.forEach(o=>o.lines.forEach(l=>{ if((l.produced||0)>0 && !l.deliveredDate) inQC.push({o,l}); }));
  const passed=inQC.filter(x=>x.l.qcPass);
  const failLab=inQC.filter(x=>x.l.qcLab&&x.l.qcLab.fail);
  const failQA=inQC.filter(x=>!(x.l.qcLab&&x.l.qcLab.fail) && x.l.qcPhys&&x.l.qcPhys.fail);
  const awaiting=inQC.filter(x=>!x.l.qcPass && !(x.l.qcLab&&x.l.qcLab.fail) && !(x.l.qcPhys&&x.l.qcPhys.fail));
  const q=l=>`${fmt(l.produced||0)}/${fmt(l.ordered)}`;
  const awRows=awaiting.map(({o,l})=>{ let acts=''; const labDone=l.qcLab&&l.qcLab.pass, physDone=l.qcPhys&&l.qcPhys.pass;
    if(!labDone&&(isLab||isCOO)) acts+=`<button class="sm green" onclick="qcLabPass('${o.id}','${l.id}')">Lab certify ✓</button> <button class="sm ghost" onclick="qcFail('${o.id}','${l.id}','qcLab')">Fail</button> `;
    if(labDone&&!physDone&&(isQA||isCOO)) acts+=`<button class="sm green" onclick="openQAPhys('${o.id}','${l.id}')">Physical inspection…</button> `;
    if(!labDone&&!(isLab||isCOO)) acts='<span class="muted" style="font-size:11px">waiting for Lab Rep</span>';
    else if(labDone&&!physDone&&!(isQA||isCOO)) acts='<span class="muted" style="font-size:11px">waiting for QA Inspector</span>';
    return `<tr><td><b>${o.po}</b></td><td>${l.brand} <span class="muted" style="font-size:11px">${l.base}</span></td><td class="num">${q(l)}</td><td>${qcLayerPill(l.qcLab)}</td><td>${qcLayerPill(l.qcPhys)}</td><td>${acts}</td></tr>`;}).join('');
  const flRows=failLab.map(({o,l})=>`<tr><td><b>${o.po}</b></td><td>${l.brand}</td><td class="num">${q(l)}</td><td><span style="color:var(--red)">${(l.qcLab&&l.qcLab.reason)||'Failed'}</span></td><td>${(isPM||isCOO)?`<button class="sm green" onclick="qcApproveLab('${o.id}','${l.id}')">Approve (deviation)</button> <button class="sm ghost" onclick="qcReworkLab('${o.id}','${l.id}')">Send to rework</button>`:'<span class="muted" style="font-size:11px">waiting for Plant Manager</span>'}</td></tr>`).join('');
  const fqRows=failQA.map(({o,l})=>{const fails=(l.qcPhys&&l.qcPhys.checklist?l.qcPhys.checklist.filter(c=>c.result==='fail').map(c=>c.item).join(', '):((l.qcPhys&&l.qcPhys.reason)||'Failed'));return `<tr><td><b>${o.po}</b></td><td>${l.brand}</td><td class="num">${q(l)}</td><td><span style="color:var(--red)">${fails}</span>${l.reinspections?` <span class="pill" style="background:var(--navy-50);color:var(--navy);font-size:9px">re-insp #${l.reinspections}</span>`:''}</td><td>${(isSC||isCOO)?`<button class="sm" onclick="openQACorrect('${o.id}','${l.id}')">Correct & resubmit</button>`:'<span class="muted" style="font-size:11px">waiting for Supply Chain</span>'}</td></tr>`;}).join('');
  $('view').innerHTML=`
   <div class="banner info"><b>QC gate.</b> Products appear once <b>production starts</b> (partial or full). <b>Lab</b> certifies, then <b>QA</b> inspects. <b>Lab fail → Plant Manager</b> (approve or rework); <b>QA fail → Supply Chain</b> (correct &amp; resubmit). Nothing ships until QC passes.</div>
   ${(isLab||isQA||isPM||isCOO)?'':`<div class="banner warn">Viewing only — QC is owned by Lab Rep, QA Inspector &amp; Plant Manager.</div>`}
   <div class="card"><h3>Awaiting QC <span class="hint">${awaiting.length}</span></h3>${awaiting.length?`<div style="overflow:auto"><table><thead><tr><th>PO</th><th>Product</th><th class="num">Produced</th><th>Lab</th><th>QA</th><th style="width:260px">Action</th></tr></thead><tbody>${awRows}</tbody></table></div>`:'<div class="muted">Nothing awaiting QC.</div>'}</div>
   ${failLab.length?`<div class="card"><h3 style="color:var(--red)">Lab QC failed — Plant Manager action <span class="hint">${failLab.length}</span></h3><div style="overflow:auto"><table><thead><tr><th>PO</th><th>Product</th><th class="num">Produced</th><th>Reason</th><th style="width:320px">Action</th></tr></thead><tbody>${flRows}</tbody></table></div></div>`:''}
   ${failQA.length?`<div class="card"><h3 style="color:var(--red)">QA failed — Supply Chain to correct <span class="hint">${failQA.length}</span></h3><div style="overflow:auto"><table><thead><tr><th>PO</th><th>Product</th><th class="num">Produced</th><th>Failed items</th><th style="width:200px">Action</th></tr></thead><tbody>${fqRows}</tbody></table></div></div>`:''}
   <div class="card"><h3>QC passed — ready to ship <span class="hint">${passed.length}</span></h3>${passed.length?`<div style="overflow:auto"><table><thead><tr><th>PO</th><th>Product</th><th class="num">Qty</th><th>Lab by</th><th>QA by</th><th>QC date</th></tr></thead><tbody>${passed.map(({o,l})=>`<tr><td><b>${o.po}</b></td><td>${l.brand}</td><td class="num">${fmt(l.ordered)}</td><td class="muted">${l.qcLab&&l.qcLab.by||'—'}</td><td class="muted">${l.qcPhys&&l.qcPhys.by||'—'}</td><td class="muted">${l.qcPass||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">None passed yet.</div>'}</div>`;
}

function qcLabPass(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); l.qcLab={pass:true,by:state.role,date:TODAY.toISOString().slice(0,10)}; qcAudit(o,l,'Lab certified','Passed'); logAction(`Lab certified ${o.po} · ${l.brand}`); qcCheckBoth(o,l); save(); render(); }

function qcApproveLab(oid,lid){ if(!(state.role==='Plant Manager'||state.role==='COO')){toast('Plant Manager only');return;} const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); if(!(l.qcLab&&l.qcLab.fail))return; const prev=l.qcLab.reason||''; l.qcLab={pass:true,by:state.role,date:TODAY.toISOString().slice(0,10),deviation:true,note:prev}; qcAudit(o,l,'Lab QC deviation approved',prev); logAction(`Lab QC deviation APPROVED by ${state.role}: ${o.po} · ${l.brand}`); qcCheckBoth(o,l); save(); toast('Deviation approved'); render(); }

  $('modalBg').classList.add('open'); }

const QC_CHECKLIST=['Packaging intact & correct','Label / artwork correct','Net weight / count verified','Seal & closure OK','Cleanliness — no contamination','Batch & expiry printed','No leakage / damage','Pallet / loading condition'];

function openQAPhys(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); if(!(l.qcLab&&l.qcLab.pass)){toast('Lab must certify first');return;} qaForm={oid,lid,marks:QC_CHECKLIST.map(()=>''),comments:''}; renderQAPhys(); $('modalBg').classList.add('open'); }
function qaSet(idx,v){ qaForm.marks[idx]=v; renderQAPhys(); }

  $('modal').innerHTML=`<div class="mh"><h2>Physical pre-shipment inspection</h2><div class="sub">${o.po} · ${l.brand} · ${fmt(l.ordered)} Kg/L · inspector ${state.role}</div></div>

   <div class="fld" style="margin-top:13px"><label>Comments / observations</label><textarea rows="2" style="width:100%;font-family:inherit" oninput="qaForm.comments=this.value" placeholder="Optional notes...">${qaForm.comments}</textarea></div></div>
   <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="green" onclick="submitQAPhys()">Submit inspection</button></div>`; }
function submitQAPhys(){ const o=state.orders.find(x=>x.id===qaForm.oid); const l=o.lines.find(x=>x.id===qaForm.lid);

/* ===================== INSTRUCTIONS ===================== */
/* ===================== PHASE 2: Approvals & Actions (per-role worklist) ===================== */
function rmAllows(l){
  if(l.rmReady || l.rmStatus==='full' || l.rmStatus==='received') return l.ordered||0;
  if(l.rmStatus==='partial') return l.canMakeKg||0;
  return 0;
}
function ackOrder(oid){ const o=state.orders.find(x=>x.id===oid); if(!o)return; o.acknowledged=true; o.ackDate=TODAY.toISOString().slice(0,10); o.ackBy=state.role; logAction(`PO ${o.po} acknowledged by ${state.role}`); save(); toast('Acknowledged'); render(); }
function cfoApprove(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o&&o.lines.find(x=>x.id===lid); if(!l)return; l.cfoApproved=TODAY.toISOString().slice(0,10); logAction(`CFO approved PR — ${o.po} · ${l.brand}`); save(); toast('PR approved'); render(); }
let closePRForm={oid:null,lid:null,date:'',grn:''};
function openClosePR(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o&&o.lines.find(x=>x.id===lid); if(!l)return; closePRForm={oid,lid,date:TODAY.toISOString().slice(0,10),grn:''};
  $('modal').innerHTML=`<div class="mh"><h2>Close PR — RM received</h2><div class="sub">${o.po} · ${l.brand}</div></div><div class="mb"><div class="formgrid" style="grid-template-columns:1fr 1fr"><div class="fld"><label>RM received date</label><input type="date" value="${closePRForm.date}" onchange="closePRForm.date=this.value"></div><div class="fld"><label>GRN #</label><input type="text" value="${closePRForm.grn}" oninput="closePRForm.grn=this.value" placeholder="GRN number"></div></div><div class="muted" style="font-size:11px;margin-top:8px">Marks raw material received and closes the PR (RM Ready). Production for the full quantity unlocks.</div></div><div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="green" onclick="submitClosePR()">Mark RM received</button></div>`;
  $('modalBg').classList.add('open'); }
function submitClosePR(){ const o=state.orders.find(x=>x.id===closePRForm.oid); const l=o&&o.lines.find(x=>x.id===closePRForm.lid); if(!l)return; if(!(closePRForm.grn||'').trim()){toast('Enter GRN #');return;} const d=closePRForm.date||TODAY.toISOString().slice(0,10); l.rmReceivedDate=d; l.grn=(closePRForm.grn||'').trim(); l.rmReady=d; l.rmStatus='received'; logAction(`RM received (GRN ${l.grn}) — ${o.po} · ${l.brand}; PR closed`); save(); closeModal(); toast('RM received — PR closed'); render(); }
function gotoScreen(sc){ state.screen=sc; render(); }
function actionItems(){
  const items=[];
  (state.orders||[]).forEach(o=>{
    const bk=orderBucket(o); const od=isOverdue(o);
    o.lines.forEach(l=>{
      const lb=lineBucket(o,l);
      if(lb==='Delivered') return;
      if(!o.acknowledged && (bk==='PO Created'||bk==='RM Check')) items.push({role:'Supply Chain',o,l,what:'Acknowledge PO received',act:`ackOrder('${o.id}')`,label:'Acknowledge'});
      if(o.acknowledged && (!l.rmStatus||l.rmStatus==='pending')) items.push({role:'Supply Chain',o,l,what:'Run RM Check',act:`openRMCheck('${o.id}','${l.id}')`,label:'RM Check'});
      if(l.prRaised && !l.cfoApproved) items.push({role:'CFO',o,l,what:'Approve PR',act:`cfoApprove('${o.id}','${l.id}')`,label:'Approve'});
      if(l.prRaised && !l.rmReady && l.rmStatus!=='received') items.push({role:'Supply Chain',o,l,what:'Close PR — record RM received + GRN',act:`openClosePR('${o.id}','${l.id}')`,label:'Close PR'});
      if(rmAllows(l)>0 && (l.produced||0) < Math.min(l.ordered, rmAllows(l))-0.5) items.push({role:'Production',o,l,what:'Produce (RM available)',act:"gotoScreen('prod')",label:'Open Production'});
      if((l.produced||0)>0 && !(l.qcLab&&l.qcLab.pass) && !(l.qcLab&&l.qcLab.fail)) items.push({role:'Lab Rep',o,l,what:'Lab certify (QC)',act:"gotoScreen('qc')",label:'Open QC'});
      if(l.qcLab&&l.qcLab.pass && !(l.qcPhys&&l.qcPhys.pass) && !(l.qcPhys&&l.qcPhys.fail)) items.push({role:'QA Inspector',o,l,what:'QA pre-shipment inspection',act:"gotoScreen('qc')",label:'Open QC'});
      if(l.qcLab&&l.qcLab.fail) items.push({role:'Plant Manager',o,l,what:'Lab QC failed — approve or rework',act:"gotoScreen('qc')",label:'Open QC'});
      if(l.qcPhys&&l.qcPhys.fail) items.push({role:'Supply Chain',o,l,what:'QA failed — correct & resubmit'+(l.reinspections?(' (re-insp #'+l.reinspections+')'):''),act:`openQACorrect('${o.id}','${l.id}')`,label:'Correct'});
      if(l.qcPass && (l.dispatched||0)<(l.packed||0)-0.5) items.push({role:'Supply Chain',o,l,what:'Record shipment',act:"gotoScreen('ship')",label:'Open Shipments'});
      if(od && !l.delayReason) items.push({role:'Plant Manager',o,l,what:'Add delay reason',act:`openOrder('${o.id}')`,label:'Add reason'});
    });
  });
  return items;
}
function screenApprovals(){
  const isCOO=state.role==='COO';
  const all=actionItems();
  const mine = isCOO ? all : all.filter(x=>x.role===state.role);

let charts={}; let _dash=null;
let dashCycExpand=-1;
const CYCSTEPS=[['PO → SO','received','soCreated'],['SO → PR','soCreated','prRaised'],['PR → RM ready','prRaised','rmReady'],['RM → Production','rmReady','prodStart'],['Production','prodStart','prodComplete'],['Production → QC','prodComplete','qcPass'],['QC → Dispatch','qcPass','dispatchDate'],['Dispatch → Delivered','dispatchDate','deliveredDate']];
function cycField(o,l,f){ return f==='received'?o.received:l[f]; }
function cycCol(d){ if(d==null)return '#cdd6e4'; if(d<=2)return 'var(--green)'; if(d<=5)return 'var(--blue)'; if(d<=10)return 'var(--amber)'; return 'var(--red)'; }
function dashCycle(){
  const rows=CYCSTEPS.map(([name,a,b])=>{ const s=[]; state.orders.forEach(o=>o.lines.forEach(l=>{const d=dts(cycField(o,l,a),cycField(o,l,b)); if(d!=null&&d>=0)s.push({po:o.po,brand:l.brand,d});}));
    const avg=s.length?s.reduce((x,y)=>x+y.d,0)/s.length:null; s.sort((x,y)=>y.d-x.d); return {name,avg,n:s.length,slow:s.slice(0,6)}; });
  const totS=[]; state.orders.forEach(o=>o.lines.forEach(l=>{const d=dts(o.received,l.deliveredDate); if(d!=null&&d>=0)totS.push(d);}));
  const totAvg=totS.length?Math.round(totS.reduce((a,b)=>a+b,0)/totS.length):null;
  const maxAvg=Math.max(1,...rows.map(r=>r.avg||0));
  const shownCyc=rows.filter(r=>r.n>0); const hiddenCyc=rows.length-shownCyc.length; const pipe=shownCyc.length?`<div class="cycpipe">${rows.map((r,i)=> r.n>0 ? `<div class="cycseg ${dashCycExpand===i?'on':''}" onclick="dashCycExpand=(dashCycExpand===${i}?-1:${i});render()"><div class="cyc-d" style="color:${cycCol(r.avg)}">${Math.round(r.avg)+'d'}</div><div class="cyc-n">${r.name}</div><div class="cyc-c">${r.n} PO${r.n===1?'':'s'}</div><div class="cyc-bar"><i style="width:${Math.round(r.avg/maxAvg*100)}%;background:${cycCol(r.avg)}"></i></div></div>` : '').join('')}</div>${hiddenCyc?`<div class="muted" style="font-size:11px;margin-top:9px">${hiddenCyc} step(s) hidden — no dates recorded yet; they appear as teams enter them.</div>`:''}`:'<div class="empty"><div class="ei">—</div>No step timings recorded yet. They build up as teams enter dates.</div>';
  const r=dashCycExpand>=0?rows[dashCycExpand]:null;
  const exp=r?`<div class="card" style="background:var(--panel2)"><h3>Slowest at: ${r.name} <span class="hint">${r.n} measured</span></h3>${r.slow.length?`<div style="overflow:auto"><table><thead><tr><th>PO</th><th>Product</th><th class="num">Days at this step</th></tr></thead><tbody>${r.slow.map(s=>`<tr><td><b>${s.po}</b></td><td>${s.brand}</td><td class="num"><b style="color:${cycCol(s.d)}">${s.d}d</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted" style="font-size:12.5px">No dates recorded for this step yet — it fills in as teams enter their dates.</div>'}</div>`:'';
  return `<div class="card"><h3>Process cycle time — where orders spend time <span class="hint">avg days per step · tap a step to see the slowest POs</span></h3>
    <div style="font-size:12.5px;color:var(--mut);margin-bottom:13px">Whole journey <b>PO → Delivered</b>: <b style="color:var(--navy);font-size:16px">${totAvg==null?'—':totAvg+' days'}</b> <span class="muted">avg across ${totS.length} delivered</span>. <span style="color:var(--green);font-weight:700">■</span> fast &nbsp; <span style="color:var(--blue);font-weight:700">■</span> ok &nbsp; <span style="color:var(--amber);font-weight:700">■</span> watch &nbsp; <span style="color:var(--red);font-weight:700">■</span> delay point. Each step shows only where both dates are recorded.</div>
    ${pipe}</div>${exp}`;
}
let dashPeriod='month', dashFrom='', dashTo='', dashCmp='client';
function periodWin(){ const T=TODAY; let s,e=new Date(T.getFullYear(),T.getMonth(),T.getDate());
  if(dashPeriod==='week'){ s=new Date(e); s.setDate(e.getDate()-6); }
  else if(dashPeriod==='month'){ s=new Date(T.getFullYear(),T.getMonth(),1); }

function prevWin(){ const T=TODAY;
  if(dashPeriod==='month'){ return {s:new Date(T.getFullYear(),T.getMonth()-1,1), e:new Date(T.getFullYear(),T.getMonth(),0)}; }
  if(dashPeriod==='week'){ const w=periodWin(); const e=new Date(w.s); e.setDate(e.getDate()-1); const s=new Date(e); s.setDate(e.getDate()-6); return {s,e}; }
  if(dashPeriod==='custom'){ const w=periodWin(); const len=w.e-w.s; const e=new Date(w.s.getTime()-86400000); return {s:new Date(e.getTime()-len), e}; }
  return null;
}
function inWin(ds,w){ if(!ds||!w)return false; const d=new Date(ds); return d>=w.s && d<=new Date(w.e.getFullYear(),w.e.getMonth(),w.e.getDate(),23,59,59); }
function periodTot(w){ let prod=0,pack=0,ship=0;
  (state.productionLog||[]).forEach(p=>{if(inWin(p.date,w))prod+=p.kg||0;});
  (state.packingLog||[]).forEach(p=>{if(inWin(p.date,w))pack+=p.kg||0;});
  (state.shipments||[]).forEach(s=>{if(inWin(s.dispatch,w))ship+=s.kg||0;});
  return {prod,pack,ship};
}

/* ---- Explorer (pivot) ---- */
function rpPivot(){ const rows={},cols=new Set(),poSets={};
  rpLines().forEach(({o,l})=>{ const r=rpDimVal(rpDim,o,l); const c=rpCol==='none'?'Total':rpDimVal(rpCol,o,l); cols.add(c);
    rows[r]=rows[r]||{}; if(rpMeas==='pos'){ poSets[r]=poSets[r]||{}; poSets[r][c]=poSets[r][c]||new Set(); poSets[r][c].add(o.po); } else rows[r][c]=(rows[r][c]||0)+rpMeasVal(rpMeas,o,l); });
  if(rpMeas==='pos'){ Object.keys(poSets).forEach(r=>{ rows[r]={}; Object.keys(poSets[r]).forEach(c=>rows[r][c]=poSets[r][c].size); }); }
  return {rows,cols:[...cols].sort()};
}
let _rpLast={labels:[],data:[]};
function rpExplorer(){
  const {rows,cols}=rpPivot(); const rkeys=Object.keys(rows).sort((a,b)=>{ const ta=cols.reduce((s,c)=>s+(rows[a][c]||0),0), tb=cols.reduce((s,c)=>s+(rows[b][c]||0),0); return tb-ta; });
  const rowTot=r=>cols.reduce((s,c)=>s+(rows[r][c]||0),0); const colTot=c=>rkeys.reduce((s,r)=>s+(rows[r][c]||0),0); const grand=rkeys.reduce((s,r)=>s+rowTot(r),0);
  _rpLast={labels:rkeys.slice(0,14),data:rkeys.slice(0,14).map(rowTot)};

    <div class="fld" style="min-width:170px"><label>Group rows by</label><select onchange="rpDim=this.value;screenReports()">${Object.entries(RP_DIMS).map(([k,v])=>`<option value="${k}" ${k===rpDim?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="fld" style="min-width:170px"><label>Split columns by</label><select onchange="rpCol=this.value;screenReports()"><option value="none" ${rpCol==='none'?'selected':''}>— none —</option>${Object.entries(RP_DIMS).map(([k,v])=>`<option value="${k}" ${k===rpCol?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="fld" style="min-width:180px"><label>Measure</label><select onchange="rpMeas=this.value;screenReports()">${Object.entries(RP_MEAS).map(([k,v])=>`<option value="${k}" ${k===rpMeas?'selected':''}>${v}</option>`).join('')}</select></div>
  </div></div>`;
  if(!rkeys.length) return ctrl+rpEmpty('No data for this selection. Adjust the filters or add orders.');
  const isCount=(rpMeas==='pos'||rpMeas==='lines'); const f=v=>isCount?(v||0).toLocaleString():fmt(v||0);
  const table=`<div class="card"><h3>${RP_DIMS[rpDim]} × ${RP_MEAS[rpMeas]}${rpCol!=='none'?' — split by '+RP_DIMS[rpCol]:''} <span class="hint">${rkeys.length} rows · total ${f(grand)}</span></h3>
   <div style="overflow:auto"><table><thead><tr><th>${RP_DIMS[rpDim]}</th>${cols.map(c=>`<th class="num">${c}</th>`).join('')}${rpCol!=='none'?'<th class="num">Total</th>':''}</tr></thead>
   <tbody>${rkeys.map(r=>`<tr><td><b>${r}</b></td>${cols.map(c=>`<td class="num">${f(rows[r][c]||0)}</td>`).join('')}${rpCol!=='none'?`<td class="num"><b>${f(rowTot(r))}</b></td>`:''}</tr>`).join('')}</tbody>
   <tfoot><tr><td><b>Total</b></td>${cols.map(c=>`<td class="num"><b>${f(colTot(c))}</b></td>`).join('')}${rpCol!=='none'?`<td class="num"><b>${f(grand)}</b></td>`:''}</tr></tfoot></table></div></div>`;

/* ---- Production ---- */
function rpProduction(){ const log=(state.productionLog||[]).filter(p=>!rpfMonth||(p.date||'').slice(0,7)===rpfMonth); const pack=(state.packingLog||[]).filter(p=>!rpfMonth||(p.date||'').slice(0,7)===rpfMonth);
