<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAN Order Control Tower</title>
<!-- VAN build: 2026-06-04 first-push test -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f3f6f1; --panel:#ffffff; --panel2:#f1f5ef; --line:#e3e9e3; --line2:#eef2ec;
  --navy:#1f7a43; --navy2:#155e32; --navy-50:#e7f3ea; --navy-100:#cfe6d5;
  --green:#1f9a4f; --green2:#15803d; --leaf:#74b53a; --green-50:#e9f6ec;
  --teal:#0e9aa7; --amber:#b07208; --amber-50:#fbf0d8; --red:#c0392b; --red-50:#fbecec;
  --blue:#1f7a43; --purple:#7a6cc0;
  --txt:#16231b; --txt2:#46584c; --mut:#7d8c82;
  --head:'Space Grotesk','Inter',system-ui,sans-serif;
  --radius:15px; --radius-sm:10px;
  --sh-sm:0 1px 2px rgba(15,23,42,.07),0 1px 1px rgba(15,23,42,.04);
  --sh:0 3px 12px rgba(15,23,42,.10),0 1px 3px rgba(15,23,42,.06);
  --sh-lg:0 20px 50px rgba(15,23,42,.20);
  --ring:0 0 0 3px rgba(31,122,67,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
h1,h2,h3{margin:0;letter-spacing:-.02em;font-family:var(--head)}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d6deea;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#c2cdde}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:238px;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 15px;border-bottom:1px solid var(--line2);margin-bottom:12px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--leaf),var(--navy));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(31,122,67,.28)}
.brand .nm{font-size:15.5px;font-weight:700;color:var(--txt);line-height:1.05;letter-spacing:-.02em;font-family:var(--head)}
.brand .nm span{display:block;font-size:9px;font-weight:700;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--txt2);cursor:pointer;font-size:13px;font-weight:600;transition:.13s;position:relative}
.nav a:hover{background:var(--panel2);color:var(--txt)}
.nav a.active{background:var(--navy-50);color:var(--navy);font-weight:700}
.nav a.active::before{content:'';position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--navy)}
.nav a .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--mut)}
.nav a.active .ic{color:var(--navy)}
.nav a .ic svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav a .lk{margin-left:auto;font-size:8.5px;color:var(--navy);background:#fff;border:1px solid var(--navy-100);border-radius:6px;padding:1px 6px;font-weight:700;letter-spacing:.3px}
.side .foot{padding-top:12px;border-top:1px solid var(--line2);margin-top:8px}
/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 24px;background:#ffffff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h2{font-size:18px;font-weight:800;color:var(--txt);letter-spacing:-.025em}
.topbar .sub{font-size:11.5px;color:var(--mut);margin-top:2px;font-weight:500}
.rolebox{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 5px;box-shadow:var(--sh-sm)}
.rolebox label{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.rolebox .av{width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}
.helpbar{display:flex;align-items:center;gap:9px;padding:7px 24px;background:var(--navy-50);border-bottom:1px solid var(--navy-100);color:#155e32;font-size:12px;line-height:1.45;font-weight:500}
.helpbar:empty{display:none}
.helpbar::before{content:'';flex-shrink:0;width:15px;height:15px;background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231f7a43' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><line x1='12' y1='16' x2='12' y2='12'/><line x1='12' y1='8' x2='12.01' y2='8'/></svg>")}
.helpbar b{font-weight:700;color:var(--navy)}
.wrap{padding:18px 24px;flex:1;max-width:1440px;margin:0 auto;width:100%}
/* ---------- controls ---------- */
select,input,button,textarea{font-family:inherit}
select,input[type=text],input[type=number],input[type=date],textarea{background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;outline:none;transition:.14s}
select:hover,input:hover{border-color:#d3dceb}
select:focus,input:focus,textarea:focus{border-color:var(--navy);box-shadow:var(--ring)}
.rolebox select{background:transparent;border:none;padding:6px 6px;font-weight:700;color:var(--navy)}
.rolebox select:focus{box-shadow:none}
button{background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 17px;font-size:13px;font-weight:700;cursor:pointer;transition:.14s;box-shadow:var(--sh-sm);letter-spacing:-.01em}
button:hover{background:var(--navy2);transform:translateY(-1px);box-shadow:var(--sh)}
button:active{transform:translateY(0)}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
button.ghost:hover{background:var(--panel2);border-color:#d3dceb}
button.green{background:var(--green)}button.green:hover{background:var(--green2)}
button.sm{padding:7px 12px;font-size:12px;border-radius:9px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
/* ---------- cards & kpis ---------- */
.row{display:flex;gap:14px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.dgrid .card{margin:0}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh-sm)}
.card h3{font-size:14px;margin-bottom:14px;color:var(--txt);font-weight:700;display:flex;align-items:center;letter-spacing:-.02em}
.card h3 .hint{font-weight:500;color:var(--mut);font-size:11.5px;margin-left:auto}
.acard{padding:0;overflow:hidden}
.acard>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:11px;font-size:14px;font-weight:700;color:var(--txt);letter-spacing:-.02em;user-select:none}
.acard>summary::-webkit-details-marker{display:none}
.acard>summary::before{content:"\203A";display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:7px;background:var(--navy-50);color:var(--navy);font-size:18px;font-weight:800;line-height:1;transition:transform .15s,background .15s,color .15s;flex:none}
.acard[open]>summary::before{transform:rotate(90deg);background:var(--navy);color:#fff}
.acard>summary:hover{background:var(--navy-50)}
.acard>summary:hover::before{background:var(--navy-100)}
.acard[open]>summary:hover::before{background:var(--navy2)}
.acard>summary .hint{font-weight:500;color:var(--mut);font-size:11.5px;margin-left:auto}
.acard>summary::after{content:"Show";flex:none;font-size:10px;font-weight:800;color:var(--navy);background:var(--navy-50);border:1px solid var(--navy-100);border-radius:999px;padding:3px 11px;text-transform:uppercase;letter-spacing:.5px}
.acard[open]>summary::after{content:"Hide";background:var(--navy);color:#fff;border-color:var(--navy)}
.acard[open]>summary{border-bottom:1px solid var(--line)}
.acard>.acard-body{padding:14px 18px 16px}
.acard .acard-body table td,.acard .acard-body table th{padding:5px 8px}
.acard .acard-body input,.acard .acard-body select{padding:5px 8px;font-size:12px}
.acard .acard-body input.num{width:120px}
.sec{font-size:12.5px;font-weight:700;color:var(--navy);letter-spacing:.4px;margin:20px 2px 9px;padding-bottom:6px;border-bottom:2px solid var(--navy-100);font-family:var(--head)}
.subh{font-size:13px;font-weight:600;margin:10px 0 8px;color:var(--navy);letter-spacing:-.01em;font-family:var(--head)}
.viewonly{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#8a5712;background:var(--amber-50);border:1px solid #f0d6a8;border-radius:999px;padding:4px 13px;margin-bottom:12px}
/* ---- compact density mode (topbar toggle) ---- */
.app.compact .wrap{padding:12px 18px}
.app.compact .card{padding:11px 14px;margin-bottom:10px}
.app.compact .acard>summary{padding:9px 14px}
.app.compact .acard>.acard-body{padding:10px 14px 12px}
.app.compact .card h3{margin-bottom:10px}
.app.compact .kpis{gap:9px;margin-bottom:10px}
.app.compact .kpi{padding:9px 11px}
.app.compact .kpi .v{font-size:19px}
.app.compact table{font-size:11.5px}
.app.compact th{padding:6px 8px}
.app.compact td{padding:5px 8px}
.app.compact .banner{padding:7px 12px;margin-bottom:9px}
/* ---- official artifact (COA) prints clean — no on-screen toolbar ---- */
@media print{#coaFS .cofbar{display:none!important}}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;transition:.16s}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--navy),var(--leaf))}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kpi .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.kpi .v{font-size:23px;font-weight:700;margin-top:5px;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;font-family:var(--head)}
.kpi .d{font-size:10.5px;color:var(--mut);margin-top:6px;font-weight:500}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#475569;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel2);z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;color:var(--txt2)}
td b,td>b{color:var(--txt)}
tr.clk{cursor:pointer;transition:.1s}
tr.clk:hover td{background:var(--navy-50)}
.empty{text-align:center;padding:30px 18px;color:var(--mut);font-size:12.5px}
.empty .ei{width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:#94a3b8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}
th.num{text-align:right}th.ctr{text-align:center}
.muted{color:var(--mut)}
.barmini{height:7px;background:#eaeef5;border-radius:6px;overflow:hidden;min-width:60px;display:inline-block;vertical-align:middle}
.barmini>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--leaf));border-radius:6px}
.pill{padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block;letter-spacing:.1px;box-shadow:inset 0 0 0 1px rgba(15,23,42,.04)}
.tag{font-size:9.5px;color:var(--navy);border:1px solid var(--navy-100);background:var(--navy-50);border-radius:6px;padding:1px 7px;font-weight:700;text-transform:none;letter-spacing:0}
.tag2{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
/* ---------- banners ---------- */
.banner{border-radius:11px;padding:9px 14px;margin-bottom:13px;font-size:12px;line-height:1.5;border:1px solid var(--line);font-weight:500}
.banner.info{background:linear-gradient(90deg,var(--navy-50),#f1f8f3);border-color:var(--navy-100);color:#1f5e36}
.banner.warn{background:var(--amber-50);border-color:#f0d6a8;color:#8a5712}
.banner b{font-weight:700}
/* ---------- forms ---------- */
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld select,.fld input,.fld textarea{width:100%;min-width:0;box-sizing:border-box}
.fld select{text-overflow:ellipsis}
.fld label{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
/* ---------- PO parent / SKU rows ---------- */
tr.po-row>td{border-top:1px solid var(--line);font-weight:600;background:#fff}
tr.po-row:hover>td{background:var(--navy-50);cursor:pointer}
tr.po-row.exp>td{background:var(--navy-50)}
tr.sku-row>td{background:var(--panel2);font-size:12px;color:var(--txt2);border-bottom:1px solid var(--line2)}
tr.sku-row:hover>td{background:#eaf4ec;cursor:pointer}
td.skufirst{padding-left:10px;box-shadow:inset 3px 0 0 var(--navy)}
.skuarrow{color:var(--navy);opacity:.5;margin-right:5px}
.chev{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:6px;background:var(--navy-50);color:var(--navy);font-size:10px;transition:.12s}
.po-row:hover .chev{background:var(--navy-100)}
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.fixedtbl{table-layout:fixed}
.fixedtbl td,.fixedtbl th{overflow:hidden;text-overflow:ellipsis}
.tscroll{overflow:auto;max-width:100%}
.fixedtbl input,.fixedtbl select{width:100%;padding:7px 8px}
/* ---------- drawer ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(17,30,66,.42);display:none;z-index:50;backdrop-filter:blur(2px)}
.drawer-bg.open{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;height:100vh;width:1060px;max-width:97vw;background:var(--bg);border-left:1px solid var(--line);overflow:auto;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-lg);z-index:51}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);z-index:2}
.drawer .dh h2{color:var(--navy);font-size:17px}
.drawer .db{padding:22px 24px}
/* ---------- lifecycle field grid ---------- */
.ff{display:flex;flex-direction:column;gap:4px}
.ff label{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;font-weight:700;display:flex;gap:5px;align-items:center}
.ff .lk2{font-size:8px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;text-transform:none;letter-spacing:0;font-weight:600}
.ff input,.ff select{padding:7px 9px;font-size:12px;width:100%;border-radius:9px}
.fval{padding:7px 9px;font-size:12px;border-radius:9px;border:1px solid var(--line);min-height:32px;display:flex;align-items:center}
.f-input{background:#fff8d8;border-color:#e7cf6f}
.f-input:focus{box-shadow:0 0 0 3px rgba(201,154,0,.18)}
.f-done{background:var(--green-50);border-color:#b4e0c2}
.f-auto{background:#eef1f7;color:#6b778c;border-color:#e0e6f0}
.f-plant{background:#ffefdc;border-color:#edca93}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.fgroup{margin-bottom:15px}
.fgroup .gt{font-size:10.5px;font-weight:800;color:var(--navy);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.calcrow{display:flex;flex-wrap:wrap;gap:7px 18px;font-size:11.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-top:10px;box-shadow:var(--sh-sm)}
.calcrow b{color:var(--navy);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:10.5px;color:var(--mut);margin:6px 0 12px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1px solid rgba(0,0,0,.06)}
@media(max-width:760px){.fgrid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}}
.stp .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;background:#e8edf4;color:var(--mut)}
.stp.done .dot{background:var(--green);color:#fff}
.hide{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;border-radius:12px;padding:12px 22px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:.2s;box-shadow:var(--sh-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,30,66,.5);display:none;z-index:60;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex;align-items:center;justify-content:center;animation:fade .18s ease}
.modal{background:#fff;border-radius:16px;width:580px;max-width:95vw;max-height:90vh;overflow:auto;box-shadow:var(--sh-lg)}
.modal.coa{width:920px;max-width:97vw}
.coasheet{border:1.5px solid #111;font-family:"Times New Roman",Georgia,serif;color:#111;font-size:12.5px;background:#fff}
.coasheet .rh{display:flex;border-bottom:1.5px solid #111}
.coasheet .rh .c1{width:96px;border-right:1px solid #111;text-align:center;padding:6px}
.coasheet .rh .c2{flex:1;text-align:center;padding:6px}
.coasheet .rh .c2 h1{margin:0;font-size:16px;color:#0a4b8c;letter-spacing:.4px}
.coasheet .rh .c3{width:150px;border-left:1px solid #111;padding:6px;font-size:10px}
.coasheet .rh .c4{width:104px;border-left:1px solid #111;text-align:center;padding:5px;font-size:8.5px}
.coasheet .types{display:flex;gap:34px;justify-content:center;padding:7px;border-bottom:1px solid #111;font-weight:700;font-size:12px}
.coasheet .iss{padding:5px 12px;border-bottom:1px solid #111}
.coasheet .meta{display:flex;border-bottom:1.5px solid #111}
.coasheet .meta .col{flex:1;padding:6px 12px;min-width:0}
.coasheet .ml{display:flex;align-items:center;gap:6px;margin:3px 0}
.coasheet .ml .lb{white-space:nowrap;font-weight:600;font-size:11.5px}
.coasheet input.sf{border:0;border-bottom:1px solid #999;border-radius:0;background:#fffdf2;font-family:inherit;font-size:12px;padding:1px 4px;flex:1;min-width:30px;outline:none}
.coasheet input.sf:disabled{background:transparent;border-bottom-color:#ccc;color:#111}
.coasheet input.sf.req{background:#ffeeea}
.coasheet table{width:100%;border-collapse:collapse}
.coasheet th,.coasheet td{border:1px solid #999;padding:3px 6px;font-size:11.5px;text-align:left}
.coasheet thead th{background:#f0f0f0;text-align:center}
.coasheet tr.grp td{font-weight:700;background:#fafafa;font-size:10.5px}
.coasheet select{padding:2px 4px;font-size:11px}
.coasheet .disc{padding:7px 12px;border-top:1.5px solid #111;font-size:9px;line-height:1.5}
.coasheet .signs{display:flex;border-top:1.5px solid #111}
.coasheet .signs .sg{flex:1;text-align:center;padding:12px 6px 8px;border-right:1px solid #111}
.coasheet .signs .sg:last-child{border-right:0}

    const bm={},sm={}; (Array.isArray(base)?base:[]).forEach(x=>{ if(x&&x.id!=null) bm[x.id]=x; }); srv.forEach(x=>{ if(x&&x.id!=null) sm[x.id]=x; });
    const seen={}, out=[];
    local.forEach(l=>{ if(l&&l.id!=null){ seen[l.id]=1; const s=sm[l.id]; out.push(s!==undefined?merge3(bm[l.id], l, s):l); } });
    srv.forEach(s=>{ if(s&&s.id!=null && !seen[s.id]) out.push(s); });
    return out;
  }
  if(local&&srv&&typeof local==='object'&&!Array.isArray(local)&&typeof srv==='object'&&!Array.isArray(srv)){
    const out={}, keys={}; [base,local,srv].forEach(o=>{ if(o&&typeof o==='object'&&!Array.isArray(o)) for(const k in o) keys[k]=1; });
    for(const k in keys){ const bv=(base&&typeof base==='object')?base[k]:undefined, lv=local[k], sv=srv[k];
      if(lv===undefined&&sv===undefined) continue;
      if(lv===undefined){ out[k]=sv; continue; }
      if(sv===undefined){ out[k]=lv; continue; }
      out[k]=merge3(bv, lv, sv); }
    return out;
  }
  return _eq(local, base) ? srv : local;   // leaf: we changed it → ours; else take theirs
}
function save(){ if(_saveTimer)clearTimeout(_saveTimer); _saveTimer=setTimeout(saveNow,400); }
async function saveNow(){ if(!_token) return; try{
    const r=await fetch('/api/state',{method:'POST',headers:Object.assign({'Content-Type':'application/json','X-Base-Rev':String(_rev)},authHdr()),body:JSON.stringify(dataOnly(state))});
    if(r.status===401){ setSession('',null); renderApp(); return; }
    if(r.status===409){
      // Someone else saved since we loaded. 3-way merge keeps THEIR edits AND ours
      // (field-level — not just records we added), then re-saves. No work is lost.
      const j=await r.json().catch(()=>null);
      if(j && j.data && j.data.orders){
        const base=_baseSnapshot||dataOnly(state);
        const merged=ensureState(merge3(base, dataOnly(state), j.data));
        const cu=state.currentUser, sc=state.screen, ro=state.role, ex=state.expanded;
        state=merged; state.currentUser=cu; state.role=ro; state.screen=sc; state.expanded=ex||{}; _rev=j.rev; _snapBase();
        const ae=document.activeElement, busy=(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))||($('modalBg')&&$('modalBg').classList.contains('open'));
        if(authed() && !busy) render();
        if(_saveRetries<5){ _saveRetries++; save(); }                 // re-save the merge against the latest rev
        else { _saveRetries=0; toast('Synced with the team’s latest changes.'); }
        return;
      }
      toast('Refreshed — please re-check your last change.');
      return;
    }
    if(r.ok){ const j=await r.json(); if(j&&typeof j.rev==='number') _rev=j.rev; _saveRetries=0; _snapBase(); }
  }catch(e){} }
function hasUnsavedEntry(){ try{ const v=document.getElementById('view'); if(!v) return false;
  const els=v.querySelectorAll('input,textarea,select');
  for(const el of els){ if(el.disabled||el.readOnly) continue; const t=(el.type||'').toLowerCase();
    if(el.tagName==='SELECT'){ if(el.selectedIndex>0) return true; continue; }
    if(t==='checkbox'||t==='radio'){ if(el.checked) return true; continue; }
    if(t==='button'||t==='submit'||t==='hidden'||t==='file') continue;
    if(String(el.value||'').trim()!=='') return true; }
  return false; }catch(e){ return false; } }
function startSync(){ if(_syncOn)return; _syncOn=true; setInterval(async ()=>{
  if(!_token) return;
  if(document.hidden) return;
  const ae=document.activeElement; if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  if(($('modalBg')&&$('modalBg').classList.contains('open'))||($('drawerBg')&&$('drawerBg').classList.contains('open'))) return;

  try{ const r=await fetch('/api/state',{cache:'no-store',headers:authHdr()}); if(r.status===401){ setSession('',null); renderApp(); return; } if(!r.ok) return; const j=await r.json();
    if(typeof j.rev==='number' && j.rev!==_rev && j.data && j.data.orders){

      state=ensureState(j.data); state.currentUser=cu; state.role=ro; state.screen=sc; state.expanded=ex||{};

    }
  }catch(e){}
}, 7000); }


/* ===================== ENGINE A — RM ===================== */
function needFor(order){ // {rm: kg}
  const need={};
  order.lines.forEach(l=>{
    const rec = recipeFor(l.base);
    for(const rm in rec){ need[rm]=(need[rm]||0) + l.ordered*rec[rm]; }
  });
  return need;
}
function rmCheck(order, s){
  s=s||state; const need=needFor(order); const short=[];
  for(const rm in need){ const have=s.rawStock[rm]??0; if(need[rm]>have+0.001) short.push({rm, need:need[rm], have, gap:need[rm]-have}); }
  return { need, short, ok: short.length===0 };
}

/* ===================== ENGINE B — stage/fulfilment ===================== */
const sum=(arr,f)=>arr.reduce((a,x)=>a+f(x),0);
const STAGE_ORDER=['New','RM / Procurement','SO Created','PR Raised','RM Ready','In Production','Produced','QC Passed','Dispatched','Delivered'];
function agg(o){ return { ordered:sum(o.lines,l=>l.ordered), produced:sum(o.lines,l=>l.produced),
  packed:sum(o.lines,l=>l.packed), dispatched:sum(o.lines,l=>l.dispatched), delivered:sum(o.lines,l=>l.delivered) }; }
function lineStage(o,l){
  if(l.deliveredDate && (l.delivered||0)>=l.ordered-0.5) return 'Delivered';
  if(l.dispatchDate||(l.dispatched||0)>0) return 'Dispatched';
  if(l.qcPass) return 'QC Passed';
  if(l.prodComplete) return 'Produced';
  if(l.prodStart) return 'In Production';
  if(l.rmReady) return 'RM Ready';
  if(l.prRaised) return 'PR Raised';
  if(l.soCreated) return 'SO Created';
  return 'New';
}
function stageOf(o){ if(!o.lines||!o.lines.length) return 'New';
  const idx=o.lines.map(l=>STAGE_ORDER.indexOf(lineStage(o,l))); return STAGE_ORDER[Math.min.apply(null,idx)]; }
function lineOverdue(o,l){ return !!l.committed && (l.delivered||0)<l.ordered-0.5 && new Date(l.committed)<TODAY; }
function isOverdue(o){ return o.lines.some(l=>lineOverdue(o,l)); }
function daysOver(o){ const ds=o.lines.filter(l=>lineOverdue(o,l)).map(l=>Math.round((TODAY-new Date(l.committed))/86400000));
  return ds.length?Math.max.apply(null,ds):(o.promised?Math.round((TODAY-new Date(o.promised))/86400000):0); }
const STAGE_COLOR={'New':'--mut','RM / Procurement':'--amber','SO Created':'--blue','PR Raised':'--blue','RM Ready':'--blue','In Production':'--purple','Produced':'--purple','QC Passed':'--leaf','Dispatched':'--green2','Delivered':'--green','Ready to Produce':'--blue','Packed':'--leaf','Closed':'--green'};

const FIELD_OWNER={
  cfoApproved:'CFO',
  prRaised:'Supply Chain', rmCheck:'Supply Chain', rmReady:'Supply Chain',
  prodStart:'Production', prodComplete:'Production',
  delayReason:'Plant Manager', respDept:'Plant Manager',
};

function canEditField(key){ return state.role==='COO' || FIELD_OWNER[key]===state.role; }
/* ---- per-line calculations (read-only) ---- */
function dts(a,b){ if(!a||!b)return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function shipFor(o,l){ return (state.shipments||[]).filter(s=>s.po===o.po && (s.brand===l.brand)); }
function calcLine(o,l){
  const sh=shipFor(o,l);
  const deliveredQty=sh.reduce((a,s)=>a+(s.kg||0),0) || l.dispatched || 0;
  const lastDisp=sh.map(s=>s.dispatch).filter(Boolean).sort().slice(-1)[0]||l.dispatchDate||null;
  const lastDeliv=sh.map(s=>s.delivered).filter(Boolean).sort().slice(-1)[0]||l.deliveredDate||null;
  const totalCycle=dts(o.received, l.deliveredDate);
  const variance = (l.deliveredDate&&l.committed)? dts(l.committed,l.deliveredDate) : null;
  const overdue = lineOverdue(o,l);
  return {
    poToSo:dts(o.received,l.soCreated), rmDays:dts(l.prRaised,l.rmReady),
    prodDays:dts(l.prodStart,l.prodComplete), qcToDeliv:dts(l.qcPass,l.deliveredDate),
    totalCycle, variance,
    onTime: l.deliveredDate ? (variance<=0?'On Time':'Late') : (overdue?'Delayed':'On Track'),
    daysOverdue: overdue? Math.round((TODAY-new Date(l.committed))/86400000) : 0,
    deliveredQty, remaining: Math.max(0,(l.ordered||0)-deliveredQty),
    shipments: sh.length, lastDispatch:lastDisp, lastDelivered:lastDeliv,
  };
}
/* ---- audited field edit ---- */
function editField(oid,lid,key,val){
  const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid);
  if(!canEditField(key)) { toast('Only '+(FIELD_OWNER[key]||'admin')+' can edit this'); return; }
  const old=l[key]; if(String(old||'')===String(val||'')) return;
  l[key]=val;
  state.audit=state.audit||[];
  state.audit.unshift({t:new Date().toISOString(), user:state.role, module:'PO Tracker', po:o.po, brand:l.brand, field:key, old:old||'', val:val||''});
  logAction(`${o.po} · ${l.brand}: set ${key} = ${val||'(cleared)'}`);
  save(); if($('drawerBg')&&$('drawerBg').classList.contains('open')) openOrder(oid); render();
}

function dfSubmitPO(){

  if(!po) return toast('Enter PO #'); if(!client) return toast('Enter customer'); if(!brand) return toast('Enter product/brand'); if(ord<=0) return toast('Enter ordered qty');
  if(state.orders.some(o=>o.po===po)) return toast('A PO with that number already exists');

  const id='O'+(state.seq++);
  state.orders.unshift({id,po,client,channel:dfForm.channel||'White Label',priority:dfForm.priority||'Normal',promised:dfForm.promised||'',received:dfForm.received||'',rmDecision:'pending',recon:true,

function dfSubmitCorrect(){
  const o=state.orders.find(x=>x.id===dfForm.oid); if(!o) return toast('Pick a PO');
  const reason=(($('co_reason')&&$('co_reason').value)||'').trim(); if(!reason) return toast('Reason is required');
  let n=0;
  const setO=(field,val,label)=>{ const old=o[field]||''; val=(val==null?'':val); if(String(old)!==String(val)){ o[field]=val; reconLog(`CORRECT ${o.po} ${label}: ${old||'—'} → ${val||'—'} — ${reason}`); n++; } };
  setO('client',(($('co_client')&&$('co_client').value)||'').trim(),'customer');
  setO('channel',($('co_channel')&&$('co_channel').value),'channel');
  setO('priority',($('co_priority')&&$('co_priority').value),'priority');
  setO('received',($('co_received')&&$('co_received').value),'received date');
  setO('promised',($('co_promised')&&$('co_promised').value),'promised date');
  o.lines.forEach(l=>{ [['ordered','Ordered'],['produced','Produced'],['packed','Packed'],['dispatched','Dispatched'],['delivered','Delivered'],['invoicePrice','Invoice price']].forEach(([field,label])=>{
    const el=$('cl_'+field+'_'+l.id); if(!el) return; const nv=+el.value||0; const old=+l[field]||0;
    if(Math.abs(nv-old)>0.001){ l[field]=nv; reconLog(`CORRECT ${o.po} · ${l.brand} ${label}: ${fmt(old)} → ${fmt(nv)} — ${reason}`); n++; }
  }); });
  // Auto-sync: a line's committed date must not be EARLIER than the PO promised (prevents false 'late' from drifted line dates).
  if(o.promised){ o.lines.forEach(l=>{ const oldc=l.committed||''; if((!l.committed||l.committed<o.promised) && oldc!==o.promised){ l.committed=o.promised; reconLog(`CORRECT ${o.po} · ${l.brand} committed ${oldc||'(blank)'} → ${o.promised} (synced to PO promised) — ${reason}`); n++; } }); }
  if(!n) return toast('No changes to apply');
  save(); toast(n+' correction(s) applied'); dfBack();
}

function genPO(recv){

function previewRM(){

function submitPO(){

  if(typeof confirm==='function' && !confirm('Verify these prices match the client PO:\n\n'+lines.map(l=>{const pk=+l.pack||0;const ip=+l.inv||0;return '- '+l.brand+': PKR '+fmt(ip)+'/Kg'+(pk>0?(' = PKR '+fmt(ip*pk)+'/pack of '+fmt(pk)):'');}).join('\n')+'\n\nDo these per-pack prices match the client PO? Confirm to submit.')) return;
  state._lastKam=$('e_kam').value;
  const recv=$('e_recv').value; const po=isManualPO()?$('e_po').value.trim():genPO(recv);
  const id='O'+(state.orders.length+1)+'_'+state.seq++;

    priority:$('e_pri').value, promised:$('e_prom').value, received:recv, rmDecision:'pending',
    lines:lines.map((l,j)=>{const det=detailForBrand(l.brand);return {id:id+'L'+j, brand:l.brand, base:det.base||l.brand, pack:+l.pack||det.pack||null, note:l.note||'', committed:l.committed||$('e_prom').value, ordered:+l.qty, printPrice:0, invoicePrice:+l.inv||0, produced:0,packed:0,dispatched:0,delivered:0};}) };
  ord.totalOrdered=ord.lines.reduce((a,l)=>a+l.ordered,0);
  ord.rmDecision='pending';
  state.orders.unshift(ord);
  logAction(`Created PO ${po} (${entryClient}, ${entryChannel}, ${fmt(ord.totalOrdered)} Kg/L)`);
  entryChannel='';entryClient='';entryVsub='';entryLines=[{brand:'',qty:'',pack:'',note:'',committed:'',price:''}]; save();

function addDealer(){
  if(!canEdit(['KAM'])){toast('Only KAM can onboard dealers');return;}

  if(state.dealers.some(d=>d.code===code)){ toast('Code already exists'); return; }

}

let trkFilter='all'; let trkStage='';
/* ===================== PO TRACKER — control tower (UI redesign) ===================== */
let trkSearch='';
const BUCKETS=['PO Created','RM Check','Production','Lab QC','QA Pre-shipment','Shipment','Delivered'];
const BUCKET_META={
 'PO Created':{c:'--mut',owner:'Supply Chain',where:'My Actions — Acknowledge & RM Check'},
 'RM Check':{c:'--amber',owner:'Supply Chain',where:'Open PO → RM Check'},
 'Production':{c:'--blue',owner:'Production',where:'Production screen'},
 'Lab QC':{c:'--purple',owner:'Lab Rep',where:'QC · Pre-shipment → Lab QC'},
 'QA Pre-shipment':{c:'--amber',owner:'QA Inspector',where:'QC · Pre-shipment → QA Pre-shipment'},
 'Shipment':{c:'--green2',owner:'Supply Chain',where:'Shipments screen'},
 'Delivered':{c:'--green',owner:'—',where:'—'}
};
function lineBucket(o,l){
 if(l.deliveredDate && (l.delivered||0)>=l.ordered-0.5) return 'Delivered';
 if((l.dispatched||0)>0||l.dispatchDate) return 'Shipment';
 if(lineCleared(o,l)>0.5) return 'Shipment';
 if(lineToInspect(o,l)>0.5) return 'QA Pre-shipment';
 if((l.packed||0)>=(l.ordered||0)-0.5) return 'QA Pre-shipment';
 if((l.produced||0)>0 && (l.produced||0)>=(l.ordered||0)-0.5) return 'Lab QC';
 if((l.produced||0)>0||l.prodStart) return 'Production';
 if(l.rmReady) return 'Production';
 if(l.prRaised) return 'RM Check';
 return 'PO Created';
}
function orderBucket(o){ if(!o.lines||!o.lines.length) return 'PO Created'; const idx=o.lines.map(l=>BUCKETS.indexOf(lineBucket(o,l))); return BUCKETS[Math.min.apply(null,idx)]; }
function attnCounts(){ let delayed=0,rmblock=0,prod=0,qc=0,qahold=0,ready=0;
  state.orders.forEach(o=>{ const b=orderBucket(o);
    if(isOverdue(o)&&b!=='Delivered')delayed++;
    if(b==='RM Check')rmblock++;
    if(b==='Production')prod++;
    if(b==='Lab QC'||b==='QA Pre-shipment')qc++;
    if(o.lines.some(l=>lineQA(o,l).anyFail))qahold++;
    if(o.lines.some(l=>lineCleared(o,l)>0.5))ready++; });
  return {delayed,rmblock,prod,qc,qahold,ready};
}
function trkMatch(o){ const b=orderBucket(o);
  switch(trkFilter){
    case 'open':return b!=='Delivered';
    case 'delivered':return b==='Delivered';
    case 'delayed':return isOverdue(o)&&b!=='Delivered';
    case 'rmblock':return b==='RM Check';
    case 'prod':return b==='Production';
    case 'qc':return b==='Lab QC'||b==='QA Pre-shipment';
    case 'qahold':return o.lines.some(l=>lineQA(o,l).anyFail);
    case 'ready':return o.lines.some(l=>lineCleared(o,l)>0.5);
    case 'myrole':return state.role==='COO'||BUCKET_META[b].owner===state.role;
    default:return true;
  }
}
function trkRender(){ render(); const q=document.getElementById('trkq'); if(q&&q.focus)q.focus(); }
function priorityPill(p){ p=p||'Normal'; var c=p==='Critical'?'--red':(p==='High'?'--amber':(p==='Low'?'--mut':'--blue')); return `<span class="pill" style="background:color-mix(in srgb,var(${c}) 14%,#fff);color:var(${c});font-size:9px;padding:1px 7px;margin-left:5px">${p}</span>`; }
function orderCard(o){
  const b=orderBucket(o); const m=BUCKET_META[b]; const a=agg(o);
  const mixed=new Set(o.lines.map(l=>lineBucket(o,l))).size>1;
  const f=Math.round(a.ordered>0?a.dispatched/a.ordered*100:0);
  const delivered=b==='Delivered'; const od=isOverdue(o);
  const onTime = delivered?'<span class="pill" style="background:var(--green-50);color:var(--green2)">Delivered</span>':(od?`<span class="pill" style="background:var(--red-50);color:var(--red)">${daysOver(o)}d overdue</span>`:'<span class="pill" style="background:var(--green-50);color:var(--green2)">On time</span>');
  const barcol=f>=100?'var(--green)':(f>0?'var(--blue)':'#cdd6e4');
  const nextAct=delivered?'<span class="muted" style="font-size:11px">No action</span>':`<span class="rbadge">${m.owner}</span>`;
  return `<div class="ordrow"><div class="ohead clk" onclick="openOrder('${o.id}')">
    <div style="font-size:10.5px;color:var(--mut);white-space:nowrap" title="${o.po}">${o.po}</div>
    <div style="font-weight:600;font-size:12.5px;line-height:1.2;white-space:nowrap" title="${(o.client||'').replace(/"/g,'&quot;')}">${o.client}${priorityPill(o.priority)}</div>
    <div><div class="muted" style="font-size:9px;text-transform:uppercase;letter-spacing:.4px">Ordered</div><b style="font-size:12px">${fmt(a.ordered)} Kg/L</b></div>
    <div><div class="muted" style="font-size:9px;text-transform:uppercase;letter-spacing:.4px">Stage</div>${pill(b,m.c)}${mixed?' <span class="pill" style="background:var(--amber-50);color:var(--amber);font-size:9px;padding:1px 6px">Mixed</span>':''}</div>
    <div><div class="muted" style="font-size:9px;text-transform:uppercase;letter-spacing:.4px">Fulfilment</div><div style="display:flex;align-items:center;gap:7px"><div class="pbar" style="flex:1"><i style="width:${Math.min(100,f)}%;background:${barcol}"></i></div><b style="font-size:11.5px">${f}%</b></div></div>
    <div><div class="muted" style="font-size:9px;text-transform:uppercase;letter-spacing:.4px">On-time</div>${onTime}</div>
    <div><div class="muted" style="font-size:9px;text-transform:uppercase;letter-spacing:.4px">Next</div>${nextAct}</div>
  </div></div>`;
}
function screenTracker(){
  state.expanded=state.expanded||{};
  const counts={}; BUCKETS.forEach(b=>counts[b]=0); state.orders.forEach(o=>counts[orderBucket(o)]++);
  const A=attnCounts();
  let list=state.orders.filter(o=>trkMatch(o));
  if(trkSearch){ const q=trkSearch.toLowerCase(); list=list.filter(o=>((o.po||'')+' '+(o.client||'')).toLowerCase().indexOf(q)>-1); }
  if(trkStage){ list=list.filter(o=>orderBucket(o)===trkStage); }
  // Sort: earliest stage (new POs) at top → progressing by stage → Delivered at the bottom.
  // Within a stage: most overdue first, then newer PO (by received date) first.
  list=list.slice().sort((a,b)=>{
    const ra=BUCKETS.indexOf(orderBucket(a)), rb=BUCKETS.indexOf(orderBucket(b));
    if(ra!==rb) return ra-rb;
    const da=daysOver(a)||0, db=daysOver(b)||0;
    if(da!==db) return db-da;
    return String(b.received||'').localeCompare(String(a.received||''));
  });
  const flow=`<div class="flowpipe">${BUCKETS.map((b,i)=>{const m=BUCKET_META[b];const on=trkStage===b;return `<div class="fnode ${on?'on':''}" style="--fc:var(${m.c})" title="Filter to ${b}" onclick="trkStage=(trkStage===\`${b}\`?'':\`${b}\`);render()"><div class="fnum">${counts[b]}</div><div class="flbl">${b}</div></div>${i<BUCKETS.length-1?'<div class="farr">\u203a</div>':''}`;}).join('')}</div>`;
  const cards=[['delayed','Delayed orders',A.delayed,'--red'],['rmblock','RM / materials',A.rmblock,'--amber'],['prod','Production pending',A.prod,'--blue'],['qc','QC pending',A.qc,'--purple'],['qahold','QA hold / fail',A.qahold,'--red'],['ready','Ready to ship',A.ready,'--green2']];
  const attn=`<div class="attngrid">${cards.map(c=>`<div class="attn ${trkFilter===c[0]?'on':''}" style="border-left-color:var(${c[3]})" onclick="trkFilter=(trkFilter==='${c[0]}'?'all':'${c[0]}');render()"><div class="a-c" style="color:var(${c[3]})">${c[2]}</div><div class="a-n">${c[1]}</div></div>`).join('')}</div>`;
  const chips=[['all','All orders'],['myrole','My role'],['delayed','Delayed'],['rmblock','RM / blocked'],['qc','QC pending'],['ready','Ready to ship'],['delivered','Delivered']];
  const chipbar=`<div class="chips">${chips.map(c=>`<span class="chip ${trkFilter===c[0]?'on':''}" onclick="trkFilter='${c[0]}';render()">${c[1]}</span>`).join('')}<input id="trkq" placeholder="Search PO or customer…" value="${trkSearch}" oninput="trkSearch=this.value;trkRender()" style="margin-left:auto;min-width:230px"></div>`;
  const rows=list.length?list.map(o=>orderCard(o)).join(''):'<div class="empty"><div class="ei">∅</div>No orders match this filter.</div>';
  $('view').innerHTML=`
    <div class="banner info" style="margin-bottom:14px">This screen shows <b>where each order is standing</b>. <b>Click any PO</b> to open its full record in a window. Orders are sorted new at the top, delivered at the bottom.</div>
    ${acard('trk_flow','Order flow','how many orders sit at each stage',`${flow}`)}
    ${acard('trk_attn','Needs attention','tap a card to filter the list',`${attn}`)}
    <div class="card"><h3>Orders <span class="hint">${list.length} shown</span></h3>${chipbar}<div>${rows}</div></div>`;
}

function fld(o,l,key,label,type){
  const v=l[key]||''; const auto=AUTO_FIELDS.includes(key); const ed=false; /* tracker view-only: actions live in My Actions */
  const plant=(key==='delayReason'||key==='respDept');
  let cls = plant?'f-plant' : auto?'f-auto' : v?'f-done' : (canEditField(key)?'f-input':'f-auto');
  const owner = auto?'auto':(FIELD_OWNER[key]||'');
  let inner;
  if(ed){
    if(type.indexOf('select:')===0){ const opts=(state.masters&&state.masters[type.split(':')[1]])||(SEED.masters&&SEED.masters[type.split(':')[1]])||[];
      inner=`<select class="${cls}" onchange="editField('${o.id}','${l.id}','${key}',this.value)"><option value="">—</option>${opts.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`; }
    else if(type==='num') inner=`<input class="${cls}" type="number" value="${v}" onchange="editField('${o.id}','${l.id}','${key}',this.value)">`;
    else if(type==='text') inner=`<input class="${cls}" type="text" value="${v}" onchange="editField('${o.id}','${l.id}','${key}',this.value)">`;
    else inner=`<input class="${cls}" type="date" value="${v}" onchange="editField('${o.id}','${l.id}','${key}',this.value)">`;
  } else { inner=`<div class="fval ${cls}">${v||'—'}</div>`; }
  const tag = (canEditField(key)&&!auto) ? `<span class="lk2" style="background:#fff7d6;border-color:#e6cd72;color:#8a6d12">\u270e you</span>` : `<span class="lk2">${owner}</span>`;
  return `<div class="ff"><label>${label}${tag}</label>${inner}</div>`;
}

function rmSetStatus(s){ rmForm.status=s; if((s==='partial'||s==='short')&&!rmForm.lines.length){ const o=state.orders.find(x=>x.id===rmForm.oid);const l=o.lines.find(x=>x.id===rmForm.lid); rmForm.lines=recipePrefill(o,l); if(!rmForm.lines.length) rmForm.lines=[{rm:'',kg:''}]; } renderRMModal(); }
function rmAddLine(){ rmForm.lines.push({rm:'',kg:''}); renderRMModal(); }
function rmDelLine(i){ rmForm.lines.splice(i,1); renderRMModal(); }
function rmPrefill(){ const o=state.orders.find(x=>x.id===rmForm.oid);const l=o.lines.find(x=>x.id===rmForm.lid); const p=recipePrefill(o,l); if(p.length) rmForm.lines=p; renderRMModal(); }
function renderRMModal(){ const o=state.orders.find(x=>x.id===rmForm.oid); const l=o.lines.find(x=>x.id===rmForm.lid);
  const rms=[...new Set([...(((state.masters&&state.masters.rawMaterials)||(typeof SEED!=='undefined'&&SEED.rawMaterials)||[]).map(r=>r.name)), ...Object.keys(state.rawStock||{}), ...((rmForm.lines||[]).map(x=>x.rm).filter(Boolean))])].sort();
  const hasRecipe=(()=>{const r=recipeFor(l.base);const k=Object.keys(r||{});return k.length&&!k[0].startsWith('(');})();
  const seg=`<div class="seg">
    <div class="opt full ${rmForm.status==='full'?'on':''}" onclick="rmSetStatus('full')"><span class="em">✅</span>In stock<span style="display:block;font-weight:500;font-size:10.5px">make full order</span></div>
    <div class="opt partial ${rmForm.status==='partial'?'on':''}" onclick="rmSetStatus('partial')"><span class="em">🟡</span>Partial<span style="display:block;font-weight:500;font-size:10.5px">make some now</span></div>
    <div class="opt short ${rmForm.status==='short'?'on':''}" onclick="rmSetStatus('short')"><span class="em">🔴</span>Short<span style="display:block;font-weight:500;font-size:10.5px">none / not enough</span></div></div>`;
  let body='';
  if(rmForm.status==='partial') body+=`<div class="fld" style="margin:14px 0"><label>How much can you make now? (Kg/L of ${l.brand})</label><input type="number" value="${rmForm.canMake}" oninput="rmForm.canMake=this.value" placeholder="Kg/L" style="max-width:240px"></div>`;
  if(rmForm.status==='partial'||rmForm.status==='short'){
    body+=`<div style="display:flex;align-items:center;margin:14px 0 9px"><b style="font-size:12.5px;color:var(--navy)">Purchase Requisition — raw materials required</b>${hasRecipe?`<button class="ghost sm" style="margin-left:auto" onclick="rmPrefill()">↺ Pre-fill from recipe</button>`:''}</div>`;
    body+=(rms.length?'':`<div class="banner warn" style="margin:6px 0">No raw materials are loaded in the master list. Pick from the recipe values below, or add raw materials in Admin · Master Data.</div>`);
    body+=rmForm.lines.map((ln,i)=>`<div class="prline"><select onchange="rmForm.lines[${i}].rm=this.value;renderRMModal()"><option value="">— raw material —</option>${rms.map(r=>`<option ${r===ln.rm?'selected':''}>${r}</option>`).join('')}</select><span class="rmstk">${ln.rm?('have '+fmt(state.rawStock[ln.rm]||0)):''}</span><input type="number" value="${ln.kg}" placeholder="Kg/L req" oninput="rmForm.lines[${i}].kg=this.value"><span class="x" onclick="rmDelLine(${i})">✕</span></div>`).join('');
    body+=`<button class="ghost sm" style="margin-top:4px" onclick="rmAddLine()">+ Add raw material</button>`;
  }
  $('modal').innerHTML=`<div class="mh"><h2>RM Check — ${l.brand}</h2><div class="sub">${o.po} · ${o.client} · ${fmt(l.ordered)} Kg/L to make · base: ${l.base}</div></div>
   <div class="mb">${seg}${body}<div class="muted" style="font-size:11px;margin-top:14px">Recording only — stock balances are not changed here. Actual material receipt is booked against the PR as a GRN (after CFO approval) in My Actions.</div></div>
   <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="${rmForm.status==='full'?'green':''}" onclick="rmSubmit()">${rmForm.status==='full'?'Confirm — materials ready':'Raise PR'}</button></div>`;
}
function rmSubmit(){ const o=state.orders.find(x=>x.id===rmForm.oid); const l=o.lines.find(x=>x.id===rmForm.lid); const today=TODAY.toISOString().slice(0,10);
  if(rmForm.status!=='full'){ const _v=(rmForm.lines||[]).filter(x=>x&&x.rm&&+x.kg>0); if(!_v.length){ toast('Add at least one raw material with a quantity to raise a PR.'); return; } }
  l.rmCheck=today; l.rmStatus=rmForm.status;
  if(rmForm.status==='full'){ l.rmReady=today; l.canMakeKg=null; l.pr=null; logAction(`RM check ${o.po}·${l.brand}: in stock — materials ready`);
    (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'RM Check',po:o.po,brand:l.brand,field:'RM status',old:'',val:'In stock — ready'}); }
  else { const lines=rmForm.lines.filter(x=>x.rm&&+x.kg>0).map(x=>({rm:x.rm,kg:+x.kg}));
    l.prRaised=today; l.pr={lines,by:state.role,date:today}; l.canMakeKg=(rmForm.status==='partial'?(+rmForm.canMake||0):0); lines.forEach(x=>raisePR(x.rm,x.kg));
    logAction(`RM check ${o.po}·${l.brand}: ${rmForm.status}${rmForm.status==='partial'?' (can make '+fmt(l.canMakeKg)+' kg)':''} — PR raised, ${lines.length} material(s)`);
    (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'RM Check',po:o.po,brand:l.brand,field:'PR raised',old:'',val:lines.map(x=>x.rm+' '+x.kg+'kg').join(', ')}); }
  save(); closeModal(); openOrder(rmForm.oid); render();
}

</script>
<script>
/* ===================== PRODUCTION (PO-centric + to-stock) ===================== */
let prodMode='po', prodPOsel='';
const BULK_BASES=['Potassium Humate','Potassium Humate Liquid','Sulfur Coated Urea','Sulfur 70%','Amino Acid','Compost','Zinc 21%','NP 6.32','Nitro Sulfur','Liquid Phosphrous','Mg Sulphate','NPK 8.8.6','Boron 5%'];
function brandsForBase(base){ return Object.keys(SEED.brandMap||{}).filter(b=>SEED.brandMap[b].base===base).sort(); }
function inProdLines(){ const r=[]; state.orders.forEach(o=>o.lines.forEach(l=>{ if(stageOf(o)!=='Delivered' && (l.packed||0)<l.ordered-0.5) r.push({o,l}); })); return r; }
function screenProd(){
  const ed=canEdit(['Production']);
  const bases=BULK_BASES.slice();
  const pos=state.orders.filter(o=>stageOf(o)!=='Delivered');
  const selO=state.orders.find(o=>o.id===prodPOsel);
  const work=inProdLines();
  const openStock=(state.batches||[]).filter(b=>b.type==='stock'&&!b.reconciled&&b.packedKg<b.producedKg-0.001);
  const psEntries=Object.entries(state.packedStock||{}).filter(([k,v])=>v>0.5).sort((a,b)=>b[1]-a[1]);
  const allocs=[]; state.orders.forEach(o=>o.lines.forEach(l=>{ const av=(state.packedStock&&state.packedStock[l.brand])||0; if(av>0.5 && (l.packed||0)<l.ordered-0.5 && stageOf(o)!=='Delivered') allocs.push({o,l,av}); }));
  const recent=state.productionLog.slice(0,15);
  const _plRows=(state.productionLog||[]).map((p,idx)=>({_i:idx,date:p.date||'',prod:((p.brand?p.brand+' ':'')+(p.base||'')+(p.po?(' · '+p.po):'')).trim(),base:p.base||'',brand:p.brand||'',po:p.po||'',kg:p.kg||0,shift:p.shift||'',incharge:p.incharge||'',by:p.by||''}));
  const _plOpt={placeholder:'Search product, PO, shift, incharge, by…',searchKeys:['prod','shift','incharge','by','po','base','brand'],dateKey:'date',pageSize:20};
  const _pl=regFilter('prodlog',_plRows,_plOpt);
  const openBatches=(state.batches||[]).filter(b=>b.status==='open' && (b.plannedKg>0 ? (b.producedKg||0) < b.plannedKg-0.001 : true));
  const doneBatches=(state.batches||[]).filter(b=>b.status==='open' && b.plannedKg>0 && (b.producedKg||0) >= b.plannedKg-0.001);
  const noNoBatches=(state.batches||[]).filter(b=>((b.producedKg||0)>0||(b.packedKg||0)>0) && (!(b.batchNo||'').trim() || (state.packingLog||[]).some(p=>p&&p.baseBatchId===b.id&&!((p.baseBatchNo||'').trim()))));
  const fixCard=(ed&&noNoBatches.length)?`<div class="card" style="border-left:4px solid var(--amber)"><h3>Set batch numbers <span class="hint">${noNoBatches.length} without a number</span></h3>
   <div class="muted" style="font-size:12px;margin-bottom:10px">These batches were produced without a batch number (a system fill or an earlier edit). Enter the real batch number — it flows to the lots, the production log and the COA. Nothing is deleted.</div>
   <div class="tscroll"><table><thead><tr><th>Product</th><th>PO</th><th class="num">Produced</th><th class="num">Packed</th><th>Date</th><th style="width:240px">Batch #</th></tr></thead><tbody>${noNoBatches.map(b=>`<tr><td><b>${b.brand||b.base||''}</b> <span class="muted" style="font-size:11px">${b.base||''}</span></td><td class="muted">${b.po||'bulk'}</td><td class="num">${fmt(b.producedKg||0)}</td><td class="num">${fmt(b.packedKg||0)}</td><td class="muted">${b.openedDate||b.closedDate||b.date||''}</td><td><div style="display:flex;gap:6px"><input type="text" id="sbn_${b.id}" placeholder="e.g. RUBS26003" style="width:150px"><button class="sm green" onclick="setBatchNo('${b.id}',document.getElementById('sbn_${b.id}').value)">Set #</button></div></td></tr>`).join('')}</tbody></table></div></div>`:'';
  const obCard=acard('prod_open','Open batches',`${openBatches.length} open`,
    (openBatches.length?`<div style="overflow:auto"><table><thead><tr><th>Batch #</th><th>Product</th><th class="num">Planned</th><th class="num">Produced</th><th class="num">Remaining</th><th>Opened</th><th style="width:250px"></th></tr></thead><tbody>`+
      openBatches.map(b=>{const prod=b.producedKg||0,plan=b.plannedKg||0,rem=Math.max(0,plan-prod);
        const prodName=b.kind==='po'?`${b.brand||''} <span class="muted" style="font-size:11px">${b.base||''} · ${b.po||''}</span>`:`<span class="muted">${b.base||''}</span> <span class="pill" style="background:var(--navy-50);color:var(--navy)">bulk</span>`;
        return `<tr><td><b>${b.batchNo||'—'}</b></td><td>${prodName}</td><td class="num">${fmt(plan)}</td><td class="num">${fmt(prod)}${prod>plan+0.5?` <span class="pill" style="background:var(--amber-50);color:var(--amber);font-size:8.5px;padding:1px 5px">over plan</span>`:``}</td><td class="num"><b style="color:${rem>0?'var(--amber)':'var(--mut)'}">${fmt(rem)}</b></td><td class="muted">${b.openedDate||b.date||''}</td><td>${ed?`<button class="sm green" onclick="openShiftLog('${b.id}')">Log shift output</button> <button class="sm ghost" onclick="closeBatch('${b.id}')">Close</button>${(((b.producedKg||0)-(b.packedKg||0))>0.5&&!b.reconciled)?` <button class="sm ghost" style="color:var(--amber)" onclick="openReconcile('${b.id}')">Reconcile</button>`:''}`:''}</td></tr>`;}).join('')+
      `</tbody></table></div>`:'<div class="muted">No open batches. Open one above to start logging shift production.</div>'));
  const cbCard = doneBatches.length?acard('prod_done','Production completed \u2014 at / over plan',`${doneBatches.length} ready to close / pack`,`<div style="overflow:auto"><table><thead><tr><th>Batch #</th><th>Product</th><th class="num">Planned</th><th class="num">Produced</th><th class="num">% plan</th><th>Opened</th><th style="width:250px"></th></tr></thead><tbody>`+
    doneBatches.map(b=>{const prod=b.producedKg||0,plan=b.plannedKg||0,pct=plan?Math.round(prod/plan*100):0;
      const prodName=b.kind==='po'?`${b.brand||''} <span class="muted" style="font-size:11px">${b.base||''} \u00b7 ${b.po||''}</span>`:`<span class="muted">${b.base||''}</span> <span class="pill" style="background:var(--navy-50);color:var(--navy)">bulk</span>`;
      const pill=prod>plan+0.5?`<span class="pill" style="background:var(--amber-50);color:var(--amber);font-size:8.5px;padding:1px 5px">over plan</span>`:`<span class="pill" style="background:var(--green-50,#e7f6ec);color:var(--green2,#1a7f37);font-size:8.5px;padding:1px 5px">at plan</span>`;
      return `<tr><td><b>${b.batchNo||'\u2014'}</b></td><td>${prodName}</td><td class="num">${fmt(plan)}</td><td class="num">${fmt(prod)} ${pill}</td><td class="num">${pct}%</td><td class="muted">${b.openedDate||b.date||''}</td><td>${ed?`<button class="sm green" onclick="closeBatch('${b.id}')">Close batch \u2713</button> <button class="sm ghost" onclick="openShiftLog('${b.id}')">Log more (\u2264105%)</button>${(((b.producedKg||0)-(b.packedKg||0))>0.5&&!b.reconciled)?` <button class="sm ghost" style="color:var(--amber)" onclick="openReconcile('${b.id}')">Reconcile</button>`:''}`:''}</td></tr>`;}).join('')+
    `</tbody></table></div>`):'';
  const logForm = prodMode==='po'
    ? `<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
         <div class="fld" style="flex:1;min-width:230px"><label>Purchase Order</label>
           <select id="pp_po" onchange="prodPOsel=this.value;render()"><option value="">— pick PO —</option>${pos.map(o=>`<option value="${o.id}" ${o.id===prodPOsel?'selected':''}>${o.po} · ${o.client}</option>`).join('')}</select></div>
         <div class="fld" style="flex:1;min-width:210px"><label>Product (as on the PO)</label>
           <select id="pp_line" ${selO?'':'disabled'}><option value="">${selO?'— pick product —':'pick PO first'}</option>${selO?selO.lines.map(l=>`<option value="${l.id}">${l.brand} (${fmt(l.produced||0)}/${fmt(l.ordered)} done)</option>`).join(''):''}</select></div>
         <div class="fld" style="width:150px"><label>Plan this batch (Kg/L)</label><input type="number" id="pp_planned" placeholder="remaining"></div>
         <div class="fld" style="width:160px"><label>Batch #</label><input type="text" id="nb_batch" placeholder="e.g. AB12345" oninput="batchNoFx(this)"></div>
         <button class="green" ${ed?'':'disabled'} onclick="openBatch('po')">Open batch</button></div>
       <div class="muted" style="font-size:11px;margin-top:8px">Opens a batch for this PO line. <b>Plan a partial quantity</b> if you'll run it in parts (blank = full remaining); open more batches for the rest. Log shift output in <b>Open batches</b> below; the PO auto-fills as shifts produce.</div>`
    : `<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
         <div class="fld" style="flex:1;min-width:240px"><label>Base Product (bulk)</label>
           <select id="pb_base"><option value="">— pick base —</option>${bases.map(b=>`<option>${b}</option>`).join('')}</select></div>
         <div class="fld" style="width:170px"><label>Batch #</label><input type="text" id="nb_batch_b" placeholder="e.g. AB12345" oninput="batchNoFx(this)"></div>
         <div class="fld" style="width:150px"><label>Planned (Kg/L)</label><input type="number" id="nb_planned" placeholder="Kg/L"></div>
         <button class="green" ${ed?'':'disabled'} onclick="openBatch('bulk')">Open batch</button></div>
       <div class="muted" style="font-size:11px;margin-top:8px">Opens a bulk-base batch with a planned target. Log shift output in <b>Open batches</b> below, then pack it once produced.</div>`;
  $('view').innerHTML=`
   ${ed?'':viewOnly('Production')}
   <div class="card"><h3>Open a production batch</h3>
     <div class="seg" style="max-width:440px;margin-bottom:14px">
       <div class="opt full ${prodMode==='po'?'on':''}" onclick="prodMode='po';render()" style="padding:9px">Against a PO</div>
       <div class="opt full ${prodMode==='stock'?'on':''}" onclick="prodMode='stock';render()" style="padding:9px">Bulk Base Production</div>
     </div>${logForm}</div>
   ${fixCard}
   ${obCard}
   ${cbCard}

   ${acard('prod_bulk','Bulk base produced — pack into brands',`${openStock.length} base(s) ready`,`${openStock.length?`<div class="tscroll"><table><thead><tr><th>Batch ▸ base</th><th class="num">Produced</th><th class="num">Packed</th><th class="num">Open</th><th>Date</th><th style="width:80px"></th></tr></thead>
       <tbody>${openStock.map(b=>`<tr><td><b>${b.batchNo||'\u2014'}</b><div class="muted" style="font-size:11px">${b.base}</div>${lotsClearedLabel(b)}</td><td class="num">${fmt(b.producedKg)}</td><td class="num">${fmt(b.packedKg)}</td><td class="num"><b>${fmt(batchPackableKg(b))}</b></td><td class="muted">${b.openedDate||b.closedDate||b.date||'\u2014'}</td><td>${ed?((batchLabApproved(b)?`<button class="sm" onclick="openPack('${b.id}')">Pack</button>`:`<span class="pill" style="background:var(--amber-50);color:var(--amber);font-size:9px">Lab QC pending</span>`)+(((b.producedKg||0)-(b.packedKg||0)>0.5&&!b.reconciled)?` <button class="sm ghost" style="color:var(--amber)" onclick="openReconcile('${b.id}')">Reconcile</button>`:'')):''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">No open to-stock bulk.</div>'}`)}

   ${acard('prod_orders','Orders in production',`${work.length} open · produced → packed → QC`,`${work.length?`<div class="tscroll"><table><thead><tr><th>PO</th><th>Product</th><th class="num">Ordered</th><th class="num">Produced</th><th class="num">Packed</th><th class="num">To produce</th><th class="num">To pack</th><th style="width:200px"></th></tr></thead>
       <tbody>${work.map(({o,l})=>{const rp=Math.max(0,l.ordered-(l.produced||0)), rk=Math.max(0,(l.produced||0)-(l.packed||0)-(l.disposedKg||0));
         let acts='';
         if(rk>0.5&&ed){ const appr=lineApprovedProducedKg(o,l)-(l.packed||0); if(appr>0.5) acts+=`<button class="sm green" onclick="openProdQty('${o.id}','${l.id}','pack')">Pack…</button> `; else acts+=`<span class="pill" style="background:var(--amber-50);color:var(--amber);font-size:9px">Lab QC pending</span> `; }
         if((l.packed||0)>=l.ordered-0.5) acts+=`<span class="pill" style="background:var(--green-50);color:var(--green2)">Fully packed → QC</span>`;
         else if(rk>0.5) acts+=`<span class="pill" style="background:var(--navy-50);color:var(--navy)">Awaiting packing</span>`;
         else acts+=`<span class="pill" style="background:var(--amber-50);color:var(--amber)">Awaiting production</span>`;
         return `<tr><td><b>${o.po}</b></td><td>${l.brand} <span class="muted" style="font-size:11px">${l.base}</span></td>
           <td class="num">${fmt(l.ordered)}</td><td class="num">${fmt(l.produced||0)}</td><td class="num">${fmt(l.packed||0)}</td>
           <td class="num"><b style="color:${rp>0?'var(--amber)':'var(--mut)'}">${fmt(rp)}</b></td><td class="num"><b style="color:${rk>0?'var(--amber)':'var(--mut)'}">${fmt(rk)}</b></td>
           <td>${acts}</td></tr>`;}).join('')}</tbody></table></div>`:'<div class="muted">No orders in production.</div>'}`)}

   ${(psEntries.length||allocs.length)?acard('prod_packed','Packed &amp; ready','finished goods available for orders',`${psEntries.length?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:${allocs.length?'14px':'0'}">${psEntries.map(([b,v])=>`<span class="pill" style="background:var(--green-50);color:var(--green2);border:1px solid #bbe3c8">${b}: ${fmt(v)} Kg/L</span>`).join('')}</div>`:''}
     ${allocs.length?`<div class="tscroll"><table><thead><tr><th>PO</th><th>Product</th><th class="num">Needed</th><th class="num">In stock</th><th style="width:160px"></th></tr></thead>
       <tbody>${allocs.map(a=>{const need=a.l.ordered-(a.l.packed||0);return `<tr><td><b>${a.o.po}</b></td><td>${a.l.brand}</td><td class="num">${fmt(need)}</td><td class="num">${fmt(a.av)}</td><td>${ed?`<button class="sm" onclick="allocateStock('${a.o.id}','${a.l.id}')">Allocate ${fmt(Math.min(a.av,need))} Kg/L</button>`:''}</td></tr>`;}).join('')}</tbody></table></div>`:''}
     `):''}

   ${acard('prod_log','Daily output log',`${state.productionLog.length} entries`,`${regBar('prodlog',_plOpt,_pl.total)}<div class="tscroll" style="max-height:52vh"><table><thead><tr><th style="width:120px">Date</th><th>Base / product</th><th class="num" style="width:100px">Kg/L</th><th style="width:90px">Shift</th><th style="width:120px">Incharge</th><th style="width:100px">By</th>${state.role==='COO'?'<th style="width:90px"></th>':''}</tr></thead>
       <tbody>${_pl.view.length?_pl.view.map(p=>`<tr><td class="muted">${p.date}</td><td>${p.brand?(p.brand+' '):''}<span class="muted">${p.base}</span>${p.po?(' · '+p.po):''}</td><td class="num">${fmt(p.kg)}</td><td class="muted">${p.shift||'—'}</td><td class="muted">${p.incharge||'—'}</td><td class="muted">${p.by}</td>${state.role==='COO'?`<td><button class="sm ghost" onclick="voidProdEntry(${p._i})">✕ remove</button></td>`:''}</tr>`).join(''):`<tr><td colspan="${state.role==='COO'?7:6}" class="muted">No output logged.</td></tr>`}</tbody></table></div>${regPager('prodlog',_pl.pages)}`)}`;
}
/* COO-only: remove a mistaken production entry. Reverses the produced quantity
   (clamped so it never drops below what's already packed) and deletes the log row.
   Logged to the Action Log. Index maps directly to state.productionLog (recent = slice(0,15)). */
function voidProdEntry(i){
  if(!screenEditOK('prod')){ toast('You need Edit access to Production'); return; }
  const p=state.productionLog[i]; if(!p) return;
  const desc=`${p.date} · ${p.brand?p.brand+' ':''}${p.base||''}${p.po?(' · '+p.po):''} · ${fmt(p.kg)} Kg/L`;
  if(!typeNameToConfirm('Remove production entry — '+desc+' (reverses produced qty)')) return;
  if(p.po){
    const o=state.orders.find(x=>x.po===p.po);
    const l=o && (o.lines.find(x=>x.brand===p.brand) || o.lines.find(x=>x.base===p.base) || o.lines[0]);
    if(l){ l.produced=Math.max(l.packed||0,(l.produced||0)-(p.kg||0)); if((l.produced||0) < l.ordered-0.001) l.prodComplete=''; }
  } else {
    const b=(state.batches||[]).find(x=>x.base===p.base && ((x.producedKg||0)-(x.packedKg||0))>0.001) || (state.batches||[]).find(x=>x.base===p.base);
    if(b){ b.producedKg=Math.max(b.packedKg||0,(b.producedKg||0)-(p.kg||0)); }
  }
  state.productionLog.splice(i,1);

function coaSubmitAnalyst(){ const ctx=coaCtx(); const b=ctx.b, h=ctx.h; if(!b||!h)return; const L=ctx.L;
  if(!(coaForm.tests||[]).length){toast('No tests on this COA — add test rows first');return;}
  const REQ=[['qcNo','Q.C. No'],['sampledBy','Sampled Received by'],['sampleQty','Sample Quantity'],['analysisTime','Analysis Time'],['temp','Temperature'],['humidity','Humidity']];
  for(const fp of REQ){ if(!String(coaForm[fp[0]]||'').trim()){toast(fp[1]+' is mandatory for the lab sample');return;} }
  for(const r of coaForm.tests){ const rk=String(r.remark||'').trim(); if(!rk){toast('Set FIT / UNFIT / No Result on every test');return;} if(!/^no result$/i.test(rk) && !(r.result||'').trim()){toast('Enter a Result for every test (or mark it No Result)');return;} }
  if(!(coaForm.analyst&&coaForm.analyst.name||'').trim()){toast('Enter the analyst name (Analysed By)');return;}
  const ov=coaOverall(coaForm.tests);
  coaForm.overall=ov; coaForm.analyst={name:coaForm.analyst.name.trim(),date:coaTS()};
  coaForm.status = (ov==='FIT') ? 'analysed' : 'failed'; if(ov==='UNFIT') coaForm.failReason='UNFIT on '+coaForm.tests.filter(r=>/unfit|not ok/i.test(r.remark||'')).map(r=>r.test).join(', '); else if(ov!=='FIT') coaForm.failReason='No result on '+coaForm.tests.filter(r=>!String(r.remark||'').trim()||/no result/i.test(r.remark||'')).map(r=>r.test).join(', ');
  h.coa=JSON.parse(JSON.stringify(coaForm)); delete h.coa.bid; delete h.coa.lid;
  state.masters.labTemplates=state.masters.labTemplates||{}; if(coaForm.item) state.masters.labTemplates[coaForm.item]=coaForm.tests.map(r=>({g:r.g,test:r.test,spec:r.spec,method:r.method,mu:r.mu}));
  qcAudit2(b,'Lab analysed',ov); logAction(`Lab COA submitted for ${L} (${coaForm.item}) — ${ov}`+(ov!=='FIT'?' → Plant Manager':' → AQCM'));
  save(); coaFSClose(); }
function coaReview(){ if(!(canEdit(['AQCM'])||state.role==='COO')){toast('AQCM only');return;} const ctx=coaCtx(); const b=ctx.b,h=ctx.h; if(!b||!h||!h.coa)return; const nm=(state.currentUser&&state.currentUser.name)||state.role; h.coa.reviewer={name:nm,date:coaTS()}; h.coa.status='reviewed'; qcAudit2(b,'AQCM reviewed',''); logAction(`COA reviewed (AQCM) for ${ctx.L} → QCM`); save(); coaFSClose(); }
function coaApprove(){ if(!(canEdit(['QCM'])||state.role==='COO')){toast('QCM only');return;} const ctx=coaCtx(); const b=ctx.b,h=ctx.h; if(!b||!h||!h.coa)return; const nm=(state.currentUser&&state.currentUser.name)||state.role; h.coa.approver={name:nm,date:coaTS()}; h.coa.status='approved'; h.coa.approvedDate=TODAY.toISOString().slice(0,10); h.coa.certifiedKg=ctx.qkg; if(ctx.lot) ctx.lot.certifiedKg=ctx.qkg; qcAudit2(b,'QCM approved','cleared'); logAction(`COA APPROVED (QCM) for ${ctx.L} — cleared for packing`); save(); coaFSClose(); }
function coaReject(stage){ if(!canEdit(['AQCM','QCM'])){toast('AQCM / QCM only');return;} const ctx=coaCtx(); const b=ctx.b,h=ctx.h; if(!b||!h||!h.coa)return; const why=(typeof prompt==='function'?prompt('Reason for rejecting back to the analyst:'):'')||''; h.coa.status='draft'; h.coa.rejected={by:state.role,stage,why:why||'',date:TODAY.toISOString().slice(0,10)}; qcAudit2(b,'COA rejected',why||''); logAction(`COA rejected at ${stage} for ${ctx.L} — back to analyst`); save(); coaFSClose(); }
function coaDeviation(){ if(!(canEdit(['Plant Manager'])||state.role==='COO')){toast('Plant Manager only');return;} const ctx=coaCtx(); const b=ctx.b,h=ctx.h; if(!b||!h||!h.coa)return; const note=(typeof prompt==='function'?prompt('Deviation note (why accept this UNFIT lot):'):'')||''; h.coa.deviation=true; h.coa.deviationNote=note||''; h.coa.deviationBy={name:(state.currentUser&&state.currentUser.name)||state.role,date:coaTS()}; h.coa.status='analysed'; qcAudit2(b,'PM deviation accepted',note||''); logAction(`UNFIT ${ctx.L} accepted as DEVIATION by Plant Manager → AQCM review → QCM approval`); save(); coaFSClose(); }
function coaRework(){ if(!(canEdit(['Plant Manager'])||state.role==='COO')){toast('Plant Manager only');return;} const ctx=coaCtx(); const b=ctx.b,h=ctx.h; if(!b||!h||!h.coa)return; h.coa.reworks=(h.coa.reworks||0)+1; const item=h.coa.item; h.coa=null; qcAudit2(b,'Sent to rework',''); logAction(`${ctx.L} (${item}) sent to rework after UNFIT`); save(); coaFSClose(); }
function qcAudit2(b,field,val){ (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'Lab QC',po:b.po||'',brand:coaItemOf(b),field,old:'',val,batchNo:b.batchNo||''}); }

/* ===== quantity-true QC helpers + QA per packed lot + print COA ===== */
function lineApprovedProducedKg(o,l){ let s=0; (state.batches||[]).forEach(b=>{ if(b.kind==='po'&&b.po===o.po&&b.lineId===l.id){ const lots=(b.lots||[]); if(lots.length){ lots.forEach(l2=>{ if(l2.coa&&l2.coa.status==='approved'){ const ck=(l2.coa.certifiedKg!=null)?l2.coa.certifiedKg:(l2.qty||0); s+=Math.min(l2.qty||0,ck); } }); } else if(b.coa&&b.coa.status==='approved'){ s+=Math.min(b.producedKg||0,(b.coa.certifiedKg!=null)?b.coa.certifiedKg:(b.producedKg||0)); } } }); return s; }
function lineQAPackedKg(o,l){ let s=0; (state.packingLog||[]).forEach(p=>{ if(p&&p.po===o.po&&p.brand===l.brand&&p.qa&&p.qa.pass) s+=(p.kg||0); }); if(l.qcPass) s=Math.max(s,l.packed||0); return s; }
function lineQA(o,l){ const lots=(state.packingLog||[]).filter(p=>p&&p.po===o.po&&p.brand===l.brand&&(p.kg||0)>0); let pass=0,fail=0,pend=0; lots.forEach(p=>{ if(p.qa&&p.qa.fail)fail++; else if(p.qa&&p.qa.pass)pass++; else pend++; }); return {lots:lots.length,pass,fail,pend,anyFail:fail>0,allPass:lots.length>0&&pass===lots.length,pending:pend>0}; }
function lotById(id){ return (state.packingLog||[]).find(p=>p&&p.id===id); }
let lotQAForm={lotId:null,marks:[],officer:'',remarks:''};
function openLotQA(lotId){ const p=lotById(lotId); if(!p)return; lotQAForm={lotId, marks:QC_CHECKLIST.map((_,i)=> (p.qa&&p.qa.checklist&&p.qa.checklist[i]&&p.qa.checklist[i].result)||''), officer:(p.qa&&p.qa.by)||'', remarks:(p.qa&&p.qa.remarks)||''}; renderLotQA(); $('modalBg').classList.add('open'); }
function lotQASet(i,v){ lotQAForm.marks[i]=v; renderLotQA(); }
function renderLotQA(){ const p=lotById(lotQAForm.lotId); if(!p){closeModal();return;}
  const rows=QC_CHECKLIST.map((it,i)=>`<tr><td>${it}</td><td style="white-space:nowrap"><label style="margin-right:12px"><input type="radio" name="qa${i}" ${lotQAForm.marks[i]==='pass'?'checked':''} onclick="lotQASet(${i},'pass')"> Pass</label><label><input type="radio" name="qa${i}" ${lotQAForm.marks[i]==='fail'?'checked':''} onclick="lotQASet(${i},'fail')"> Fail</label></td></tr>`).join('');
  $('modal').innerHTML=`<div class="mh"><h2>QA pre-shipment inspection</h2><div class="sub">${p.po} · ${p.brand} · ${fmt(p.kg)} Kg/L · batch ${lotBaseNo(p)||'—'} ▸ ${lotBrandNo(p)||'—'} · mfg ${p.mfgDate||'—'} · exp ${p.expDate||'—'} · inspector ${state.role}</div></div>
   <div class="mb"><div class="muted" style="font-size:12px;margin-bottom:10px">Inspect this packed lot. Any <b>Fail</b> = lot fails → Supply Chain corrects &amp; re-inspects. Only QA-passed lots can ship.</div>
     <table><thead><tr><th>Checklist item</th><th style="width:180px">Result</th></tr></thead><tbody>${rows}</tbody></table>
     <div class="fld" style="margin-top:10px"><label>Inspector name (shared QA login)</label><input type="text" value="${(lotQAForm.officer||'').replace(/"/g,'&quot;')}" oninput="lotQAForm.officer=this.value"></div>
     <div class="fld" style="margin-top:8px"><label>Remarks</label><input type="text" value="${(lotQAForm.remarks||'').replace(/"/g,'&quot;')}" oninput="lotQAForm.remarks=this.value"></div>
   </div>
   <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="green" onclick="lotQASubmit()">Save inspection</button></div>`; }
function lotQASubmit(){ const p=lotById(lotQAForm.lotId); if(!p)return; if(lotQAForm.marks.some(m=>!m)){toast('Mark every item Pass or Fail');return;} if(!(lotQAForm.officer||'').trim()){toast('Enter inspector name');return;}
  const anyFail=lotQAForm.marks.some(m=>m==='fail'); const d=TODAY.toISOString().slice(0,10);
  p.qa={pass:!anyFail, fail:anyFail, by:lotQAForm.officer.trim(), date:d, checklist:QC_CHECKLIST.map((it,i)=>({item:it,result:lotQAForm.marks[i]})), remarks:lotQAForm.remarks||''};
  const o=state.orders.find(x=>x.po===p.po); const l=o&&o.lines.find(x=>x.brand===p.brand);
  if(!anyFail && o&&l){ const cleared=lineQAPackedKg(o,l); if(cleared>=(l.ordered||0)-0.001) l.qcPass=l.qcPass||d; }
  (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'QA',po:p.po,brand:p.brand,field:anyFail?'QA FAILED':'QA passed',old:'',val:lotQAForm.remarks||''});

  const transitHtml=transit.length?`<div class="sec" style="color:var(--amber)">In transit · press "Mark delivered" when it arrives</div>`+transit.map(g=>`<div class="card" style="padding:13px 16px;border-left:4px solid var(--amber)"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><b>${g.po}</b> <span class="muted" style="font-size:12px">· ${g.destination||''}</span><div class="muted" style="font-size:11.5px;margin-top:3px">${g.rows.length} product(s) · ${fmt(g.kg)} Kg/L · ${g.date||''}${g.vehicle?(' · '+g.vehicle):''}${g.dc?(' · DC '+g.dc):''}</div><div class="muted" style="font-size:11px;margin-top:3px">${g.rows.map(r=>r.brand+' '+fmt(r.kg)).join(' · ')}</div></div>${ed?`<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><input type="date" id="dlv_${g.dispId}" value="${TODAY.toISOString().slice(0,10)}"><button class="green sm" onclick="markDelivered('${g.dispId}',document.getElementById('dlv_${g.dispId}').value)">Mark delivered</button></div>`:''}</div></div>`).join(''):'';

   ${histHtml}

       <tbody>${_sr.view.length?_sr.view.map(s=>`<tr><td class="muted">${s.dispatch||'—'}${s.time?' '+s.time:''}</td><td>${s.po}</td><td>${s.brand}</td><td class="num">${fmt(s.kg)}</td><td class="num">${packsCount((+s.pack||linePackSize(s.po,s.brand)),s.kg)!=null?fmt(packsCount((+s.pack||linePackSize(s.po,s.brand)),s.kg)):'\u2014'}</td><td>${s.destination||'—'}</td><td>${s.vehicle||'—'}${s.carrier?(' · '+s.carrier):''}</td><td>${s.dc||'—'}</td><td>${s.bilty||'—'}</td><td class="muted">${s.delivered||'—'}</td></tr>`).join(''):'<tr><td colspan="10" class="muted">No shipments match.</td></tr>'}</tbody></table></div>${regPager('shiplog',_sr.pages)}`)}`;

function seedPackForBrand(brand){ try{ const by=(SEED&&SEED.catalog&&SEED.catalog.brandsByClient)||{}; for(const k in by){ const hit=(by[k]||[]).find(x=>x.brand===brand); if(hit&&+hit.pack>0) return +hit.pack; } }catch(e){} return 0; }
function packsCount(ps,kg){ ps=+ps||0; return ps>0?Math.ceil((+kg||0)/ps):null; }
function linePackSize(po,brand){ const o=(state.orders||[]).find(x=>x.po===po); const l=o&&o.lines.find(x=>x.brand===brand); return (l&&+l.pack)||seedPackForBrand(brand)||0; }
function shipPacksText(){ const ps=+shipForm.pack||0,q=+shipForm.qty||0; return ps>0?('\u2248 '+fmt(Math.ceil(q/ps))+' packs'):'pack size not set'; }
let shipForm={};
function openShip(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); const rem=Math.max(0, Math.min(l.packed||0, lineQAPackedKg(o,l)) - (l.dispatched||0));
  shipForm={oid,lid,pack:(+l.pack||seedPackForBrand(l.brand)||0),qty:Math.round(rem),date:TODAY.toISOString().slice(0,10),time:'',dest:o.client,carrier:'',vehicle:'',dc:'',bilty:'',delivered:'',remarks:''};
  renderShipModal(); $('modalBg').classList.add('open'); }
function renderShipModal(){ const o=state.orders.find(x=>x.id===shipForm.oid); const l=o.lines.find(x=>x.id===shipForm.lid); const rem=Math.max(0, Math.min(l.packed||0, lineQAPackedKg(o,l)) - (l.dispatched||0)); const ps=+shipForm.pack||0;
  $('modal').innerHTML=`<div class="mh"><h2>Record shipment</h2><div class="sub">${o.po} · ${l.brand} · up to ${fmt(rem)} Kg/L${ps>0?` · \u2248 ${fmt(Math.ceil(rem/ps))} packs (${fmt(ps)} Kg/L/pack)`:''}</div></div>
   <div class="mb"><div class="formgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
     <div class="fld"><label>Qty shipped (Kg/L)</label><input type="number" value="${shipForm.qty}" oninput="shipForm.qty=this.value;{const e=document.getElementById('ship_packs');if(e)e.textContent=shipPacksText();}"><div class="muted" id="ship_packs" style="font-size:11px;margin-top:4px">${shipPacksText()}</div></div>
     <div class="fld"><label>Date</label><input type="date" value="${shipForm.date}" onchange="shipForm.date=this.value"></div>
     <div class="fld"><label>Destination</label><input type="text" value="${shipForm.dest}" oninput="shipForm.dest=this.value"></div>
     <div class="fld"><label>Carrier</label><input type="text" value="${shipForm.carrier}" oninput="shipForm.carrier=this.value" placeholder="transporter"></div>
     <div class="fld"><label>Vehicle #</label><input type="text" value="${shipForm.vehicle}" oninput="shipForm.vehicle=this.value"></div>
     <div class="fld"><label>DC number</label><input type="text" value="${shipForm.dc}" oninput="shipForm.dc=this.value"></div>
     <div class="fld"><label>Bilty / reference</label><input type="text" value="${shipForm.bilty}" oninput="shipForm.bilty=this.value"></div>
     <div class="fld"><label>Delivered date (optional)</label><input type="date" value="${shipForm.delivered}" onchange="shipForm.delivered=this.value"></div>
     <div class="fld" style="grid-column:1 / -1"><label>Remarks</label><input type="text" value="${shipForm.remarks}" oninput="shipForm.remarks=this.value"></div>
   </div></div>
   <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button onclick="saveShip()">Save shipment</button></div>`; }
function saveShip(){ if(!canEdit(['Supply Chain'])){toast('Supply Chain only');return;} const o=state.orders.find(x=>x.id===shipForm.oid); const l=o.lines.find(x=>x.id===shipForm.lid); const rem=Math.max(0, Math.min(l.packed||0, lineQAPackedKg(o,l)) - (l.dispatched||0));
  const kg=Math.min(+shipForm.qty||0,rem); if(kg<=0){toast('Enter a valid qty');return;}
  state.shipments.unshift({po:o.po,brand:l.brand,kg,pack:(+l.pack||seedPackForBrand(l.brand)||0),dispatch:shipForm.date,destination:shipForm.dest,carrier:shipForm.carrier,vehicle:shipForm.vehicle,dc:shipForm.dc,bilty:shipForm.bilty,delivered:shipForm.delivered||null,remarks:shipForm.remarks,by:state.role});
  l.dispatched=(l.dispatched||0)+kg; l.dispatchDate=l.dispatchDate||shipForm.date;
  if(shipForm.delivered){ l.delivered=(l.delivered||0)+kg; l.deliveredDate=shipForm.delivered; }
  const wasClosed=o.lines.every(x=>stageOf(o)==='Delivered');
  logAction(`Shipped ${fmt(kg)} Kg/L of ${l.brand} for ${o.po}${shipForm.dc?(' · DC '+shipForm.dc):''}`);
  (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'Shipment',po:o.po,brand:l.brand,field:'Dispatched',old:'',val:fmt(kg)+' Kg/L · '+(shipForm.vehicle||'')+' · DC '+(shipForm.dc||'-')});
  save(); closeModal(); render(); }

/* ===== Pre-shipment inspection (inspect-then-ship): packed material is inspected by quantity
