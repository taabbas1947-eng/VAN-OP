<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAN Order Control Tower</title>
<!-- VAN build: 2026-06-04 first-push test -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f3f6fb; --line:#dde3ec; --line2:#eaeef4;
  --navy:#1d4ed8; --navy2:#1e40af; --navy-50:#eef4ff; --navy-100:#d8e4fe;
  --green:#16a34a; --green2:#15803d; --leaf:#22c55e; --green-50:#ecfdf3;
  --teal:#0e9aa7; --amber:#f59e0b; --amber-50:#fef6e7; --red:#dc2626; --red-50:#fef2f2;
  --blue:#1d4ed8; --purple:#7a5bd0;
  --txt:#111827; --txt2:#334155; --mut:#64748b;
  --radius:15px; --radius-sm:10px;
  --sh-sm:0 1px 2px rgba(15,23,42,.07),0 1px 1px rgba(15,23,42,.04);
  --sh:0 3px 12px rgba(15,23,42,.10),0 1px 3px rgba(15,23,42,.06);
  --sh-lg:0 20px 50px rgba(15,23,42,.20);
  --ring:0 0 0 3px rgba(29,78,216,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
h1,h2,h3{margin:0;letter-spacing:-.02em}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d6deea;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#c2cdde}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:238px;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 15px;border-bottom:1px solid var(--line2);margin-bottom:12px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(155deg,var(--navy),#3b66e0);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(29,78,216,.28)}
.brand .nm{font-size:15.5px;font-weight:800;color:var(--txt);line-height:1.05;letter-spacing:-.02em}
.brand .nm span{display:block;font-size:9px;font-weight:700;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--txt2);cursor:pointer;font-size:13px;font-weight:600;transition:.13s;position:relative}
.nav a:hover{background:var(--panel2);color:var(--txt)}
.nav a.active{background:var(--navy-50);color:var(--navy);font-weight:700}
.nav a.active::before{content:'';position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--navy)}
.nav a .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--mut)}
.nav a.active .ic{color:var(--navy)}
.nav a .ic svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav a .lk{margin-left:auto;font-size:8.5px;color:var(--navy);background:#fff;border:1px solid var(--navy-100);border-radius:6px;padding:1px 6px;font-weight:700;letter-spacing:.3px}
.side .foot{padding-top:12px;border-top:1px solid var(--line2);margin-top:8px}
/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 24px;background:#ffffff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h2{font-size:18px;font-weight:800;color:var(--txt);letter-spacing:-.025em}
.topbar .sub{font-size:11.5px;color:var(--mut);margin-top:2px;font-weight:500}
.rolebox{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 5px;box-shadow:var(--sh-sm)}
.rolebox label{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.rolebox .av{width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}
.helpbar{display:flex;align-items:center;gap:9px;padding:7px 24px;background:var(--navy-50);border-bottom:1px solid var(--navy-100);color:#1e3a8a;font-size:12px;line-height:1.45;font-weight:500}
.helpbar:empty{display:none}
.helpbar::before{content:'';flex-shrink:0;width:15px;height:15px;background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d4ed8' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><line x1='12' y1='16' x2='12' y2='12'/><line x1='12' y1='8' x2='12.01' y2='8'/></svg>")}
.helpbar b{font-weight:700;color:var(--navy)}
.wrap{padding:18px 24px;flex:1;max-width:1440px;margin:0 auto;width:100%}
/* ---------- controls ---------- */
select,input,button,textarea{font-family:inherit}
select,input[type=text],input[type=number],input[type=date],textarea{background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;outline:none;transition:.14s}
select:hover,input:hover{border-color:#d3dceb}
select:focus,input:focus,textarea:focus{border-color:var(--navy);box-shadow:var(--ring)}
.rolebox select{background:transparent;border:none;padding:6px 6px;font-weight:700;color:var(--navy)}
.rolebox select:focus{box-shadow:none}
button{background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 17px;font-size:13px;font-weight:700;cursor:pointer;transition:.14s;box-shadow:var(--sh-sm);letter-spacing:-.01em}
button:hover{background:var(--navy2);transform:translateY(-1px);box-shadow:var(--sh)}
button:active{transform:translateY(0)}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
button.ghost:hover{background:var(--panel2);border-color:#d3dceb}
button.green{background:var(--green)}button.green:hover{background:var(--green2)}
button.sm{padding:7px 12px;font-size:12px;border-radius:9px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
/* ---------- cards & kpis ---------- */
.row{display:flex;gap:14px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.dgrid .card{margin:0}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh-sm)}
.card h3{font-size:14px;margin-bottom:14px;color:var(--txt);font-weight:700;display:flex;align-items:center;letter-spacing:-.02em}
.card h3 .hint{font-weight:500;color:var(--mut);font-size:11.5px;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;transition:.16s}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--navy),#5b8def)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kpi .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.kpi .v{font-size:23px;font-weight:800;margin-top:5px;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.kpi .d{font-size:10.5px;color:var(--mut);margin-top:6px;font-weight:500}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#475569;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel2);z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;color:var(--txt2)}
td b,td>b{color:var(--txt)}
tr.clk{cursor:pointer;transition:.1s}
tr.clk:hover td{background:var(--navy-50)}
.empty{text-align:center;padding:30px 18px;color:var(--mut);font-size:12.5px}
.empty .ei{width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:#94a3b8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}
th.num,th.ctr{text-align:inherit}
.muted{color:var(--mut)}
.barmini{height:7px;background:#eaeef5;border-radius:6px;overflow:hidden;min-width:60px;display:inline-block;vertical-align:middle}
.barmini>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--leaf));border-radius:6px}
.pill{padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block;letter-spacing:.1px;box-shadow:inset 0 0 0 1px rgba(15,23,42,.04)}
.tag{font-size:9.5px;color:var(--navy);border:1px solid var(--navy-100);background:var(--navy-50);border-radius:6px;padding:1px 7px;font-weight:700;text-transform:none;letter-spacing:0}
.tag2{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
/* ---------- banners ---------- */
.banner{border-radius:11px;padding:9px 14px;margin-bottom:13px;font-size:12px;line-height:1.5;border:1px solid var(--line);font-weight:500}
.banner.info{background:linear-gradient(90deg,var(--navy-50),#f3f8ff);border-color:var(--navy-100);color:#284b91}
.banner.warn{background:var(--amber-50);border-color:#f0d6a8;color:#8a5712}
.banner b{font-weight:700}
/* ---------- forms ---------- */
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld select,.fld input,.fld textarea{width:100%;min-width:0;box-sizing:border-box}
.fld select{text-overflow:ellipsis}
.fld label{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
/* ---------- PO parent / SKU rows ---------- */
tr.po-row>td{border-top:1px solid var(--line);font-weight:600;background:#fff}
tr.po-row:hover>td{background:var(--navy-50);cursor:pointer}
tr.po-row.exp>td{background:var(--navy-50)}
tr.sku-row>td{background:var(--panel2);font-size:12px;color:var(--txt2);border-bottom:1px solid var(--line2)}
tr.sku-row:hover>td{background:#eef4ff;cursor:pointer}
td.skufirst{padding-left:10px;box-shadow:inset 3px 0 0 var(--navy)}
.skuarrow{color:var(--navy);opacity:.5;margin-right:5px}
.chev{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:6px;background:var(--navy-50);color:var(--navy);font-size:10px;transition:.12s}
.po-row:hover .chev{background:var(--navy-100)}
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.fixedtbl{table-layout:fixed}
.fixedtbl td,.fixedtbl th{overflow:hidden;text-overflow:ellipsis}
.fixedtbl input,.fixedtbl select{width:100%;padding:7px 8px}
/* ---------- drawer ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(17,30,66,.42);display:none;z-index:50;backdrop-filter:blur(2px)}
.drawer-bg.open{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;height:100vh;width:660px;max-width:97vw;background:var(--bg);border-left:1px solid var(--line);overflow:auto;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-lg);z-index:51}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);z-index:2}
.drawer .dh h2{color:var(--navy);font-size:17px}
.drawer .db{padding:22px 24px}
/* ---------- lifecycle field grid ---------- */
.ff{display:flex;flex-direction:column;gap:4px}
.ff label{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;font-weight:700;display:flex;gap:5px;align-items:center}
.ff .lk2{font-size:8px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;text-transform:none;letter-spacing:0;font-weight:600}
.ff input,.ff select{padding:7px 9px;font-size:12px;width:100%;border-radius:9px}
.fval{padding:7px 9px;font-size:12px;border-radius:9px;border:1px solid var(--line);min-height:32px;display:flex;align-items:center}
.f-input{background:#fff8d8;border-color:#e7cf6f}
.f-input:focus{box-shadow:0 0 0 3px rgba(201,154,0,.18)}
.f-done{background:var(--green-50);border-color:#b4e0c2}
.f-auto{background:#eef1f7;color:#6b778c;border-color:#e0e6f0}
.f-plant{background:#ffefdc;border-color:#edca93}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.fgroup{margin-bottom:15px}
.fgroup .gt{font-size:10.5px;font-weight:800;color:var(--navy);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.calcrow{display:flex;flex-wrap:wrap;gap:7px 18px;font-size:11.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-top:10px;box-shadow:var(--sh-sm)}
.calcrow b{color:var(--navy);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:10.5px;color:var(--mut);margin:6px 0 12px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1px solid rgba(0,0,0,.06)}
@media(max-width:760px){.fgrid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}}
.stp .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;background:#e8edf4;color:var(--mut)}
.stp.done .dot{background:var(--green);color:#fff}
.hide{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;border-radius:12px;padding:12px 22px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:.2s;box-shadow:var(--sh-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,30,66,.5);display:none;z-index:60;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex;align-items:center;justify-content:center;animation:fade .18s ease}
.modal{background:#fff;border-radius:16px;width:580px;max-width:95vw;max-height:90vh;overflow:auto;box-shadow:var(--sh-lg)}
.modal.coa{width:920px;max-width:97vw}
.coasheet{border:1.5px solid #111;font-family:"Times New Roman",Georgia,serif;color:#111;font-size:12.5px;background:#fff}
.coasheet .rh{display:flex;border-bottom:1.5px solid #111}
.coasheet .rh .c1{width:96px;border-right:1px solid #111;text-align:center;padding:6px}
.coasheet .rh .c2{flex:1;text-align:center;padding:6px}
.coasheet .rh .c2 h1{margin:0;font-size:16px;color:#0a4b8c;letter-spacing:.4px}
.coasheet .rh .c3{width:150px;border-left:1px solid #111;padding:6px;font-size:10px}
.coasheet .rh .c4{width:104px;border-left:1px solid #111;text-align:center;padding:5px;font-size:8.5px}
.coasheet .types{display:flex;gap:34px;justify-content:center;padding:7px;border-bottom:1px solid #111;font-weight:700;font-size:12px}
.coasheet .iss{padding:5px 12px;border-bottom:1px solid #111}
.coasheet .meta{display:flex;border-bottom:1.5px solid #111}
.coasheet .meta .col{flex:1;padding:6px 12px;min-width:0}
.coasheet .ml{display:flex;align-items:center;gap:6px;margin:3px 0}
.coasheet .ml .lb{white-space:nowrap;font-weight:600;font-size:11.5px}
.coasheet input.sf{border:0;border-bottom:1px solid #999;border-radius:0;background:#fffdf2;font-family:inherit;font-size:12px;padding:1px 4px;flex:1;min-width:30px;outline:none}
.coasheet input.sf:disabled{background:transparent;border-bottom-color:#ccc;color:#111}
.coasheet input.sf.req{background:#ffeeea}
.coasheet table{width:100%;border-collapse:collapse}
.coasheet th,.coasheet td{border:1px solid #999;padding:3px 6px;font-size:11.5px;text-align:left}
.coasheet thead th{background:#f0f0f0;text-align:center}
.coasheet tr.grp td{font-weight:700;background:#fafafa;font-size:10.5px}
.coasheet select{padding:2px 4px;font-size:11px}
.coasheet .disc{padding:7px 12px;border-top:1.5px solid #111;font-size:9px;line-height:1.5}
.coasheet .signs{display:flex;border-top:1.5px solid #111}
.coasheet .signs .sg{flex:1;text-align:center;padding:12px 6px 8px;border-right:1px solid #111}
.coasheet .signs .sg:last-child{border-right:0}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal .mh h2{font-size:16px;color:var(--navy)}
.modal .mh .sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.modal .mb{padding:18px 22px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.seg{display:flex;gap:8px;margin-bottom:6px}
.seg .opt{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:12px 10px;text-align:center;cursor:pointer;font-weight:700;font-size:13px;transition:.12s;background:#fff;color:var(--txt2)}
.seg .opt:hover{border-color:#cdd8ea}
.seg .opt.on.full{border-color:var(--green);background:var(--green-50);color:var(--green2)}
.seg .opt.on.partial{border-color:var(--amber);background:var(--amber-50);color:var(--amber)}
.seg .opt.on.short{border-color:var(--red);background:var(--red-50);color:var(--red)}
.seg .opt .em{font-size:18px;display:block;margin-bottom:3px}
.prline{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.prline select{flex:1}.prline input{width:110px}
.prline .rmstk{font-size:10.5px;color:var(--mut);width:96px;text-align:right}
.prline .x{cursor:pointer;color:var(--red);font-weight:700;width:20px;text-align:center}
@media print{.side,.topbar,.helpbar,.seg,.filterbar,button{display:none!important}.wrap{padding:0;max-width:none}.card{box-shadow:none;break-inside:avoid}}
.authscreen{position:fixed;inset:0;background:linear-gradient(160deg,#e8f0ff,#f8fafc);display:none;align-items:center;justify-content:center;z-index:200}
.authcard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-lg);padding:30px 28px;width:360px;max-width:92vw}
.authcard .lhdr{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.authcard .lmark{width:44px;height:44px;border-radius:12px;background:linear-gradient(155deg,var(--navy),#3b66e0);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(29,78,216,.3)}
.authcard .lsub{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.authcard label{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin:14px 0 5px}
.authcard input{width:100%}
.authcard .lbtn{width:100%;margin-top:18px;padding:12px;font-size:14px}
.autherr{background:var(--red-50);color:var(--red);border:1px solid #f4c9c9;border-radius:9px;padding:9px 12px;font-size:12px;margin-top:13px;font-weight:600}
.rolebox{gap:9px}
.flowstrip{display:flex;align-items:stretch;gap:5px;flex-wrap:wrap}
.flowstrip .fstep{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;min-width:104px}
.flowstrip .fstep b{font-size:12px;color:var(--txt);font-weight:700}
.flowstrip .fstep i{font-style:normal;font-size:10px;color:var(--mut)}

  else { const a=$('authScreen'),sh=$('appShell'); if(sh)sh.style.display='none'; if(a){ a.style.display='flex'; renderLogin('Server data looks incomplete \u2014 not overwriting. Please refresh.'); } setTimeout(bootState,4000); return; }
  sessionInit(state); restoreSession(); renderApp(); startSync();

async function saveNow(){ if(!_token) return; try{
    const r=await fetch('/api/state',{method:'POST',headers:Object.assign({'Content-Type':'application/json','X-Base-Rev':String(_rev)},authHdr()),body:JSON.stringify(dataOnly(state))});
    if(r.status===401){ setSession('',null); renderApp(); return; }
    if(r.status===409){
      // Someone else saved since we loaded. Do NOT overwrite their data — pull the latest
      // and ask the user to re-enter their last change. Protects committed data from loss.
      const j=await r.json().catch(()=>null);
      if(j && j.data && j.data.orders){ const cu=state.currentUser, sc=state.screen, ro=state.role, ex=state.expanded; state=ensureState(j.data); state.currentUser=cu; state.role=ro; state.screen=sc; state.expanded=ex||{}; _rev=j.rev; if(authed()) render(); }
      toast('Someone else just saved — screen refreshed. Please re-enter your last change.');

    }
    if(r.ok){ const j=await r.json(); if(j&&typeof j.rev==='number') _rev=j.rev; }
  }catch(e){} }

/* ===================== ENGINE A — RM ===================== */
function needFor(order){ // {rm: kg}
  const need={};
  order.lines.forEach(l=>{
    const rec = SEED.baseRecipes[l.base] || {};
    for(const rm in rec){ need[rm]=(need[rm]||0) + l.ordered*rec[rm]; }
  });
  return need;
}
function rmCheck(order, s){
  s=s||state; const need=needFor(order); const short=[];
  for(const rm in need){ const have=s.rawStock[rm]??0; if(need[rm]>have+0.001) short.push({rm, need:need[rm], have, gap:need[rm]-have}); }
  return { need, short, ok: short.length===0 };
}

/* ===================== ENGINE B — stage/fulfilment ===================== */
const sum=(arr,f)=>arr.reduce((a,x)=>a+f(x),0);
const STAGE_ORDER=['New','RM / Procurement','SO Created','PR Raised','RM Ready','In Production','Produced','QC Passed','Dispatched','Delivered'];
function agg(o){ return { ordered:sum(o.lines,l=>l.ordered), produced:sum(o.lines,l=>l.produced),
  packed:sum(o.lines,l=>l.packed), dispatched:sum(o.lines,l=>l.dispatched), delivered:sum(o.lines,l=>l.delivered) }; }
function lineStage(o,l){
  if(l.deliveredDate && (l.delivered||0)>=l.ordered-0.5) return 'Delivered';
  if(l.dispatchDate||(l.dispatched||0)>0) return 'Dispatched';
  if(l.qcPass) return 'QC Passed';
  if(l.prodComplete) return 'Produced';
  if(l.prodStart) return 'In Production';
  if(l.rmReady) return 'RM Ready';
  if(l.prRaised) return 'PR Raised';
  if(l.soCreated) return 'SO Created';
  return 'New';
}
function stageOf(o){ if(!o.lines||!o.lines.length) return 'New';
  const idx=o.lines.map(l=>STAGE_ORDER.indexOf(lineStage(o,l))); return STAGE_ORDER[Math.min.apply(null,idx)]; }
function lineOverdue(o,l){ return !!l.committed && (l.delivered||0)<l.ordered-0.5 && new Date(l.committed)<TODAY; }
function isOverdue(o){ return o.lines.some(l=>lineOverdue(o,l)); }
function daysOver(o){ const ds=o.lines.filter(l=>lineOverdue(o,l)).map(l=>Math.round((TODAY-new Date(l.committed))/86400000));
  return ds.length?Math.max.apply(null,ds):(o.promised?Math.round((TODAY-new Date(o.promised))/86400000):0); }
const STAGE_COLOR={'New':'--mut','RM / Procurement':'--amber','SO Created':'--blue','PR Raised':'--blue','RM Ready':'--blue','In Production':'--purple','Produced':'--purple','QC Passed':'--leaf','Dispatched':'--green2','Delivered':'--green','Ready to Produce':'--blue','Packed':'--leaf','Closed':'--green'};

  cfoApproved:'CFO',

};

/* ---- per-line calculations (read-only) ---- */
function dts(a,b){ if(!a||!b)return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function shipFor(o,l){ return (state.shipments||[]).filter(s=>s.po===o.po && (s.brand===l.brand)); }
function calcLine(o,l){
  const sh=shipFor(o,l);
  const deliveredQty=sh.reduce((a,s)=>a+(s.kg||0),0) || l.dispatched || 0;
  const lastDisp=sh.map(s=>s.dispatch).filter(Boolean).sort().slice(-1)[0]||l.dispatchDate||null;
  const lastDeliv=sh.map(s=>s.delivered).filter(Boolean).sort().slice(-1)[0]||l.deliveredDate||null;
  const totalCycle=dts(o.received, l.deliveredDate);
  const variance = (l.deliveredDate&&l.committed)? dts(l.committed,l.deliveredDate) : null;
  const overdue = lineOverdue(o,l);
  return {
    poToSo:dts(o.received,l.soCreated), rmDays:dts(l.prRaised,l.rmReady),
    prodDays:dts(l.prodStart,l.prodComplete), qcToDeliv:dts(l.qcPass,l.deliveredDate),
    totalCycle, variance,
    onTime: l.deliveredDate ? (variance<=0?'On Time':'Late') : (overdue?'Delayed':'On Track'),
    daysOverdue: overdue? Math.round((TODAY-new Date(l.committed))/86400000) : 0,
    deliveredQty, remaining: Math.max(0,(l.ordered||0)-deliveredQty),
    shipments: sh.length, lastDispatch:lastDisp, lastDelivered:lastDeliv,
  };
}

}

function dfSubmitProduction(){
  if(!dfReasonOk()) return toast('Reason is required');
  const q=+dfForm.qty||0; if(q<=0) return toast('Enter a quantity');
  const d=dfForm.date||TODAY.toISOString().slice(0,10); const sh=dfForm.shift||'Morning'; const inc=dfForm.incharge||'';
  if(dfForm.kind==='bulk'){
    const base=dfForm.base; if(!base) return toast('Pick a base product');
    let b=(state.batches||[]).find(x=>x.base===base&&x.status==='open');
    if(b){ b.producedKg=(b.producedKg||0)+q; } else { state.batches.unshift({id:'B'+(state.seq++),batchNo:'',kind:'bulk',type:'stock',base,brand:null,plannedKg:q,producedKg:q,packedKg:0,status:'closed',openedDate:d,closedDate:d,by:state.role,recon:true}); }
    state.productionLog.unshift({date:d,base,kg:q,by:state.role,shift:sh,incharge:inc,recon:true});
    reconLog(`Added missing production: ${fmt(q)} Kg/L bulk ${base} — ${dfForm.reason}`, d);
  } else {
    const o=state.orders.find(x=>x.id===dfForm.oid); const l=o&&o.lines.find(x=>x.id===dfForm.lid);
    if(!l) return toast('Pick PO and product');
    l.produced=(l.produced||0)+q; l.prodStart=l.prodStart||d; if((l.produced||0)>=l.ordered-0.001) l.prodComplete=l.prodComplete||d;
    state.productionLog.unshift({date:d,base:l.base,kg:q,by:state.role,po:o.po,brand:l.brand,shift:sh,incharge:inc,recon:true});
    reconLog(`Added missing production: ${fmt(q)} Kg/L ${l.brand} on ${o.po} — ${dfForm.reason}`, d);
  }
  save(); toast('Production backfilled'); dfBack();
}
function dfSubmitPacking(){
  if(!dfReasonOk()) return toast('Reason is required');

function dfSubmitPO(){
  if(!dfReasonOk()) return toast('Reason is required');
  const po=(dfForm.po||'').trim(), client=(dfForm.client||'').trim(), brand=(dfForm.brand||'').trim(), ord=+dfForm.ordered||0;
  if(!po) return toast('Enter PO #'); if(!client) return toast('Enter customer'); if(!brand) return toast('Enter product/brand'); if(ord<=0) return toast('Enter ordered qty');
  if(state.orders.some(o=>o.po===po)) return toast('A PO with that number already exists');
  const base=((typeof SEED!=='undefined'&&SEED.brandMap&&SEED.brandMap[brand]&&SEED.brandMap[brand].base))||brand;
  const id='O'+(state.seq++);
  state.orders.unshift({id,po,client,channel:dfForm.channel||'White Label',priority:dfForm.priority||'Normal',promised:dfForm.promised||'',received:dfForm.received||'',rmDecision:'pending',recon:true,

  reconLog(`Added missing PO ${po} · ${client} · ${brand} ${fmt(ord)} Kg/L (received ${dfForm.received||'—'}) — ${dfForm.reason}`, dfForm.received);
  save(); toast('PO added'); dfBack();
}
function dfSubmitCorrect(){
  const o=state.orders.find(x=>x.id===dfForm.oid); if(!o) return toast('Pick a PO');
  const reason=(($('co_reason')&&$('co_reason').value)||'').trim(); if(!reason) return toast('Reason is required');
  let n=0;
  const setO=(field,val,label)=>{ const old=o[field]||''; val=(val==null?'':val); if(String(old)!==String(val)){ o[field]=val; reconLog(`CORRECT ${o.po} ${label}: ${old||'—'} → ${val||'—'} — ${reason}`); n++; } };
  setO('client',(($('co_client')&&$('co_client').value)||'').trim(),'customer');
  setO('channel',($('co_channel')&&$('co_channel').value),'channel');
  setO('priority',($('co_priority')&&$('co_priority').value),'priority');
  setO('received',($('co_received')&&$('co_received').value),'received date');
  setO('promised',($('co_promised')&&$('co_promised').value),'promised date');
  o.lines.forEach(l=>{ [['ordered','Ordered'],['produced','Produced'],['packed','Packed'],['dispatched','Dispatched'],['delivered','Delivered']].forEach(([field,label])=>{
    const el=$('cl_'+field+'_'+l.id); if(!el) return; const nv=+el.value||0; const old=+l[field]||0;
    if(Math.abs(nv-old)>0.001){ l[field]=nv; reconLog(`CORRECT ${o.po} · ${l.brand} ${label}: ${fmt(old)} → ${fmt(nv)} — ${reason}`); n++; }
  }); });
  if(!n) return toast('No changes to apply');
  save(); toast(n+' correction(s) applied'); dfBack();
}

  if(ch==='Distributor') return [{id:'BKK',label:'BKK',brandKey:'BKK'}];

function genPO(recv){
  const d=recv?new Date(recv):TODAY; const ym=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0');

function submitPO(){

  state._lastKam=$('e_kam').value;
  const recv=$('e_recv').value; const po=isManualPO()?$('e_po').value.trim():genPO(recv);
  const id='O'+(state.orders.length+1)+'_'+state.seq++;
  const ord={ id, po, client:entryClient, channel:entryChannel, vgreenSub:entryVsub||null, kam:$('e_kam').value.trim(),
    priority:$('e_pri').value, promised:$('e_prom').value, received:recv, rmDecision:'pending',
    lines:lines.map((l,j)=>{const det=detailForBrand(l.brand);return {id:id+'L'+j, brand:l.brand, base:det.base||l.brand, pack:+l.pack||det.pack||null, note:l.note||'', committed:l.committed||$('e_prom').value, ordered:+l.qty, printPrice:+l.price||0, produced:0,packed:0,dispatched:0,delivered:0};}) };
  ord.totalOrdered=ord.lines.reduce((a,l)=>a+l.ordered,0);
  ord.rmDecision='pending';
  state.orders.unshift(ord);
  logAction(`Created PO ${po} (${entryClient}, ${entryChannel}, ${fmt(ord.totalOrdered)} Kg/L)`);
  entryChannel='';entryClient='';entryVsub='';entryLines=[{brand:'',qty:'',pack:'',note:'',committed:'',price:''}]; save();

}

/* ===================== PO TRACKER — control tower (UI redesign) ===================== */
let trkSearch='';
const BUCKETS=['PO Created','RM Check','Production','Lab QC','QA Pre-shipment','Shipment','Delivered'];
const BUCKET_META={
 'PO Created':{c:'--mut',owner:'Supply Chain',where:'My Actions — Acknowledge & RM Check'},
 'RM Check':{c:'--amber',owner:'Supply Chain',where:'Open PO → RM Check'},
 'Production':{c:'--blue',owner:'Production',where:'Production screen'},
 'Lab QC':{c:'--purple',owner:'Lab Rep',where:'QC · Pre-shipment → Lab QC'},
 'QA Pre-shipment':{c:'--amber',owner:'QA Inspector',where:'QC · Pre-shipment → QA Pre-shipment'},
 'Shipment':{c:'--green2',owner:'Supply Chain',where:'Shipments screen'},
 'Delivered':{c:'--green',owner:'—',where:'—'}
};
function lineBucket(o,l){
 if(l.deliveredDate && (l.delivered||0)>=l.ordered-0.5) return 'Delivered';
 if((l.dispatched||0)>0||l.dispatchDate) return 'Shipment';
 if(l.qcPass) return 'Shipment';
 if(l.qcLab&&l.qcLab.pass) return 'QA Pre-shipment';
 if((l.packed||0)>=l.ordered-0.5) return 'Lab QC';
 if((l.produced||0)>0||l.prodStart) return 'Production';
 if(l.rmReady) return 'Production';
 if(l.prRaised) return 'RM Check';
 return 'PO Created';
}
function orderBucket(o){ if(!o.lines||!o.lines.length) return 'PO Created'; const idx=o.lines.map(l=>BUCKETS.indexOf(lineBucket(o,l))); return BUCKETS[Math.min.apply(null,idx)]; }
function attnCounts(){ let delayed=0,rmblock=0,prod=0,qc=0,qahold=0,ready=0;
  state.orders.forEach(o=>{ const b=orderBucket(o);
    if(isOverdue(o)&&b!=='Delivered')delayed++;
    if(b==='RM Check')rmblock++;
    if(b==='Production')prod++;
    if(b==='Lab QC'||b==='QA Pre-shipment')qc++;
    if(o.lines.some(l=>(l.qcLab&&l.qcLab.fail)||(l.qcPhys&&l.qcPhys.fail)))qahold++;
    if(o.lines.some(l=>l.qcPass&&(l.dispatched||0)<(l.packed||0)-0.5))ready++; });
  return {delayed,rmblock,prod,qc,qahold,ready};
}
function trkMatch(o){ const b=orderBucket(o);
  switch(trkFilter){
    case 'open':return b!=='Delivered';
    case 'delivered':return b==='Delivered';
    case 'delayed':return isOverdue(o)&&b!=='Delivered';
    case 'rmblock':return b==='RM Check';
    case 'prod':return b==='Production';
    case 'qc':return b==='Lab QC'||b==='QA Pre-shipment';
    case 'qahold':return o.lines.some(l=>(l.qcLab&&l.qcLab.fail)||(l.qcPhys&&l.qcPhys.fail));
    case 'ready':return o.lines.some(l=>l.qcPass&&(l.dispatched||0)<(l.packed||0)-0.5);
    case 'myrole':return state.role==='COO'||BUCKET_META[b].owner===state.role;
    default:return true;
  }
}

  return lab+' '+qa; }
function trkTimeline(o){ const cur=BUCKETS.indexOf(orderBucket(o));
  const blocked=o.lines.some(l=>(l.qcLab&&l.qcLab.fail)||(l.qcPhys&&l.qcPhys.fail));

function screenTracker(){

  let list=state.orders.filter(o=>trkMatch(o));
  if(trkSearch){ const q=trkSearch.toLowerCase(); list=list.filter(o=>((o.po||'')+' '+(o.client||'')).toLowerCase().indexOf(q)>-1); }
  // Sort: earliest stage (new POs) at top → progressing by stage → Delivered at the bottom.

  list=list.slice().sort((a,b)=>{
    const ra=BUCKETS.indexOf(orderBucket(a)), rb=BUCKETS.indexOf(orderBucket(b));

function advanceLine(o,l,kind){

    state.productionLog.unshift({date:TODAY.toISOString().slice(0,10),base:l.base,kg:amt,by:state.role,po:o.po});
    logAction(`Produced ${fmt(amt)} Kg/L of ${l.brand} for ${o.po}`); }
  else if(kind==='pack'){ const amt=l.produced-l.packed; if(amt<=0.5)return; l.packed+=amt;
    state.packingLog.unshift({date:TODAY.toISOString().slice(0,10),po:o.po,brand:l.brand,kg:amt,by:state.role});
    logAction(`Packed ${fmt(amt)} Kg/L of ${l.brand} for ${o.po}`); }
  else if(kind==='ship'){ const amt=l.packed-l.dispatched; if(amt<=0.5)return; l.dispatched+=amt; l.delivered+=amt; l.dispatchDate=l.dispatchDate||TODAY.toISOString().slice(0,10); l.deliveredDate=TODAY.toISOString().slice(0,10);

}

function renderRMModal(){ const o=state.orders.find(x=>x.id===rmForm.oid); const l=o.lines.find(x=>x.id===rmForm.lid);

    <div class="opt short ${rmForm.status==='short'?'on':''}" onclick="rmSetStatus('short')"><span class="em">🔴</span>Short<span style="display:block;font-weight:500;font-size:10.5px">none / not enough</span></div></div>`;

  }
  $('modal').innerHTML=`<div class="mh"><h2>RM Check — ${l.brand}</h2><div class="sub">${o.po} · ${o.client} · ${fmt(l.ordered)} Kg/L to make · base: ${l.base}</div></div>
   <div class="mb">${seg}${body}<div class="muted" style="font-size:11px;margin-top:14px">Recording only — stock balances are not changed here. Actual receipts are handled in Sowaan.</div></div>
   <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="${rmForm.status==='full'?'green':''}" onclick="rmSubmit()">${rmForm.status==='full'?'Confirm — materials ready':'Raise PR'}</button></div>`;
}
function rmSubmit(){ const o=state.orders.find(x=>x.id===rmForm.oid); const l=o.lines.find(x=>x.id===rmForm.lid); const today=TODAY.toISOString().slice(0,10);
  l.rmCheck=today; l.rmStatus=rmForm.status;
  if(rmForm.status==='full'){ l.rmReady=today; l.canMakeKg=null; l.pr=null; logAction(`RM check ${o.po}·${l.brand}: in stock — materials ready`);
    (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'RM Check',po:o.po,brand:l.brand,field:'RM status',old:'',val:'In stock — ready'}); }
  else { const lines=rmForm.lines.filter(x=>x.rm&&+x.kg>0).map(x=>({rm:x.rm,kg:+x.kg}));
    l.prRaised=today; l.pr={lines,by:state.role,date:today}; l.canMakeKg=(rmForm.status==='partial'?(+rmForm.canMake||0):0); lines.forEach(x=>raisePR(x.rm,x.kg));
    logAction(`RM check ${o.po}·${l.brand}: ${rmForm.status}${rmForm.status==='partial'?' (can make '+fmt(l.canMakeKg)+' kg)':''} — PR raised, ${lines.length} material(s)`);
    (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'RM Check',po:o.po,brand:l.brand,field:'PR raised',old:'',val:lines.map(x=>x.rm+' '+x.kg+'kg').join(', ')}); }
  save(); closeModal(); openOrder(rmForm.oid); render();
}

<script>

      openBatches.map(b=>{const prod=b.producedKg||0,plan=b.plannedKg||0,rem=Math.max(0,plan-prod);

      `</tbody></table></div>`:'<div class="muted">No open batches. Open one above to start logging shift production.</div>')+`</div>`;
  const cbCard = doneBatches.length?`<div class="card"><h3>Production completed \u2014 at / over plan <span class="hint">${doneBatches.length} ready to close / pack</span></h3><div style="overflow:auto"><table><thead><tr><th>Batch #</th><th>Product</th><th class="num">Planned</th><th class="num">Produced</th><th class="num">% plan</th><th>Opened</th><th style="width:250px"></th></tr></thead><tbody>`+
    doneBatches.map(b=>{const prod=b.producedKg||0,plan=b.plannedKg||0,pct=plan?Math.round(prod/plan*100):0;
      const prodName=b.kind==='po'?`${b.brand||''} <span class="muted" style="font-size:11px">${b.base||''} \u00b7 ${b.po||''}</span>`:`<span class="muted">${b.base||''}</span> <span class="pill" style="background:var(--navy-50);color:var(--navy)">bulk</span>`;
      const pill=prod>plan+0.5?`<span class="pill" style="background:var(--amber-50);color:var(--amber);font-size:8.5px;padding:1px 5px">over plan</span>`:`<span class="pill" style="background:var(--green-50,#e7f6ec);color:var(--green2,#1a7f37);font-size:8.5px;padding:1px 5px">at plan</span>`;
      return `<tr><td><b>${b.batchNo||'\u2014'}</b></td><td>${prodName}</td><td class="num">${fmt(plan)}</td><td class="num">${fmt(prod)} ${pill}</td><td class="num">${pct}%</td><td class="muted">${b.openedDate||b.date||''}</td><td>${ed?`<button class="sm green" onclick="closeBatch('${b.id}')">Close batch \u2713</button> <button class="sm ghost" onclick="openShiftLog('${b.id}')">Log more (\u2264105%)</button>`:''}</td></tr>`;}).join('')+
    `</tbody></table></div></div>`:'';
  const logForm = prodMode==='po'
    ? `<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
         <div class="fld" style="flex:1;min-width:230px"><label>Purchase Order</label>
           <select id="pp_po" onchange="prodPOsel=this.value;render()"><option value="">— pick PO —</option>${pos.map(o=>`<option value="${o.id}" ${o.id===prodPOsel?'selected':''}>${o.po} · ${o.client}</option>`).join('')}</select></div>
         <div class="fld" style="flex:1;min-width:210px"><label>Product (as on the PO)</label>
           <select id="pp_line" ${selO?'':'disabled'}><option value="">${selO?'— pick product —':'pick PO first'}</option>${selO?selO.lines.map(l=>`<option value="${l.id}">${l.brand} (${fmt(l.produced||0)}/${fmt(l.ordered)} done)</option>`).join(''):''}</select></div>
         <div class="fld" style="width:170px"><label>Batch #</label><input type="text" id="nb_batch" placeholder="e.g. AB12345" oninput="batchNoFx(this)"></div>
         <button class="green" ${ed?'':'disabled'} onclick="openBatch('po')">Open batch</button></div>
       <div class="muted" style="font-size:11px;margin-top:8px">Opens a batch for this PO line (planned = remaining order qty). Log shift output against it in <b>Open batches</b> below; the PO auto-fills as shifts produce.</div>`
    : `<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
         <div class="fld" style="flex:1;min-width:240px"><label>Base Product (bulk)</label>
           <select id="pb_base"><option value="">— pick base —</option>${bases.map(b=>`<option>${b}</option>`).join('')}</select></div>
         <div class="fld" style="width:170px"><label>Batch #</label><input type="text" id="nb_batch_b" placeholder="e.g. AB12345" oninput="batchNoFx(this)"></div>
         <div class="fld" style="width:150px"><label>Planned (Kg/L)</label><input type="number" id="nb_planned" placeholder="Kg/L"></div>
         <button class="green" ${ed?'':'disabled'} onclick="openBatch('bulk')">Open batch</button></div>
       <div class="muted" style="font-size:11px;margin-top:8px">Opens a bulk-base batch with a planned target. Log shift output in <b>Open batches</b> below, then pack it once produced.</div>`;
  $('view').innerHTML=`
   ${ed?'':`<div class="banner warn">Owned by <b>Production</b>. You're <b>${state.role}</b> — viewing only.</div>`}
   <div class="card"><h3>Open a production batch</h3>
     <div class="seg" style="max-width:440px;margin-bottom:14px">
       <div class="opt full ${prodMode==='po'?'on':''}" onclick="prodMode='po';render()" style="padding:9px">Against a PO</div>
       <div class="opt full ${prodMode==='stock'?'on':''}" onclick="prodMode='stock';render()" style="padding:9px">Bulk Base Production</div>
     </div>${logForm}</div>
   ${obCard}
   ${cbCard}

   <div class="card"><h3>Bulk base produced — pack into brands <span class="hint">${openStock.length} base(s) ready</span></h3>
     ${openStock.length?`<table><thead><tr><th>Base</th><th class="num">Produced</th><th class="num">Packed</th><th class="num">Open</th><th>Date</th><th style="width:80px"></th></tr></thead>
       <tbody>${openStock.map(b=>`<tr><td>${b.base}</td><td class="num">${fmt(b.producedKg)}</td><td class="num">${fmt(b.packedKg)}</td><td class="num"><b>${fmt(b.producedKg-b.packedKg)}</b></td><td class="muted">${b.openedDate||b.closedDate||b.date||'\u2014'}</td><td>${ed?(batchLabApproved(b)?`<button class="sm" onclick="openPack('${b.id}')">Pack</button>`:`<span class="pill" style="background:var(--amber-50);color:var(--amber);font-size:9px">Lab QC pending</span>`):''}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">No open to-stock bulk.</div>'}</div>

   <div class="card"><h3>Orders in production <span class="hint">${work.length} open · produced → packed → QC</span></h3>
     ${work.length?`<table><thead><tr><th>PO</th><th>Product</th><th class="num">Ordered</th><th class="num">Produced</th><th class="num">Packed</th><th class="num">To produce</th><th class="num">To pack</th><th style="width:200px"></th></tr></thead>
       <tbody>${work.map(({o,l})=>{const rp=Math.max(0,l.ordered-(l.produced||0)), rk=Math.max(0,(l.produced||0)-(l.packed||0));
         let acts='';
         if(rk>0.5&&ed){ const appr=lineApprovedProducedKg(o,l)-(l.packed||0); if(appr>0.5) acts+=`<button class="sm green" onclick="openProdQty('${o.id}','${l.id}','pack')">Pack…</button> `; else acts+=`<span class="pill" style="background:var(--amber-50);color:var(--amber);font-size:9px">Lab QC pending</span> `; }
         if((l.packed||0)>=l.ordered-0.5) acts+=`<span class="pill" style="background:var(--green-50);color:var(--green2)">Fully packed → QC</span>`;
         else if(rk>0.5) acts+=`<span class="pill" style="background:var(--navy-50);color:var(--navy)">Awaiting packing</span>`;
         else acts+=`<span class="pill" style="background:var(--amber-50);color:var(--amber)">Awaiting production</span>`;
         return `<tr><td><b>${o.po}</b></td><td>${l.brand} <span class="muted" style="font-size:11px">${l.base}</span></td>
           <td class="num">${fmt(l.ordered)}</td><td class="num">${fmt(l.produced||0)}</td><td class="num">${fmt(l.packed||0)}</td>
           <td class="num"><b style="color:${rp>0?'var(--amber)':'var(--mut)'}">${fmt(rp)}</b></td><td class="num"><b style="color:${rk>0?'var(--amber)':'var(--mut)'}">${fmt(rk)}</b></td>
           <td>${acts}</td></tr>`;}).join('')}</tbody></table>`:'<div class="muted">No orders in production.</div>'}</div>

   ${(psEntries.length||allocs.length)?`<div class="card"><h3>Packed &amp; ready <span class="hint">finished goods available for orders</span></h3>
     ${psEntries.length?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:${allocs.length?'14px':'0'}">${psEntries.map(([b,v])=>`<span class="pill" style="background:var(--green-50);color:var(--green2);border:1px solid #bbe3c8">${b}: ${fmt(v)} Kg/L</span>`).join('')}</div>`:''}
     ${allocs.length?`<table><thead><tr><th>PO</th><th>Product</th><th class="num">Needed</th><th class="num">In stock</th><th style="width:160px"></th></tr></thead>
       <tbody>${allocs.map(a=>{const need=a.l.ordered-(a.l.packed||0);return `<tr><td><b>${a.o.po}</b></td><td>${a.l.brand}</td><td class="num">${fmt(need)}</td><td class="num">${fmt(a.av)}</td><td>${ed?`<button class="sm" onclick="allocateStock('${a.o.id}','${a.l.id}')">Allocate ${fmt(Math.min(a.av,need))} Kg/L</button>`:''}</td></tr>`;}).join('')}</tbody></table>`:''}
     </div>`:''}

   <div class="card"><h3>Daily output log <span class="hint">${state.productionLog.length} entries</span></h3>
     <div style="max-height:230px;overflow:auto"><table><thead><tr><th style="width:120px">Date</th><th>Base / product</th><th class="num" style="width:100px">Kg/L</th><th style="width:90px">Shift</th><th style="width:120px">Incharge</th><th style="width:100px">By</th>${state.role==='COO'?'<th style="width:90px"></th>':''}</tr></thead>
       <tbody>${recent.length?recent.map((p,i)=>`<tr><td class="muted">${p.date}</td><td>${p.brand?(p.brand+' '):''}<span class="muted">${p.base}</span>${p.po?(' · '+p.po):''}</td><td class="num">${fmt(p.kg)}</td><td class="muted">${p.shift||'—'}</td><td class="muted">${p.incharge||'—'}</td><td class="muted">${p.by}</td>${state.role==='COO'?`<td><button class="sm ghost" onclick="voidProdEntry(${i})">✕ remove</button></td>`:''}</tr>`).join(''):`<tr><td colspan="${state.role==='COO'?7:6}" class="muted">No output logged.</td></tr>`}</tbody></table></div></div>`;
}
function logProdStock(){ const base=$('pb_base').value, kg=+$('pb_kg').value, date=($('pb_date')&&$('pb_date').value)||TODAY.toISOString().slice(0,10);
  if(!base||!kg){toast('Pick base product and Kg/L');return;}

  state.batches.unshift({id:'B'+state.seq++,type:'stock',base,brand:null,producedKg:kg,packedKg:0,date,by:state.role});
  state.productionLog.unshift({date,base,kg,by:state.role}); logAction(`Produced ${fmt(kg)} Kg/L ${base} (bulk base)`); save(); toast('Logged'); render(); }
function logProdPO(){ const oid=$('pp_po').value, lid=$('pp_line').value, kg=+$('pp_kg').value, date=($('pp_date')&&$('pp_date').value)||TODAY.toISOString().slice(0,10);
  if(!oid||!lid||!kg){toast('Pick PO, product and Kg/L');return;}
  const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); const cap=Math.max(0,l.ordered-(l.produced||0));
  const q=Math.min(kg,cap); if(q<=0){toast('Already fully produced');return;}
  l.produced=(l.produced||0)+q; l.prodStart=l.prodStart||date; if(l.produced>=l.ordered-0.001) l.prodComplete=date;
  state.productionLog.unshift({date,base:l.base,kg:q,by:state.role,po:o.po,brand:l.brand});
  logAction(`Produced ${fmt(q)} Kg/L of ${l.brand} for ${o.po}`); save(); toast('Logged'); render(); }
/* COO-only: remove a mistaken production entry. Reverses the produced quantity
   (clamped so it never drops below what's already packed) and deletes the log row.
   Logged to the Action Log. Index maps directly to state.productionLog (recent = slice(0,15)). */
function voidProdEntry(i){
  if(state.role!=='COO'){ toast('Only COO can remove entries'); return; }
  const p=state.productionLog[i]; if(!p) return;
  const desc=`${p.date} · ${p.brand?p.brand+' ':''}${p.base||''}${p.po?(' · '+p.po):''} · ${fmt(p.kg)} Kg/L`;
  if(typeof confirm==='function' && !confirm('Remove this production entry?\n\n'+desc+'\n\nThis reverses the produced quantity. It cannot be undone here.')) return;
  if(p.po){
    const o=state.orders.find(x=>x.po===p.po);
    const l=o && (o.lines.find(x=>x.brand===p.brand) || o.lines.find(x=>x.base===p.base) || o.lines[0]);
    if(l){ l.produced=Math.max(l.packed||0,(l.produced||0)-(p.kg||0)); if((l.produced||0) < l.ordered-0.001) l.prodComplete=''; }
  } else {
    const b=(state.batches||[]).find(x=>x.base===p.base && ((x.producedKg||0)-(x.packedKg||0))>0.001) || (state.batches||[]).find(x=>x.base===p.base);
    if(b){ b.producedKg=Math.max(b.packedKg||0,(b.producedKg||0)-(p.kg||0)); }
  }
  state.productionLog.splice(i,1);
  logAction(`COO removed production entry: ${desc}`);
  save(); toast('Entry removed'); render();
}
/* ===================== LOCK 3: shift-based batch production ===================== */
function batchNoFx(el){ el.style.background = (!el.value.trim()||validateBatchNo(el.value)) ? '' : '#fff8d6'; }
function openBatch(kind){
  const today=TODAY.toISOString().slice(0,10);
  const fmtRule='2-4 capital letters then 3-9 digits, length 5-11';
  if(kind==='po'){
    const oid=$('pp_po')&&$('pp_po').value, lid=$('pp_line')&&$('pp_line').value;
    const batchNo=(($('nb_batch')&&$('nb_batch').value)||'').trim();
    if(!oid||!lid){toast('Pick PO and product');return;}
    if(!batchNo){toast('Enter a batch number');return;} {const _fy=fyKey(today); if(batchOwnerInFY(batchNo,_fy)){toast('Batch # "'+batchNo+'" already used this financial year ('+_fy+') — use a unique number.');return;}}
    const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid);
    const _bb=(typeof SEED!=='undefined'&&SEED.brandMap&&SEED.brandMap[l.brand]&&SEED.brandMap[l.brand].base)||l.base||l.brand;
    if(_bb && _bb!==l.brand){ toast(l.brand+' is made from base "'+_bb+'" — produce '+_bb+' in Bulk Base, then pack it into '+l.brand+' for this PO.'); return; }
    if(!validateBatchNo(batchNo) && typeof confirm==='function' && !confirm(`Batch number "${batchNo}" doesn't match the usual format (${fmtRule}). Is it correct?`)) return;
    const cap=rmAllows(l); if(cap<=(l.produced||0)+0.001){ toast('No raw material confirmed yet — run RM Check first. (Partial RM lets you make the available qty.)'); return; } const planned=Math.max(0,Math.min(l.ordered-(l.produced||0), cap-(l.produced||0)));
    state.batches.unshift({id:'B'+(state.seq++),batchNo,kind:'po',po:o.po,lineId:l.id,base:l.base,brand:l.brand,plannedKg:planned,producedKg:0,packedKg:0,status:'open',openedDate:today,by:state.role});

}
function qcAudit(o,l,field,val){ (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'QC',po:o.po,brand:l.brand,field,old:'',val}); }
function qcCheckBoth(o,l){ if(l.qcLab&&l.qcLab.pass&&l.qcPhys&&l.qcPhys.pass){ l.qcPass=TODAY.toISOString().slice(0,10); logAction(`QC PASSED: ${o.po} · ${l.brand} — cleared for shipment`); } }
function qcLabPass(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); l.qcLab={pass:true,by:state.role,date:TODAY.toISOString().slice(0,10)}; qcAudit(o,l,'Lab certified','Passed'); logAction(`Lab certified ${o.po} · ${l.brand}`); qcCheckBoth(o,l); save(); render(); }
function qcPhysPass(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); if(!(l.qcLab&&l.qcLab.pass)){toast('Lab must certify first');return;} l.qcPhys={pass:true,by:state.role,date:TODAY.toISOString().slice(0,10)}; qcAudit(o,l,'Physical inspection','Passed'); logAction(`QA physical pass ${o.po} · ${l.brand}`); qcCheckBoth(o,l); save(); render(); }
function qcFail(oid,lid,layer){ const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); const reason=(typeof prompt==='function'?prompt('Reason for QC fail:'):'')||'Failed'; l[layer]={pass:false,fail:true,reason,by:state.role,date:TODAY.toISOString().slice(0,10)}; l.qcPass=''; qcAudit(o,l,(layer==='qcLab'?'Lab':'Physical')+' FAILED',reason); logAction(`QC FAIL (${layer==='qcLab'?'Lab':'Physical'}) ${o.po} · ${l.brand}: ${reason}`); save(); render(); }
function qcApproveLab(oid,lid){ if(!(state.role==='Plant Manager'||state.role==='COO')){toast('Plant Manager only');return;} const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); if(!(l.qcLab&&l.qcLab.fail))return; const prev=l.qcLab.reason||''; l.qcLab={pass:true,by:state.role,date:TODAY.toISOString().slice(0,10),deviation:true,note:prev}; qcAudit(o,l,'Lab QC deviation approved',prev); logAction(`Lab QC deviation APPROVED by ${state.role}: ${o.po} · ${l.brand}`); qcCheckBoth(o,l); save(); toast('Deviation approved'); render(); }
function qcReworkLab(oid,lid){ if(!(state.role==='Plant Manager'||state.role==='COO')){toast('Plant Manager only');return;} const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); if(!(l.qcLab&&l.qcLab.fail))return; l.qcReworks=(l.qcReworks||0)+1; l.qcLab=null; l.qcPass=''; qcAudit(o,l,'Sent to rework','rework #'+l.qcReworks); logAction(`Lab QC -> REWORK #${l.qcReworks} by ${state.role}: ${o.po} · ${l.brand}`); save(); toast('Sent to rework'); render(); }
let qaFixForm={oid:null,lid:null,note:''};
function openQACorrect(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o&&o.lines.find(x=>x.id===lid); if(!l)return; qaFixForm={oid,lid,note:''};
  const fails=(l.qcPhys&&l.qcPhys.checklist?l.qcPhys.checklist.filter(c=>c.result==='fail').map(c=>c.item).join(', '):'');
  $('modal').innerHTML=`<div class="mh"><h2>Correct & resubmit for re-inspection</h2><div class="sub">${o.po} · ${l.brand}${fails?' · failed: '+fails:''}</div></div><div class="mb"><div class="fld"><label>What was corrected (required)</label><textarea rows="3" style="width:100%;font-family:inherit" oninput="qaFixForm.note=this.value" placeholder="Explain the correction…"></textarea></div><div class="muted" style="font-size:11px;margin-top:6px">Clears the QA fail and sends it back for re-inspection (logged as a numbered re-inspection).</div></div><div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="green" onclick="submitQACorrect()">Resubmit for re-inspection</button></div>`;
  $('modalBg').classList.add('open'); }
function submitQACorrect(){ const o=state.orders.find(x=>x.id===qaFixForm.oid); const l=o&&o.lines.find(x=>x.id===qaFixForm.lid); if(!l)return; if(!(qaFixForm.note||'').trim()){toast('Add a correction note');return;} l.reinspections=(l.reinspections||0)+1; l.qcPhys=null; l.qcPass=''; qcAudit(o,l,'Re-inspection #'+l.reinspections+' requested',qaFixForm.note); logAction(`Re-inspection #${l.reinspections} (${o.po} · ${l.brand}) — corrected by ${state.role}: ${qaFixForm.note}`); save(); closeModal(); toast('Sent for re-inspection #'+l.reinspections); render(); }
const QC_CHECKLIST=['Packaging intact & correct','Label / artwork correct','Net weight / count verified','Seal & closure OK','Cleanliness — no contamination','Batch & expiry printed','No leakage / damage','Pallet / loading condition'];
let qaForm={oid:null,lid:null,marks:[],comments:''};
function openQAPhys(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o.lines.find(x=>x.id===lid); if(!(l.qcLab&&l.qcLab.pass)){toast('Lab must certify first');return;} qaForm={oid,lid,marks:QC_CHECKLIST.map(()=>''),comments:''}; renderQAPhys(); $('modalBg').classList.add('open'); }
function qaSet(idx,v){ qaForm.marks[idx]=v; renderQAPhys(); }
function renderQAPhys(){ const o=state.orders.find(x=>x.id===qaForm.oid); const l=o.lines.find(x=>x.id===qaForm.lid);
  $('modal').innerHTML=`<div class="mh"><h2>Physical pre-shipment inspection</h2><div class="sub">${o.po} · ${l.brand} · ${fmt(l.ordered)} Kg/L · batch ${qcBatchText(o,l)} · inspector ${state.role}</div></div>
   <div class="mb"><div class="muted" style="font-size:11px;margin-bottom:10px">Mark every item, add comments, then submit. Any <b>Fail</b> blocks the shipment.</div>
   ${QC_CHECKLIST.map((it,idx)=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2)">
      <div style="flex:1;font-size:12.5px">${it}</div>
      <button class="sm ${qaForm.marks[idx]==='pass'?'green':'ghost'}" onclick="qaSet(${idx},'pass')">Pass</button>
      <button class="sm ghost" style="${qaForm.marks[idx]==='fail'?'background:var(--red);color:#fff;border-color:var(--red)':''}" onclick="qaSet(${idx},'fail')">Fail</button></div>`).join('')}
   <div class="fld" style="margin-top:13px"><label>Comments / observations</label><textarea rows="2" style="width:100%;font-family:inherit" oninput="qaForm.comments=this.value" placeholder="Optional notes...">${qaForm.comments}</textarea></div></div>
   <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="green" onclick="submitQAPhys()">Submit inspection</button></div>`; }
function submitQAPhys(){ const o=state.orders.find(x=>x.id===qaForm.oid); const l=o.lines.find(x=>x.id===qaForm.lid);
  if(qaForm.marks.some(m=>!m)){toast('Mark every checklist item Pass or Fail');return;}
  const anyFail=qaForm.marks.some(m=>m==='fail'); const d=TODAY.toISOString().slice(0,10);
  const checklist=QC_CHECKLIST.map((it,idx)=>({item:it,result:qaForm.marks[idx]}));
  const fails=checklist.filter(c=>c.result==='fail').map(c=>c.item);
  l.qcPhys={pass:!anyFail,fail:anyFail,checklist,comments:qaForm.comments,by:state.role,date:d};
  if(anyFail){ l.qcPass=''; qcAudit(o,l,'Physical FAILED','Failed: '+fails.join(', ')+(qaForm.comments?' — '+qaForm.comments:'')); logAction(`QC physical FAILED ${o.po} · ${l.brand}: ${fails.join(', ')}`); }
  else { qcAudit(o,l,'Physical inspection','Passed checklist'+(qaForm.comments?' — '+qaForm.comments:'')); logAction(`QC physical passed ${o.po} · ${l.brand}`); qcCheckBoth(o,l); }
  save(); closeModal(); render(); }

  return 0;
}

function openReceiveMaterials(){ const open=(state.prs||[]).filter(p=>p.status==='open');
  $('modal').innerHTML=`<div class="mh"><h2>Receive raw materials (GRN)</h2><div class="sub">${open.length} open PR(s) · partial receipts allowed</div></div><div class="mb">`+
   (open.length?open.map(p=>{const rem=Math.max(0,p.qtyRequired-(p.qtyReceived||0));return `<div style="border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px"><div style="font-weight:600">${p.rm}</div><div class="muted" style="font-size:11px;margin-bottom:6px">required ${fmt(p.qtyRequired)} · received ${fmt(p.qtyReceived||0)} · remaining ${fmt(rem)} Kg/L${(p.receipts&&p.receipts.length)?(' · '+p.receipts.length+' receipt(s)'):''}${p.cfoApproved?' · <span style="color:var(--green2)">CFO approved</span>':' · <span style="color:var(--amber)">awaiting CFO approval</span>'}</div><div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap"><div class="fld" style="width:120px"><label>Receive qty</label><input type="number" id="rcv_${p.id}" placeholder="max ${fmt(rem)}"></div><div class="fld" style="width:140px"><label>GRN #</label><input type="text" id="grn_${p.id}"></div><div class="fld" style="width:140px"><label>Date</label><input type="date" id="rdt_${p.id}" value="${TODAY.toISOString().slice(0,10)}"></div><button class="sm green" onclick="receivePR('${p.id}')">Receive</button></div></div>`;}).join(''):'<div class="muted" style="padding:6px 0">No open PRs.</div>')+
   `</div><div class="mf"><button class="ghost" onclick="closeModal()">Close</button></div>`;
  $('modalBg').classList.add('open'); }
function receivePR(prId){ const p=(state.prs||[]).find(x=>x.id===prId); if(!p)return; if(!p.cfoApproved){toast('This PR must be approved by CFO before raw material can be received.');return;} const qty=+(($('rcv_'+prId)&&$('rcv_'+prId).value))||0; const grn=((($('grn_'+prId)&&$('grn_'+prId).value))||'').trim(); const d=(($('rdt_'+prId)&&$('rdt_'+prId).value))||TODAY.toISOString().slice(0,10);
  if(!(qty>0)){toast('Enter received qty');return;} if(!grn){toast('Enter GRN #');return;}
  p.receipts=p.receipts||[]; p.receipts.push({date:d,grn,qty,by:state.role}); p.qtyReceived=(p.qtyReceived||0)+qty; state.rawStock[p.rm]=(state.rawStock[p.rm]||0)+qty;
  if(p.qtyReceived>=p.qtyRequired-0.001) p.status='closed';
  logAction(`GRN ${grn}: received ${fmt(qty)} Kg/L ${p.rm} (PR ${p.id} ${p.status})`);
  save(); toast(p.status==='closed'?'PR fully received — closed':'Partial receipt recorded'); openReceiveMaterials(); }
function openLabQC(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o&&o.lines.find(x=>x.id===lid); if(!l)return;
  $('modal').innerHTML=`<div class="mh"><h2>Lab QC — Layer 1</h2><div class="sub">${o.po} · ${l.brand} · produced ${fmt(l.produced||0)}/${fmt(l.ordered)} Kg/L · batch ${qcBatchText(o,l)}</div></div><div class="mb"><div class="muted" style="font-size:12.5px">Certify spec/quality. Lab certification unlocks the QA physical inspection.</div></div><div class="mf"><button class="ghost" onclick="qcFail('${o.id}','${l.id}','qcLab');closeModal()">Fail</button><button class="green" onclick="qcLabPass('${o.id}','${l.id}');closeModal()">Lab certify ✓</button></div>`;
  $('modalBg').classList.add('open'); }
function openLabFailReview(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o&&o.lines.find(x=>x.id===lid); if(!l)return;
  $('modal').innerHTML=`<div class="mh"><h2>Lab QC failed — review</h2><div class="sub">${o.po} · ${l.brand} · reason: ${(l.qcLab&&l.qcLab.reason)||'failed'}</div></div><div class="mb"><div class="muted" style="font-size:12.5px">Approve the deviation (accept as-is) or send back to Production for rework.</div></div><div class="mf"><button class="ghost" onclick="qcReworkLab('${o.id}','${l.id}');closeModal()">Send to rework</button><button class="green" onclick="qcApproveLab('${o.id}','${l.id}');closeModal()">Approve (deviation)</button></div>`;
  $('modalBg').classList.add('open'); }
let delayForm={oid:null,lid:null,reason:'',dept:''};
function openDelayReason(oid,lid){ const o=state.orders.find(x=>x.id===oid); const l=o&&o.lines.find(x=>x.id===lid); if(!l)return; delayForm={oid,lid,reason:l.delayReason||'',dept:l.respDept||''};
  const rs=(state.masters&&state.masters.delayReasons)||[]; const ds=(state.masters&&state.masters.respDepts)||[];
  $('modal').innerHTML=`<div class="mh"><h2>Delay reason</h2><div class="sub">${o.po} · ${l.brand}</div></div><div class="mb"><div class="formgrid" style="grid-template-columns:1fr 1fr"><div class="fld"><label>Delay reason</label><select onchange="delayForm.reason=this.value"><option value="">— pick —</option>${rs.map(r=>`<option ${r===delayForm.reason?'selected':''}>${r}</option>`).join('')}</select></div><div class="fld"><label>Responsible dept</label><select onchange="delayForm.dept=this.value"><option value="">— pick —</option>${ds.map(d=>`<option ${d===delayForm.dept?'selected':''}>${d}</option>`).join('')}</select></div></div></div><div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="green" onclick="submitDelayReason()">Save</button></div>`;
  $('modalBg').classList.add('open'); }
function submitDelayReason(){ const o=state.orders.find(x=>x.id===delayForm.oid); const l=o&&o.lines.find(x=>x.id===delayForm.lid); if(!l)return; if(!delayForm.reason){toast('Pick a delay reason');return;} l.delayReason=delayForm.reason; l.respDept=delayForm.dept||l.respDept; logAction(`Delay reason set ${o.po} · ${l.brand}: ${delayForm.reason}${delayForm.dept?(' / '+delayForm.dept):''}`); save(); closeModal(); render(); }
function actionItems(){
  const items=[];
  (state.orders||[]).forEach(o=>{
    const bk=orderBucket(o); const od=isOverdue(o);
    o.lines.forEach(l=>{
      const lb=lineBucket(o,l);
      if(lb==='Delivered') return;
      if(!o.acknowledged && (bk==='PO Created'||bk==='RM Check')) items.push({role:'Supply Chain',o,l,what:'Acknowledge PO received',act:`ackOrder('${o.id}')`,label:'Acknowledge'});
      if(o.acknowledged && (!l.rmStatus||l.rmStatus==='pending')) items.push({role:'Supply Chain',o,l,what:'Run RM Check',act:`openRMCheck('${o.id}','${l.id}')`,label:'RM Check'});
      if(l.prRaised && !l.rmReady && l.rmStatus!=='received') items.push({role:'Supply Chain',o,l,what:'Receive raw materials (GRN, partial OK)',act:`openReceiveMaterials()`,label:'Receive'});
      if(rmAllows(l)>0 && (l.produced||0) < Math.min(l.ordered, rmAllows(l))-0.5) items.push({role:'Production',o,l,what:'Produce (RM available)',act:"gotoScreen('prod')",label:'Open Production'});
      if(l.qcPass && (l.dispatched||0)<(l.packed||0)-0.5) items.push({role:'Supply Chain',o,l,what:'Record shipment',act:`openShip('${o.id}','${l.id}')`,label:'Ship'});
      if(od && !l.delayReason) items.push({role:'Plant Manager',o,l,what:'Add delay reason',act:`openDelayReason('${o.id}','${l.id}')`,label:'Add reason'});
    });
  });
  (state.prs||[]).filter(p=>p.status==='open'&&!p.cfoApproved).forEach(p=>items.push({role:'CFO',pr:p,what:'Approve PR — '+p.rm+' '+fmt(p.qtyRequired)+' Kg/L',act:"cfoApprovePR('"+p.id+"')",label:'Approve PR'}));
  (state.batches||[]).filter(b=>(b.producedKg||0)>0 && (!b.coa||b.coa.status!=='approved')).forEach(b=>{ const st=b.coa&&b.coa.status; const it=coaItemOf(b);
    if(!b.coa||st==='draft') items.push({role:'Lab Rep',batch:b,what:'Lab COA — '+it+' batch '+(b.batchNo||''),act:"openBatchCOA('"+b.id+"')",label:'Lab QC'});
    else if(st==='analysed') items.push({role:'AQCM',batch:b,what:'Review COA — '+it+' batch '+(b.batchNo||''),act:"openBatchCOA('"+b.id+"')",label:'Review'});
    else if(st==='reviewed') items.push({role:'QCM',batch:b,what:'Approve COA — '+it+' batch '+(b.batchNo||''),act:"openBatchCOA('"+b.id+"')",label:'Approve'});
    else if(st==='failed') items.push({role:'Plant Manager',batch:b,what:'UNFIT batch — '+it+' '+(b.batchNo||''),act:"openBatchCOA('"+b.id+"')",label:'Review'}); });
  (state.packingLog||[]).filter(p=>p&&p.brand&&(p.kg||0)>0&&(!p.qa||(!p.qa.pass&&!p.qa.fail))).forEach(p=>items.push({role:'QA Inspector',lot:p,what:'QA inspect lot — '+p.brand+' '+(p.brandBatchNo||p.baseBatchNo||'')+' ('+fmt(p.kg)+' Kg/L)',act:"openLotQA('"+p.id+"')",label:'Inspect'}));
  (state.packingLog||[]).filter(p=>p&&p.qa&&p.qa.fail).forEach(p=>items.push({role:'Supply Chain',lot:p,what:'QA failed lot — correct & resubmit ('+p.brand+')',act:"lotQACorrect('"+p.id+"')",label:'Correct'}));
  return items;
}
function screenApprovals(){
  const isCOO=state.role==='COO';
  const all=actionItems();
  const mine = isCOO ? all : all.filter(x=>x.role===state.role);
  const row=(it)=>`<tr><td><b>${it.o?it.o.po:(it.pr?('PR · '+it.pr.rm):(it.batch?('Batch '+(it.batch.batchNo||'')):(it.lot?(it.lot.po||'Lot'):'—')))}</b>${it.o?`<div class="muted" style="font-size:11px">${it.o.client}</div>`:''}</td><td>${it.l?it.l.brand:(it.pr?(fmt(it.pr.qtyRequired)+' Kg/L'):(it.batch?coaItemOf(it.batch):(it.lot?it.lot.brand:'')))}</td><td>${it.what}</td><td>${(it.o&&isOverdue(it.o)&&lineBucket(it.o,it.l)!=='Delivered')?`<span class="pill" style="background:var(--red-50);color:var(--red)">${daysOver(it.o)}d overdue</span>`:''}</td><td style="width:160px"><button class="sm green" onclick="${it.act}">${it.label}</button></td></tr>`;
  const tbl=(arr)=>`<table><thead><tr><th>PO</th><th>Product</th><th>Action needed</th><th></th><th></th></tr></thead><tbody>${arr.map(row).join('')}</tbody></table>`;
  let body;
  if(!mine.length){ body=`<div class="card"><div class="muted" style="padding:6px 0">Nothing waiting on you right now.</div></div>`; }
  else if(isCOO){
    const roles=['Supply Chain','CFO','Production','Lab Rep','AQCM','QCM','QA Inspector','Plant Manager'];
    body=roles.map(r=>{const g=all.filter(x=>x.role===r); return g.length?`<div class="card"><h3>${r} <span class="hint">${g.length}</span></h3>${tbl(g)}</div>`:'';}).join('');
  } else {
    body=`<div class="card"><h3>Your open actions <span class="hint">${mine.length}</span></h3>${tbl(mine)}</div>`;
  }
  $('view').innerHTML=`<div class="banner info"><b>My Actions.</b> Everything waiting on you, pulled live from every order; each action is timestamped. ${isCOO?'(As COO you see all queues.)':''}</div>${body}`;
}

let labTplForm={product:''};

function labTplNewProduct(){ if(!canEdit(['Lab Rep','AQCM','QCM'])){toast('Lab / QC only');return;} const n=(typeof prompt==='function'?prompt('New product / item name (exactly as the base or brand is named):'):'')||''; const nm=n.trim(); if(!nm)return; state.masters.labTemplates=labTpls(); if(!state.masters.labTemplates[nm])state.masters.labTemplates[nm]=[]; labTplForm.product=nm; save(); render(); }
function labTplAddRow(g){ if(!canEdit(['Lab Rep','AQCM','QCM'])){toast('Lab / QC only');return;} const p=labTplForm.product; if(!p)return; const t=labTpls(); t[p]=t[p]||[]; t[p].push({g:g||'Chemical',test:'',spec:'',method:'',mu:'-'}); state.masters.labTemplates=t; save(); render(); }
function labTplSet(idx,field,v){ const p=labTplForm.product; const t=labTpls(); if(!t[p]||!t[p][idx])return; t[p][idx][field]=v; save(); }
function labTplDelRow(idx){ if(!canEdit(['Lab Rep','AQCM','QCM'])){toast('Lab / QC only');return;} const p=labTplForm.product; const t=labTpls(); if(!t[p])return; t[p].splice(idx,1); save(); render(); }
function labTplDelProduct(){ if(!canEdit(['Lab Rep','AQCM','QCM'])){toast('Lab / QC only');return;} const p=labTplForm.product; if(!p)return; if(typeof confirm==='function'&&!confirm('Delete the entire lab template for '+p+'?'))return; const t=labTpls(); delete t[p]; state.masters.labTemplates=t; labTplForm.product=''; save(); render(); }
function labTplEsc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

      ${rows.length?rows.map((r,i)=>`<tr>
        <td>${ed?`<select onchange="labTplSet(${i},'g',this.value)"><option ${r.g==='Physical'?'selected':''}>Physical</option><option ${r.g==='Chemical'?'selected':''}>Chemical</option></select>`:labTplEsc(r.g)}</td>
        <td>${ed?`<input type="text" value="${labTplEsc(r.test)}" onchange="labTplSet(${i},'test',this.value)">`:labTplEsc(r.test)}</td>

      </tr>`).join(''):`<tr><td colspan="6" class="muted">No tests yet — add rows below.</td></tr>`}
    </tbody></table></div>

  </div>`;
}
function addMaster(k){ const el=$('adm_'+k); const v=(el&&el.value||'').trim(); if(!v)return;
  state.masters[k]=state.masters[k]||[]; if(state.masters[k].includes(v)){toast('Already exists');return;}
  state.masters[k].push(v); logAction(`Admin added to ${k}: ${v}`); save(); toast('Added'); render(); }
function delMaster(k,idx){ if(state.role!=='COO'){toast('COO only');return;} const arr=(state.masters&&state.masters[k])||[]; const v=arr[idx]; if(v==null)return;
  if(typeof confirm==='function' && !confirm('Delete "'+v+'" from this list?\n\nIt stops appearing in dropdowns. Existing records that already use it keep their value.')) return;
  arr.splice(idx,1); logAction(`Admin removed from ${k}: ${v}`); save(); toast('Deleted'); render(); }
function editMaster(k,idx){ if(state.role!=='COO'){toast('COO only');return;} const arr=(state.masters&&state.masters[k])||[]; const old=arr[idx]; if(old==null)return;
  const nv=(typeof prompt==='function'?prompt('Rename value:',old):old); if(nv==null)return; const v=String(nv).trim();
  if(!v||v===old)return; if(arr.includes(v)){toast('Already exists');return;} arr[idx]=v; logAction(`Admin renamed in ${k}: ${old} -> ${v}`); save(); toast('Renamed'); render(); }

/* ===================== REPORTS (read-only) ===================== */
let rpTab='explorer';
let rpDim='client', rpMeas='ordered', rpCol='none';
let rpfMonth='', rpfChannel='', rpfClient='', rpfPriority='';
let rpChart=null;
const RP_DIMS={client:'Client',channel:'Channel',brand:'Product (brand)',base:'Base product',month:'Month (PO received)',priority:'Priority',stage:'Stage'};
const RP_MEAS={ordered:'Ordered (Kg/L)',produced:'Produced (Kg/L)',packed:'Packed (Kg/L)',dispatched:'Shipped (Kg/L)',delivered:'Delivered (Kg/L)',toproduce:'Pending to produce',topack:'Pending to pack',toship:'Pending to ship',pos:'# POs',lines:'# SKU lines'};
const RP_TABS=[['explorer','Explorer'],['postatus','PO Status'],['prod','Production'],['trace','Batch Trace'],['labqc','Lab QC'],['qaqc','QA Pre-Shipment'],['ship','Shipments'],['delay','Delay / Hold'],['monthly','Monthly Production'],['log','Action Log']];
function rpSet(k,v){ window[k]=v; if(k==='rpTab'){rpfClient=rpfClient;} screenReports(); }
function rpReset(){ rpfMonth='';rpfChannel='';rpfClient='';rpfPriority='';screenReports(); }
function rpMonths(){ const s=new Set(); state.orders.forEach(o=>{const m=(o.received||'').slice(0,7); if(m)s.add(m);}); (state.productionLog||[]).forEach(p=>{const m=(p.date||'').slice(0,7); if(m)s.add(m);}); return [...s].sort().reverse(); }
function rpLines(){ const out=[]; state.orders.forEach(o=>{ if(rpfChannel&&o.channel!==rpfChannel)return; if(rpfClient&&o.client!==rpfClient)return; if(rpfPriority&&(o.priority||'Normal')!==rpfPriority)return; o.lines.forEach(l=>{ if(rpfMonth&&(o.received||'').slice(0,7)!==rpfMonth)return; out.push({o,l}); }); }); return out; }
function rpDimVal(dim,o,l){ if(dim==='client')return o.client; if(dim==='channel')return o.channel; if(dim==='brand')return l.brand; if(dim==='base')return l.base; if(dim==='month')return (o.received||'').slice(0,7)||'—'; if(dim==='priority')return o.priority||'Normal'; if(dim==='stage')return lineStage(o,l); return '—'; }
function rpMeasVal(meas,o,l){ const ord=l.ordered||0,pr=l.produced||0,pk=l.packed||0,dp=l.dispatched||0,dl=l.delivered||0; switch(meas){ case 'ordered':return ord; case 'produced':return pr; case 'packed':return pk; case 'dispatched':return dp; case 'delivered':return dl; case 'toproduce':return Math.max(0,ord-pr); case 'topack':return Math.max(0,pr-pk); case 'toship':return Math.max(0,pk-dp); case 'lines':return 1; } return 0; }
function rpFilterBar(){
  const ms=rpMonths(), chans=[...new Set(state.orders.map(o=>o.channel))].filter(Boolean).sort(), clients=[...new Set(state.orders.map(o=>o.client))].filter(Boolean).sort(), pris=['Critical','High','Normal','Low'];
  return `<div class="card" style="padding:12px 16px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
    <div class="fld" style="min-width:120px"><label>Month</label><select onchange="rpfMonth=this.value;screenReports()"><option value="">All months</option>${ms.map(m=>`<option ${m===rpfMonth?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="fld" style="min-width:130px"><label>Channel</label><select onchange="rpfChannel=this.value;screenReports()"><option value="">All channels</option>${chans.map(c=>`<option ${c===rpfChannel?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="fld" style="min-width:160px"><label>Client</label><select onchange="rpfClient=this.value;screenReports()"><option value="">All clients</option>${clients.map(c=>`<option ${c===rpfClient?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="fld" style="min-width:110px"><label>Priority</label><select onchange="rpfPriority=this.value;screenReports()"><option value="">All</option>${pris.map(p=>`<option ${p===rpfPriority?'selected':''}>${p}</option>`).join('')}</select></div>
    <button class="ghost sm" onclick="rpReset()">Clear filters</button>
    <button class="ghost sm" onclick="window.print()" style="margin-left:auto">Print</button>
  </div></div>`;
}
function rpEmpty(msg){ return `<div class="empty"><div class="ei">∅</div>${msg}</div>`; }
function rpTabsBar(){ return `<div class="seg" style="flex-wrap:wrap;gap:6px;margin-bottom:14px">${RP_TABS.map(([id,nm])=>`<div class="opt ${id===rpTab?'on full':''}" style="flex:0 0 auto;padding:8px 14px;font-size:12.5px" onclick="rpTab='${id}';screenReports()">${nm}</div>`).join('')}</div>`; }

function screenReports(){
  let body='';
  if(rpTab==='explorer') body=rpExplorer();
  else if(rpTab==='postatus') body=rpPOStatus();
  else if(rpTab==='prod') body=rpProduction();
  else if(rpTab==='trace') body=rpTrace();
  else if(rpTab==='labqc') body=rpLabQC();
  else if(rpTab==='qaqc') body=rpQAQC();
  else if(rpTab==='ship') body=rpShip();
