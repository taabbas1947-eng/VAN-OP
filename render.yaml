services:
  - type: web
    name: van-control-tower
    runtime: node
    # starter ($7/mo), NOT free. Three things depend on this and all fail silently on free:
    #   1. Free web services block outbound SMTP (ports 25/465/587), so notifications time out.
    #   2. Free has no persistent disk, so every Library upload is deleted on each deploy
    #      while the database row survives — the user sees "file missing from the store".
    #   3. Free instances sleep, so the first person in each morning waits for a cold start.
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    # Persistent storage for PD Library documents. mountPath must contain PD_LIBRARY_DIR below.
    disk:
      name: pd-library
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Live data lives in an EXTERNAL MySQL database on HostGator — NOT a Render-managed DB.
      # Set DATABASE_URL by hand in the Render dashboard as a mysql:// URL.
      - key: DATABASE_URL
        sync: false
      # Stable secret so logins survive restarts. If unset, server.js generates a random one
      # per boot and EVERY deploy silently signs everybody out.
      - key: SESSION_SECRET
        sync: false
      # Must sit inside the disk mountPath above, or uploads go to ephemeral storage.
      - key: PD_LIBRARY_DIR
        value: /var/data/pd-library
      # --- notifications: uncomment once the mail transport is chosen ---
      # - key: MAIL_TRANSPORT
      #   sync: false
      # - key: MAIL_FROM
      #   sync: false
