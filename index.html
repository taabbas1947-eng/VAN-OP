    body+=`<div style="display:flex;align-items:center;margin:14px 0 9px"><b style="font-size:12.5px;color:var(--navy)">Purchase Requisition — raw materials required</b>${hasRecipe?`<button class="ghost sm" style="margin-left:auto" onclick="rmPrefill()">↺ Pre-fill from recipe</button>`:''}</div>`;
    body+=(rms.length?'':`<div class="banner warn" style="margin:6px 0">No raw materials are loaded in the master list. Pick from the recipe values below, or add raw materials in Admin · Master Data.</div>`);
    body+=rmForm.lines.map((ln,i)=>`<div class="prline"><select onchange="rmForm.lines[${i}].rm=this.value;renderRMModal()"><option value="">— raw material —</option>${rms.map(r=>`<option ${r===ln.rm?'selected':''}>${r}</option>`).join('')}</select><span class="rmstk">${ln.rm?('have '+fmt(state.rawStock[ln.rm]||0)):''}</span><input type="number" value="${ln.kg}" placeholder="Kg/L req" oninput="rmForm.lines[${i}].kg=this.value"><span class="x" onclick="rmDelLine(${i})">✕</span></div>`).join('');
    body+=`<button class="ghost sm" style="margin-top:4px" onclick="rmAddLine()">+ Add raw material</button>`;
  }
  $('modal').innerHTML=`<div class="mh"><h2>RM Check — ${l.brand}</h2><div class="sub">${o.po} · ${o.client} · ${fmt(l.ordered)} Kg/L to make · base: ${l.base}</div></div>
   <div class="mb">${seg}${body}<div class="muted" style="font-size:11px;margin-top:14px">Recording only — stock balances are not changed here. Actual material receipt is booked against the PR as a GRN (after CFO approval) in My Actions.</div></div>
   <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="${rmForm.status==='full'?'green':''}" onclick="rmSubmit()">${rmForm.status==='full'?'Confirm — materials ready':'Raise PR'}</button></div>`;
}
function rmSubmit(){ const o=state.orders.find(x=>x.id===rmForm.oid); const l=o.lines.find(x=>x.id===rmForm.lid); const today=TODAY.toISOString().slice(0,10);
  if(rmForm.status!=='full'){ const _v=(rmForm.lines||[]).filter(x=>x&&x.rm&&+x.kg>0); if(!_v.length){ toast('Add at least one raw material with a quantity to raise a PR.'); return; } }
  l.rmCheck=today; l.rmStatus=rmForm.status;
  if(rmForm.status==='full'){ l.rmReady=today; l.canMakeKg=null; l.pr=null; logAction(`RM check ${o.po}·${l.brand}: in stock — materials ready`);
    (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'RM Check',po:o.po,brand:l.brand,field:'RM status',old:'',val:'In stock — ready'}); }
  else { const lines=rmForm.lines.filter(x=>x.rm&&+x.kg>0).map(x=>({rm:x.rm,kg:+x.kg}));
    l.prRaised=today; l.pr={lines,by:state.role,date:today}; l.canMakeKg=(rmForm.status==='partial'?(+rmForm.canMake||0):0); lines.forEach(x=>raisePR(x.rm,x.kg));
    logAction(`RM check ${o.po}·${l.brand}: ${rmForm.status}${rmForm.status==='partial'?' (can make '+fmt(l.canMakeKg)+' kg)':''} — PR raised, ${lines.length} material(s)`);
    (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'RM Check',po:o.po,brand:l.brand,field:'PR raised',old:'',val:lines.map(x=>x.rm+' '+x.kg+'kg').join(', ')}); }
  save(); closeModal(); openOrder(rmForm.oid); render();
}

</script>
<script>
/* ===================== PRODUCTION (PO-centric + to-stock) ===================== */
let prodMode='po', prodPOsel='';
const BULK_BASES=['Potassium Humate','Potassium Humate Liquid','Sulfur Coated Urea','Sulfur 70%','Amino Acid','Compost','Zinc 21%','NP 6.32','Nitro Sulfur','Liquid Phosphrous','Mg Sulphate','NPK 8.8.6','Boron 5%','Zinc 10%'];
function brandsForBase(base){ return Object.keys(SEED.brandMap||{}).filter(b=>SEED.brandMap[b].base===base).sort(); }
function inProdLines(){ const r=[]; state.orders.forEach(o=>o.lines.forEach(l=>{ if(stageOf(o)!=='Delivered' && (l.packed||0)<l.ordered-0.5) r.push({o,l}); })); return r; }
var prodStage='';
var prodView='floor', prodOutSub='day', prodLifeSub='batch', prodFloorSub='lanes', prodBatchSel=null, prodBatchTab='lots';
var PJORD=['recon','producing','qc','pack','done'];
function batchClearedKg(b){ var lots=(b.lots||[]); var s=0; if(lots.length){ lots.forEach(function(l){ if(l.coa&&l.coa.status==='approved'){ var ck=(l.coa.certifiedKg!=null)?l.coa.certifiedKg:(l.qty||0); s+=Math.min(l.qty||0,ck); } }); } else if(b.coa&&b.coa.status==='approved'){ var ck2=(b.coa.certifiedKg!=null)?b.coa.certifiedKg:(b.producedKg||0); s+=Math.min(b.producedKg||0,ck2); } return s; }
function batchStage(b){ var prod=+b.producedKg||0, plan=+b.plannedKg||0, packed=+b.packedKg||0, cleared=batchClearedKg(b), rem=Math.max(0,prod-packed);
  if(b.status==='closed' && rem>0.5 && !b.reconciled && (cleared-packed)<=0.5) return 'recon';  // reconcile ONLY when no QC-cleared stock is left to pack (packable stock is never auto-"reconcile"); the Reconcile button stays available as a choice
  if(b.status==='open' && prod<plan-0.5) return 'producing';
  if(prod-cleared>0.5) return 'qc';
  if(cleared-packed>0.5) return 'pack';
  return 'done'; }
function batchAging(b){ var s=batchStage(b), d=null, lots=(b.lots||[]);
  if(s==='producing') d=b.openedDate||b.date;
  else if(s==='qc'){ var ds=lots.map(function(l){return l.date;}).filter(Boolean).sort(); d=ds.length?ds[ds.length-1]:(b.openedDate||b.date); }
  else if(s==='pack'){ var ap=lots.filter(function(l){return l.coa&&l.coa.status==='approved';}).map(function(l){return l.coa.approvedDate;}).filter(Boolean).sort(); d=ap.length?ap[0]:(b.closedDate||b.openedDate||b.date); }
  else d=b.closedDate||b.openedDate||b.date;
  if(!d) return null; var t=new Date(d); if(isNaN(t)) return null; var days=Math.round((TODAY-t)/86400000); return days<0?0:days; }
function journeyCard(b,ed){
  var prod=+b.producedKg||0, plan=+b.plannedKg||0, cleared=batchClearedKg(b), packed=+b.packedKg||0;
  var waiting=Math.max(0,prod-cleared), ready=Math.max(0,cleared-packed), rem=batchRemainderKg(b);
  var s=batchStage(b), age=batchAging(b);
  var SM={producing:['Producing','--blue'],qc:['Awaiting Lab QC','--purple'],pack:['Ready to pack','--green2'],recon:['Reconcile required','--red'],done:['Packed','--mut']};
  var lbl=SM[s][0], col='var('+SM[s][1]+')';
  var nm=b.kind==='po'?(b.brand||b.base||''):(b.base||'');
  var sub=b.kind==='po'?((b.base||'')+' · '+(b.po||'')):'bulk to stock';
  var ageBad=age!=null&&age>=4&&s!=='done';
  var ageHtml=s==='done'?'':('<span class="pjage'+(ageBad?' bad':'')+'">'+(age!=null?(age+'d in '+lbl.toLowerCase()+(ageBad?' · stalled':'')):'—')+'</span>');
  function seg(t,v,ss,active){ return '<div class="pjseg'+(active?' on':'')+'" style="--sc:'+(active?col:'var(--line)')+'"><div class="pjsl">'+t+'</div><div class="pjsv">'+v+'</div><div class="pjss">'+(ss||'&nbsp;')+'</div></div>'; }
  var rail='<div class="pjrail">'
    +seg('Produced',fmt(prod)+' <span style="color:var(--mut);font-size:10px">/'+fmt(plan)+'</span>',(prod<plan-0.5&&b.status==='open')?(fmt(plan-prod)+' to go'):'plan met',s==='producing')
    +seg('Lab QC',fmt(cleared)+' ✓',waiting>0.5?(fmt(waiting)+' waiting'):'cleared',s==='qc')
    +seg('Packed',fmt(packed),ready>0.5?(fmt(ready)+' ready'):'&nbsp;',s==='pack')
    +seg('To PO',fmt(packed),packed>0?'routed':'—',false)
    +'</div>';
  var acts='';
  if(ed){
    if(s==='producing'){ acts+='<button class="sm green" onclick="openShiftLog(\''+b.id+'\')">Log shift output</button>'; if(ready>0.5){ if(b.kind==='bulk') acts+=' <button class="sm" onclick="openPack(\''+b.id+'\')">Pack cleared ('+fmt(ready)+')</button>'; else { var _o=state.orders.find(function(x){return x.po===b.po;}); var _l=_o&&_o.lines.find(function(x){return x.id===b.lineId;}); if(_o&&_l) acts+=' <button class="sm" onclick="openProdQty(\''+_o.id+'\',\''+_l.id+'\')">Pack cleared ('+fmt(ready)+')</button>'; } } }  /* fix: QC-cleared partial stock is packable while the batch keeps producing the rest */
    else if(s==='qc') acts+='<button class="sm ghost" onclick="gotoScreen(\'qc\')">Open Lab QC ▸</button>';
    else if(s==='pack'){ if(b.kind==='bulk') acts+='<button class="sm" onclick="openPack(\''+b.id+'\')">Pack into brand</button>'; else { var o=state.orders.find(function(x){return x.po===b.po;}); var l=o&&o.lines.find(function(x){return x.id===b.lineId;}); if(o&&l) acts+='<button class="sm" onclick="openProdQty(\''+o.id+'\',\''+l.id+'\')">Pack…</button>'; } }
    else if(s==='recon') acts+='<button class="sm" style="background:var(--red);color:#fff" onclick="openReconcile(\''+b.id+'\')">Reconcile '+fmt(rem)+' Kg ▸</button>';
    if(b.status==='open'&&prod>0&&s!=='recon') acts+=' <button class="sm ghost" onclick="closeBatch(\''+b.id+'\')">Close</button>';
    if(rem>0.5&&!b.reconciled&&s!=='recon'&&s!=='producing') acts+=' <button class="sm ghost" style="color:var(--amber)" onclick="openReconcile(\''+b.id+'\')">Reconcile</button>';
  }
  return '<div class="pjcard'+(s==='recon'?' rec':'')+'">'
    +'<div class="pjhd"><b style="font-size:13px">'+(b.batchNo||'—')+'</b> <span class="pjk '+b.kind+'">'+(b.kind==='po'?'PO':'BULK')+'</span> <span style="font-size:12px;color:var(--mut)">'+nm+' · '+sub+'</span>'
      +'<span class="pjpill" style="background:color-mix(in srgb,'+col+' 14%,#fff);color:'+col+'">'+lbl+'</span>'+ageHtml+'</div>'
    +rail+(acts?'<div class="pjacts">'+acts+'</div>':'')+'</div>';
}
/* Stage 5: group active batches into Command-Center lanes by their (mutually-exclusive) batchStage — render-only; every batch lands in exactly ONE lane so nothing is ever dropped from the board */
function laneCard(b,ed){
  var prod=+b.producedKg||0, plan=+b.plannedKg||0, cleared=batchClearedKg(b), packed=+b.packedKg||0;
  var ready=Math.max(0,cleared-packed); var s=batchStage(b);
  var SM={producing:['In production','--blue'],qc:['Awaiting Lab QC','--purple'],pack:['Ready to pack','--green2'],recon:['Reconcile','--red'],done:['Packed','--mut']};
  var col='var('+(SM[s]?SM[s][1]:'--navy')+')';
  var nm=b.kind==='po'?(b.brand||b.base||''):(b.base||''); var sub=b.kind==='po'?(b.po||''):'bulk → stock';
  var pct=plan>0?Math.min(100,Math.round(prod/plan*100)):0;
  var foot=fmt(prod)+'/'+fmt(plan)+' Kg'+(ready>0.5?(' · '+fmt(ready)+' ready'):'');
  var act='';
  if(ed){ if(s==='producing') act='<button class="sm green" onclick="event.stopPropagation();openShiftLog(\''+b.id+'\')">Log output</button>';
    else if(s==='qc') act='<button class="sm ghost" onclick="event.stopPropagation();gotoScreen(\'qc\')">Lab QC ▸</button>';
    else if(s==='pack'){ if(b.kind==='bulk') act='<button class="sm" onclick="event.stopPropagation();openPack(\''+b.id+'\')">Pack</button>'; else { var o=state.orders.find(function(x){return x.po===b.po;}); var l=o&&o.lines.find(function(x){return x.id===b.lineId;}); if(o&&l) act='<button class="sm" onclick="event.stopPropagation();openProdQty(\''+o.id+'\',\''+l.id+'\')">Pack</button>'; } }
    else if(s==='recon') act='<button class="sm" style="background:var(--red);color:#fff" onclick="event.stopPropagation();openReconcile(\''+b.id+'\')">Reconcile</button>'; }
  return '<div class="lncard" onclick="prodBatchSel=\''+b.id+'\';prodView=\'lifecycle\';prodLifeSub=\'batch\';render()"><div class="lnhd"><span class="lncode">'+(b.batchNo||'—')+'</span><span class="lntag">'+(b.kind==='po'?'PO':'BULK')+'</span></div><div class="lnnm">'+nm+'</div><div class="lnsub">'+sub+'</div><div class="lnbar"><i style="width:'+pct+'%;background:'+col+'"></i></div><div class="lnfoot">'+foot+'</div>'+(act?('<div class="lnact">'+act+'</div>'):'')+'</div>';
}
function _prodLanes(items,ed){
  const order=[['producing','In production','producing the planned quantity','var(--navy)'],['qc','Awaiting Lab QC','produced — COA pending','var(--amber)'],['pack','Ready to pack','QC-cleared, awaiting packing','var(--green2)'],['recon','Reconcile','finished — route the remainder','#b06a00'],['done','Packed — ready to close','fully packed','var(--mut)']];
  const by={}; order.forEach(o=>by[o[0]]=[]); items.forEach(b=>{ const st=batchStage(b); (by[st]||(by[st]=[])).push(b); });
  return order.filter(o=>by[o[0]]&&by[o[0]].length).map(o=>`<div style="margin:0 0 16px"><div style="display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 11px;border-left:3px solid ${o[3]};background:color-mix(in srgb,${o[3]} 8%,#fff);border-radius:7px"><b style="font-size:12.5px">${o[1]}</b><span style="font-size:10.5px;font-weight:700;background:${o[3]};color:#fff;border-radius:10px;padding:1px 8px">${by[o[0]].length}</span><span class="muted" style="font-size:11px;font-weight:400">${o[2]}</span></div><div class="pjgrid">${by[o[0]].map(b=>laneCard(b,ed)).join()}</div></div>`).join('');
}
function _pcCard(t,h,b){return '<div class="card"><h3>'+t+(h?' <span class="hint">'+h+'</span>':'')+'</h3>'+b+'</div>';}
function _pcKpi(l,v,u,d,c){return '<div style="background:var(--surface,#fff);border:1px solid var(--line);border-top:3px solid '+(c||'var(--navy)')+';border-radius:8px;padding:11px 13px"><div style="font-family:var(--font-mono,monospace);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3,#8A95A6)">'+l+'</div><div style="font-family:var(--font-display,sans-serif);font-size:22px;font-weight:800;color:var(--ink,#17202E);line-height:1.1;margin-top:3px">'+v+(u?' <span style="font-size:12px;color:var(--ink-3,#8A95A6);font-weight:600">'+u+'</span>':'')+'</div>'+(d?'<div style="font-size:11px;color:var(--ink-2,#586577);margin-top:2px">'+d+'</div>':'')+'</div>';}
function _pcBars(rows){var PC=window.ProductionCenter;var max=Math.max.apply(null,rows.map(function(r){return r.kg;}).concat([1]));return '<div class="bars">'+rows.map(function(r){var label=r.name||r.date||'';return '<div class="bl"><div class="h"><b>'+label+'</b><span>'+PC.fmt(r.kg)+' Kg</span></div><div class="bt"><i style="width:'+Math.round(r.kg/max*100)+'%"></i></div></div>';}).join('')+'</div>';}
function _pcStage(st){var M=(window.ProductionCenter&&ProductionCenter.STAGE_META[st])||{name:st,dot:'#888'};return '<span style="background:color-mix(in srgb,'+M.dot+' 15%,#fff);color:'+M.dot+';font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap">'+M.name+'</span>';}
function _pcResult(r){var c=r.tone==='good'?'var(--green,#4FA84E)':r.tone==='bad'?'var(--red,#E03127)':r.tone==='warn'?'var(--amber,#C77D18)':'var(--ink-3,#8A95A6)';return '<span style="color:'+c+';font-weight:700;font-size:11.5px">'+r.label+'</span>';}
function prodViewBar(active){var V=[['floor','Floor'],['output','Output'],['lifecycle','Lifecycle']];return '<div class="pvbar" style="margin-bottom:14px">'+V.map(function(v){return '<button onclick="prodView=\''+v[0]+'\';render()" class="pvbtn'+(active===v[0]?' on':'')+'">'+v[1]+'</button>';}).join('')+'</div>';}
function _pcSub(opts,cur,setter){return '<div class="pvsub">'+opts.map(function(o){return '<button onclick="'+setter+'=\''+o[0]+'\';render()" class="'+(cur===o[0]?'on':'')+'">'+o[1]+'</button>';}).join('')+'</div>';}
function renderProdFloorBoard(){var PC=window.ProductionCenter;if(!PC)return '<div class="card">Board unavailable</div>';var lanes=PC.floorLanes(state);var cols=lanes.map(function(L){var cards=(L.batches||[]).map(function(b){var pct=b.planned>0?Math.min(100,Math.round((b.produced/b.planned)*100)):0;return '<div class="pbcard"><div class="pbtop"><span class="pbcode">'+(b.batchNo||'\u2014')+'</span><span class="pbtag">'+(b.kind==='pool'?'Pool':b.po?'PO':'Bulk')+'</span></div><div class="pbname">'+(b.brand||b.base||'')+'</div><div class="pbbar"><i style="width:'+pct+'%;background:'+L.dot+'"></i></div><div class="pbfoot">'+PC.fmt(b.produced)+'/'+PC.fmt(b.planned)+' Kg'+(b.readyToPack>0.5?(' \u00b7 '+PC.fmt(b.readyToPack)+' ready'):'')+'</div></div>';}).join('')||'<div class="muted" style="font-size:11px;padding:4px 2px">\u2014</div>';return '<div class="pbcol"><div class="pbcolh"><span class="dot" style="background:'+L.dot+'"></span>'+L.name+'<span class="pbcount">'+L.count+'</span></div>'+cards+'</div>';}).join('');return '<div class="pboard">'+cols+'</div>';}
function renderProdFloorTable(){var PC=window.ProductionCenter;if(!PC)return '<div class="card">Table unavailable</div>';var rows=PC.floorRows(state);if(!rows.length)return '<div class="card"><div class="muted">No open batches.</div></div>';return '<div class="card"><div class="tscroll"><table><thead><tr><th>Batch</th><th>Product</th><th>Owner</th><th>Stage</th><th class="num">Produced</th><th class="num">Cleared</th><th class="num">Packed</th><th class="num">Ready</th></tr></thead><tbody>'+rows.map(function(b){return '<tr><td><b>'+(b.batchNo||'\u2014')+'</b></td><td>'+(b.brand||b.base||'')+'</td><td class="muted" style="font-size:11px">'+b.owner+'</td><td>'+_pcStage(b.stage)+'</td><td class="num">'+PC.fmt(b.produced)+'</td><td class="num">'+PC.fmt(b.cleared)+'</td><td class="num">'+PC.fmt(b.packed)+'</td><td class="num"><b style="color:'+(b.readyToPack>0.5?'var(--green2)':'var(--mut)')+'">'+PC.fmt(b.readyToPack)+'</b></td></tr>';}).join('')+'</tbody></table></div></div>';}
function renderProdOutput(){var PC=window.ProductionCenter;if(!PC)return '<div class="card">Output unavailable</div>';var o=PC.output(state);
  var kpis='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px">'+_pcKpi('Output (7d)',PC.fmt(o.totalKg),'Kg','last 7 days','var(--navy)')+_pcKpi('Avg / day',PC.fmt(o.avgPerDay),'Kg','','var(--teal,#1F9C92)')+_pcKpi('Today',PC.fmt(o.todayKg),'Kg','latest day','var(--green,#4FA84E)')+_pcKpi('QA pass rate',o.qcPassRate+'%','','pre-shipment','var(--green,#4FA84E)')+'</div>';
  var seg=_pcSub([['day','By day'],['shift','By shift'],['incharge','By incharge'],['po','By PO'],['product','By product']],prodOutSub,'prodOutSub');
  var body;
  if(prodOutSub==='day')body=_pcBars(o.byDate.map(function(d){return {name:d.date,kg:d.kg};}));
  else if(prodOutSub==='shift')body=_pcBars(Object.keys(o.byShift).map(function(k){return {name:k,kg:o.byShift[k]};}));
  else if(prodOutSub==='incharge')body=_pcBars(o.byIncharge);
  else if(prodOutSub==='po')body=_pcBars(o.byPO.map(function(p){return {name:p.name+(p.client?(' · '+p.client):''),kg:p.kg};}));
  else body=_pcBars(o.byProduct);
  var rec='<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Shift</th><th>Incharge</th><th>Product</th><th style="text-align:right">Kg</th><th>Batch</th></tr></thead><tbody>'+o.recent.map(function(r){return '<tr><td>'+r.date+'</td><td>'+(r.shift||'')+'</td><td>'+(r.incharge||'')+'</td><td>'+r.product+'</td><td style="text-align:right">'+PC.fmt(r.kg)+'</td><td>'+(r.batchNo||'')+'</td></tr>';}).join('')+'</tbody></table></div>';
  return kpis+_pcCard('Throughput','by '+prodOutSub,seg+body)+_pcCard('Recent production log',o.recent.length+' entries',rec);}
function renderProdLifecycle(){var PC=window.ProductionCenter;if(!PC)return '<div class="card">Lifecycle unavailable</div>';
  var seg=_pcSub([['batch','Batch'],['po','By PO'],['quality','Quality']],prodLifeSub,'prodLifeSub');var body;
  if(prodLifeSub==='po'){var g=PC.lifecycleByPO(state);body=g.length?g.map(function(x){return _pcCard(x.po+' <span class="muted" style="font-weight:400">'+x.client+'</span>',x.count+' batch(es)','<div style="overflow:auto"><table><thead><tr><th>Batch</th><th>Product</th><th>Stage</th><th style="text-align:right">Produced</th><th style="text-align:right">Ready</th></tr></thead><tbody>'+x.batches.map(function(b){return '<tr><td>'+b.batchNo+'</td><td>'+b.base+'</td><td>'+_pcStage(b.stage)+'</td><td style="text-align:right">'+PC.fmt(b.produced)+'/'+PC.fmt(b.planned)+'</td><td style="text-align:right">'+PC.fmt(b.readyToPack)+'</td></tr>';}).join('')+'</tbody></table></div>');}).join(''):'<div class="card"><div class="muted">No open PO batches.</div></div>';}
  else if(prodLifeSub==='quality'){var reg=PC.coaRegister(state);body=_pcCard('COA register',reg.length+' lots','<div style="overflow:auto"><table><thead><tr><th>Batch</th><th>Lot</th><th>Product</th><th style="text-align:right">Qty</th><th>QC #</th><th>Result</th></tr></thead><tbody>'+reg.map(function(r){return '<tr><td>'+r.batchNo+'</td><td>'+(r.lotNo||'')+'</td><td>'+r.product+'</td><td style="text-align:right">'+PC.fmt(r.qty)+'</td><td>'+(r.qcNo||'')+'</td><td>'+_pcResult(r.result)+'</td></tr>';}).join('')+'</tbody></table></div>');}

function coaSubmitAnalyst(){ const ctx=coaCtx(); const b=ctx.b, h=ctx.h; if(!b||!h)return; const L=ctx.L;
  if(!(coaForm.tests||[]).length){toast('No tests on this COA — add test rows first');return;}
  const REQ=[['qcNo','Q.C. No'],['sampledBy','Sampled Received by'],['sampleQty','Sample Quantity'],['analysisTime','Analysis Time'],['temp','Temperature'],['humidity','Humidity']];
  for(const fp of REQ){ if(!String(coaForm[fp[0]]||'').trim()){toast(fp[1]+' is mandatory for the lab sample');return;} }
  for(const r of coaForm.tests){ const rk=String(r.remark||'').trim(); if(!rk){toast('Set FIT / UNFIT / No Result on every test');return;} if(!/^no result$/i.test(rk) && !(r.result||'').trim()){toast('Enter a Result for every test (or mark it No Result)');return;} }
  if(!(coaForm.analyst&&coaForm.analyst.name||'').trim()){toast('Enter the analyst name (Analysed By)');return;}
  const ov=coaOverall(coaForm.tests);
  coaForm.overall=ov; coaForm.analyst={name:coaForm.analyst.name.trim(),date:coaTS()};
  coaForm.status = (ov==='FIT') ? 'analysed' : 'failed'; if(ov==='UNFIT') coaForm.failReason='UNFIT on '+coaForm.tests.filter(r=>/unfit|not ok/i.test(r.remark||'')).map(r=>r.test).join(', '); else if(ov!=='FIT') coaForm.failReason='No result on '+coaForm.tests.filter(r=>!String(r.remark||'').trim()||/no result/i.test(r.remark||'')).map(r=>r.test).join(', ');
  h.coa=JSON.parse(JSON.stringify(coaForm)); delete h.coa.bid; delete h.coa.lid;
  state.masters.labTemplates=state.masters.labTemplates||{}; if(coaForm.item) state.masters.labTemplates[coaForm.item]=coaForm.tests.map(r=>({g:r.g,test:r.test,spec:r.spec,method:r.method,mu:r.mu}));
  qcAudit2(b,'Lab analysed',ov); logAction(`Lab COA submitted for ${L} (${coaForm.item}) — ${ov}`+(ov!=='FIT'?' → Plant Manager':' → AQCM'));
  save(); coaFSClose(); }
function coaReview(){ if(!(canEdit(['AQCM'])||state.role==='COO')){toast('AQCM only');return;} const ctx=coaCtx(); const b=ctx.b,h=ctx.h; if(!b||!h||!h.coa)return; const nm=(state.currentUser&&state.currentUser.name)||state.role; h.coa.reviewer={name:nm,date:coaTS()}; h.coa.status='reviewed'; qcAudit2(b,'AQCM reviewed',''); logAction(`COA reviewed (AQCM) for ${ctx.L} → QCM`); save(); coaFSClose(); }
function coaApprove(){ if(!(canEdit(['QCM'])||state.role==='COO')){toast('QCM only');return;} const ctx=coaCtx(); const b=ctx.b,h=ctx.h; if(!b||!h||!h.coa)return; const nm=(state.currentUser&&state.currentUser.name)||state.role; h.coa.approver={name:nm,date:coaTS()}; h.coa.status='approved'; h.coa.approvedDate=TODAY.toISOString().slice(0,10); h.coa.certifiedKg=ctx.qkg; if(ctx.lot) ctx.lot.certifiedKg=ctx.qkg; qcAudit2(b,'QCM approved','cleared'); logAction(`COA APPROVED (QCM) for ${ctx.L} — cleared for packing`); save(); coaFSClose(); }
function coaReject(stage){ if(!canEdit(['AQCM','QCM'])){toast('AQCM / QCM only');return;} const ctx=coaCtx(); const b=ctx.b,h=ctx.h; if(!b||!h||!h.coa)return; const why=(typeof prompt==='function'?prompt('Reason for rejecting back to the analyst:'):'')||''; h.coa.status='draft'; h.coa.rejected={by:state.role,stage,why:why||'',date:TODAY.toISOString().slice(0,10)}; qcAudit2(b,'COA rejected',why||''); logAction(`COA rejected at ${stage} for ${ctx.L} — back to analyst`); save(); coaFSClose(); }
function coaDeviation(){ if(!(canEdit(['Plant Manager'])||state.role==='COO')){toast('Plant Manager only');return;} const ctx=coaCtx(); const b=ctx.b,h=ctx.h; if(!b||!h||!h.coa)return; const note=(typeof prompt==='function'?prompt('Deviation note (why accept this UNFIT lot):'):'')||''; h.coa.deviation=true; h.coa.deviationNote=note||''; h.coa.deviationBy={name:(state.currentUser&&state.currentUser.name)||state.role,date:coaTS()}; h.coa.status='analysed'; qcAudit2(b,'PM deviation accepted',note||''); logAction(`UNFIT ${ctx.L} accepted as DEVIATION by Plant Manager → AQCM review → QCM approval`); save(); coaFSClose(); }
function coaRework(){ if(!(canEdit(['Plant Manager'])||state.role==='COO')){toast('Plant Manager only');return;} const ctx=coaCtx(); const b=ctx.b,h=ctx.h; if(!b||!h||!h.coa)return; h.coa.reworks=(h.coa.reworks||0)+1; const item=h.coa.item; h.coa=null; qcAudit2(b,'Sent to rework',''); logAction(`${ctx.L} (${item}) sent to rework after UNFIT`); save(); coaFSClose(); }
function qcAudit2(b,field,val){ (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'Lab QC',po:b.po||'',brand:coaItemOf(b),field,old:'',val,batchNo:b.batchNo||''}); }

/* ===== quantity-true QC helpers + QA per packed lot + print COA ===== */
function lineApprovedProducedKg(o,l){ let s=0; (state.batches||[]).forEach(b=>{ if(b.kind==='po'&&b.po===o.po&&b.lineId===l.id){ const lots=(b.lots||[]); if(lots.length){ lots.forEach(l2=>{ if(l2.coa&&l2.coa.status==='approved'){ const ck=(l2.coa.certifiedKg!=null)?l2.coa.certifiedKg:(l2.qty||0); s+=Math.min(l2.qty||0,ck); } }); } else if(b.coa&&b.coa.status==='approved'){ s+=Math.min(b.producedKg||0,(b.coa.certifiedKg!=null)?b.coa.certifiedKg:(b.producedKg||0)); } } }); return s; }
function lineQAPackedKg(o,l){ let s=0; (state.packingLog||[]).forEach(p=>{ if(p&&p.po===o.po&&p.brand===l.brand&&p.qa&&p.qa.pass) s+=(p.kg||0); }); if(l.qcPass) s=Math.max(s,l.packed||0); return s; }
function lineQA(o,l){ const lots=(state.packingLog||[]).filter(p=>p&&p.po===o.po&&p.brand===l.brand&&(p.kg||0)>0); let pass=0,fail=0,pend=0; lots.forEach(p=>{ if(p.qa&&p.qa.fail)fail++; else if(p.qa&&p.qa.pass)pass++; else pend++; }); return {lots:lots.length,pass,fail,pend,anyFail:fail>0,allPass:lots.length>0&&pass===lots.length,pending:pend>0}; }
function lotById(id){ return (state.packingLog||[]).find(p=>p&&p.id===id); }
let lotQAForm={lotId:null,marks:[],officer:'',remarks:''};
function openLotQA(lotId){ const p=lotById(lotId); if(!p)return; lotQAForm={lotId, marks:QC_CHECKLIST.map((_,i)=> (p.qa&&p.qa.checklist&&p.qa.checklist[i]&&p.qa.checklist[i].result)||''), officer:(p.qa&&p.qa.by)||'', remarks:(p.qa&&p.qa.remarks)||''}; renderLotQA(); $('modalBg').classList.add('open'); }
function lotQASet(i,v){ lotQAForm.marks[i]=v; renderLotQA(); }
function renderLotQA(){ const p=lotById(lotQAForm.lotId); if(!p){closeModal();return;}
  const rows=QC_CHECKLIST.map((it,i)=>`<tr><td>${it}</td><td style="white-space:nowrap"><label style="margin-right:12px"><input type="radio" name="qa${i}" ${lotQAForm.marks[i]==='pass'?'checked':''} onclick="lotQASet(${i},'pass')"> Pass</label><label><input type="radio" name="qa${i}" ${lotQAForm.marks[i]==='fail'?'checked':''} onclick="lotQASet(${i},'fail')"> Fail</label></td></tr>`).join('');
  $('modal').innerHTML=`<div class="mh"><h2>QA pre-shipment inspection</h2><div class="sub">${p.po} · ${p.brand} · ${fmt(p.kg)} Kg/L · batch ${lotBaseNo(p)||'—'} ▸ ${lotBrandNo(p)||'—'} · mfg ${p.mfgDate||'—'} · exp ${p.expDate||'—'} · inspector ${state.role}</div></div>
   <div class="mb"><div class="muted" style="font-size:12px;margin-bottom:10px">Inspect this packed lot. Any <b>Fail</b> = lot fails → Supply Chain corrects &amp; re-inspects. Only QA-passed lots can ship.</div>
     <table><thead><tr><th>Checklist item</th><th style="width:180px">Result</th></tr></thead><tbody>${rows}</tbody></table>
     <div class="fld" style="margin-top:10px"><label>Inspector name (shared QA login)</label><input type="text" value="${(lotQAForm.officer||'').replace(/"/g,'&quot;')}" oninput="lotQAForm.officer=this.value"></div>
     <div class="fld" style="margin-top:8px"><label>Remarks</label><input type="text" value="${(lotQAForm.remarks||'').replace(/"/g,'&quot;')}" oninput="lotQAForm.remarks=this.value"></div>
   </div>
   <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="green" onclick="lotQASubmit()">Save inspection</button></div>`; }
function lotQASubmit(){ const p=lotById(lotQAForm.lotId); if(!p)return; if(lotQAForm.marks.some(m=>!m)){toast('Mark every item Pass or Fail');return;} if(!(lotQAForm.officer||'').trim()){toast('Enter inspector name');return;}
  const anyFail=lotQAForm.marks.some(m=>m==='fail'); const d=TODAY.toISOString().slice(0,10);
  p.qa={pass:!anyFail, fail:anyFail, by:lotQAForm.officer.trim(), date:d, checklist:QC_CHECKLIST.map((it,i)=>({item:it,result:lotQAForm.marks[i]})), remarks:lotQAForm.remarks||''};
  const o=state.orders.find(x=>x.po===p.po); const l=o&&o.lines.find(x=>x.brand===p.brand);
  if(!anyFail){ p.insKg=Math.max(+p.insKg||0,(+p.kg||0)); if(o&&l){ const cleared=lineQAPackedKg(o,l); if(cleared>=(l.ordered||0)-0.001) l.qcPass=l.qcPass||d; } }
  (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'QA',po:p.po,brand:p.brand,field:anyFail?'QA FAILED':'QA passed',old:'',val:lotQAForm.remarks||''});
  logAction(`QA ${anyFail?'FAILED':'passed'} lot ${p.brandBatchNo||p.baseBatchNo||''} (${p.brand}, ${fmt(p.kg)} Kg/L) for ${p.po}`);
  save(); closeModal(); render(); }
function lotQACorrect(lotId){ if(!(canEdit(['Supply Chain'])||state.role==='COO')){toast('Supply Chain only');return;} const p=lotById(lotId); if(!p||!(p.qa&&p.qa.fail))return; const note=(typeof prompt==='function'?prompt('Correction note before re-inspection:'):'')||''; p.reinsp=(p.reinsp||0)+1; p.qa=null; logAction(`Lot ${p.brandBatchNo||p.baseBatchNo||''} corrected & resubmitted for re-inspection #${p.reinsp} (${p.po})`+(note?(' — '+note):'')); save(); render(); }

  var prod=it.l?it.l.brand:(it.batch?(it.batch.base||''):'');
  var title=it.what||(it.o?(it.label+' — '+it.o.po):(it.batch?(it.batch.batchNo||coaItemOf(it.batch)):(it.pr?('PR · '+it.pr.rm):it.label)));
  var sub=cust+(prod?' · '+prod:'');
  var due=(it.o&&it.o.promised)?('due '+_fmtShort(it.o.promised)):acWaitTxt(it);
  return '<div class="axn-card" onclick="acOpenDrawer(\''+it._id+'\')">'
    +'<div class="axn-ch"><div class="axn-ic" style="width:28px;height:28px;font-size:14px;background:color-mix(in srgb,'+col+' 14%,#fff)">'+em+'</div><div class="axn-t1" style="flex:1">'+title+'</div></div>'
    +'<div class="axn-t2">'+sub+'</div>'+acStep(it)
    +'<div class="axn-cf"><button class="sm green" onclick="event.stopPropagation();'+it.act+'">'+it.label+'</button><span class="axn-due" style="margin-left:auto">'+due+'</span></div>'
  +'</div>'; }
function acCardsHTML(){ var rows=acFiltered(); if(!rows.length)return '<div class="empty" style="padding:26px;text-align:center;color:var(--mut)">No actions in this view.</div>';

    return groups.map(function(g){ var items=rows.filter(function(x){return x._risk===g[0];}); if(!items.length)return ''; return '<div class="ac2grouphead '+g[2]+'" style="border:0;background:none;padding:8px 0">'+g[1]+' · '+items.length+'</div><div class="ac2cgrid">'+items.map(acCardHTML).join('')+'</div>'; }).join(''); }
  var keys=acGroup==='stage'?AC_STAGES.slice():AC_ROLEORDER.slice();

function acHeaderTabsHTML(){ function t(k,l){return '<button class="'+(acGroup===k?'on':'')+'" onclick="acGroup=\''+k+'\';render()">'+l+'</button>';} return t('priority','Priority')+t('stage','By stage')+t('role','By role'); }
function acGroupedHTML(mode){ var rows=acFiltered(); var EMPTY='<div class="empty" style="padding:26px;text-align:center;color:var(--mut)">No actions in this view.</div>'; if(!rows.length)return EMPTY; var keys=mode==='stage'?AC_STAGES.slice():AC_ROLEORDER.slice(); if(mode==='role'){rows.forEach(function(x){if(keys.indexOf(x.role)<0)keys.push(x.role);});} var html=keys.map(function(k){var items=rows.filter(function(x){return mode==='stage'?acStageOf(x.label)===k:x.role===k;}); if(!items.length)return ''; var late=items.filter(function(x){return x._risk==='late';}).length; var head='<div class="ac2ghead"><span class="dot"></span><span class="nm">'+k+'</span><span class="cnt">'+items.length+'</span>'+(late?'<span class="ltb">'+late+' late</span>':'')+'<span class="ln"></span></div>'; return '<div class="ac2group">'+head+items.map(function(x){return acRowHTML(x,true);}).join('')+'</div>';}).join(''); return html||EMPTY; }
function acBodyHTML(){ if(acView==='cards')return acCardsHTML(); if(acGroup==='stage')return acGroupedHTML('stage'); if(acGroup==='role')return acGroupedHTML('role'); return acListHTML(); }

  return '<div class="kpis ac2kpis">'+k('In your queue',c.all,'tasks for <b>'+state.role+'</b>','all')+k('Urgent',c.late,c.late?'<b style="color:var(--red)">overdue</b> — first':'none overdue','late')+k('Touch today',Math.min(c.all,6),'recommended focus','today')+k('Pipeline open',pipe,'orders moving',null)+'</div>'; }

    +'<select onchange="acSort2=this.value;render()"><option value="risk"'+(acSort2==='risk'?' selected':'')+'>Risk first</option><option value="oldest"'+(acSort2==='oldest'?' selected':'')+'>Oldest first</option><option value="newest"'+(acSort2==='newest'?' selected':'')+'>Newest first</option><option value="customer"'+(acSort2==='customer'?' selected':'')+'>Customer A–Z</option></select></div>';

   {n:'5',title:'Produce (batch + shift)',who:'Production',when:'as production runs',tab:'Production Center',

function seedPackForBrand(brand){ try{ const by=(SEED&&SEED.catalog&&SEED.catalog.brandsByClient)||{}; for(const k in by){ const hit=(by[k]||[]).find(x=>x.brand===brand); if(hit&&+hit.pack>0) return +hit.pack; } }catch(e){} return 0; }
function packsCount(ps,kg){ ps=+ps||0; return ps>0?Math.ceil((+kg||0)/ps):null; }
function linePackSize(po,brand){ const o=(state.orders||[]).find(x=>x.po===po); const l=o&&o.lines.find(x=>x.brand===brand); return (l&&+l.pack)||seedPackForBrand(brand)||0; }

function saveShip(){ if(!canEdit(['Supply Chain'])){toast('Supply Chain only');return;} const o=state.orders.find(x=>x.id===shipForm.oid); const l=o.lines.find(x=>x.id===shipForm.lid); const rem=Math.max(0, Math.min(l.packed||0, lineQAPackedKg(o,l)) - (l.dispatched||0));
  const kg=Math.min(+shipForm.qty||0,rem); if(kg<=0){toast('Enter a valid qty');return;}
  state.shipments.unshift({po:o.po,brand:l.brand,kg,pack:(+l.pack||seedPackForBrand(l.brand)||0),dispatch:shipForm.date,destination:shipForm.dest,carrier:shipForm.carrier,vehicle:shipForm.vehicle,dc:shipForm.dc,bilty:shipForm.bilty,delivered:shipForm.delivered||null,remarks:shipForm.remarks,by:state.role});
  l.dispatched=(l.dispatched||0)+kg; l.dispatchDate=l.dispatchDate||shipForm.date;
  if(shipForm.delivered){ l.delivered=(l.delivered||0)+kg; l.deliveredDate=shipForm.delivered; }
  const wasClosed=o.lines.every(x=>stageOf(o)==='Delivered');
  logAction(`Shipped ${fmt(kg)} Kg/L of ${l.brand} for ${o.po}${shipForm.dc?(' · DC '+shipForm.dc):''}`);
  (state.audit=state.audit||[]).unshift({t:new Date().toISOString(),user:state.role,module:'Shipment',po:o.po,brand:l.brand,field:'Dispatched',old:'',val:fmt(kg)+' Kg/L · '+(shipForm.vehicle||'')+' · DC '+(shipForm.dc||'-')});
  save(); closeModal(); render(); }

/* ===== Pre-shipment inspection (inspect-then-ship): packed material is inspected by quantity
   (partial allowed); only inspected-&-passed quantity becomes shippable. Pure reads — no mutation. ===== */
/* Lot/batch-anchored: each packing lot carries base▸brand batch #s; insKg/shipKg track inspected & shipped per lot. */
function lotsFor(o,l){ return (state.packingLog||[]).filter(p=>p&&p.po===o.po&&p.brand===l.brand&&(+p.kg||0)>0.0001).sort((a,b)=>String(a.date||a.mfgDate||'').localeCompare(String(b.date||b.mfgDate||''))||String(a.id||'').localeCompare(String(b.id||''))); }
function lotHasBatch(p){ return !!lotBaseNo(p); }
function lotAvail(p){ return Math.max(0,(+p.kg||0)-(+p.insKg||0)); }                               // packed, not yet inspected
function lotClearedKg(p){ return Math.max(0,(+p.insKg||0)-(+p.shipKg||0)); }                       // inspected, not yet shipped
function linePassedInsp(o,l){ let s=0; lotsFor(o,l).forEach(p=>s+=(+p.insKg||0)); return s; }
function lineToInspect(o,l){ let s=0; lotsFor(o,l).forEach(p=>{ if(lotHasBatch(p)) s+=lotAvail(p); }); return s; }   // inspectable (has batch #)
function lineUnbatched(o,l){ let s=0; lotsFor(o,l).forEach(p=>{ if(!lotHasBatch(p)) s+=lotAvail(p); }); return s; }  // blocked — no batch #

function rpTrace(){
  const pk=(state.packingLog||[]).filter(p=>p&&p.brand);
  if(!pk.length) return rpEmpty('No packing records yet — pack a bulk base into a brand to create base⇄brand batch links.');
  const baseOf=p=>{ let base=p.baseBatchNo; if(!base&&p.baseBatchId){ const bb=(state.batches||[]).find(b=>b.id===p.baseBatchId); base=bb&&bb.batchNo; } return base||'—'; };
  // composition: group by brand + brand batch -> contributing base batches
  const groups={};
  pk.forEach(p=>{ const bb=p.brandBatchNo||p.baseBatchNo||'—'; const key=p.brand+''+bb;
    const g=(groups[key]=groups[key]||{brand:p.brand,brandB:bb,total:0,bases:{}});
    const baseB=baseOf(p); g.total+=(p.kg||0);
    const bk=(g.bases[baseB]=g.bases[baseB]||{baseB,baseName:p.base||'',kg:0});
    bk.kg+=(p.kg||0); });
  const glist=Object.values(groups).sort((a,b)=>b.total-a.total);
  const comp=glist.map(g=>{ const bases=Object.values(g.bases).sort((a,b)=>b.kg-a.kg);
    const rows=bases.map(x=>`<tr><td><b>${x.baseB}</b></td><td class="muted">${x.baseName}</td><td style="text-align:right">${fmt(x.kg)}</td><td class="muted" style="text-align:right">${g.total?Math.round(x.kg/g.total*100):0}%</td></tr>`).join('');
    return `<details class="qcgrp"><summary><b style="color:var(--navy)">${g.brandB}</b> · ${g.brand}<span class="c">${fmt(g.total)} Kg/L · ${bases.length} base batch${bases.length===1?'':'es'}</span></summary><div style="overflow:auto"><table><thead><tr><th>Base batch</th><th>Base product</th><th style="text-align:right">Qty (Kg/L)</th><th style="text-align:right">Share</th></tr></thead><tbody>${rows}<tr style="border-top:2px solid var(--navy);background:var(--navy-50)"><td colspan="2"><b>Total — ${g.brandB}</b></td><td style="text-align:right"><b>${fmt(g.total)}</b></td><td></td></tr></tbody></table></div></details>`;
  }).join('');
  // per-run flat list (audit-level)
  const rows=pk.map(p=>({baseB:baseOf(p),brandB:p.brandBatchNo||p.baseBatchNo||'—',baseName:p.base||'',brand:p.brand,po:p.po||'',kg:p.kg||0,date:p.date||''}));
  rows.sort((a,b)=>(a.brandB+a.date).localeCompare(b.brandB+b.date));
  const flat=`<div class="card"><h3>Every pack run <span class="hint">${rows.length}</span></h3><div class="muted" style="font-size:11px;margin-bottom:8px">The raw log behind the composition above — one row per packing run.</div><div style="overflow:auto;max-height:420px"><table><thead><tr><th>Base batch</th><th>Base product</th><th>→ Brand batch</th><th>Brand</th><th>PO</th><th style="text-align:right">Qty</th><th>Date</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r.baseB}</b></td><td class="muted">${r.baseName}</td><td><b style="color:var(--navy)">${r.brandB}</b></td><td>${r.brand}</td><td>${r.po}</td><td style="text-align:right">${fmt(r.kg)}</td><td class="muted">${r.date}</td></tr>`).join('')}</tbody></table></div></div>`;

}
function rpLog(){ const rows=(state.audit||[]).map(x=>({when:(x.t||'').replace('T',' ').slice(0,16),date:(x.t||'').slice(0,10),user:x.user||'',module:x.module||'',po:x.po||'',brand:x.brand||'',field:x.field||'',val:(x.val!=null?String(x.val):'')}));
  const opt={placeholder:'Search user, PO, product, action, value…', searchKeys:['user','po','brand','field','val','module'], filters:[{key:'module',label:'Module'}], dateKey:'date', pageSize:50};
  opt.filters[0].opts=[...new Set(rows.map(r=>r.module).filter(Boolean))].sort();
  const {view,total,pages}=regFilter('log',rows,opt);
  const body=view.map(x=>`<tr><td class="muted" style="white-space:nowrap">${x.when}</td><td>${x.user||'—'}</td><td><span class="pill" style="background:var(--navy-50);color:var(--navy);font-size:9px">${x.module||'—'}</span></td><td>${x.po||'—'}</td><td>${x.brand||'—'}</td><td>${x.field||'—'}</td><td>${x.val||'—'}</td></tr>`).join('');
  return `<div class="card"><h3>Action Log <span class="hint">${rows.length} entries</span></h3>${regBar('log',opt,total)}<div style="overflow:auto;max-height:58vh"><table><thead><tr><th>When</th><th>User</th><th>Module</th><th>PO</th><th>Product</th><th>Field</th><th>Value</th></tr></thead><tbody>${body||'<tr><td colspan="7" class="muted">No actions match.</td></tr>'}</tbody></table></div>${regPager('log',pages)}</div>`;
}

async function doLogin(){
  const u=($('lg_user').value||'').trim().toLowerCase();
  const p=$('lg_pass').value||'';
  let r; try{ r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}); }catch(e){ renderLogin('Cannot reach the server. Check your connection and try again.'); return; }
  if(!r.ok){ renderLogin('Incorrect username or password.'); return; }
  const j=await r.json(); setSession(j.token, j.user);
  let loaded=false;
  try{ const sr=await fetch('/api/state',{cache:'no-store',headers:authHdr()}); if(sr.ok){ const sj=await sr.json(); _rev=sj.rev||0; if(sj.data&&sj.data.orders){ state=ensureState(sj.data); loaded=true; } else if((sj.rev||0)===0 && !sj.data){ state=buildFromSeed(); loaded=true; await saveNow(); } } }catch(e){}
  if(!loaded){ state=buildFromSeed(); }
  sessionInit(state); state.currentUser=j.user; state.role=j.user.role;
  const al=allowedScreens(); state.screen=canView(state.role,'approvals')?'approvals':((al[0]&&al[0].id)||'dash');  /* land on Action Center (My Actions) for all users; fall back only if a role can't view it */
  logAction('Signed in'); save();
  renderApp(); startSync();
}
function logout(){ if(state.currentUser){ logAction('Signed out'); saveNow(); } setSession('',null); renderApp(); }

  $('view').innerHTML=`
   <div class="card"><h3>Add a person</h3><div class="formgrid">
     <div class="fld"><label>Full name</label><input value="${uForm.name}" oninput="uForm.name=this.value" placeholder="e.g. Muhammad Imran"></div>
     <div class="fld"><label>Username</label><input value="${uForm.username}" oninput="uForm.username=this.value" placeholder="e.g. imran"></div>
     <div class="fld"><label>Password</label><input type="password" value="${uForm.password}" oninput="uForm.password=this.value" placeholder="set a password"></div>
     <div class="fld"><label>Role</label><select onchange="uForm.role=this.value">${rolesList().map(r=>`<option ${r===uForm.role?'selected':''}>${r}</option>`).join('')}</select></div>
   </div><button class="green" style="margin-top:13px" onclick="addUser()">Add person</button></div>
   <div class="card"><h3>People <span class="hint">${us.length} accounts</span></h3><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th class="ctr">Actions</th></tr></thead><tbody>${us.map(u=>`<tr><td><b>${u.name}</b>${u.username===me?' <span class="pill" style="background:var(--navy-50);color:var(--navy)">you</span>':''}</td><td>${u.username}</td><td>${u.role}</td><td class="ctr"><button class="sm ghost" onclick="openEditUser('${u.username}')">Edit</button> <button class="sm ghost" onclick="delUser('${u.username}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
async function addUser(){ if(!screenEditOK('users')){toast('You need Edit access to Users & Access');return;} const n=(uForm.name||'').trim(), u=(uForm.username||'').trim().toLowerCase(), p=uForm.password||'';
  if(!n||!u||!p){toast('Name, username and password are all required');return;}
  try{ const r=await fetch('/api/users',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHdr()),body:JSON.stringify({name:n,username:u,password:p,role:uForm.role})});
    if(r.status===409){toast('That username already exists');return;}
    if(!r.ok){toast('Could not add user');return;}
    logAction('Added user '+u+' as '+uForm.role); save();
    uForm={name:'',username:'',password:'',role:'KAM'}; toast('Added '+n); loadUsers();
  }catch(e){ toast('Network error'); }
}
async function delUser(username){ if(!screenEditOK('users')){toast('You need Edit access to Users & Access');return;} const u=(usersList||[]).find(x=>x.username===username); if(!u)return;
  if(state.currentUser&&state.currentUser.username===username){toast('You cannot delete your own account');return;}
  if(typeof confirm==='function' && !confirm('Delete '+u.name+'?')) return;
  try{ const r=await fetch('/api/users/'+encodeURIComponent(username),{method:'DELETE',headers:authHdr()});
    if(!r.ok){ const j=await r.json().catch(()=>({})); toast(j.error||'Could not delete'); return; }
    logAction('Deleted user '+username); save(); loadUsers();
  }catch(e){ toast('Network error'); }
}
let uEdit={username:'',name:'',newUsername:'',password:'',role:'KAM'};
function openEditUser(username){ if(!screenEditOK('users'))return; const u=(usersList||[]).find(x=>x.username===username); if(!u)return; uEdit={username:u.username,name:u.name,newUsername:u.username,password:'',role:u.role}; renderEditUser(); $('modalBg').classList.add('open'); }
function renderEditUser(){ const self=state.currentUser&&state.currentUser.username===uEdit.username;
  $('modal').innerHTML=`<div class="mh"><h2>Edit person</h2><div class="sub">${uEdit.username||''}${self?' · this is you':''}</div></div>
  <div class="mb"><div class="formgrid" style="grid-template-columns:1fr 1fr">
    <div class="fld"><label>Full name</label><input value="${uEdit.name}" oninput="uEdit.name=this.value"></div>
    <div class="fld"><label>Username</label><input value="${uEdit.newUsername}" oninput="uEdit.newUsername=this.value"></div>
    <div class="fld"><label>New password <span class="muted" style="text-transform:none">(blank = keep)</span></label><input type="password" value="${uEdit.password}" oninput="uEdit.password=this.value" placeholder="leave blank to keep"></div>
    <div class="fld"><label>Role</label><select onchange="uEdit.role=this.value">${rolesList().map(r=>`<option ${r===uEdit.role?'selected':''}>${r}</option>`).join('')}</select></div>
  </div><div class="muted" style="font-size:11px;margin-top:11px">Leave password blank to keep the current one. If you change your OWN account, you'll be signed out to sign in again.</div></div>
  <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="green" onclick="saveEditUser()">Save changes</button></div>`; }
async function saveEditUser(){ if(!screenEditOK('users')){toast('You need Edit access to Users & Access');return;} const old=uEdit.username; const n=(uEdit.name||'').trim(), un=(uEdit.newUsername||'').trim().toLowerCase();
  if(!n||!un){toast('Name and username are required');return;}
  const body={name:n,username:un,role:uEdit.role}; if(uEdit.password) body.password=uEdit.password;
  try{ const r=await fetch('/api/users/'+encodeURIComponent(old),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},authHdr()),body:JSON.stringify(body)});
    if(r.status===409){toast('That username already exists');return;}
    if(!r.ok){ const j=await r.json().catch(()=>({})); toast(j.error||'Could not save'); return; }
    logAction('Edited user '+un); save(); closeModal(); toast('Saved');
    if(state.currentUser && state.currentUser.username===old){ toast('Your account changed — please sign in again'); setTimeout(function(){ setSession('',null); renderApp(); },800); return; }
    loadUsers();
  }catch(e){ toast('Network error'); }
}

bootState();
</script>
<script>
/* ===== Production Center selectors (read-only, drop-in from handoff) ===== */
/* ============================================================
   VAN Ops — Production Center selectors (vanilla JS, no React)
   ------------------------------------------------------------
   Drop-in for the live app (index.html). Every function reads
   LIVE `state` and returns plain data for the 3 Views.

   Field names match live state:
     batch:  { batchNo, kind 'po'|'bulk', po, lineId, base, brand,
               plannedKg, producedKg, packedKg, status, openedDate,
               pool, sources, lots:[{ qty, certifiedKg, coa:{ status,
               overall 'FIT'|'UNFIT', deviation, certifiedKg, qcNo,
               incharge, shift, date } }] }
     order:  { po, client, lines:[{ id, brand, base, ordered,
               produced, rmStatus }] }
     productionLog: [{ date, base, kg, shift, incharge, batchNo }]
     inspections:   [{ pass, ... }]

   Usage:
     const PC = ProductionCenter;
     const lanes   = PC.floorLanes(state);
     const kpis    = PC.floorKpis(state);
     const byDay   = PC.output(state).byDate;
     const reg     = PC.coaRegister(state);
   No dependency on prod-data.js — that was demo-only.
   ============================================================ */
(function (global) {
  'use strict';

  // ---- small utils ----------------------------------------------------
  var round = function (n) { return Math.round(n || 0); };
  var fmt = function (n) { return round(n).toLocaleString('en-US'); };
  var sum = function (arr, f) { return arr.reduce(function (a, x) { return a + (f ? f(x) : x); }, 0); };
  function groupSum(rows, keyFn, valFn) {
    var m = {};
    rows.forEach(function (r) { var k = keyFn(r); m[k] = (m[k] || 0) + (valFn(r) || 0); });
    return m;
  }
  function sortedPairs(obj) {
    return Object.keys(obj).map(function (k) { return { name: k, kg: obj[k] }; })
      .sort(function (a, b) { return b.kg - a.kg; });
  }

  // ---- per-batch derivation (mirrors batchStage in source) ------------
  // Returns the computed quantities + stage for one batch.
  function derive(b) {
    var lots = b.lots || [];
    var cert = 0, pend = 0, unfit = 0, dev = 0;
    lots.forEach(function (l) {
      var c = l.coa || {};
      if (c.status === 'approved') {
        cert += (l.certifiedKg || c.certifiedKg || l.qty || 0);
        if (c.deviation) dev++;
      } else {
        pend += (l.qty || 0);
      }
      if (c.overall === 'UNFIT' && !c.deviation) unfit += (l.qty || 0);
    });
    var planned = b.plannedKg || 0;
    var produced = b.producedKg || 0;
    var packed = b.packedKg || 0;
    var toProduce = Math.max(0, planned - produced);
    var readyToPack = Math.max(0, cert - packed);

    var stage;
    if (b.pool) stage = 'recon';
    else if (toProduce > 0 && cert <= packed && pend === 0) stage = 'producing';
    else if (pend > 0) stage = 'qc';
    else if (readyToPack > 0) stage = 'pack';
    else stage = 'packed';

    return {
      batchNo: b.batchNo, kind: b.pool ? 'pool' : b.kind, po: b.po || '',
      base: b.base, brand: (b.brand && b.brand !== b.base) ? b.brand : '',
      planned: planned, produced: produced, packed: packed,
      cleared: cert, pending: pend, unfit: unfit, deviations: dev,
      lots: lots.length, sources: b.sources || 0,
      toProduce: toProduce, readyToPack: readyToPack,
      stage: stage, opened: b.openedDate,
      owner: b.pool ? 'By-product pool' : (b.po ? ('PO ' + b.po) : 'Bulk \u2192 stock')
    };
  }

  // Only batches still on the floor (status open). Adjust if your
  // "open" flag differs.
  function openBatches(state) {
    return (state.batches || []).filter(function (b) {
      return b.status === 'open';
    }).map(derive);
  }

  var STAGE_ORDER = ['producing', 'qc', 'pack', 'recon', 'packed'];
  var STAGE_META = {
    producing: { name: 'In production',        dot: '#0891b2' },
    qc:        { name: 'Awaiting Lab QC',       dot: '#C77B0E' },
    pack:      { name: 'Ready to pack',         dot: '#06b6d4' },
    recon:     { name: 'Reconcile',             dot: '#C0392B' },
    packed:    { name: 'Packed \u2014 closing', dot: '#B7C3BC' }
  };

  // ====================================================================
  //  VIEW 1 — FLOOR
  // ====================================================================
  function floorKpis(state) {
    var rows = openBatches(state);
    var by = {}; STAGE_ORDER.forEach(function (k) { by[k] = []; });
    rows.forEach(function (r) { (by[r.stage] || (by[r.stage] = [])).push(r); });
    return {
      producing: { count: by.producing.length, kg: sum(by.producing, function (b) { return b.toProduce; }) },
      qc:        { count: by.qc.length,        kg: sum(by.qc, function (b) { return b.pending; }) },
      pack:      { count: by.pack.length,      kg: sum(by.pack, function (b) { return b.readyToPack; }) },
      recon:     { count: by.recon.length,     kg: sum(by.recon, function (b) { return b.planned; }) }
    };
  }
  // Lanes (sub-view: Lanes / Board both use this; Table uses floorRows)
  function floorLanes(state) {
    var rows = openBatches(state);
    return STAGE_ORDER.map(function (k) {
      var list = rows.filter(function (r) { return r.stage === k; });
      var totalKg = sum(list, function (b) {
        return k === 'pack' ? b.readyToPack : k === 'producing' ? b.toProduce
             : k === 'qc' ? b.pending : b.planned;
      });
      return { stage: k, name: STAGE_META[k].name, dot: STAGE_META[k].dot,
               count: list.length, totalKg: totalKg, batches: list };
    });
  }
  // Table sub-view (optionally filtered by stage)
  function floorRows(state, stageFilter) {
    var rows = openBatches(state);
    return (stageFilter && stageFilter !== 'all')
      ? rows.filter(function (r) { return r.stage === stageFilter; })
      : rows;
  }

  // ====================================================================
  //  VIEW 2 — OUTPUT  (analytics off productionLog)
  // ====================================================================
  function output(state, days) {
    var log = state.productionLog || [];
    // batchNo -> po  (for By PO)
    var b2po = {};
    (state.batches || []).forEach(function (b) { if (b.po && b.batchNo) b2po[b.batchNo] = b.po; });
    var poClient = {};
    (state.orders || []).forEach(function (o) { poClient[String(o.po)] = o.client; });

    var allDates = log.map(function (p) { return p.date; })
      .filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
    var lastN = days ? allDates.slice(-days) : allDates.slice(-7);
    var byDate = lastN.map(function (dt) {
      var rows = log.filter(function (p) { return p.date === dt; });
      return { date: dt, kg: sum(rows, function (p) { return p.kg; }), entries: rows.length };
    });

    var byShift = groupSum(log, function (p) { return p.shift; }, function (p) { return p.kg; });
    var byIncharge = sortedPairs(groupSum(log, function (p) { return p.incharge || p.by; }, function (p) { return p.kg; }));
    var byProduct  = sortedPairs(groupSum(log, function (p) { return p.base; }, function (p) { return p.kg; }));
    var byPOraw    = groupSum(log, function (p) { return b2po[p.batchNo] || 'Bulk \u2192 stock'; }, function (p) { return p.kg; });
    var byPO = sortedPairs(byPOraw).map(function (x) {
      return { name: x.name, kg: x.kg,
               client: x.name === 'Bulk \u2192 stock' ? 'to stock' : (poClient[x.name] || '') };
    });

    var recent = log.slice().sort(function (a, b) { return String(b.date).localeCompare(a.date); })
      .slice(0, 14).map(function (p) {
        return { date: p.date, shift: p.shift, incharge: p.incharge || p.by,
                 product: p.base, kg: p.kg, batchNo: p.batchNo };
      });

    var total = sum(byDate, function (x) { return x.kg; });
    return {
      byDate: byDate, byShift: byShift, byIncharge: byIncharge,
      byProduct: byProduct, byPO: byPO, recent: recent,
      totalKg: total, avgPerDay: byDate.length ? round(total / byDate.length) : 0,
      todayKg: byDate.length ? byDate[byDate.length - 1].kg : 0,
      qcPassRate: qcPassRate(state)
    };
  }
  function qcPassRate(state) {
    var ins = state.inspections || [];
    if (!ins.length) return 100;
    return round(ins.filter(function (i) { return i.pass; }).length / ins.length * 100);
  }

  // ====================================================================
  //  VIEW 3 — LIFECYCLE
  // ====================================================================
  // Sub-view "Batch": master list + one batch's stepper
  function lifecycleMaster(state) {
    return openBatches(state).map(function (b) {
      return { batchNo: b.batchNo, product: b.base, stage: b.stage,
               stageName: STAGE_META[b.stage].name, dot: STAGE_META[b.stage].dot };
    });
  }
  function lifecycleSteps(b /* a derived batch */) {
    var st = function (state) { return state; };
    var stProd = b.produced >= b.planned ? 'done' : b.produced > 0 ? 'curr' : 'todo';
    var stQC   = b.pending > 0 ? 'curr' : b.cleared > 0 ? 'done' : 'todo';
    var stPack = b.cleared > 0 && b.packed >= b.cleared ? 'done' : (b.stage === 'pack' || b.packed > 0) ? 'curr' : 'todo';
    var stRec  = b.stage === 'recon' ? 'curr' : (b.produced > b.packed && b.stage === 'packed') ? 'curr' : 'todo';
    return [
      { key: 'produced', label: 'Produced',  state: stProd, sub: fmt(b.produced) + '/' + fmt(b.planned) + ' KG' },
      { key: 'qc',       label: 'Lab QC',     state: stQC,   sub: b.pending > 0 ? fmt(b.pending) + ' KG pending' : b.cleared > 0 ? fmt(b.cleared) + ' KG cleared' : '\u2014' },
      { key: 'packed',   label: 'Packed',     state: stPack, sub: fmt(b.packed) + '/' + fmt(b.cleared) + ' KG' },
      { key: 'recon',    label: 'Reconcile',  state: stRec,  sub: b.stage === 'recon' ? fmt(b.planned) + ' KG pool' : (b.produced > b.packed ? fmt(b.produced - b.packed) + ' KG left' : '\u2014') },
      { key: 'closed',   label: 'Closed',     state: 'todo', sub: 'open' }
    ];
  }
  // Sub-view "By PO": open PO batches grouped under their PO
  function lifecycleByPO(state) {
    var rows = openBatches(state).filter(function (b) { return b.kind === 'po' && b.po; });
    var poClient = {};
    (state.orders || []).forEach(function (o) { poClient[String(o.po)] = o.client; });
    var groups = {};
    rows.forEach(function (b) { (groups[b.po] = groups[b.po] || []).push(b); });
    return Object.keys(groups).map(function (po) {
      return { po: po, client: poClient[po] || '', count: groups[po].length, batches: groups[po] };
    });
  }
  // Sub-view "Quality": COA register across all open batch lots
  function coaRegister(state) {
    var out = [];
    (state.batches || []).filter(function (b) { return b.status === 'open' && !b.pool; })
      .forEach(function (b) {
        (b.lots || []).forEach(function (l) {
          var c = l.coa || {};
          var result;
          if (c.status !== 'approved') result = { label: 'Lab QC pending', tone: 'muted' };
          else if (c.deviation)        result = { label: 'Approved \u00b7 deviation', tone: 'warn' };
          else if (c.overall === 'UNFIT') result = { label: 'UNFIT', tone: 'bad' };
          else                         result = { label: 'FIT', tone: 'good' };
          out.push({ batchNo: b.batchNo, lotNo: l.lotNo, product: b.base,
                     qty: l.qty, qcNo: c.qcNo || '', incharge: l.incharge || c.incharge || '',
                     date: l.date || c.date || '', result: result });
        });
      });
    return out;
  }

  // ====================================================================
  //  OPEN-BATCH support (dropdowns + validation)  — mirrors openBatch()
  // ====================================================================
  var BULK_BASES = ['Potassium Humate', 'Potassium Humate Liquid', 'Sulfur Coated Urea',
    'Sulfur 70%', 'Amino Acid', 'Compost', 'Zinc 21%', 'NP 6.32', 'Nitro Sulfur',
    'Liquid Phosphrous', 'Mg Sulphate', 'NPK 8.8.6', 'Boron 5%', 'Zinc 10%'];

  // POs that still have producible lines
  function openablePOs(state) {
    return (state.orders || []).map(function (o) {
      var lines = (o.lines || []).filter(function (l) {
        return (l.produced || 0) < (l.ordered || 0) - 0.5;
      }).map(function (l) {
        return { id: l.id, brand: l.brand, base: l.base, ordered: l.ordered,
                 produced: l.produced || 0,
                 remaining: Math.max(0, (l.ordered || 0) - (l.produced || 0)),
                 rmStatus: l.rmStatus || 'pending',
                 sameBase: (l.base === l.brand) };
      });
      return { id: o.id, po: String(o.po), client: o.client, lines: lines };
    }).filter(function (o) { return o.lines.length > 0; });
  }

  // Financial year (Jul–Jun) key for a date
  function fyKey(dateStr) {
    var d = dateStr ? new Date(dateStr) : new Date();
    var y = d.getFullYear(), m = d.getMonth(); // 0=Jan
    return (m >= 6) ? y : (y - 1); // Jul(6)..Dec -> y ; Jan..Jun -> y-1
  }
  function usedBatchNos(state, forDate) {
    var fy = fyKey(forDate);
    return (state.batches || []).filter(function (b) {
      return b.batchNo && fyKey(b.openedDate) === fy;
    }).map(function (b) { return b.batchNo.trim().toUpperCase(); });
  }
  // Soft format check — warns, never blocks (matches validateBatchNo)
  function batchNoFormatOk(no) {
    no = (no || '').trim();
    return /^[A-Z]{2,5}[0-9]{3,9}$/.test(no) && no.length >= 5 && no.length <= 14;
  }
  // Full validation for the Open-batch modal. Returns
  // { ok, errors:[], warnings:[] } — RM is a WARNING here; flip to an
  // error to hard-block (the live app blocks until RM Check confirms).
  function validateOpenBatch(state, opts) {
    // opts: { mode:'po'|'bulk', po, lineId, base, plannedKg, batchNo, enforceRM }
    var errors = [], warnings = [];
    var no = (opts.batchNo || '').trim().toUpperCase();
    if (!no) errors.push('Batch # is required.');
    else if (usedBatchNos(state).indexOf(no) !== -1)
      errors.push('Batch # "' + no + '" already used this financial year.');
    if (no && !batchNoFormatOk(no))
      warnings.push('Unusual format — convention is 2\u20135 capitals + 3\u20139 digits (e.g. AB12345).');

    if (opts.mode === 'po') {
      var po = openablePOs(state).filter(function (o) { return o.id === opts.po; })[0];
      var line = po && po.lines.filter(function (l) { return l.id === opts.lineId; })[0];
      if (!po || !line) { errors.push('Pick a PO and product.'); }
      else {
        if (!line.sameBase)
          errors.push(line.brand + ' is made from base "' + line.base +
            '". Produce ' + line.base + ' in Bulk \u2192 stock, then pack it into ' + line.brand + '.');
        var pv = +(opts.plannedKg || 0) || 0;
        if (pv > 0 && pv > line.remaining + 0.5)
          errors.push('Plan must be \u2264 ' + fmt(line.remaining) + ' Kg (remaining order).');
        if (line.rmStatus !== 'full') {
          var msg = 'No raw material confirmed yet for ' + line.brand + ' \u2014 run RM Check first.';
          (opts.enforceRM ? errors : warnings).push(msg);
        }
      }
    } else {
      if (!opts.base) errors.push('Pick a base product.');
      if (!(+(opts.plannedKg || 0) > 0)) errors.push('Enter a planned quantity.');
    }
    return { ok: errors.length === 0, errors: errors, warnings: warnings };
  }

  // ---- export ---------------------------------------------------------
  global.ProductionCenter = {
    // shared
    derive: derive, openBatches: openBatches,
    STAGE_ORDER: STAGE_ORDER, STAGE_META: STAGE_META, BULK_BASES: BULK_BASES,
    fmt: fmt,
    // View 1 — Floor
    floorKpis: floorKpis, floorLanes: floorLanes, floorRows: floorRows,
    // View 2 — Output
    output: output, qcPassRate: qcPassRate,
    // View 3 — Lifecycle
    lifecycleMaster: lifecycleMaster, lifecycleSteps: lifecycleSteps,
    lifecycleByPO: lifecycleByPO, coaRegister: coaRegister,
    // Open batch
    openablePOs: openablePOs, usedBatchNos: usedBatchNos,
    batchNoFormatOk: batchNoFormatOk, validateOpenBatch: validateOpenBatch,
    fyKey: fyKey
  };
})(typeof window !== 'undefined' ? window : this);

</script>
</body></html>
