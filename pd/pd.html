<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAN · Product Development</title>
<meta name="description" content="Vital Agri Nutrients — Product Development.">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   PD · the screens milestone, part 1 — intake (the three doors), the Problem
   register, and triage.  Written 9 Sept 2026.

   The shell deliberately mirrors o2s/o2s.html — same sidebar, same type, same
   radii and shadows — so PD and O2S read as one platform behind one login,
   which PORTING_STATUS.md flagged as the thing the old hand-built PD page got
   wrong. The accent is PD's green rather than O2S's cyan: same building,
   different room.

   The wording on this page is governed by RECLASSIFICATION-RULES.md §6, which
   bans a specific list of words anywhere a person can read them. Nothing here
   says wrong, incorrect, invalid, mistake, misfiled, corrected, or should have
   been. An entry is moved, refiled, or now recorded as something — never
   fixed. If you are editing this file, that list is not a style preference.
--------------------------------------------------------------------------- */
:root{
  --bg:#f8f9fb; --panel:#fff; --panel2:#f1f3f6; --line:#e5e8ee; --line2:#eef0f4;
  --rail:#eceef1; --rail-line:#dee1e6;
  --green:#16a34a; --green2:#15803d; --green-50:#e7f7ee; --green-100:#c4ebd5;
  --amber:#c77b0e; --amber-50:#faf0da; --red:#c0392b; --red-50:#fbe7e4;
  --blue:#2563eb; --violet:#7a6cc0; --violet-50:#efedf9;
  --txt:#161a20; --txt2:#475063; --mut:#717a88; --faint:#98a1b0;
  --head:'Space Grotesk','Inter',system-ui,sans-serif;
  --radius:15px; --radius-sm:10px;
  --sh-sm:0 1px 2px rgba(15,23,42,.07),0 1px 1px rgba(15,23,42,.04);
  --sh:0 3px 12px rgba(15,23,42,.10),0 1px 3px rgba(15,23,42,.06);
  --ring:0 0 0 3px rgba(22,163,74,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
h1,h2,h3{margin:0;letter-spacing:-.02em;font-family:var(--head)}
a{color:var(--green2);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d6deea;border-radius:8px;border:2px solid var(--bg)}

/* ---------- sign in ---------- */
.signin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.signin .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);padding:30px 28px}
.signin h1{font-size:19px;margin-bottom:6px}
.signin p{color:var(--mut);margin:0 0 20px;font-size:13px;line-height:1.5}

/* ---------- app shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:220px;background:var(--rail);border-right:1px solid var(--rail-line);padding:11px 9px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;padding:3px 6px 10px;border-bottom:1px solid var(--line2);margin-bottom:8px}
.brand img{height:28px;width:auto;display:block}
.brand{gap:8px}
.brand img{height:26px}
/* The rail is 220px and the logo takes most of it, so this label has to be
   allowed to wrap. It was clipping to "PRODUCT DEVELOPME" before — found by
   looking at the rendered page, not by any test. */
.brand .nm{font-size:9.5px;font-weight:700;color:var(--mut);letter-spacing:.7px;line-height:1.25;text-transform:uppercase;padding-left:8px;border-left:1px solid var(--rail-line);white-space:normal;min-width:0}
.nav{display:flex;flex-direction:column;gap:1px;flex:1}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;color:var(--txt2);cursor:pointer;font-size:12.5px;font-weight:600;transition:.13s;position:relative;text-decoration:none}
.nav a:hover{background:var(--panel2);color:var(--txt);text-decoration:none}
.nav a.active{background:var(--green-50);color:var(--green2);font-weight:700}
.nav a.active::before{content:'';position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--green)}
.nav a .ic svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
.nav a .cnt{margin-left:auto;font-size:10px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut)}
.side .foot{padding-top:12px;border-top:1px solid var(--line2);margin-top:8px;font-size:11.5px;color:var(--mut);line-height:1.5}
.side .foot b{display:block;color:var(--txt);font-size:12.5px;font-weight:700}
.main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1180px}
.page-h{margin-bottom:16px}
.page-h h1{font-size:21px}
.page-h .sub{color:var(--mut);font-size:13px;margin-top:5px;line-height:1.55;max-width:62ch}

/* ---------- pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-sm);padding:18px 18px}
.card + .card{margin-top:14px}
.card h2{font-size:14.5px;margin-bottom:3px}
.card .hint{color:var(--mut);font-size:12.5px;line-height:1.55;margin:0 0 14px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}.side{display:none}.main{padding:16px}}
label{display:block;font-size:11.5px;font-weight:700;color:var(--txt2);margin:0 0 5px;letter-spacing:.01em}
label .opt{font-weight:500;color:var(--faint);letter-spacing:0}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--txt);background:#fff;outline:none;transition:.13s}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:var(--ring)}
textarea{resize:vertical;min-height:88px;line-height:1.55}
.field{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--green);background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:8px 15px;border-radius:var(--radius-sm);cursor:pointer;transition:.13s}
.btn:hover{background:var(--green2);border-color:var(--green2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--txt2);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel2);color:var(--txt)}
.btn.sm{font-size:12px;padding:5px 11px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.door{border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:10px 11px;cursor:pointer;text-align:left;transition:.13s}
.door:hover{border-color:var(--green-100);background:var(--green-50)}
.door.on{border-color:var(--green);background:var(--green-50);box-shadow:var(--ring)}
.door b{display:block;font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:2px}
.door span{font-size:11.5px;color:var(--mut);line-height:1.45}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.pill.num{background:#fff;color:var(--txt2);font-family:var(--head);letter-spacing:.04em}
.pill.unsorted{background:var(--amber-50);color:var(--amber);border-color:#f0dfb5}
.pill.settled{background:var(--green-50);color:var(--green2);border-color:var(--green-100)}
.pill.moved{background:var(--violet-50);color:var(--violet);border-color:#ddd8f0}
.item{border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;background:#fff;margin-bottom:8px}
.item:hover{border-color:var(--line2);box-shadow:var(--sh-sm)}
.item .top{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.item .txt{font-size:13px;color:var(--txt);line-height:1.55;white-space:pre-wrap}
.item .meta{font-size:11.5px;color:var(--mut);margin-top:7px}
.item .waiting{font-size:11.5px;color:var(--amber);font-weight:600;margin-top:6px}
.empty{color:var(--mut);font-size:12.5px;padding:14px 2px;line-height:1.6}
.msg{border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.5}
.msg.ok{background:var(--green-50);color:var(--green2);border:1px solid var(--green-100)}
.msg.bad{background:var(--red-50);color:var(--red);border:1px solid #f3ccc6}
.kills{background:#fff;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:var(--radius-sm);padding:9px 12px;margin-top:8px;font-size:12.5px;line-height:1.5;color:var(--txt2)}
.kills b{color:var(--txt)}
.result{background:var(--green-50);border:1px solid var(--green-100);border-radius:var(--radius-sm);padding:9px 12px;margin-top:8px;font-size:12.5px;line-height:1.5;color:var(--txt)}
.notice{background:#fff;border:1px solid var(--green-100);border-left:3px solid var(--green);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:12px}
.notice b{font-size:13.5px;display:block;margin-bottom:4px}
.notice .def{font-size:12.5px;color:var(--txt2);line-height:1.55}
.notice .by{font-size:11.5px;color:var(--mut);margin-top:7px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;padding:0 8px 7px 0;border-bottom:1px solid var(--line)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.tile{border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;background:#fff}
.tile.flag{border-color:#f0dfb5;background:var(--amber-50)}
.tile .n{font-family:var(--head);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.tile.flag .n{color:var(--amber)}
.tile .l{font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.35}
.tile .h{font-size:11px;color:var(--faint);margin-top:4px;line-height:1.35}
.item.flag{border-color:#f0dfb5;background:#fffdf7}
.hist{font-size:12px;color:var(--txt2);border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-bottom:9px}
.hist .f{font-weight:700;color:var(--txt);font-size:12px}
.hist .was{color:var(--mut);text-decoration:line-through;text-decoration-color:#cfd6e0}
.hist .who{color:var(--faint);font-size:11px;margin-top:3px}
.quiet{font-size:11.5px;color:var(--faint);cursor:pointer}
.quiet:hover{color:var(--green2);text-decoration:underline}
.back{font-size:12.5px;color:var(--mut);margin-bottom:10px;display:inline-block}
.spin{color:var(--mut);font-size:12.5px;padding:20px 0}
</style>
</head>
<body>
<div id="root"><div class="spin" style="padding:40px">Loading…</div></div>

<script>
/* ===========================================================================
   State. `me` is null until a session is proven — every render path and the
   hash router check it. That is not defensive habit: signing out used to race
   the router here (location.hash='' fires its handler AFTER the synchronous
   sign-out code), and the previous session's page could repaint over the
   login form. Found in a browser, invisible to API tests.
   =========================================================================== */
var me = null, D = null, D2 = null, D3 = null, view = null, msg = null;
/* What the person has typed but not yet saved. paint() rebuilds the whole
   screen from innerHTML, so without this a click on a door button — or any
   message coming back from the server — emptied the box they had just written
   in. On a screen whose own promise is "one minute is enough", losing the
   minute is the worst bug it can have. Found by review, 9 Sept 2026. */
var draft = {};
function fields() { return document.querySelectorAll('#root input[id], #root textarea[id], #root select[id]'); }
function keepDraft() {
  Array.prototype.forEach.call(fields(), function (el) { draft[el.id] = el.value; });
}
function restoreDraft() {
  Array.prototype.forEach.call(fields(), function (el) {
    if (draft[el.id] !== undefined && draft[el.id] !== '') el.value = draft[el.id];
  });
}
function clearDraft() { draft = {}; }
var TOKEN_KEY = 'van_token';                 // the same token O2S uses — one login
var $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function token() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

async function api(path, method, body) {
  var res = await fetch(path, {
    method: method || 'GET',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  var j = null; try { j = await res.json(); } catch (e) {}
  if (res.status === 401) { setToken(''); me = null; renderSignIn(); throw new Error('signed out'); }
  if (!res.ok) throw new Error(pdWords((j && j.error) || 'That did not go through. Try again in a moment.'));
  return j;
}
function when(ts) {
  if (!ts) return '';
  var d = new Date(String(ts).replace(' ', 'T'));
  if (isNaN(d)) return String(ts).slice(0, 10);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

/* ---------------------------------------------------------------------------
   Sign in — the same POST /api/login and the same van_token as O2S.
--------------------------------------------------------------------------- */
/* See the note in the sign-in handler: this module cannot edit the platform's
   own messages, so it says them in its own words on its own screen. */
function pdWords(msg) {
  var m = String(msg || '');
  if (/username or password/i.test(m)) return 'That username and password did not match. Check them and try again.';
  if (/^Error:/i.test(m) || /ECONNREFUSED|ETIMEDOUT|ENOTFOUND/i.test(m)) {
    return 'PD could not be reached just now. Try again in a moment, or tell the Data Custodian.';
  }
  if (/Not permitted: (\w+)/.test(m)) {
    return 'That part of PD is not open to your role yet. Ask the COO or the Data Custodian.';
  }
  return m || 'That did not sign in.';
}
function renderSignIn(err) {
  $('root').innerHTML =
    '<div class="signin"><div class="card">' +
      '<div class="brand" style="border:none;margin:0 0 14px;padding:0">' +
        '<img src="/assets/van-logo.png" alt="VAN"><span class="nm">Product Development</span></div>' +
      '<h1>Sign in</h1><p>The same account you use for the Order Control Tower.</p>' +
      (err ? '<div class="msg bad">' + esc(err) + '</div>' : '') +
      '<div class="field"><label>Username</label><input type="text" id="u" autocomplete="username"></div>' +
      '<div class="field"><label>Password</label><input type="password" id="p" autocomplete="current-password" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;font-family:inherit"></div>' +
      '<button class="btn" id="go" style="width:100%;justify-content:center">Sign in</button>' +
      '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)"><a href="/">&larr; Back to the platform</a></div>' +
    '</div></div>';
  var go = async function () {
    $('go').disabled = true;
    try {
      var r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('u').value.trim(), password: $('p').value }) });
      var j = await r.json();
      if (!j.token) return renderSignIn(pdWords(j.error));
      setToken(j.token); start();
    } catch (e) { renderSignIn('The server did not answer. Try again in a moment.'); }
  };
  $('go').onclick = go;
  $('p').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  $('u').focus();
}

/* ---------------------------------------------------------------------------
   Shell
--------------------------------------------------------------------------- */
/* TWO screens, and that is deliberate.
   MODEL.md §5 signs off four: "What came in", "What I owe", the Problem
   Dossier, and the Report. REUSE-RULES.md §5's tripwire says a screen beyond
   that list stops the rebuild until Tahir signs it off. This build first grew
   two more — a separate triage screen and a separate page per entry — and
   Tahir's ruling, 9 Sept 2026, was to fold them back in rather than sign off
   six. So:
     · "What came in" carries the door, the person's own entries, the
       moderator's filing list, and one entry opened in place.
     · "Problems" is the Problem Dossier (§5.3) in its first form — the
       register, and registering into it.
   All four are now built, and four is the whole list. A FIFTH nav item is the
   tripwire — it needs Tahir before it goes any further. */
var ICONS = {
  owe: '<svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  report: '<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
  intake: '<svg viewBox="0 0 24 24"><path d="M4 14h4l2 3h4l2-3h4"/><path d="M5.5 14 8 5h8l2.5 9"/><rect x="4" y="14" width="16" height="6" rx="2"/></svg>',
  problems: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
};
function may(s) { return me && me.surfaces && me.surfaces.indexOf(s) >= 0; }

function shell(inner) {
  var route = (location.hash || '#owe').slice(1).split('/')[0];
  if (route === 'item') route = 'intake';        // an entry is a panel on that screen, not a screen
  if (route === 'problem') route = 'problems';  // and one Problem is a panel on Problems
  var owed = D2 ? (D2.runs || []).filter(function (r) { return r.late || r.abnormal; }).length
                + (D2.questions || []).filter(function (q) { return q.late; }).length : 0;
  var nav = '';
  nav += navLink('owe', 'What I owe', route, owed);
  nav += navLink('intake', 'What came in', route,
    may('triage') && D && D.feed ? D.feed.filter(function (x) { return x.status === 'unsorted' && !x.moved; }).length : 0);
  nav += navLink('problems', 'Problems', route);
  nav += navLink('report', 'The Report', route);
  return '<div class="app"><div class="side">' +
    '<div class="brand"><img src="/assets/van-logo.png" alt="VAN"><span class="nm">Product<br>Development</span></div>' +
    '<div class="nav">' + nav + '</div>' +
    '<div class="foot"><b>' + esc(me.name) + '</b>' + esc(me.label || 'No PD role') +
      '<div style="margin-top:8px"><a id="signout">Sign out</a> · <a href="/">Platform</a></div></div>' +
    '</div><div class="main">' + inner + '</div></div>';
}
function navLink(id, label, active, count) {
  return '<a href="#' + id + '" class="' + (active === id ? 'active' : '') + '"><span class="ic">' + ICONS[id] + '</span>' +
    esc(label) + (count ? '<span class="cnt">' + count + '</span>' : '') + '</a>';
}
function afterRender() {
  var so = $('signout');
  if (so) so.onclick = function () {
    // Order matters: clear `me` BEFORE touching the hash, or the router's own
    // handler repaints the signed-in page over the login form.
    setToken(''); me = null; D = null;
    if (location.hash) location.hash = '';
    renderSignIn();
  };
}
function flash(kind, text) { msg = { kind: kind, text: text }; }
function flashHtml() {
  if (!msg) return '';
  var h = '<div class="msg ' + msg.kind + '">' + esc(msg.text) + '</div>';
  msg = null;
  return h;
}

/* ---------------------------------------------------------------------------
   Screen 1 · What came in
   MODEL.md §5.1 — one door. A person writes what happened and saves. Choosing
   which of the three it is comes AFTER the box, is optional, and its absence
   is never treated as a missing field (RECLASSIFICATION-RULES.md §3).
--------------------------------------------------------------------------- */
var draftDoor = '';
function renderIntake() {
  // Notices live on What I owe — one screen delivers them, once (§7).
  var form =
    '<div class="card">' +
      '<h2>Write down what happened</h2>' +
      '<p class="hint">One minute is enough. You do not have to know what kind of thing it is — write it down and it is in. Someone will file it against the right Problem afterwards.</p>' +
      '<div class="field"><label>What happened, or what arrived</label>' +
        '<textarea id="text" placeholder="A dealer said… / A sample turned up from… / Someone wants…"></textarea></div>' +
      '<label>If you already know which of these it is <span class="opt">— optional</span></label>' +
      '<div class="doors">' +
        door('', 'Not sure yet', 'Write it down anyway. This is the ordinary answer. It is held as an Observation until someone files it.') +
        door('challenge', 'A complaint — a Challenge', 'Something we already sell is not doing what it should.') +
        door('observation', 'Something arrived — an Observation', 'A result or a material that reached us. Not a complaint, and not an idea.') +
        door('request', 'Someone wants a sample — a Request', 'Someone has asked for a sample or a product to be made. Name who asked and who it goes to.') +
      '</div>' +
      doorFields() +
      '<div class="field"><label>Who reported it <span class="opt">— optional. Leave blank if it was you.</span></label>' +
        '<input type="text" id="reported_by_name" placeholder="' + esc(me.name) + '"></div>' +
      '<button class="btn" id="save">Save it</button>' +
    '</div>';

  var mine = '<div class="card"><h2>Your entries</h2>' +
    '<p class="hint">Everything you have written down, and where it went.</p>' +
    (D.mine.length ? D.mine.map(function (x) { return itemCard(x, true); }).join('') : '<div class="empty">You have not written anything down yet. Use the box above to add your first entry. A few sentences is enough.</div>') +
    '</div>';

  return '<div class="page-h"><h1>What came in</h1>' +
    '<div class="sub">Everything enters Product Development here. Write down what happened, in your own words. Someone will file it against a Problem afterwards, and turn it into a Question if it needs one.</div></div>' +
    flashHtml() +
    '<div class="cols"><div>' + form + '</div><div>' + mine + '</div></div>' +
    toFileSection();
}

/* The moderator's filing list — a section of this screen, not a screen of its
   own (see the note on ICONS above). §3: this is the normal front of the
   system, not a backlog of mistakes, and §8.4: never a list of somebody's
   outstanding homework, so it is ordered by age and nothing here is counted
   per person. */
function toFileSection() {
  if (!may('triage') || !D.feed) return '';
  var open = D.feed.filter(function (x) { return !x.moved && x.status === 'unsorted'; });
  var done = D.feed.filter(function (x) { return x.moved || x.status !== 'unsorted'; });
  return '<div class="card" style="margin-top:14px"><h2>Waiting to be filed <span class="pill" style="margin-left:6px">' + open.length + '</span></h2>' +
      '<p class="hint">Everything that has come in, oldest first. Give each one a Problem, an owner, or both. No reason is needed, and filing is not a judgement on what somebody wrote.</p>' +
      (open.length ? open.map(fileRow).join('') : '<div class="empty">Nothing is waiting to be filed right now.</div>') + '</div>' +
    '<div class="card"><h2>Already filed</h2>' +
      (done.length ? done.map(itemCard).join('') : '<div class="empty">Nothing yet.</div>') + '</div>';
}
function door(v, title, sub) {
  return '<button class="door ' + (draftDoor === v ? 'on' : '') + '" data-door="' + v + '"><b>' + esc(title) + '</b><span>' + esc(sub) + '</span></button>';
}
function doorFields() {
  if (draftDoor === 'challenge') {
    return '<div class="field"><label>Which product</label><input type="text" id="product_ref" placeholder="NP 11-44, Maxim, …"></div>' +
      '<div class="field"><label>What is being claimed underneath it <span class="opt">— optional</span></label>' +
        '<input type="text" id="buried_claim_text" placeholder="e.g. that the competitor gives more at the same bag rate"></div>';
  }
  if (draftDoor === 'request') {
    return '<div class="two"><div class="field"><label>Who is asking</label><input type="text" id="requester" placeholder="' + esc(me.name) + '"></div>' +
      '<div class="field"><label>Who it goes to</label><input type="text" id="recipient" placeholder="Name, place"></div></div>' +
      '<div class="two"><div class="field"><label>Dispatch by <span class="opt">— optional</span></label><input type="date" id="dispatch_date"></div>' +
      '<div class="field"><label>Answer needed by <span class="opt">— optional</span></label><input type="date" id="return_by"></div></div>';
  }
  return '';
}
function itemCard(x, forAuthor) {
  var num = '<span class="pill num">' + esc(x.label) + '</span>';
  var state = (x.moved || x.converted_to_type) ? '<span class="pill moved">moved</span>'
    : x.status === 'unsorted'
      ? (forAuthor ? '<span class="pill">waiting to be filed</span>'
                   : '<span class="pill unsorted">not filed yet</span>')
      : '<span class="pill settled">' + esc(x.status) + '</span>';
  return '<div class="item"><div class="top">' + num + state +
      (x.problem_label ? '<span class="pill">' + esc(x.problem_label) + '</span>' : '') +
      (x.owner_name ? '<span class="pill">owner · ' + esc(x.owner_name) + '</span>' : '') +
      '<a style="margin-left:auto;font-size:12px" href="#item/' + x.type + '/' + x.id + '">open it</a></div>' +
    '<div class="txt">' + esc(String(x.text || '').slice(0, 400)) + (String(x.text || '').length > 400 ? '…' : '') + '</div>' +
    '<div class="meta">' + (x.author ? esc(x.author) + ' · ' : '') + when(x.created_at) +
      (x.door_chosen === false ? ' · held as an Observation for now' : '') + '</div>' +
    (x.waiting_for && !forAuthor ? '<div class="waiting">' + esc(x.waiting_for) + '</div>' : '') +
    '</div>';
}
function fileRow(x) {
  var probOpts = '<option value="">— pick a problem —</option>' + D.problems.map(function (p) {
    return '<option value="' + p.id + '"' + (x.problem_id === p.id ? ' selected' : '') + '>' + esc(p.label) + '</option>';
  }).join('');
  var ownOpts = '<option value="">— pick an owner —</option>' + (D.people || []).map(function (p) {
    return '<option value="' + p.id + '"' + (x.owner_id === p.id ? ' selected' : '') + '>' + esc(p.name) + ' · ' + esc(p.role_label) + '</option>';
  }).join('');
  return '<div class="item"><div class="top"><span class="pill num">' + esc(x.label) + '</span>' +
      '<span class="pill">' + esc(x.type) + '</span>' +
      (x.door_chosen === false ? '<span class="pill">no type was picked, so it is here</span>' : '') +
      '<a style="margin-left:auto;font-size:12px" href="#item/' + x.type + '/' + x.id + '">open it</a></div>' +
    '<div class="txt">' + esc(String(x.text || '').slice(0, 300)) + (String(x.text || '').length > 300 ? '…' : '') + '</div>' +
    '<div class="meta">' + (x.author ? esc(x.author) + ' · ' : '') + when(x.created_at) + '</div>' +
    '<div class="row" style="margin-top:9px">' +
      '<select data-p="' + x.type + ':' + x.id + '" style="max-width:230px">' + probOpts + '</select>' +
      '<select data-o="' + x.type + ':' + x.id + '" style="max-width:210px">' + ownOpts + '</select>' +
      '<button class="btn sm" data-file="' + x.type + ':' + x.id + '">File it</button>' +
    '</div></div>';
}
function bindTriage() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-file]'), function (b) {
    b.onclick = async function () {
      var key = b.getAttribute('data-file'), parts = key.split(':');
      var p = document.querySelector('[data-p="' + key + '"]').value;
      var o = document.querySelector('[data-o="' + key + '"]').value;
      if (!p && !o) { flash('bad', 'Pick a problem, an owner, or both.'); return paint(); }
      b.disabled = true;
      try {
        var body = {}; if (p) body.problem_id = Number(p); if (o) body.owner_id = Number(o);
        await api('/api/pd/intake/' + parts[0] + '/' + parts[1] + '/file', 'POST', body);
        flash('ok', 'Filed.'); await load();
      } catch (e) { flash('bad', e.message); b.disabled = false; paint(); }
    };
  });
}

/* RECLASSIFICATION-RULES.md §7 — three parts and nothing else. Do not add a
   fourth. */
function noticeCard(n) {
  return '<div class="notice"><b>' + esc(n.headline) + '</b>' +
    '<div class="def">' + esc(n.definition_text) + '</div>' +
    '<div class="by">moved by ' + esc(n.mover) + ' · ' + when(n.created_at) +
      ' · <a href="#item/' + esc(n.link_type) + '/' + n.link_id + '">open it</a>' +
      ' · <a data-reply="' + n.id + '">I meant something else</a></div></div>';
}

function bindIntake() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-door]'), function (b) {
    b.onclick = function () { draftDoor = b.getAttribute('data-door'); paint(); };
  });
  var save = $('save');
  if (save) save.onclick = async function () {
    var body = { text: ($('text').value || '').trim(), door: draftDoor,
      reported_by_name: ($('reported_by_name').value || '').trim() };
    ['product_ref', 'buried_claim_text', 'requester', 'recipient', 'dispatch_date', 'return_by'].forEach(function (f) {
      if ($(f)) body[f] = $(f).value;
    });
    save.disabled = true;
    try {
      var r = await api('/api/pd/intake', 'POST', body);
      draftDoor = ''; clearDraft();
      flash('ok', 'Saved as ' + r.label + '.' +
        (r.note ? ' ' + r.note + ' It is recorded as an Observation for now, and whoever files it will pick that up.'
                : (r.door_chosen === false ? ' It is recorded as an Observation for now — whoever files it will say what kind it is.' : '')));
      await load();
    } catch (e) { flash('bad', e.message); save.disabled = false; paint(); }
  };
}

/* ---------------------------------------------------------------------------
   Screen · What I owe   (MODEL.md §5.2)
   The landing page. The adoption audit's finding, in one line: a chemist wrote
   six real records and the next morning his home screen said "Nothing yet."
   Everything he owned was reachable only by remembering which Problem it lived
   under. This is the screen where a person's own work is in front of them.

   §5.2 calls it "the only per-person scoreboard", and it is per-person in the
   one direction that helps: it is always about YOU. There is no route, and no
   control anywhere, that shows one person another person's list —
   RECLASSIFICATION-RULES.md §8.1 forbids that, and it is forbidden for a good
   reason: the moment this can be pointed at somebody else it stops being a
   worklist and becomes a league table, and people stop writing things down.
--------------------------------------------------------------------------- */
function renderOwe() {
  var W = D2 || {};
  var late = function (b) { return b ? ' <span class="pill unsorted">late</span>' : ''; };

  var notices = (W.notices || []).filter(function (n) { return !n.seen_at; }).map(noticeCard).join('');

  var runs = (W.runs || []).map(function (r) {
    return '<div class="item ' + (r.abnormal ? 'flag' : '') + '">' +
      '<div class="top"><span class="pill num">Run ' + esc(r.label) + '</span>' +
        (r.abnormal ? '<span class="pill unsorted">something abnormal — look at this one</span>'
                    : '<span class="pill">running</span>') +
        (r.next_look ? '<span class="pill' + (r.late ? ' unsorted' : '') + '">next reading ' + when(r.next_look) + (r.late ? ' · past due' : '') + '</span>'
                     : '<span class="pill unsorted">no next reading set</span>') +
        '<a style="margin-left:auto;font-size:12px" href="#problem/' + r.problem_id + '">open it</a></div>' +
      '<div class="meta" style="margin:0 0 5px">This Run answers: ' + esc(r.question_title) + '</div>' +
      '<div class="txt"><b>Expected:</b> ' + esc(r.expected) + '</div>' +
      '<div class="kills" style="margin-top:6px"><b>This Bet ends if:</b> ' + esc(r.kill_criterion) + '</div>' +
      '</div>';
  }).join('');

  var questions = (W.questions || []).map(function (q) {
    return '<div class="item"><div class="top"><span class="pill num">Question ' + esc(q.label) + '</span>' +
      '<span class="pill">' + esc(q.nature_label || q.nature) + '</span>' +
      '<span class="pill' + (q.state === 'contested' ? ' unsorted' : '') + '">' + esc(q.state_label || q.state) + '</span>' +
      (q.due_date ? '<span class="pill' + (q.late ? ' unsorted' : '') + '">due ' + when(q.due_date) + '</span>' + late(q.late) : '') +
      '<a style="margin-left:auto;font-size:12px" href="#problem/' + q.problem_id + '">open it</a></div>' +
      '<div class="txt"><b>' + esc(q.title) + '</b></div>' +
      '<div class="meta">' + esc(q.problem_label) + ' · ' + esc(q.problem_title) +
        ' · ' + (q.open_bets ? q.open_bets + ' bet' + (q.open_bets === 1 ? '' : 's') + ' running' : 'no bets on it yet') + '</div></div>';
  }).join('');

  var bets = (W.bets || []).map(function (b) {
    return '<div class="item"><div class="top"><span class="pill num">Bet ' + esc(b.label) + '</span>' +
      '<span class="pill">' + (b.open_runs ? b.open_runs + ' run' + (b.open_runs === 1 ? '' : 's') + ' open' : b.all_runs ? 'all runs closed — is the bet decided?' : 'no runs yet') + '</span>' +
      '<a style="margin-left:auto;font-size:12px" href="#problem/' + b.problem_id + '">open it</a></div>' +
      // B7 — the Question a Bet tests belongs on the Bet, never one click away.
      // The payload has carried question_title all along; this card dropped it.
      '<div class="meta" style="margin:0 0 5px">This Bet tests: ' + esc(b.question_title) + '</div>' +
      '<div class="txt">' + esc(b.approach) + '</div>' +
      '<div class="kills"><b>This Bet ends if:</b> ' + esc(b.kill_criterion) + '</div></div>';
  }).join('');

  var requests = (W.requests || []).map(function (r) {
    return '<div class="item"><div class="top"><span class="pill num">Request ' + esc(r.label) + '</span>' +
      (r.return_by ? '<span class="pill' + (r.late ? ' unsorted' : '') + '">wanted by ' + when(r.return_by) + '</span>' : '') +
      '</div><div class="txt">' + esc(r.requester) + ' → ' + esc(r.recipient) + '</div>' +
      '<div class="meta">' + esc(String(r.purpose || '').slice(0, 160)) + '</div></div>';
  }).join('');

  var replies = (W.replies || []).map(function (r) {
    return '<div class="item"><div class="top"><span class="pill">a question back</span></div>' +
      '<div class="txt">' + esc(r.author) + ' says: ' + esc(r.reply_text) + '</div>' +
      '<div class="meta">about ' + esc(r.headline) + ' · ' + when(r.replied_at) +
      ' · <a href="#item/' + esc(r.link_type) + '/' + r.link_id + '">open it</a></div></div>';
  }).join('');

  var mine = (W.mine || []).map(function (x) { return itemCard(x, true); }).join('');

  var nothing = !runs && !questions && !bets && !requests;
  var triageCard = W.caps && W.caps.triage ?
    '<div class="card"><h2>Waiting to be filed <span class="pill" style="margin-left:6px">' + (W.toFile || 0) + '</span></h2>' +
      '<p class="hint">Entries that have come in and do not yet have a Problem and an owner. Filing one takes a few seconds.</p>' +
      (W.toFile ? '<a class="btn ghost sm" href="#intake">Go and file them</a>'
                : '<div class="empty">Nothing is waiting to be filed right now.</div>') + '</div>' : '';

  return '<div class="page-h"><h1>What I owe</h1>' +
      '<div class="sub">Everything that is yours: the Questions you own, the Runs waiting on a reading, the Bets that need deciding. Nobody else sees this page, and there is no version of it pointed at anyone else.</div></div>' +
    flashHtml() + notices +
    (nothing ?
      '<div class="card"><h2>Nothing is waiting on you</h2>' +
        '<p class="hint">When you write a Question, take a Bet or start a Run, it appears here with what it needs next. ' +
        'If you have something to write down, <a href="#intake">start at What came in</a>.</p></div>' : '') +
    (runs ? '<div class="card"><h2>Runs waiting on you <span class="pill" style="margin-left:6px">' + W.runs.length + '</span></h2>' +
      '<p class="hint">A Run is one recipe made and measured. A long trial is active monitoring, so what falls due is the next reading — not the trial.</p>' + runs + '</div>' : '') +
    (questions ? '<div class="card"><h2>Questions you own <span class="pill" style="margin-left:6px">' + W.questions.length + '</span></h2>' +
      '<p class="hint">A Question is something we must know in order to solve a Problem. It is settled when you write the answer.</p>' + questions + '</div>' : '') +
    (bets ? '<div class="card"><h2>Bets you own <span class="pill" style="margin-left:6px">' + W.bets.length + '</span></h2>' +
      '<p class="hint">A Bet is one approach, with the result that would end it written down first. Closing one — killed or advanced — is a result either way.</p>' + bets + '</div>' : '') +
    (requests ? '<div class="card"><h2>Sample requests waiting on you</h2>' +
      '<p class="hint">Somebody outside PD is expecting these.</p>' + requests + '</div>' : '') +
    (replies ? '<div class="card"><h2>Someone answered back</h2>' +
      '<p class="hint">You filed something of theirs, and they have said what they meant.</p>' + replies + '</div>' : '') +
    triageCard +
    '<div class="card"><h2>What you have written down</h2>' +
      '<p class="hint">Everything you put through the door, and where it went.</p>' +
      (mine || '<div class="empty">You have not written anything down yet. <a href="#intake">Start here</a> — a few sentences is enough.</div>') +
    '</div>';
}
function bindOwe() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-reply]'), function (a) {
    a.onclick = async function () {
      var t = prompt('What did you mean? This goes back to the person who filed it, as a question.');
      if (!t) return;
      try { await api('/api/pd/notices/' + a.getAttribute('data-reply') + '/reply', 'POST', { reply_text: t });
        flash('ok', 'Sent back to them.'); await load(); } catch (e) { flash('bad', e.message); paint(); }
    };
  });
}

/* ---------------------------------------------------------------------------
   Screen · The Report   (MODEL.md §5.4, signed off in PENDING-DECISIONS §B19)
   Aggregate only. Never a person, never a count by person, never a field a
   screen could group by — RECLASSIFICATION-RULES.md §8.1. If somebody asks for
   "and who is behind?", the answer is in that section, not in this file.
--------------------------------------------------------------------------- */
function tile(n, label, hint, flag) {
  return '<div class="tile' + (flag && n ? ' flag' : '') + '"><div class="n">' + n + '</div>' +
    '<div class="l">' + esc(label) + '</div>' + (hint ? '<div class="h">' + esc(hint) + '</div>' : '') + '</div>';
}
function renderReport() {
  var R = D3 || {};
  if (!R.problems) return '<div class="spin">Loading…</div>';
  var w = R.written.week, m = R.written.month;

  var feed = function (rows, fn, empty) { return rows && rows.length ? rows.map(fn).join('') : '<div class="empty">' + empty + '</div>'; };

  return '<div class="page-h"><h1>The Report</h1>' +
      '<div class="sub">How much is being written down, what is waiting, and what has been answered. Counts of things — never of people, and there is no version of this page that names anybody.</div></div>' +
    flashHtml() +

    '<div class="card"><h2>Written down in the last seven days</h2>' +
      '<p class="hint">The pilot is judged on whether things get written down at all: entries arriving, Questions written before samples are made, results written when things close. Last thirty days in brackets.</p>' +
      '<div class="tiles">' +
        tile(w.arrived, 'came in through the door', 'was ' + m.arrived + ' over thirty days') +
        tile(w.questions, 'Questions written', m.questions + ' over thirty days') +
        tile(w.bets, 'Bets taken', m.bets + ' over thirty days') +
        tile(w.runs, 'Runs started', m.runs + ' over thirty days') +
        tile(w.readings, 'readings recorded', m.readings + ' over thirty days') +
        tile(w.results, 'results written', m.results + ' over thirty days') +
      '</div></div>' +

    '<div class="card"><h2>Where the work stands</h2>' +
      '<div class="tiles">' +
        tile(R.problems.field_problem, 'field problems open') +
        tile(R.problems.product_concept, 'product concepts open') +
        tile(R.questions.open, 'Questions open') +
        tile(R.questions.contested, 'Questions contested', 'claims on both sides') +
        tile(R.questions.settled, 'Questions settled', 'an answer we stand behind') +
        tile(R.bets.active, 'Bets running') +
        tile(R.bets.killed, 'Bets killed', 'a result, not a failure') +
        tile(R.bets.advanced, 'Bets advanced') +
        tile(R.runs.running, 'Runs under observation') +
        tile(R.runs.investigating, 'Runs with something abnormal', 'an investigation is open', true) +
        tile(R.claims.proven, 'Claims proven') +
        tile(R.claims.believed, 'Claims believed', 'held on experience') +
      '</div></div>' +

    '<div class="card"><h2>Where the discipline is slipping</h2>' +
      '<p class="hint">Four things a count can see. None of them is about a person — each one is a signal about the work itself, or about a form that is harder to fill in than it should be.</p>' +
      '<div class="tiles">' +
        tile(R.discipline.unfiled, 'entries not yet filed', 'came in, still nobody’s', true) +
        tile(R.discipline.bets_never_run, 'Bets with no Run', 'stated, never acted on', true) +
        tile(R.discipline.runs_unwatched, 'Runs with no reading in three weeks', 'a trial nobody is watching', true) +
        tile(R.discipline.runs_without_recipe, 'Runs with no recipe recorded', 'the Combination Bank will close this') +
      '</div></div>' +

    '<div class="cols">' +
      '<div class="card"><h2>Needs attention</h2>' +
        '<p class="hint">Overdue Questions, readings past their date, and Runs where something abnormal was seen.</p>' +
        feed(R.attention.investigations, function (r) {
          return '<div class="item flag"><div class="top"><span class="pill num">Run ' + esc(r.label) + '</span>' +
            '<span class="pill unsorted">something abnormal</span>' +
            '<a style="margin-left:auto;font-size:12px" href="#problem/' + r.problem_id + '">open it</a></div>' +
            '<div class="txt">' + esc(r.question_title) + '</div></div>';
        }, 'No investigations open.') +
        feed(R.attention.overdueQuestions, function (q) {
          return '<div class="item"><div class="top"><span class="pill num">Question ' + esc(q.label) + '</span>' +
            '<span class="pill unsorted">due ' + when(q.due_date) + '</span>' +
            '<a style="margin-left:auto;font-size:12px" href="#problem/' + q.problem_id + '">open it</a></div>' +
            '<div class="txt">' + esc(q.title) + '</div></div>';
        }, 'No Questions are past their date.') +
        feed(R.attention.lateLooks, function (r) {
          return '<div class="item"><div class="top"><span class="pill num">Run ' + esc(r.label) + '</span>' +
            '<span class="pill unsorted">reading was due ' + when(r.next_look) + '</span>' +
            '<a style="margin-left:auto;font-size:12px" href="#problem/' + r.problem_id + '">open it</a></div>' +
            '<div class="txt">' + esc(r.question_title) + '</div></div>';
        }, 'Every Run is being read on time.') +
      '</div>' +
      '<div class="card"><h2>Answered recently</h2>' +
        '<p class="hint">Every result written here becomes a Claim. This is the only place they appear together.</p>' +
        feed(R.closed, function (c) {
          return '<div class="item"><div class="top"><span class="pill num">Claim ' + esc(c.label) + '</span>' +
            '<span class="pill ' + (c.grade === 'proven' ? 'settled' : c.grade === 'contested' ? 'unsorted' : '') + '">' + esc(c.grade) + '</span>' +
            (c.problem_id ? '<a style="margin-left:auto;font-size:12px" href="#problem/' + c.problem_id + '">open it</a>' : '') + '</div>' +
            '<div class="txt">' + esc(c.text) + '</div>' +
            '<div class="meta">' + (c.question_title ? esc(c.question_label) + ' · ' + esc(c.question_title) + ' · ' : '') + when(c.created_at) + '</div></div>';
        }, 'Nothing has been answered yet.') +
      '</div>' +
    '</div>';
}

/* ---------------------------------------------------------------------------
   Screen 2 · Problems — MODEL.md §5.3's Problem Dossier, in its first form.
   The list, and one Problem opened with everything ever aimed at it:
   Questions → Bets → Runs, the Claims that closed them, and what came in
   against it. Opening one is a panel on this screen, not a screen of its own
   (see the note on ICONS).

   Two things on this screen are load-bearing rather than decorative:
   · B7 — the question a run answers, and the result that would kill its bet,
     are printed ON the run. Not one click away. Himmayat asked for this and
     the review said it is cheap now and expensive to retrofit.
   · MODEL.md §0 — every close writes a graded Claim. The forms below ask for
     the result and the grade in the same breath as the close, because there
     is no close without them.
--------------------------------------------------------------------------- */
var probKind = 'field_problem';
var dossier = null;      // the open Problem, or null on the list
var openForm = '';       // which inline form is showing, e.g. 'bet:12'
var claimSubject = '';   // what the claim form is currently aimed at

function formOpen(key) { return openForm === key; }
function toggle(key) { openForm = formOpen(key) ? '' : key; paint(); }

function renderProblems() {
  if (dossier) return renderDossier();
  var list = (D.problems || []).map(function (p) {
    return '<div class="item"><div class="top"><span class="pill num">' + esc(p.label.split(' — ')[0]) + '</span>' +
      '<span class="pill">' + esc(p.kind === 'product_concept' ? 'product concept' : 'field problem') + '</span>' +
      (p.status !== 'open' ? '<span class="pill settled">' + esc(p.status) + '</span>' : '') +
      '<a style="margin-left:auto;font-size:12px" href="#problem/' + p.id + '">open it</a></div>' +
      '<div class="txt"><b>' + esc(p.title) + '</b></div>' +
      '<div class="meta">registered by ' + esc(p.author || '') + '</div></div>';
  }).join('');
  return '<div class="page-h"><h1>Problems</h1>' +
    '<div class="sub">A Problem is the parent of all work aimed at it. It can be a problem in the field, or a product we have decided to build — both work the same way: every Question, Bet and Run sits under one Problem. There should be few Problems, and they should last a long time.</div></div>' +
    flashHtml() +
    '<div class="cols"><div class="card"><h2>Register one</h2>' +
      '<p class="hint">If you already know you have a field problem or a product concept, register it here. You do not need to send it through What came in.</p>' +
      '<div class="doors">' +
        '<button class="door ' + (probKind === 'field_problem' ? 'on' : '') + '" data-kind="field_problem"><b>A problem in the field</b><span>Something is not working out there, or in the market.</span></button>' +
        '<button class="door ' + (probKind === 'product_concept' ? 'on' : '') + '" data-kind="product_concept"><b>A product concept</b><span>Something we have decided to build.</span></button>' +
      '</div>' +
      '<div class="field"><label>Short title</label><input type="text" id="ptitle" placeholder="P fixation in our soils"></div>' +
      '<div class="field"><label>' + (probKind === 'product_concept' ? 'What the product is meant to do' : 'What the problem actually is') + '</label><textarea id="pstatement"></textarea></div>' +
      '<div class="field"><label>Anything else worth knowing <span class="opt">— optional</span></label><textarea id="pcontext" style="min-height:60px"></textarea></div>' +
      '<button class="btn" id="psave">Register it</button></div>' +
    '<div class="card"><h2>All Problems</h2><p class="hint">Every Problem work can be aimed at. Open one to see its Questions, Bets, Runs and Claims.</p>' +
      (list || '<div class="empty">No Problems registered yet. A Problem is a pain in the field, or a product we have decided to build. Every Question, Bet and Run sits under one.</div>') + '</div></div>';
}

/* ---- one Problem, and everything aimed at it ---- */
function renderDossier() {
  var d = dossier, p = d.problem, lead = d.caps.lead;
  var owners = (d.people || []).map(function (x) {
    return '<option value="' + x.id + '">' + esc(x.name) + ' · ' + esc(x.role_label) + '</option>';
  }).join('');

  var questions = d.questions.map(function (q) { return questionCard(q, lead, owners); }).join('') ||
    '<div class="empty">No Questions on this Problem yet. A Question is something we must know in order to solve it — it has one owner and a due date. Nothing gets made until a Question is written. Write the first one here.</div>';

  var claims = (d.claims || []).map(function (c) {
    var older = (c.history || []).map(function (h) {
      return '<div class="hist"><span class="f">version ' + h.version + '</span> <span class="was">' + esc(h.text) + '</span>' +
        '<div class="who">' + esc(h.written_by_name || '') + ' · ' + when(h.created_at) + ' · ' + esc(h.grade) + '</div></div>';
    }).join('');
    return '<div class="item"><div class="top"><span class="pill num">Claim ' + esc(c.label) + '</span>' +
      '<span class="pill ' + (c.grade === 'proven' ? 'settled' : c.grade === 'contested' ? 'unsorted' : '') + '">' + esc(c.grade_label || c.grade) + '</span>' +
      (c.version > 1 ? '<span class="pill">version ' + c.version + '</span>' : '') +
      (c.challenges_number ? '<span class="pill moved">challenges C-' + String(c.challenges_number).padStart(3, '0') + '</span>' : '') +
      '</div><div class="txt">' + esc(c.text) + '</div>' +
      '<div class="meta">' + esc(c.owner_name || '') + '’s claim' +
        (c.written_by_name && c.written_by_name !== c.owner_name ? ' · this version written by ' + esc(c.written_by_name) : '') +
        (c.source_ref ? ' · ' + esc(c.source_ref) : '') + '</div>' +
      (older ? '<div style="margin-top:8px">' + older + '</div>' : '') + '</div>';
  }).join('') || '<div class="empty">No Claims yet. A Claim is something a person says is true about this Problem, with their name on it and a grade for the evidence. Anyone can write one, and anyone can write another that challenges it.</div>';

  var filed = (d.filed || []).map(function (x) { return itemCard(x, true); }).join('') ||
    '<div class="empty">Nothing has been filed under this Problem yet.</div>';

  return '<a class="back" href="#problems">&larr; back to problems</a>' + flashHtml() +
    '<div class="page-h"><h1>' + esc(p.label) + ' · ' + esc(p.title) + '</h1>' +
      '<div class="sub">' + esc(p.statement) + '</div></div>' +
    '<div class="row" style="margin-bottom:14px">' +
      '<span class="pill">' + esc(p.kind === 'product_concept' ? 'product concept' : 'field problem') + '</span>' +
      (p.status !== 'open' ? '<span class="pill settled">' + esc(p.status) + '</span>' : '<span class="pill">open</span>') +
      (p.closed_reason ? '<span class="pill">closed: ' + esc(String(p.closed_reason).slice(0, 60)) + '</span>' : '') +
    '</div>' +
    '<div class="card"><h2>Questions <span class="pill" style="margin-left:6px">' + d.questions.length + '</span></h2>' +
      '<p class="hint">A Question is something we must know in order to solve this Problem. It has one owner, one due date, and a state that says where it stands.</p>' +
      questions +
      (formOpen('question') ? questionForm() :
        '<button class="btn ghost sm" data-open="question">+ Write a question</button>') +
    '</div>' +
    '<div class="cols" style="margin-top:14px">' +
      '<div class="card"><h2>Claims</h2>' +
        '<p class="hint">A Claim is something a person says is true, with their name on it and a grade for the evidence. Anyone can write a Claim, and anyone can write another Claim that challenges it.</p>' +
        claims +
        (formOpen('claim') ? claimForm(d) : '<button class="btn ghost sm" data-open="claim">+ Write a claim</button>') +
      '</div>' +
      '<div class="card"><h2>What came in about this</h2>' +
        '<p class="hint">Complaints, arrivals and sample requests filed under this Problem.</p>' + filed + '</div>' +
    '</div>' +
    constraintsCard();
}

/* MODEL.md §3's ninth object, written from here rather than from a fifth
   screen (Tahir's ruling, 10 Sept 2026). It is shown on the dossier because
   this is where the Bets that inherit it are — a rule you can only read on a
   screen you never open is a rule nobody applies. The register is the same
   list for the whole company, not this Problem's own: a constraint binds a
   delivery context, and every product aimed through it. */
function constraintsCard() {
  var reg = dossier.constraintRegister || [];
  var contexts = (dossier.vocab && dossier.vocab.contexts) || [];
  var lead = dossier.caps.lead;
  var body = contexts.map(function (ctx) {
    var mine = reg.filter(function (c) { return c.context_id === ctx.id; });
    if (!mine.length) return '';
    return '<div class="item"><div class="top"><span class="pill num">' + esc(ctx.name) + '</span>' +
      '<span class="pill">' + mine.length + ' rule' + (mine.length === 1 ? '' : 's') + '</span></div>' +
      mine.map(function (c) {
        return '<div class="kills" style="margin:6px 0 0"><b>' + esc(c.kind_label) + ':</b> ' + esc(c.rule_text) +
          '<div class="who">written by ' + esc(c.added_by_name || 'the system') + ' · ' + when(c.created_at) +
          (lead ? ' · <a class="quiet" data-open="retirec:' + c.id + '">it no longer binds</a>' : '') + '</div>' +
          (formOpen('retirec:' + c.id) ? retireConstraintForm(c) : '') + '</div>';
      }).join('') + '</div>';
  }).join('');
  if (!body) {
    body = '<div class="empty">No constraints are recorded yet. A Constraint is a rule that kills options — what will not blend, what will cake in storage, what the plant cannot make, what the regulator will not allow. Every Bet aimed through that delivery context inherits it automatically.</div>';
  }
  return '<div class="card" style="margin-top:14px"><h2>Constraints <span class="pill" style="margin-left:6px">' + reg.length + '</span></h2>' +
    '<p class="hint">Rules that remove options before anyone spends a bench day on them. They belong to a delivery context, not to this Problem — every Bet aimed through that context inherits them, here and everywhere else.</p>' +
    body +
    (lead
      ? (formOpen('constraint') ? constraintForm() : '<button class="btn ghost sm" data-open="constraint">+ Write a constraint</button>')
      : '<p class="hint" style="margin-top:10px">Writing one is a technical lead’s or the COO’s — a constraint binds every product aimed through that context, not just this Problem.</p>') +
    '</div>';
}

function constraintForm() {
  var contexts = ((dossier.vocab && dossier.vocab.contexts) || []).map(function (c) {
    return '<option value="' + c.id + '">' + esc(c.name) + '</option>';
  }).join('');
  var kinds = dossier.vocab && dossier.vocab.constraintKinds ? dossier.vocab.constraintKinds : {};
  var kindOpts = Object.keys(kinds).map(function (k) {
    return '<option value="' + k + '">' + esc(kinds[k]) + '</option>';
  }).join('');
  return box('<h2>Write a constraint</h2>' +
    '<p class="hint">A rule that kills options. Every Bet aimed through this delivery context will show it, from now on, without anyone having to remember.</p>' +
    '<div class="two">' +
      '<div class="field"><label>Which delivery context does it bind?</label>' +
        '<select id="c_ctx"><option value="">— pick one —</option>' + contexts + '</select></div>' +
      '<div class="field"><label>What kind of rule is it?</label>' +
        '<select id="c_kind"><option value="">— pick one —</option>' + kindOpts + '</select></div>' +
    '</div>' +
    '<div class="field"><label>The rule, in full</label>' +
      '<textarea id="c_rule" placeholder="Write it so somebody who was not in the room can apply it."></textarea></div>' +
    '<div class="row"><button class="btn" data-constraint="1">Write it down</button>' +
    '<button class="btn ghost" data-open="constraint">Cancel</button></div>');
}

function retireConstraintForm(c) {
  return box('<h2>This rule no longer binds</h2>' +
    '<p class="hint">It is not deleted — it stays on the record with your reason, so nobody re-argues it next year.</p>' +
    '<div class="field"><label>Why does it no longer bind?</label>' +
      '<textarea id="cr_why_' + c.id + '"></textarea></div>' +
    '<div class="row"><button class="btn" data-retirec="' + c.id + '">Retire it</button>' +
    '<button class="btn ghost" data-open="retirec:' + c.id + '">Cancel</button></div>');
}

/* The restricted half of "open to write, restricted to assign".
   It used to render in full on every card — six owner dropdowns on one
   Question, which is most of what a reader saw. Now it is a quiet link until
   somebody actually wants to move the work, and it is not offered at all on
   something already finished. */
function assignControl(type, id, hasOwner, finished) {
  if (finished) return '';
  var key = 'assign:' + type + ':' + id;
  if (!formOpen(key)) {
    return '<a class="quiet" data-open="' + key + '">' + (hasOwner ? 'change owner' : 'give it an owner') + '</a>';
  }
  var owners = (dossier.people || []).map(function (x) {
    return '<option value="' + x.id + '">' + esc(x.name) + ' · ' + esc(x.role_label) + '</option>';
  }).join('');
  return '<select id="assign_' + type.charAt(0) + '_' + id + '" style="max-width:190px">' +
    '<option value="">— pick a person —</option>' + owners + '</select>' +
    '<button class="btn ghost sm" data-assign="' + type + ':' + id + '">Assign</button>' +
    '<a class="quiet" data-open="' + key + '">cancel</a>';
}

function questionCard(q, lead, owners) {
  var bets = (q.bets || []).map(function (b) { return betCard(b, q, lead); }).join('') ||
    '<div class="empty" style="padding:6px 0">No Bets on this Question yet. A Bet is one approach we try, with the one result that would end it written down first.</div>';
  return '<div class="item" style="border-left:3px solid var(--green);padding-left:12px">' +
    '<div class="top"><span class="pill num">Question ' + esc(q.label) + '</span>' +
      '<span class="pill">' + esc(q.nature_label || q.nature) + '</span>' +
      '<span class="pill ' + (q.state === 'settled' ? 'settled' : q.state === 'contested' ? 'unsorted' : '') + '">' + esc(q.state_label || q.state) + '</span>' +
      (q.owner_name ? '<span class="pill">owner · ' + esc(q.owner_name) + '</span>' : '') +
      (q.due_date ? '<span class="pill ' + (q.overdue ? 'unsorted' : '') + '">due ' + when(q.due_date) + (q.overdue ? ' · late' : '') + '</span>' : '') +
    '</div>' +
    '<div class="txt"><b>' + esc(q.title) + '</b><br>' + esc(q.text) + '</div>' +
    (q.settled_reason ? '<div class="result">Settled: ' + esc(q.settled_reason) + '</div>' : '') +
    '<div style="margin:10px 0 0 8px;padding-left:10px;border-left:1px solid var(--line)">' + bets +
      (formOpen('bet:' + q.id) ? betForm(q) :
        (q.state === 'settled' ? '' : '<button class="btn ghost sm" data-open="bet:' + q.id + '">+ Take a bet on it</button>')) +
    '</div>' +
    '<div class="row" style="margin-top:9px">' +
      (q.state !== 'settled' ? (formOpen('settle:' + q.id) ? '' : '<button class="btn ghost sm" data-open="settle:' + q.id + '">Settle it</button>') : '') +
      (lead ? assignControl('question', q.id, !!q.owner_name, q.state === 'settled') : '') +
    '</div>' +
    (formOpen('settle:' + q.id) ? settleForm(q) : '') +
    '</div>';
}

function betCard(b, q, lead) {
  var runs = (b.runs || []).map(function (r) { return runCard(r, b); }).join('');
  var constraints = (b.constraints || []).map(function (c) {
    return '<div class="hist" style="margin:4px 0"><span class="f">' + esc(c.kind_label || c.kind) + '</span> ' + esc(c.rule_text) + '</div>';
  }).join('');
  return '<div class="item">' +
    '<div class="top"><span class="pill num">Bet ' + esc(b.label) + '</span>' +
      '<span class="pill ' + (b.status === 'killed' ? 'unsorted' : b.status === 'advanced' ? 'settled' : '') + '">' + esc(b.status_label || b.status) + '</span>' +
      (b.context_name ? '<span class="pill">' + esc(b.context_name) + '</span>' : '') +
      (b.owner_name ? '<span class="pill">owner · ' + esc(b.owner_name) + '</span>' : '') +
    '</div>' +
    '<div class="txt">' + esc(b.approach) + '</div>' +
    '<div class="kills"><b>Kill criterion — the one result that ends this Bet:</b> ' + esc(b.kill_criterion) + '</div>' +
    (constraints ? '<div style="margin-top:8px"><div class="meta">Inherited from ' + esc(b.context_name) + ':</div>' + constraints + '</div>' : '') +
    (b.closing_text ? '<div class="result"><b>' + esc(b.status === 'killed' ? 'Killed' : 'Advanced') + ':</b> ' + esc(b.closing_text) + ' <span class="pill">' + esc(b.closing_grade) + '</span></div>' : '') +
    (runs ? '<div style="margin:10px 0 0 8px;padding-left:10px;border-left:1px solid var(--line)">' + runs + '</div>' : '') +
    '<div class="row" style="margin-top:9px">' +
      (b.status === 'active' ? (formOpen('run:' + b.id) ? '' : '<button class="btn ghost sm" data-open="run:' + b.id + '">+ Make a run</button>') : '') +
      (b.status === 'active' && !formOpen('closebet:' + b.id) ? '<button class="btn ghost sm" data-open="closebet:' + b.id + '">Close the bet</button>' : '') +
      (dossier.caps.lead ? assignControl('bet', b.id, !!b.owner_name, b.status !== 'active') : '') +
    '</div>' +
    (formOpen('run:' + b.id) ? runForm(b) : '') +
    (formOpen('closebet:' + b.id) ? closeBetForm(b) : '') +
    '</div>';
}

function runCard(r, b) {
  var readings = (r.readings || []).map(function (rd) {
    return '<div class="hist"><span class="f">' + when(rd.reading_date) + '</span> ' +
      esc([rd.parameters_checked, rd.physical_observation, rd.analytical_result].filter(Boolean).join(' · ') || 'nothing seen') +
      ' <span class="pill ' + (rd.verdict === 'abnormal' ? 'unsorted' : '') + '">' + esc(rd.verdict_label || rd.verdict) + '</span>' +
      '<div class="who">' + esc(rd.who) + (rd.next_observation_date ? ' · next reading due ' + when(rd.next_observation_date) : '') + '</div></div>';
  }).join('');
  return '<div class="item">' +
    '<div class="top"><span class="pill num">Run ' + esc(r.label) + '</span>' +
      '<span class="pill ' + (r.status === 'abnormal_investigation' ? 'unsorted' : r.status === 'closed' ? 'settled' : '') + '">' + esc(r.status_label || r.status) + '</span>' +
      (r.replaced_number ? '<span class="pill moved">replaces Run R-' + String(r.replaced_number).padStart(3, '0') + '</span>' : '') +
      (r.combination_code ? '<span class="pill">' + esc(r.combination_code) + '</span>' : '') +
    '</div>' +
    // B7 — on the run itself, never one click away.
    '<div class="meta" style="margin:0 0 6px">This Run answers: ' + esc(r.question_title) + '</div>' +
    '<div class="kills" style="margin:0 0 8px"><b>This Bet ends if:</b> ' + esc(r.kill_criterion) + '</div>' +
    '<div class="txt"><b>Expected:</b> ' + esc(r.expected) + '</div>' +
    (r.actual ? '<div class="txt" style="margin-top:5px"><b>Actual:</b> ' + esc(r.actual) + '</div>' : '') +
    (r.replaces_reason ? '<div class="meta">Replaces the earlier run because: ' + esc(r.replaces_reason) + '</div>' : '') +
    (readings ? '<div style="margin-top:8px">' + readings + '</div>' : '') +
    (r.next_observation ? '<div class="waiting">Next reading due: ' + when(r.next_observation) + '</div>' : '') +
    (r.closing_text ? '<div class="result"><b>Result:</b> ' + esc(r.closing_text) + ' <span class="pill">' + esc(r.closing_grade) + '</span></div>' : '') +
    '<div class="row" style="margin-top:9px">' +
      (r.status !== 'closed' ? '<button class="btn ghost sm" data-open="reading:' + r.id + '">+ Add a reading</button>' : '') +
      (r.status !== 'closed' ? '<button class="btn ghost sm" data-open="closerun:' + r.id + '">Close the run</button>' : '') +
      '<button class="btn ghost sm" data-open="observe:' + r.id + '">Something turned up — write an Observation</button>' +
      (dossier.caps.lead ? assignControl('run', r.id, !!r.owner_name, r.status === 'closed') : '') +
    '</div>' +
    (formOpen('reading:' + r.id) ? readingForm(r) : '') +
    (formOpen('closerun:' + r.id) ? closeRunForm(r) : '') +
    (formOpen('observe:' + r.id) ? observeForm(r) : '') +
    '</div>';
}

/* ---- the inline forms ---- */
function natureOptions() {
  return Object.keys(dossier.vocab.natures).map(function (k) {
    return '<option value="' + k + '">' + esc(dossier.vocab.natures[k]) + '</option>';
  }).join('');
}
function gradeSelect(id) {
  return '<div class="field"><label>Grade the evidence honestly</label><select id="' + id + '">' +
    Object.keys(dossier.vocab.grades).map(function (k) {
      return '<option value="' + k + '">' + esc(dossier.vocab.grades[k]) + '</option>';
    }).join('') + '</select></div>';
}
function box(inner) { return '<div class="card" style="margin-top:10px;background:var(--panel2)">' + inner + '</div>'; }

function questionForm() {
  // Every id on this screen carries the Problem it belongs to. The draft a
  // person leaves behind is keyed on the field's id, so a plain `q_title`
  // followed them to the next Problem and saved a question there under the
  // wrong parent — confirmed by review, 9 Sept 2026.
  var P = dossier.problem.id;
  return box('<h2>Write a question</h2>' +
    '<p class="hint">Something we must know in order to solve this problem. You will own it until someone moves it.</p>' +
    '<div class="field"><label>Short title</label><input type="text" id="q_title_' + P + '"></div>' +
    '<div class="field"><label>What do we need to know?</label><textarea id="q_text_' + P + '"></textarea></div>' +
    '<div class="two"><div class="field"><label>What kind of question</label><select id="q_nature_' + P + '">' + natureOptions() + '</select></div>' +
    '<div class="field"><label>Due by <span class="opt">— optional</span></label><input type="date" id="q_due_' + P + '"></div></div>' +
    '<div class="row"><button class="btn" id="q_save">Write it down</button>' +
    '<button class="btn ghost" data-open="question">Cancel</button></div>');
}
function settleForm(q) {
  return box('<h2>Settle ' + esc(q.label) + '</h2>' +
    '<p class="hint">Nothing is settled here without a written answer. What you write becomes a Claim that anyone can read and challenge.</p>' +
    '<div class="field"><label>What is the answer?</label><textarea id="s_text_' + q.id + '"></textarea></div>' +
    gradeSelect('s_grade_' + q.id) +
    '<div class="field"><label>Where it came from <span class="opt">— optional</span></label><input type="text" id="s_src_' + q.id + '" placeholder="a trial, a paper, a path under E:\\NP"></div>' +
    '<div class="row"><button class="btn" data-settle="' + q.id + '">Settle it</button>' +
    '<button class="btn ghost" data-open="settle:' + q.id + '">Cancel</button></div>');
}
function betForm(q) {
  var ctx = '<option value="">— no context picked yet —</option>' + (dossier.vocab.contexts || []).map(function (c) {
    return '<option value="' + c.id + '">' + esc(c.name) + '</option>';
  }).join('');
  return box('<h2>Take a bet on ' + esc(q.label) + '</h2>' +
    '<p class="hint">A Bet is one approach, taken because we believe something. Write the one result that would end it now, before any bench work.</p>' +
    '<div class="field"><label>What is the approach?</label><textarea id="b_approach_' + q.id + '"></textarea></div>' +
    '<div class="field"><label>What one result would kill it?</label><textarea id="b_kill_' + q.id + '" placeholder="If this happens, the bet is over."></textarea></div>' +
    '<div class="field"><label>Aimed through <span class="opt">— optional; it inherits that context’s constraints</span></label><select id="b_ctx_' + q.id + '">' + ctx + '</select></div>' +
    '<div class="row"><button class="btn" data-bet="' + q.id + '">Take the bet</button>' +
    '<button class="btn ghost" data-open="bet:' + q.id + '">Cancel</button></div>');
}
function closeBetForm(b) {
  return box('<h2>Close ' + esc(b.label) + '</h2>' +
    '<p class="hint">A Bet that is killed is a useful result. Write what happened — what you write becomes a Claim on the record.</p>' +
    // The kill criterion was written before the bench work precisely so it
    // could be read at this moment. Putting it anywhere but here makes the
    // first dropdown option a guess.
    '<div class="kills" style="margin:0 0 10px"><b>What was written before the work started:</b> ' + esc(b.kill_criterion) + '</div>' +
    '<div class="field"><label>How does it close?</label><select id="cb_status_' + b.id + '">' +
      '<option value="killed">Killed — the kill criterion was met</option>' +
      '<option value="advanced">Advanced — it earned the next step</option></select></div>' +
    '<div class="field"><label>What was the result?</label><textarea id="cb_text_' + b.id + '"></textarea></div>' +
    gradeSelect('cb_grade_' + b.id) +
    '<div class="row"><button class="btn" data-closebet="' + b.id + '">Close it</button>' +
    '<button class="btn ghost" data-open="closebet:' + b.id + '">Cancel</button></div>');
}
function runForm(b) {
  var prev = (b.runs || []).map(function (r) { return '<option value="' + r.id + '">' + esc(r.label) + '</option>'; }).join('');
  return box('<h2>Make a run under ' + esc(b.label) + '</h2>' +
    '<p class="hint">A Run is one recipe made and measured. Write what you expect before you make it: a Run records what was expected against what happened.</p>' +
    '<div class="field"><label>What do you expect to happen?</label><textarea id="r_exp_' + b.id + '"></textarea></div>' +
    (prev ? '<div class="two"><div class="field"><label>Does it replace an earlier run? <span class="opt">— optional</span></label>' +
      '<select id="r_repl_' + b.id + '"><option value="">— no —</option>' + prev + '</select></div>' +
      '<div class="field"><label>If so, why</label><input type="text" id="r_replwhy_' + b.id + '"></div></div>' : '') +
    '<div class="row"><button class="btn" data-run="' + b.id + '">Start the run</button>' +
    '<button class="btn ghost" data-open="run:' + b.id + '">Cancel</button></div>');
}
function readingForm(r) {
  return box('<h2>Add a reading to Run ' + esc(r.label) + '</h2>' +
    '<p class="hint">Check the Run on a date and write what you saw. Then set the date of the next reading. If you find something, bring that date forward.</p>' +
    '<div class="two"><div class="field"><label>When</label><input type="date" id="rd_date_' + r.id + '"></div>' +
    '<div class="field"><label>What did it look like?</label><select id="rd_verdict_' + r.id + '">' +
      '<option value="normal">Nothing unexpected</option><option value="abnormal">Something abnormal</option></select></div></div>' +
    '<div class="field"><label>What you checked <span class="opt">— optional</span></label><input type="text" id="rd_params_' + r.id + '"></div>' +
    '<div class="field"><label>What you saw <span class="opt">— optional; blank is a recorded "nothing seen"</span></label><textarea id="rd_obs_' + r.id + '" style="min-height:56px"></textarea></div>' +
    '<div class="two"><div class="field"><label>Analysis <span class="opt">— optional</span></label><input type="text" id="rd_an_' + r.id + '"></div>' +
    '<div class="field"><label>Next reading due</label><input type="date" id="rd_next_' + r.id + '"></div></div>' +
    '<div class="row"><button class="btn" data-reading="' + r.id + '">Add the reading</button>' +
    '<button class="btn ghost" data-open="reading:' + r.id + '">Cancel</button></div>');
}
function closeRunForm(r) {
  return box('<h2>Close Run ' + esc(r.label) + '</h2>' +
    '<p class="hint">Write what actually happened, and what it tells us. What you write becomes a Claim other people can read and challenge.</p>' +
    // A Run records what was expected against what happened. Both halves have
    // to be on the screen at the moment the second half is written.
    '<div class="kills" style="margin:0 0 6px"><b>You expected:</b> ' + esc(r.expected) + '</div>' +
    '<div class="kills" style="margin:0 0 10px"><b>This Bet ends if:</b> ' + esc(r.kill_criterion) + '</div>' +
    '<div class="field"><label>What actually happened?</label><textarea id="cr_actual_' + r.id + '"></textarea></div>' +
    '<div class="field"><label>And what does that tell us?</label><textarea id="cr_text_' + r.id + '"></textarea></div>' +
    gradeSelect('cr_grade_' + r.id) +
    '<div class="row"><button class="btn" data-closerun="' + r.id + '">Close it</button>' +
    '<button class="btn ghost" data-open="closerun:' + r.id + '">Cancel</button></div>');
}
function observeForm(r) {
  return box('<h2>Something turned up in ' + esc(r.label) + '</h2>' +
    '<p class="hint">Settling, a smell, a seal swelling — something the Run produced that nobody was looking for. It is filed as an Observation and goes to the same queue as anything else that came in.</p>' +
    '<div class="field"><label>What did you see?</label><textarea id="ob_text_' + r.id + '"></textarea></div>' +
    '<div class="row"><button class="btn" data-observe="' + r.id + '">Write it down</button>' +
    '<button class="btn ghost" data-open="observe:' + r.id + '">Cancel</button></div>');
}
function claimForm(d) {
  var P = d.problem.id;
  var current = claimSubject || ('problem:' + d.problem.id);
  var subj = '<option value="problem:' + d.problem.id + '"' + (current === 'problem:' + d.problem.id ? ' selected' : '') + '>Against the problem itself</option>' +
    d.questions.map(function (q) {
      return '<option value="question:' + q.id + '"' + (current === 'question:' + q.id ? ' selected' : '') + '>' + esc(q.label + ' — ' + q.title) + '</option>';
    }).join('');
  // A claim challenges another claim ABOUT THE SAME THING, so only those are
  // offered. Before this, the list held every claim on the page and picking
  // the mismatched one was refused by the server after the fact.
  var parts = current.split(':');
  var sameSubject = (d.claims || []).filter(function (c) { return c.subject_type === parts[0] && String(c.subject_id) === parts[1]; });
  var against = '<option value="">— not challenging anything —</option>' + sameSubject.map(function (c) {
    return '<option value="' + c.id + '">' + esc(c.label + ' — ' + String(c.text).slice(0, 60)) + '</option>';
  }).join('');
  return box('<h2>Write a claim</h2>' +
    '<p class="hint">What you have seen in our own products is a Claim. So is a result from a published paper. Grade each one for what the evidence actually is.</p>' +
    '<div class="field"><label>What is it about?</label><select id="c_subject_' + P + '">' + subj + '</select></div>' +
    '<div class="field"><label>The claim</label><textarea id="c_text_' + P + '"></textarea></div>' +
    gradeSelect('c_grade_' + P) +
    '<div class="field"><label>Where it came from <span class="opt">— optional</span></label><input type="text" id="c_src_' + P + '"></div>' +
    '<div class="field"><label>Does it challenge one already here? <span class="opt">— optional; only claims about the same thing</span></label><select id="c_against_' + P + '">' + against + '</select></div>' +
    '<div class="row"><button class="btn" id="c_save">Write it down</button>' +
    '<button class="btn ghost" data-open="claim">Cancel</button></div>');
}

/* ---- wiring ---- */
function bindProblems() {
  if (dossier) return bindDossier();
  Array.prototype.forEach.call(document.querySelectorAll('[data-kind]'), function (b) {
    b.onclick = function () { probKind = b.getAttribute('data-kind'); paint(); };
  });
  $('psave').onclick = async function () {
    $('psave').disabled = true;
    try {
      var r = await api('/api/pd/problems', 'POST', { title: $('ptitle').value, statement: $('pstatement').value, context: $('pcontext').value, kind: probKind });
      clearDraft();
      flash('ok', 'Registered as ' + r.label + '.'); await load();
    } catch (e) { flash('bad', e.message); $('psave').disabled = false; paint(); }
  };
}

function on(sel, fn) {
  Array.prototype.forEach.call(document.querySelectorAll(sel), function (el) {
    el.onclick = async function () {
      el.disabled = true;
      try { await fn(el); } catch (e) { flash('bad', e.message); el.disabled = false; paint(); }
    };
  });
}
async function reloadDossier(message) {
  openForm = ''; claimSubject = ''; clearDraft();
  if (message) flash('ok', message);
  await loadDossier(dossier.problem.id);
  await load();          // keeps the "What came in" count in step after an
                         // Observation raised from a run

}

function bindDossier() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (b) {
    b.onclick = function () { toggle(b.getAttribute('data-open')); };
  });
  on('#q_save', async function () {
    var P = dossier.problem.id;
    var r = await api('/api/pd/questions', 'POST', { problem_id: P,
      title: $('q_title_' + P).value, text: $('q_text_' + P).value,
      nature: $('q_nature_' + P).value, due_date: $('q_due_' + P).value });
    await reloadDossier('Written down as ' + r.label + '. It is yours until someone moves it.');
  });
  on('[data-settle]', async function (b) {
    var id = b.getAttribute('data-settle');
    await api('/api/pd/questions/' + id + '/settle', 'POST', { result_text: $('s_text_' + id).value, grade: $('s_grade_' + id).value, source_ref: $('s_src_' + id).value });
    await reloadDossier('Settled, and the answer is on the record as a claim.');
  });
  on('[data-bet]', async function (b) {
    var id = b.getAttribute('data-bet');
    var r = await api('/api/pd/bets', 'POST', { question_id: id, approach: $('b_approach_' + id).value, kill_criterion: $('b_kill_' + id).value, delivery_context_id: $('b_ctx_' + id).value });
    await reloadDossier('Bet ' + r.label + ' is on.');
  });
  on('[data-closebet]', async function (b) {
    var id = b.getAttribute('data-closebet');
    var r = await api('/api/pd/bets/' + id + '/close', 'POST', { status: $('cb_status_' + id).value, result_text: $('cb_text_' + id).value, grade: $('cb_grade_' + id).value });
    await reloadDossier('Closed as ' + r.status + ', with the result written.');
  });
  on('[data-run]', async function (b) {
