services:
  - type: web
    name: van-control-tower
    runtime: node
    # starter ($7/mo), NOT free. Three things depend on this and all fail silently on free:
    #   1. Free web services block outbound SMTP (ports 25/465/587), so notifications time out.
    #   2. (Was: PD Library uploads on a persistent disk. PD was removed on 17 Oct 2026, and the disk with it.)
    #   3. Free instances sleep, so the first person in each morning waits for a cold start.
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    # No disk (17 Oct 2026): the pd-library disk held only PD Library uploads, and PD was removed. Without a disk
    # Render can start the new version before stopping the old one, so a deploy no longer interrupts anyone.
    envVars:
      # Live data lives in an EXTERNAL MySQL database on HostGator — NOT a Render-managed DB.
      # Set DATABASE_URL by hand in the Render dashboard as a mysql:// URL.
      - key: DATABASE_URL
        sync: false
      # Stable secret so logins survive restarts. If unset, server.js generates a random one
      # per boot and EVERY deploy silently signs everybody out.
      - key: SESSION_SECRET
        sync: false
      # O2S alerts on laptop and phone (Web Push, 16 Oct 2026). Set by hand in the Render dashboard:
      # make the 2 keys once with `npx web-push generate-vapid-keys`; the subject is a contact,
      # written mailto:someone@van.com.pk. Without them O2S says alerts are off; nothing else changes.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # --- notifications: uncomment once the mail transport is chosen ---
      # - key: MAIL_TRANSPORT
      #   sync: false
      # - key: MAIL_FROM
      #   sync: false
