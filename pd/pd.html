    var id = b.getAttribute('data-run');
    var body = { bet_id: id, expected: $('r_exp_' + id).value };
    if ($('r_repl_' + id)) { body.replaces_run_id = $('r_repl_' + id).value; body.replaces_reason = $('r_replwhy_' + id).value; }
    var r = await api('/api/pd/runs', 'POST', body);
    await reloadDossier('Run ' + r.label + ' started.');
  });
  on('[data-reading]', async function (b) {
    var id = b.getAttribute('data-reading');
    var r = await api('/api/pd/runs/' + id + '/reading', 'POST', {
      reading_date: $('rd_date_' + id).value, verdict: $('rd_verdict_' + id).value,
      parameters_checked: $('rd_params_' + id).value, physical_observation: $('rd_obs_' + id).value,
      analytical_result: $('rd_an_' + id).value, next_observation_date: $('rd_next_' + id).value });
    await reloadDossier(r.investigation_opened ? 'Recorded. That was abnormal, so an investigation is open on the run.' : 'Recorded.');
  });
  on('[data-closerun]', async function (b) {
    var id = b.getAttribute('data-closerun');
    await api('/api/pd/runs/' + id + '/close', 'POST', { actual: $('cr_actual_' + id).value, result_text: $('cr_text_' + id).value, grade: $('cr_grade_' + id).value });
    await reloadDossier('Closed, with the result written.');
  });
  on('[data-observe]', async function (b) {
    var id = b.getAttribute('data-observe');
    var r = await api('/api/pd/runs/' + id + '/observe', 'POST', { text: $('ob_text_' + id).value });
    await reloadDossier('Written down as ' + r.label + '. It is in the queue with everything else that came in.');
  });
  var P = dossier.problem.id;
  if ($('c_subject_' + P)) $('c_subject_' + P).onchange = function () { claimSubject = $('c_subject_' + P).value; paint(); };
  on('#c_save', async function () {
    var parts = $('c_subject_' + P).value.split(':');
    var r = await api('/api/pd/claims', 'POST', { subject_type: parts[0], subject_id: parts[1],
      text: $('c_text_' + P).value, grade: $('c_grade_' + P).value,
      source_ref: $('c_src_' + P).value, challenges_claim_id: $('c_against_' + P).value });
    await reloadDossier('Claim ' + r.label + ' is on the record.');
  });
  on('[data-constraint]', async function () {
    var r = await api('/api/pd/constraints', 'POST', {
      delivery_context_id: $('c_ctx').value, kind: $('c_kind').value, rule_text: $('c_rule').value });
    await reloadDossier('Written down. Every Bet aimed through ' + r.context_name + ' now shows it.');
  });
  on('[data-retirec]', async function (b) {
    var id = b.getAttribute('data-retirec');
    await api('/api/pd/constraints/' + id + '/retire', 'POST', { retired_reason: $('cr_why_' + id).value });
    await reloadDossier('Retired, with your reason on the record.');
  });
  on('[data-assign]', async function (b) {
    var parts = b.getAttribute('data-assign').split(':');
    var sel = $('assign_' + parts[0].charAt(0) + '_' + parts[1]);
    if (!sel || !sel.value) { flash('bad', 'Pick who owns it.'); return paint(); }
    await api('/api/pd/' + parts[0] + '/' + parts[1] + '/assign', 'POST', { owner_id: Number(sel.value) });
    await reloadDossier('Owner set.');
  });
}

/* ---------------------------------------------------------------------------
   One entry, opened in place on "What came in" — a panel, not a screen.
--------------------------------------------------------------------------- */
var item = null;
async function loadDossier(id) { dossier = await api('/api/pd/problem/' + encodeURIComponent(id)); }
async function loadItem(type, id) {
  item = await api('/api/pd/intake/' + encodeURIComponent(type) + '/' + encodeURIComponent(id));
}
function renderItem() {
  if (!item) return '<div class="spin">Loading…</div>';
  var x = item.item;
  var hist = (item.history || []).map(function (h) {
    if (h.change_kind === 'not_applied') {
      return '<div class="hist"><span class="f">' + esc(h.field_words || h.field.replace(/_/g, ' ')) + '</span> — this change did not go through, so the record still reads as it did.' +
        '<div class="who">' + esc(h.who) + ' · ' + when(h.changed_at) + '</div></div>';
    }
    if (h.change_kind === 'snapshot_on_move') {
      return '<div class="hist"><span class="f">' + esc(h.field_words || h.field.replace(/_/g, ' ')) + '</span> as it read when it was refiled: ' + esc(String(h.old_words || h.old_value).slice(0, 300)) +
        '<div class="who">' + esc(h.who) + ' · ' + when(h.changed_at) + '</div></div>';
    }
    var words = h.field_words || h.field.replace(/_/g, ' ');
    var was = h.old_words, now = h.new_words;
    return '<div class="hist"><span class="f">' + esc(words) + '</span> ' +
      (was ? '<span class="was">' + esc(String(was).slice(0, 200)) + '</span> → ' : 'set to ') +
      esc(String(now === null || now === undefined ? 'nothing' : now).slice(0, 200)) +
      '<div class="who">' + esc(h.who) + ' · ' + when(h.changed_at) + '</div></div>';
  }).join('');
  var moves = (item.moves || []).map(function (m) {
    return '<div class="hist"><span class="f">' + esc(m.from_type) + ' → ' + esc(m.to_type) + '</span>' +
      (m.reversed ? ' <span class="pill">moved back since</span>' : '') +
      '<div style="margin-top:4px">' + esc(m.definition_text) + '</div>' +
      '<div class="who">written down by ' + esc(m.original_author) + ' on ' + when(m.original_filed_at) +
      ' · moved by ' + esc(m.mover) + ' on ' + when(m.moved_at) +
      (m.reversed ? '' : ' · <a data-undo="' + m.id + '">move it back</a>') + '</div></div>';
  }).join('');

  var moveBox = item.caps.triage && !item.became ? '<div class="card"><h2>Record it as something else</h2>' +
    '<p class="hint">No reason is asked for, here or anywhere. The entry keeps its number, keeps its author, and keeps what it said.</p>' +
    '<div class="field"><label>Record it as</label><select id="to_type">' +
      ['challenge', 'observation', 'request'].filter(function (t) { return t !== x.type; })
        .map(function (t) { return '<option value="' + t + '">' + ({ challenge: 'a Challenge — a complaint about something we sell', observation: 'an Observation — something that arrived or was seen', request: 'a Request — someone wants a sample made' })[t] + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="two"><div class="field"><label>Product <span class="opt">— for a Challenge</span></label><input type="text" id="m_product_ref"></div>' +
    '<div class="field"><label>Goes to <span class="opt">— for a Request</span></label><input type="text" id="m_recipient"></div></div>' +
    '<div class="field"><label>Who is asking <span class="opt">— for a Request</span></label><input type="text" id="m_requester"></div>' +
    // RECLASSIFICATION-RULES.md §2: "A free note is available and always
    // optional. It is never demanded, never highlighted as missing, and its
    // absence is never shown."
    '<div class="field"><label>Anything you want to add <span class="opt">— optional</span></label><textarea id="m_note" style="min-height:56px"></textarea></div>' +
    '<button class="btn ghost" id="domove">Move it</button></div>' : '';

  return '<a class="back" href="#intake">&larr; back to what came in</a>' + flashHtml() +
    '<div class="page-h"><h1>' + esc(x.label) + '</h1><div class="sub">' + esc(item.definition) + '</div></div>' +
    '<div class="cols"><div>' +
      '<div class="card"><div class="row" style="margin-bottom:10px">' +
        (x.problem_label ? '<span class="pill">' + esc(x.problem_label) + '</span>' : '<span class="pill unsorted">not filed against a problem</span>') +
        (x.owner_name ? '<span class="pill">owner · ' + esc(x.owner_name) + '</span>' : '<span class="pill unsorted">no owner</span>') +
        (item.became ? '<span class="pill moved">now ' + esc(item.became.label) + '</span>' : '') + '</div>' +
        (item.became ? '<div class="result">This entry is now <a href="#item/' + esc(item.became.type) + '/' + item.became.id + '">' + esc(item.became.label) + '</a>. Its number still points there.</div>' : '') +
        '<div class="txt" style="white-space:pre-wrap;line-height:1.6">' + esc(x.text) + '</div>' +
        '<div class="meta" style="margin-top:12px;color:var(--mut);font-size:11.5px">written down by ' + esc(x.author || '') + ' · ' + when(x.created_at) + '</div>' +
      '</div>' + moveBox + '</div><div>' +
      '<div class="card"><h2>What has happened to it</h2>' +
        '<p class="hint">Content can be edited. The record of what it said cannot.</p>' +
        (moves || '') + (hist || (moves ? '' : '<div class="empty">Nothing has changed on this entry yet.</div>')) + '</div>' +
    '</div></div>';
}
function bindItem() {
  var mv = $('domove');
  if (mv) mv.onclick = async function () {
    mv.disabled = true;
    try {
      var r = await api('/api/pd/intake/' + item.item.type + '/' + item.item.id + '/move', 'POST',
        { to_type: $('to_type').value, product_ref: $('m_product_ref').value,
          recipient: $('m_recipient').value, requester: $('m_requester').value, note: $('m_note').value });
      clearDraft();
      flash('ok', r.was + ' is now ' + r.label + '.');
      location.hash = 'item/' + r.type + '/' + r.id;
    } catch (e) { flash('bad', e.message); mv.disabled = false; paint(); }
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-undo]'), function (a) {
    a.onclick = async function () {
      try { await api('/api/pd/reclassifications/' + a.getAttribute('data-undo') + '/undo', 'POST');
        flash('ok', 'Moved back.'); await route(); } catch (e) { flash('bad', e.message); paint(); }
    };
  });
}

/* ---------------------------------------------------------------------------
   Router + paint
--------------------------------------------------------------------------- */
function paint() {
  if (!me) return;                              // see the note on `me` above
  keepDraft();
  var body;
  if (view === 'problems') body = renderProblems();
  else if (view === 'item') body = renderItem();
  else if (view === 'report') body = renderReport();
  else if (view === 'intake') body = renderIntake();
  else body = renderOwe();
  $('root').innerHTML = shell(body);
  afterRender();
  if (view === 'problems') bindProblems();
  else if (view === 'item') bindItem();
  else if (view === 'report') { /* nothing to bind — it is a read */ }
  else if (view === 'intake') { bindIntake(); bindTriage(); }
  else bindOwe();
  restoreDraft();
}
async function load() {
  // "What I owe" is the landing page and its counts sit in the nav, so it is
  // fetched on every route. The other two are fetched when they are opened.
  D2 = await api('/api/pd/mywork');
  if (view === 'intake' || view === 'item' || view === 'problems') D = await api('/api/pd/intake');
  else if (!D) { try { D = await api('/api/pd/intake'); } catch (e) { D = { problems: [], mine: [], feed: [] }; } }
  if (view === 'report') D3 = await api('/api/pd/report');
  paint();
}
async function route() {
  if (!me) return;                              // the sign-out race, again
  var parts = (location.hash || '#owe').slice(1).split('/');
  view = parts[0] || 'owe';
  try {
    if (view === 'item' && parts[1] && parts[2]) { dossier = null; await loadItem(parts[1], parts[2]); await load(); }
    else if (view === 'problem' && parts[1]) {
      item = null; view = 'problems';
      if (!dossier || String(dossier.problem.id) !== String(parts[1])) { openForm = ''; claimSubject = ''; clearDraft(); }
      await loadDossier(parts[1]); await load();
    }
    else { item = null; dossier = null; await load(); }
  } catch (e) {
    if (e.message === 'signed out') return;
    $('root').innerHTML = shell('<div class="msg bad">' + esc(e.message) + '</div>');
    afterRender();
  }
}
async function start() {
  try {
    me = await api('/api/pd/me');
  } catch (e) {
    if (e.message === 'signed out') return;
    me = null;
    return renderSignIn(e.message);
  }
  if (!me.surfaces || !me.surfaces.length) {
    $('root').innerHTML = '<div class="signin"><div class="card"><h1>No PD access yet</h1>' +
      '<p>Your account signs in, but nobody has given it a Product Development role. The COO or the Data Custodian can do that in Manage access.</p>' +
      '<a href="/">&larr; Back to the platform</a></div></div>';
    return;
  }
  await route();
}
window.addEventListener('hashchange', function () { route(); });
if (!token()) renderSignIn(); else start();
</script>
