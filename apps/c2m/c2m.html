<html lang="en">
<head>

<style>
/* C2M · O2S Queue Shell skin (ruled 14 Oct 2026). Header with the person's words, then 1 screen.

:root{--bg:#E6E8E2;--surface:#F9F9F6;--ink:#1B1F1A;--muted:#5d6459;--line:#cfd3c9;--kraft:#8C6532;--blue:#2E5F86;--ok:#25703F;--late:#8A5A00;--over:#A3302A;--okbg:#e3efe5;--latebg:#f4ead6;--overbg:#f5e1df;
 --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
:root[data-theme="dark"]{--bg:#1d211c;--surface:#262b25;--ink:#ecefe7;--muted:#a6ad9f;--line:#3a4137;--kraft:#c39a5f;--blue:#7fb0d8;--ok:#6fc28a;--late:#e0b25c;--over:#f08a80;--okbg:#1f3326;--latebg:#3a3020;--overbg:#3d2321;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d211c;--surface:#262b25;--ink:#ecefe7;--muted:#a6ad9f;--line:#3a4137;--kraft:#c39a5f;--blue:#7fb0d8;--ok:#6fc28a;--late:#e0b25c;--over:#f08a80;--okbg:#1f3326;--latebg:#3a3020;--overbg:#3d2321;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}

.hdr .home{color:var(--ink);text-decoration:none;white-space:nowrap;font-size:13px;border:1px solid var(--line, #d6d3c8);border-radius:6px;padding:3px 8px}.hdr .home:hover{border-color:var(--blue)}
.hdr .app{font-weight:600}.hdr nav{display:flex;flex-wrap:wrap;gap:4px 16px}

.box{background:var(--surface);border:1px solid var(--line);border-radius:3px}

td.r,th.r{text-align:right;white-space:nowrap}
tr.go{cursor:pointer}tr.go:hover td,tr.go:focus td{background:color-mix(in srgb,var(--blue) 8%,transparent)}
.btn{font:inherit;font-size:13px;font-weight:500;background:var(--blue);color:var(--surface);border:1px solid var(--blue);border-radius:3px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--blue)}.btn.warn{background:var(--over);border-color:var(--over)}.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr.go:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.over{color:var(--over)}.late{color:var(--late)}.ok{color:var(--ok)}

.jobs .job:last-child{border-bottom:0}.job>div:first-child{min-width:0;flex:1 1 320px}.job .t{font-weight:500}.job .d{font-size:12px;color:var(--muted)}

.crumb{font-size:13px;color:var(--muted);margin:0 0 8px}.crumb button{font:inherit;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.three>div,.two>div{min-width:0}

@media (max-width:600px){.subnav{flex-wrap:nowrap;overflow-x:auto}.subnav button{flex:0 0 auto}}
.toast.err{background:var(--over)}.ask{border-left:3px solid var(--late)}
.form{display:grid;gap:8px;padding:12px}.form label{font-size:12px;color:var(--muted);display:grid;gap:3px}

/* Phone (ruled 16 Oct 2026): approvals, jobs and price lists usable one-handed */
@media (max-width:600px){
  main{padding:12px 12px 40px}h1{font-size:19px;line-height:1.3}h2{font-size:13px;letter-spacing:.04em}
  table.cards tr:first-child{display:none}table.cards td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}table.cards tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.cards td{display:block;border:0;padding:3px 0}
  table.cards select,table.cards input[type=number]{width:100%;min-height:40px}table.cards td .btn{min-height:44px}
  .jobs .job{flex-direction:column;align-items:stretch}.jobs .job>div:first-child{flex:0 0 auto}.jobs .job>div:last-child{display:flex;flex-wrap:wrap;gap:8px}
  .jobs .job .btn,.next .btn{flex:1 1 auto;min-height:44px}
  .row{flex-direction:column;align-items:stretch}.row label,.row input,.row select{width:100%}
  .tiles{grid-template-columns:1fr 1fr}.tile .v{font-size:20px}
  .three,.two{grid-template-columns:minmax(0,1fr)!important}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chips button{flex:0 0 auto}
  .doc{padding:14px 10px}.doc-h{flex-wrap:wrap;gap:8px}.doc-tb{font-size:11px}
  .hdr .who{width:100%;font-size:12px}
  table{font-size:12px}td,th{padding:6px 6px}
  .warnbox .btn{min-height:44px;margin-top:4px}
}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:5px 8px;max-width:100%}
input[type=number]{width:120px}textarea{min-height:56px;width:100%}
.warnbox{border:1px solid var(--over);background:var(--overbg);padding:10px 12px;border-radius:3px;margin:8px 0}
.assume{border-left:3px dashed var(--late);padding:4px 0 4px 12px;margin:10px 0;font-size:13px}.assume b{color:var(--late);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:3px;font-size:13px;max-width:calc(100% - 32px);z-index:9}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px;font-size:12px}.steps span{padding:3px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.steps span.done{background:var(--okbg);border-color:var(--ok)}.steps span.now{background:var(--latebg);border-color:var(--late);font-weight:600}
.cols{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:0 0 10px}
.doc{background:#fff;color:#14233a;border:1px solid var(--line);max-width:900px;margin:0 auto;padding:24px 28px 16px}
.doc-h{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;border-bottom:3px solid #14327e;padding-bottom:12px}.doc-logo{width:90px;height:auto}
.doc-co{flex:1 1 220px;display:grid}.doc-co b{font-size:16px;color:#14327e}.doc-co span,.doc-ref{font-size:12px;color:#4a5a70}.doc-ref{display:grid;text-align:right}
.doc-t{margin:14px 0 10px}.doc-t h3{margin:0 0 4px;font-size:19px;color:#14327e}.doc-t div{font-size:13px}
.doc-tb{border-collapse:collapse;width:100%;font-size:12px;min-width:560px}.doc-tb th{background:#14327e;color:#fff;font-weight:500;padding:6px 8px}
.doc-tb td{padding:6px 8px;border-bottom:1px solid #d9dee8;color:#14233a;background:#fff}.doc-tb td.r{text-align:right;font-family:var(--mono)}.doc-tb tbody tr:nth-child(even) td{background:#f4f6fa}
.doc-n{font-size:12px;color:#4a5a70;margin:12px 0;padding-left:18px}.doc-s{display:flex;justify-content:flex-end;margin:18px 0 12px;font-size:12px}.doc-s div{border-top:1px solid #14233a;padding-top:4px;min-width:200px}
.doc-f{border-top:2px solid #e5262a;padding-top:8px;font-size:11px;color:#4a5a70;text-align:center}
.md{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px 18px;max-width:100%;overflow-x:auto}.md pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;margin:0}
.loading{padding:40px;text-align:center;color:var(--muted)}
</style>

<body>
<div id="app"><div class="loading">Loading C2M…</div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/* =========================================================================
 * C2M front end. Reads /api/c2m/state; every action is a POST, then a reload of state.
 * Formulas shown here mirror c2m-lib.js on the server; the server is the source of truth.
 * ========================================================================= */
let fbasis = 'budget', hist = 'approved';
/** Truck rows on the chosen history basis: approved cost on the truck's date, or restated at today's bands. */
const salesRows0 = () => (ST.sales || []).map(r => r.costBands != null ? { ...r, cost: r.costBands } : r);
const salesRows = () => (ST.sales || []).map(r => hist === 'bands' && r.costBands != null ? { ...r, cost: r.costBands } : r);
let ST = null, scr = 'today', sub = null, drill = { cust: null, prod: null }, period = 'fy', month = null, openRec = null, sendBack = null, trial = null, ptrial = null,
  pgrp = 'cost', propose = null, priceCust = null, cols = { prev: true, hilo: false, margin: true, port: true, actual: false }, bo = 'import', corr = null, doc = null, editLines = null,
  PLB = { aud: 'wl', client: null, pick: {}, reasons: {}, eff: null, till: null, note: '' }, boDoc = null, listSel = null, billEdit = null;
const NAV = { today: 'Today', margin: 'Margin', recipes: 'Recipes', materials: 'Materials', rates: 'Rates', prices: 'Prices', lists: 'Price lists', backoffice: 'Back Office', guide: 'Guide' };
const STEP = { draft: 'Majid checks', review: 'Himayat reviews', endorse: 'Fahim endorses', cost: 'Yawar approves cost', approved: 'Approved', old: 'Earlier version' };
const MYJOB = { draft: 'Check recipe', review: 'Review recipe', endorse: 'Endorse recipe', cost: 'Approve cost' };
const STEP_ROLE = { draft: 'production', review: 'qc', endorse: 'plant', cost: 'cfo' };
const ROLE_NAME = { production: 'Majid', qc: 'Himayat', plant: 'Fahim', cfo: 'Yawar', coo: 'Tahir' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rs = v => v == null || isNaN(v) ? 'n/a' : 'Rs ' + Math.round(v).toLocaleString('en-US');
const rs2 = v => v == null || isNaN(v) ? 'n/a' : 'Rs ' + Number(v).toFixed(2);
const rsM = v => 'Rs ' + (v / 1e6).toFixed(1) + 'M';
const pc = v => v == null || isNaN(v) ? 'n/a' : Number(v).toFixed(1) + '%';
const pl = (n, a, b) => n + ' ' + (n === 1 ? a : b);
const SET = k => { const r = (ST.settings || []).find(x => x.k === k); return r ? Number(r.v) : null; };
function toast(t, err) { const e = $('toast'); e.textContent = t; e.hidden = false; e.classList.toggle('err', !!err); clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, err ? 9000 : 4000); }
/* On VAN Systems the platform keeps the sign-in token in localStorage (van_token) and checks a Bearer header.
 * Locally the harness cookie is used instead; both are sent. */
function authH() { let t = null; try { t = localStorage.getItem('van_token'); } catch (_) {} return t ? { Authorization: 'Bearer ' + t } : {}; }
async function api(path, body) {
  const r = await fetch(path, body === undefined ? { headers: authH() } : { method: 'POST', headers: { 'Content-Type': 'application/json', ...authH() }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/'; throw new Error('Sign in first.'); }
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Nothing was saved.');
  return j;
}
async function savePdf(id) {
  const r = await fetch('/api/c2m/pricedocs/' + id + '/pdf', { headers: authH() });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'The PDF could not be made.'); }
  const url = URL.createObjectURL(await r.blob()); const a = document.createElement('a');
  a.href = url; a.download = ((r.headers.get('content-disposition') || '').match(/filename="?([^";]+)/) || [, 'VAN price list.pdf'])[1]; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
async function load() { ST = await api('/api/c2m/state'); if (!ST.me.nav.includes(scr)) scr = ST.me.nav[0]; render(); }
async function act(path, body, okMsg) { try { const j = await api(path, body); if (okMsg) toast(typeof okMsg === 'function' ? okMsg(j) : okMsg); await load(); return j; } catch (e) { toast(e.message, true); return null; } }

/* ---------- Lookups ---------- */
const packIdx = () => { const m = new Map(); (ST.products || []).forEach(p => p.packs.forEach(k => m.set(k.id, { ...k, product: p }))); return m; };
const packLabel = k => `${k.product.brand} ${k.size} ${k.product.soldPer}`;
function inP(d) { if (period === 'fy') return d >= fyStart(); if (period === 'month') return d.slice(0, 7) === ST.today.slice(0, 7); if (period === '3m') return d >= addDays(ST.today, -91); return d.slice(0, 7) === month; }
function fyStart() { const y = Number(ST.today.slice(0, 4)), m = Number(ST.today.slice(5, 7)); return (m >= 7 ? y : y - 1) + '-07-01'; }
function addDays(s, n) { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const pkey = r => r.brand + ' · ' + r.pack;

/* ---------- Margin maths (mirrors c2m-lib.js) ---------- */
function grp(rows, key) {
  const m = new Map();
  rows.forEach(r => { const k = key(r); if (!m.has(k)) m.set(k, { key: k, rows: [], sales: 0, costed: 0, cost: 0, kg: 0, tw: 0, tv: 0, bw: 0, bv: 0 }); const g = m.get(k); const v = r.kg * r.price;
    g.rows.push(r); g.sales += v; g.kg += r.kg; if (r.cost != null) { g.costed += v; g.cost += r.kg * r.cost; if (r.target != null) { g.tw += v * r.target; g.tv += v; } if (r.budget != null) { g.bw += v * r.budget; g.bv += v; } } });
  return [...m.values()].map(g => { g.gp = g.costed ? (g.costed - g.cost) / g.costed * 100 : null; g.target = g.tv ? g.tw / g.tv : null; g.budget = g.bv ? g.bw / g.bv : null; return g; });
}
/** Red needs a Rs gap above red_share_pct % of all white label sales in the chosen period (ruled 16 Oct, 5j 3). */
function redRs() { const t = (ST.sales || []).filter(r => r.grp === 'White label' && inP(r.date)).reduce((s, r) => s + r.kg * r.price, 0); const sh = SET('red_share_pct'); return (sh == null ? 1 : sh) / 100 * t; }
function flag(g) {
  if (g.gp == null) return ['p-none', 'cost to load'];
  if (g.gp < 0) return ['p-red', 'below cost'];
  if (g.target == null && g.budget == null) return ['p-none', 'no target'];
  if (g.target != null && g.gp < g.target - 0.05) { const gap = g.target - g.gp, imp = gap / 100 * g.costed; return gap > SET('red_gap_pts') && imp > redRs() ? ['p-red', 'below target'] : gap > SET('red_gap_pts') ? ['p-amber', `${gap.toFixed(1)} pts below target, small Rs`] : ['p-amber', 'slightly below target']; }
  if (g.budget != null && g.gp < g.budget - 0.05) return ['p-amber', 'below budget'];
  return ['p-green', 'on target'];
}
/* Exposure per white label client pack (ruling 14 Oct, 5f) */
function exposure() {
  const P = packIdx(); const out = [];
  const first = (ST.sales || []).length ? ST.sales[0].date : ST.today;
  const months = Math.max(1, (new Date(ST.today) - new Date(first < addDays(ST.today, -91) ? addDays(ST.today, -91) : first)) / (30.44 * 864e5));
  const since = addDays(ST.today, -91);
  for (const [id, k] of P) {
    if (k.product.grp !== 'White label' || !k.cost || k.price == null) continue;
    const shipped = (ST.sales || []).filter(s => s.packId === id && s.date >= since).reduce((s, x) => s + x.kg, 0);
    const openKg = (ST.open || []).filter(o => o.packId === id).reduce((s, x) => s + x.kg, 0);
    // Expected kg: the budget's annual kg spread over the horizon, shared across the product's packs by kg shipped; else the last 3 months' run rate.
    const sibs = k.product.packs.map(x => x.id); const sibKg = (ST.sales || []).filter(s => sibs.includes(s.packId) && s.date >= since).reduce((s, x) => s + x.kg, 0);
    const share = sibs.length === 1 ? 1 : sibKg ? shipped / sibKg : 1 / sibs.length;
    const byBudget = fbasis === 'budget' && k.product.budgetKg > 0; const kg3 = Math.round(byBudget ? k.product.budgetKg / 12 * SET('forward_months') * share : shipped / months * SET('forward_months'));
    const c = k.cost.total, t = k.product.target, price = k.price;
    const tp = t == null ? null : c / (1 - t / 100); const gap = tp == null ? 0 : Math.max(tp - price, 0);
    const gp = (price - c) / price * 100;
    const locked = tp == null ? 0 : (ST.open || []).filter(o => o.packId === id).reduce((s, o) => s + Math.max(tp - o.price, 0) * o.kg, 0);
    out.push({ id, cust: k.product.customer, prod: packLabel(k), brand: k.product.brand, pack: k.size, price, c, tp, gp, target: t, gapPts: t == null ? 0 : t - gp, kg3, basis: byBudget ? 'budget' : 'run rate', openKg,
      locked, fwd: gap * Math.max(kg3 - openKg, 0), fwdLoss: Math.max(c - price, 0) * Math.max(kg3 - openKg, 0), floor: k.floor, priceFrom: k.priceFrom, unit: k.product.soldPer === 'L' ? 'L' : 'kg' });
  }
  return out;
}

/* ---------- Jobs for Today ---------- */
function jobs() {
  const R = ST.me.role, J = [];
  (ST.recipes || []).forEach(v => { if (STEP_ROLE[v.state] === R) J.push({ t: `${MYJOB[v.state]}: ${v.brand} for ${v.customer}, version ${v.version}`, d: v.sentBack && v.state === 'draft' ? `Sent back: ${v.sentBack.reason}. Advice: ${v.sentBack.advice}` : (v.note || ''), btn: 'Open recipe', go: () => { scr = 'recipes'; openRec = v.id; } }); });
  if (R === 'cfo') {
    (ST.reapprovals || []).forEach(x => J.push({ t: `Re-approve cost: ${pl(x.items.length, 'pack', 'packs')} moved over ${SET('reapprove_pct')}%`, d: 'Cause: ' + x.cause, btn: 'Open re-approval', go: () => { scr = 'recipes'; openRec = null; } }));

  const P = new Map((ST.products || []).map(p => [p.id, p])); const T = new Map((ST.productTypes || []).map(t => [t.id, t.name]));
  const extra = [r.scopeForm ? r.scopeForm + 's' : '', r.scopeReprocessed == null ? '' : Number(r.scopeReprocessed) ? 'reprocessed' : 'not reprocessed', r.scopePackMin != null ? 'packs from ' + Number(r.scopePackMin) : '', r.scopePackMax != null ? 'packs below ' + Number(r.scopePackMax) : ''].filter(Boolean).join(', ');
  if ((r.products || []).length) return pl(r.products.length, 'product', 'products') + ': ' + r.products.map(id => P.get(id) ? `${P.get(id).brand} (${P.get(id).customer})` : id).join(', ') + (extra ? '; ' + extra : '');
  if (r.scopeBaseProductId != null) return 'Product type: ' + (T.get(r.scopeBaseProductId) || '?') + (extra ? '; ' + extra : '');
  return (Number(r.isBase) ? 'Base band, all products' : 'All products (beats the bands)') + (extra ? ': ' + extra : '');
}

/* ---------- Events ---------- */
const val = id => ($(id) || {}).value;
document.addEventListener('click', async e => {
  const t = e.target.closest('button,tr.go,a[data-signout],input[type=checkbox]'); if (!t) return; const d = t.dataset;
  // 2-step approvals: the first tap asks, the second acts (UX review)
  if (d.confirm && !d.armed) { const was = t.textContent; d.armed = '1'; t.textContent = d.confirm; t.classList.add('warn'); setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = was; t.classList.remove('warn'); } }, 6000); return; }
  if ('signout' in d) { e.preventDefault(); try { localStorage.removeItem('van_token'); } catch (_) {} await fetch('/harness/logout', { method: 'POST' }).catch(() => {}); location.href = '/'; return; }
  if (d.scr) { scr = d.scr; drill = { cust: null, prod: null }; openRec = null; sub = null; propose = null; trial = null; ptrial = null; boDoc = null; ask = null; window.scrollTo(0, 0); }
  else if (d.job != null) { const j = jobs()[+d.job]; if (j && j.go) j.go(); }
  else if (d.fb) fbasis = d.fb;
  else if (d.hist) hist = d.hist;
  else if (d.per) period = d.per; else if (d.mon) { period = 'any'; month = d.mon; }
  else if ('home' in d) drill = { cust: null, prod: null };
  else if (d.cust != null && !d.propose) { scr = 'margin'; drill = { cust: d.cust, prod: d.prod || null }; window.scrollTo(0, 0); }
  else if (d.rec) { scr = 'recipes'; openRec = +d.rec; sendBack = null; editLines = null; window.scrollTo(0, 0); }
  else if ('recback' in d) openRec = null;
  else if (d.adv) { await act(`/api/c2m/recipes/${d.adv}/advance`, {}, j => j.state === 'approved' ? 'Cost approved. Margin updated.' : 'Sent on.'); return; }
  else if (d.sb) sendBack = +d.sb; else if ('sbcancel' in d) sendBack = null;
  else if (d.sbsend) { const r = await act(`/api/c2m/recipes/${d.sbsend}/sendback`, { reason: val('sbr'), advice: val('sba') }, 'Sent back to Majid'); if (r) sendBack = null; return; }
  else if ('newrec' in d) { newRec = {}; }
  else if ('nrcancel' in d) newRec = null;
  else if ('nrsave' in d) { const cpId = +val('nrp'); const p = (ST.products || []).find(x => x.id === cpId); const r = await act('/api/c2m/recipes/new', { clientProductId: cpId, fromVersionId: p ? (p.approvedVersionId || p.latestVersionId) : null, note: val('nrn') }, 'Draft started'); if (r) { newRec = null; openRec = r.id; render(); } return; }
  else if (d.editlines) { const v = ST.recipes.find(x => x.id === +d.editlines); editLines = { id: v.id, lines: v.lines.map(l => ({ gradeId: l.gradeId, qty: l.qty })) }; }
  else if ('elAdd' in d) editLines.lines.push({ gradeId: (ST.rates || [])[0].gradeId, qty: 0.01 });
  else if (d.elDel != null) editLines.lines.splice(+d.elDel, 1);
  else if ('elCancel' in d) editLines = null;
  else if (d.elSave) { const r = await act(`/api/c2m/recipes/${d.elSave}/lines`, { lines: editLines.lines }, 'Lines saved'); if (r) editLines = null; return; }
  else if (d.reapp) { await act(`/api/c2m/reapprovals/${d.reapp}/approve`, {}, 'Re-approved. New costs apply from now.'); return; }
  else if (d.reappsome) { const ids = [...document.querySelectorAll(`[data-rpi^="${d.reappsome}:"]`)].filter(x => x.checked).map(x => +x.dataset.rpi.split(':')[1]); await act(`/api/c2m/reapprovals/${d.reappsome}/approve`, { packIds: ids }, `Re-approved ${pl(ids.length, 'pack', 'packs')}. The rest keep their approved cost.`); return; }
  else if (d.reappno) ask = { kind: 'reappno', id: +d.reappno };
  else if ('askcancel' in d) ask = null;
  else if ('askok' in d) { const why = val('askw'); if (!String(why || '').trim()) { toast('Write the reason first.', true); return; } const A = ask;
    const j = A.kind === 'reappno' ? await act(`/api/c2m/reapprovals/${A.id}/dismiss`, { why }, r => 'Closed. Approved costs unchanged.' + (r.reapproval ? ` ${pl(r.reapproval, 'pack', 'packs')} still moved for another reason: new item added.` : ''))
      : A.kind === 'pwd' ? await act(`/api/c2m/prices/${A.id}/withdraw`, { why }, r => 'Withdrawn. Today\'s price stays as it was.' + (r.issuedDocs && r.issuedDocs.length ? ' Already issued with that price: ' + r.issuedDocs.join(', ') + '. Tell the client.' : ''))
      : A.kind === 'lwd' ? await act(`/api/c2m/lists/revisions/${A.id}/withdraw`, { why }, 'Withdrawn. The list stays as it is.')
      : A.kind === 'retire' ? await act(`/api/c2m/rules/conversion/${A.id}/retire`, { why }, r => r.reapproval ? `Retired. ${pl(r.reapproval, 'pack', 'packs')} to re-approve.` : 'Retired.')
      : await act(`/api/c2m/products/${A.id}/type`, { newType: why }, 'Product type added and set');
    if (j) ask = null; return; }
  else if (d.rpi) return;
  else if (d.reproc) { await act(`/api/c2m/products/${d.reproc}/reprocessed`, { on: t.checked }, j => j.reapproval ? 'Saved. Cost moved: re-approval added.' : 'Saved'); return; }
  else if (d.try) { trial = { gradeId: +d.try, rate: (ST.rates.find(r => r.gradeId === +d.try) || {}).rate, source: '', conf: false, res: null }; render(); $('trf') && $('trf').scrollIntoView({ block: 'center' }); return; }
  else if ('trcalc' in d) { trial.rate = Number(val('trv')); trial.source = val('trs'); try { trial.res = await api('/api/c2m/rates/try', { gradeId: trial.gradeId, rate: trial.rate }); } catch (err) { toast(err.message, true); } }
  else if ('trdrop' in d) { trial = null; toast('Dropped. Nothing changed.'); }
  else if ('trsave' in d) { const r = await act('/api/c2m/rates', { gradeId: trial.gradeId, rate: Number(val('trv')), source: val('trs'), confirmed: trial.conf }, j => j.reapproval ? `Saved. ${pl(j.reapproval, 'pack', 'packs')} moved over ${SET('reapprove_pct')}%: re-approval added to Today.` : 'Saved.'); if (r) trial = null; return; }
  else if (d.ptry) { ptrial = { itemId: +d.ptry, price: (ST.packingItems.find(i => i.id === +d.ptry) || {}).price, source: '', conf: false }; }
  else if ('ptdrop' in d) ptrial = null;
  else if ('ptsave' in d) { const r = await act('/api/c2m/packing/rate', { itemId: ptrial.itemId, price: Number(val('ptv')), source: val('pts'), confirmed: ptrial.conf }, j => j.reapproval ? `Saved. ${pl(j.reapproval, 'pack', 'packs')} to re-approve.` : 'Saved.'); if (r) ptrial = null; return; }
  else if (d.sub) { sub = d.sub; propose = null; }
  else if (d.pgrp) pgrp = d.pgrp;
  else if (d.propose) { const k = packIdx().get(+d.propose); const tp = k && k.cost && k.product.target != null ? Math.ceil(k.cost.total / (1 - k.product.target / 100)) : Math.ceil((k && k.price) || 0); propose = { packId: +d.propose, v: tp }; render(); $('pf') && $('pf').scrollIntoView({ block: 'center' }); return; }
  else if ('pcancel' in d) propose = null;
  else if ('psend' in d) { const r = await act('/api/c2m/prices/propose', { packId: propose.packId, price: Number(val('ppv')), validFrom: val('ppf') || undefined, validTo: val('ppt') || undefined, reason: val('ppn'), belowReason: val('ppr'), replaceId: propose.replaceId }, 'Sent to Tahir. It is on his Today list.'); if (r) propose = null; return; }
  else if (d.presend) { const p = ST.proposals.find(x => x.id === +d.presend); propose = { packId: p.packId, v: p.price, was: p.backReason, reason: p.reason, r: p.belowReason, replaceId: p.id }; render(); $('pf') && $('pf').scrollIntoView({ block: 'center' }); return; }
  else if (d.pok) { await act(`/api/c2m/prices/${d.pok}/approve`, {}, j => (j.waitsUntil ? `Approved. It takes over on ${fmtD(j.waitsUntil)}; today's price stays until then.` : 'Approved. Price lists and margin updated.') + (j.cancelled ? ' The price that was waiting for a later date is cancelled.' : '')); return; }
  else if (d.pwd) ask = { kind: 'pwd', id: +d.pwd };
  else if (d.lwd) ask = { kind: 'lwd', id: +d.lwd };
  else if (d.pback) propose = { back: +d.pback }; else if ('pbcancel' in d) propose = null;
  else if (d.pbsend) { const r = await act(`/api/c2m/prices/${d.pbsend}/sendback`, { reason: val('pbr') }, 'Sent back to Yawar'); if (r) propose = null; return; }
  else if (d.revstart) { rev = { list: d.revstart, vals: {} }; render(); $('revf') && $('revf').scrollIntoView({ block: 'start' }); return; }
  else if ('revcancel' in d) rev = null;
  else if ('revsend' in d) { const items = {}; Object.entries(rev.vals).forEach(([k, v]) => { if (v === '' || v == null) return; const [id, f] = k.split(':'); (items[id] = items[id] || { id: +id, values: {} }).values[f] = f === 'disc' ? String(Number(v) / 100) : v; });
    const j = await act('/api/c2m/lists/revise', { list: rev.list, items: Object.values(items), reason: val('rvr'), validFrom: val('rvf'), validTill: val('rvt') || null, replaceId: rev.replaceId }, j => `Sent to Tahir: ${pl(j.rows, 'price', 'prices')}.`); if (j) rev = null; return; }
  else if (d.lrok) { await act(`/api/c2m/lists/revisions/${d.lrok}/approve`, {}, j => j.waitsUntil ? `Approved. It takes effect on ${fmtD(j.waitsUntil)}; the list stays as it is until then.` : 'Approved. The list and its dates are updated.'); return; }
  else if (d.lrback) rev = { back: +d.lrback };
  else if (d.lrbsend) { const j = await act(`/api/c2m/lists/revisions/${d.lrbsend}/sendback`, { reason: val('lrbr') }, 'Sent back to Yawar'); if (j) rev = null; return; }
  else if (d.lrredo) { const r = ST.listRevisions.find(x => x.id === +d.lrredo); const vals = {}; r.items.forEach(i => Object.entries(i.to).forEach(([f, v]) => { vals[i.id + ':' + f] = v; })); rev = { list: r.list_name, vals, reason: r.reason, from: String(r.valid_from).slice(0, 10), till: r.valid_till ? String(r.valid_till).slice(0, 10) : '', was: r.back_reason, replaceId: r.id }; }
  else if (d.goPrices) { scr = 'prices'; sub = d.goPrices; }
  else if (d.col) { cols[d.col] = t.checked; }
  else if (d.aud) { PLB.aud = d.aud; PLB.effSet = PLB.tillSet = false; }
  else if (d.plf) { PLB.pick[PLB.aud][d.plf] = t.checked; }
  else if (d.list) { listSel = d.list; }
  else if ('mkpdf' in d) { const a = PLB.aud; const pick = PLB.pick[a] || Object.fromEntries(fieldsFor(a).map(f => [f[0], !!f[2]])); try { const j = await api('/api/c2m/pricedocs', { audience: a, client: PLB.client, fields: fieldsFor(a).map(f => f[0]).filter(k => pick[k]), eff: PLB.effSet ? PLB.eff : undefined, till: PLB.tillSet ? PLB.till : undefined, note: PLB.note, reasons: PLB.reasons }); await savePdf(j.id); toast('PDF created: ' + (j.ref || 'see your downloads')); } catch (err) { toast(err.message, true); } await load(); return; }
  else if (d.bo) { bo = d.bo; boDoc = null; corr = null; billEdit = null; ask = null; window.scrollTo(0, 0); }
  else if (d.imp) { await act(`/api/c2m/import/${d.imp}/accept`, {}, 'Accepted under your name'); return; }
  else if (d.impc) corr = +d.impc; else if ('impcancel' in d) corr = null;
  else if (d.impsave) { const r = await act(`/api/c2m/import/${d.impsave}/correct`, { value: val('cv'), why: val('cw'), confirmed: !!($('cconf') && $('cconf').checked) }, j => j.reapproval ? `Saved. ${pl(j.reapproval, 'pack', 'packs')} to re-approve.` : j.kind === 'note' ? 'Recorded. Nothing in C2M changes from a note; make the change on its screen.' : 'Saved into C2M'); if (r) corr = null; return; }
  else if ('sync' in d) { await act('/api/c2m/sync', {}, j => `Pulled O2S: ${j.poLines} PO lines, ${j.trucks} trucks, ${pl(j.issues.length, 'issue', 'issues')}.`); return; }
  else if (d.grant) { const [u, k, v] = d.grant.split('|'); await act('/api/c2m/grants', { username: u, kind: k, value: v, on: t.checked }, t.checked ? 'Granted' : 'Removed'); return; }
  else if ('setsave' in d) { const ch = {}; (ST.settings || []).forEach(s => { const v = val('set-' + s.k); if (v != null) ch[s.k] = v; }); await act('/api/c2m/settings', { changes: ch }, j => j.pending ? 'Sent to Tahir for approval.' + (j.applied ? ' Other changes saved; Tahir notified.' : '') : j.applied ? 'Saved. Tahir is notified.' : 'Nothing changed.'); return; }
  else if (d.setok) { await act(`/api/c2m/settings/requests/${d.setok}/approve`, {}, 'Approved. New thresholds apply.'); return; }
  else if (d.setno) { await act(`/api/c2m/settings/requests/${d.setno}/refuse`, {}, 'Refused.'); return; }
  else if (d.treq) { await act('/api/c2m/targets/request', { clientProductId: +d.treq, toGp: Number(val('tg-' + d.treq)), reason: val('tr-' + d.treq) }, 'Sent to Tahir'); return; }
  else if (d.tok) { await act(`/api/c2m/targets/${d.tok}/approve`, {}, 'Target approved'); return; }
  else if (d.tno) { await act(`/api/c2m/targets/${d.tno}/refuse`, {}, 'Refused'); return; }
  else if (d.rfs) { Object.assign(rf, { scope: d.rfs, name: val('crn'), kind: val('crk'), rs: val('crr'), from: val('crv') }); }
  else if (d.rfp) { Object.assign(rf, { name: val('crn'), kind: val('crk'), rs: val('crr'), from: val('crv') }); rf.picks[d.rfp] = t.checked; render(); return; }
  else if ('rfall' in d) { document.querySelectorAll('[data-rfp]').forEach(x => { rf.picks[x.dataset.rfp] = true; }); }
  else if ('rfnone' in d) rf.picks = {};
  else if ('crsave' in d) { const j0 = await act('/api/c2m/rules/conversion', { name: val('crn'), kind: val('crk'), rsPerKg: val('crr'), validFrom: val('crv'), scope: rf.scope, baseProductId: val('crt') || null, productIds: Object.keys(rf.picks).filter(k => rf.picks[k]).map(Number), form: val('crf') || null, reprocessed: val('crp2'), packMin: val('crmin') || null, packMax: val('crmax') || null }, j => j.reapproval ? `Rate saved and applied. ${pl(j.reapproval, 'pack', 'packs')} moved over ${SET('reapprove_pct')}%: re-approval added.` : 'Rate saved and applied'); if (j0) rf = { scope: 'general', picks: {} }; return; }
  else if ('actsave' in d) { await act('/api/c2m/actuals', { month: val('am'), labour: Number(val('al')), foh: Number(val('af')) }, 'Saved'); return; }
  else if (d.chk) { const m = addDays(ST.today.slice(0, 7) + '-01', -1).slice(0, 7); await act('/api/c2m/checks', { month: m, kind: d.chk, data: d.chk === 'tie_books' ? { erpSales: Number(val('tbs')), erpCogs: Number(val('tbc')) } : null }, 'Recorded'); return; }
  else if (d.doc || d.gdoc) { const f = d.doc || d.gdoc; try { const r = await fetch('/api/c2m/docs/' + encodeURIComponent(f), { headers: authH() }); boDoc = { f, text: await r.text() }; } catch (err) { toast(err.message, true); } }
  else if ('billnew' in d) billEdit = { name: '', lines: [{ itemId: (ST.packingItems || [])[0].id, level: 'primary', pieces: 1 }] };
  else if (d.billedit) { const b = ST.packingBills.find(x => x.id === +d.billedit); billEdit = { id: b.id, name: b.name, lines: b.lines.map(l => ({ itemId: l.itemId, level: l.level, pieces: l.pieces, packsPerOuter: l.packsPerOuter })) }; }
  else if ('blAdd' in d) billEdit.lines.push({ itemId: (ST.packingItems || [])[0].id, level: 'primary', pieces: 1 });
  else if (d.blDel != null) billEdit.lines.splice(+d.blDel, 1);
  else if ('blCancel' in d) billEdit = null;
  else if ('blSave' in d) { billEdit.name = val('ben'); const r = await act('/api/c2m/packing/bill', billEdit, j => j.reapproval ? `Saved and approved. ${pl(j.reapproval, 'pack', 'packs')} to re-approve.` : 'Packing bill saved and approved'); if (r) billEdit = null; return; }
  else if ('mtsave' in d) { await act('/api/c2m/materials', { name: val('mtn'), typeId: +val('mtt'), unit: val('mtu'), grade: val('mtg'), rate: val('mtr'), source: val('mts') }, 'Material added with its rate'); return; }
  else if (d.nut) nutEdit = +d.nut;
  else if (d.matf) matFilter = d.matf;
  else if (d.mclassno) delete matPend[d.mclassno];
  else if (d.mclassok) { const id = d.mclassok, tp = (ST.materialTypes || []).find(x => x.id === matPend[id]); const j = await act(`/api/c2m/materials/${id}/type`, { typeId: matPend[id] }, `Class saved: now ${tp ? tp.name : ''}`); if (j) delete matPend[id]; return; }
  else if ('nutcancel' in d) nutEdit = null;
  else if (d.nutsave) { const r = (ST.materials || ST.rates || []).find(x => x.gradeId === +d.nutsave); const values = {}; const zero = $('nut0') && $('nut0').checked; r.fields.forEach(f => { const v = val('nut-' + f); values[f] = (v === '' || v == null) && zero ? '0' : v; }); const j = await act(`/api/c2m/grades/${d.nutsave}/nutrients`, { values }, 'Nutrient values saved'); if (j) nutEdit = null; return; }
  else if (d.custedit) custEdit = +d.custedit; else if ('custcancel' in d) custEdit = null;
  else if (d.custsave) { const j = await act(`/api/c2m/customers/${d.custsave}`, { priceRule: val('cer'), cycle: val('cec'), region: val('ceg'), o2sNames: val('cen') }, 'Customer saved'); if (j) custEdit = null; return; }
  else if (d.retire) ask = { kind: 'retire', id: +d.retire };
  else if ('frsave' in d) { await act('/api/c2m/freight', { segment: val('frs'), region: val('frr'), rsPerKg: val('frk'), validFrom: val('frf') }, 'Freight saved'); return; }
  else if ('pinew' in d) { await act('/api/c2m/packing/item', { name: val('pin'), kind: val('pik'), price: Number(val('pip')), source: val('pis') }, 'Packing item added'); return; }
  else return;
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.go')) e.target.click(); });
document.addEventListener('change', async e => {
  const t = e.target, d = t.dataset, id = t.id;
  if (id === 'trc') { trial.conf = t.checked; render(); }
  else if (id === 'ptc') { ptrial.conf = t.checked; render(); }
  else if (id === 'trv') { trial.rate = Number(t.value); trial.res = null; render(); }
  else if (id === 'trs') { trial.source = t.value; render(); }
  else if (id === 'ptv') { ptrial.price = Number(t.value); render(); }
  else if (id === 'pts') { ptrial.source = t.value; render(); }
  else if (id === 'ppv' || id === 'ppf' || id === 'ppt') { propose.v = Number(val('ppv')); propose.from = val('ppf'); propose.till = val('ppt'); propose.reason = val('ppn'); propose.r = val('ppr'); render(); }
  else if (id === 'pcu') { priceCust = t.value; render(); }
  else if (id === 'crq') { rf.q = t.value; render(); }
  else if (id === 'plc') { PLB.client = t.value; PLB.effSet = PLB.tillSet = false; render(); } else if (id === 'ple') { PLB.eff = t.value; PLB.effSet = !!t.value; render(); } else if (id === 'plt') { PLB.till = t.value; PLB.tillSet = true; render(); } else if (id === 'pln') { PLB.note = t.value; render(); }
  else if (d.plr) { PLB.reasons[d.plr] = t.value; render(); }
  else if (d.rv) { rev.vals[d.rv] = t.value; rev.reason = val('rvr'); rev.from = val('rvf'); rev.till = val('rvt'); render(); }
  else if (d.mclass) { matPend[d.mclass] = +t.value; render(); }
  else if (d.ptype) { const v = t.value; if (v === '__new') { ask = { kind: 'ptype', id: +d.ptype }; render(); return; } else await act(`/api/c2m/products/${d.ptype}/type`, { typeId: v ? +v : null }, j => j.reapproval ? 'Type set. Cost moved: re-approval added.' : 'Product type set'); }
  else if (d.assign) { await act('/api/c2m/packing/assign', { packId: +d.assign, billId: t.value ? +t.value : null }, j => j.reapproval ? 'Packing bill set. Cost moved: re-approval added.' : 'Packing bill set'); }
  else if (d.elM != null) editLines.lines[+d.elM].gradeId = +t.value; else if (d.elQ != null) editLines.lines[+d.elQ].qty = Number(t.value);
  else if (d.blI != null) billEdit.lines[+d.blI].itemId = +t.value; else if (d.blL != null) { billEdit.lines[+d.blL].level = t.value; billEdit.name = val('ben'); render(); } else if (d.blP != null) billEdit.lines[+d.blP].pieces = Number(t.value); else if (d.blN != null) billEdit.lines[+d.blN].packsPerOuter = Number(t.value);
});
load().catch(e => { $('app').innerHTML = `<main><h1>C2M could not load.</h1><p class="ans">${esc(e.message)}</p></main>`; });
</script>
</body>
</html>
