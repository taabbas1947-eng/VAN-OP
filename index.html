  const byB={}; log.forEach(p=>{const k=p.brand||p.base;byB[k]=byB[k]||{prod:0,pack:0,ship:0,n:0};byB[k].prod+=p.kg||0;byB[k].n++;}); pack.forEach(p=>{const k=p.brand||p.base;byB[k]=byB[k]||{prod:0,pack:0,ship:0,n:0};byB[k].pack+=p.kg||0;});
  (state.shipments||[]).filter(s=>!rpfMonth||(s.dispatch||'').slice(0,7)===rpfMonth).forEach(s=>{const k=s.brand;byB[k]=byB[k]||{prod:0,pack:0,ship:0,n:0};byB[k].ship+=s.kg||0;});
  const keys=Object.keys(byB).sort((a,b)=>byB[b].prod-byB[a].prod); _rpLast={labels:keys.slice(0,14),data:keys.slice(0,14).map(k=>byB[k].prod)};
  const tot=keys.reduce((a,k)=>({prod:a.prod+byB[k].prod,pack:a.pack+byB[k].pack,ship:a.ship+byB[k].ship,n:a.n+byB[k].n}),{prod:0,pack:0,ship:0,n:0});
  return `<div class="card"><h3>Production by product ${rpfMonth?'· '+rpfMonth:'· all months'} <span class="hint">${tot.n} log entries</span></h3><div style="overflow:auto"><table><thead><tr><th>Product</th><th class="num">Produced</th><th class="num">Packed</th><th class="num">Shipped</th><th class="num">Pack/Prod</th><th class="num">Ship/Pack</th><th class="num">Entries</th></tr></thead><tbody>${keys.map(k=>`<tr><td><b>${k}</b></td><td class="num">${fmt(byB[k].prod)}</td><td class="num">${fmt(byB[k].pack)}</td><td class="num">${fmt(byB[k].ship)}</td><td class="num">${byB[k].prod?Math.round(byB[k].pack/byB[k].prod*100):0}%</td><td class="num">${byB[k].pack?Math.round(byB[k].ship/byB[k].pack*100):0}%</td><td class="num">${byB[k].n}</td></tr>`).join('')}</tbody><tfoot><tr><td><b>Total</b></td><td class="num"><b>${fmt(tot.prod)}</b></td><td class="num"><b>${fmt(tot.pack)}</b></td><td class="num"><b>${fmt(tot.ship)}</b></td><td class="num"><b>${tot.prod?Math.round(tot.pack/tot.prod*100):0}%</b></td><td class="num"><b>${tot.pack?Math.round(tot.ship/tot.pack*100):0}%</b></td><td class="num"><b>${tot.n}</b></td></tr></tfoot></table></div></div><div class="card"><h3>Top products by output</h3><div style="height:260px"><canvas id="rpCanvas"></canvas></div></div>`;
}

/* ---- Lab QC ---- */
function rpLabQC(){ const rows=rpLines().filter(({l})=>l.qcLab||(l.packed>=l.ordered&&l.ordered>0)); if(!rows.length) return rpEmpty('Nothing in Lab QC yet — items appear once fully packed.');
  return `<div class="card"><h3>Lab QC (Layer 1) <span class="hint">${rows.length} items</span></h3><div style="overflow:auto"><table><thead><tr><th>PO</th><th>Product</th><th class="ctr">Result</th><th>Inspector</th><th>Date</th></tr></thead><tbody>${rows.map(({o,l})=>{ const r=l.qcLab?(l.qcLab.pass?'<span class="pill" style="background:var(--green-50);color:var(--green2)">Pass</span>':'<span class="pill" style="background:var(--red-50);color:var(--red)">Fail</span>'):'<span class="pill" style="background:var(--amber-50);color:var(--amber)">Pending</span>'; return `<tr><td><b>${o.po}</b></td><td>${l.brand}</td><td class="ctr">${r}</td><td>${(l.qcLab&&l.qcLab.by)||'—'}</td><td>${(l.qcLab&&l.qcLab.date)||'—'}</td></tr>`; }).join('')}</tbody></table></div></div>`;
}

/* ---- QA Pre-Shipment ---- */
function rpQAQC(){ const rows=rpLines().filter(({l})=>l.qcPhys||(l.qcLab&&l.qcLab.pass)); if(!rows.length) return rpEmpty('Nothing in QA pre-shipment yet — items appear after Lab certifies.');
  return `<div class="card"><h3>QA Pre-Shipment (Layer 2) <span class="hint">${rows.length} items</span></h3><div style="overflow:auto"><table><thead><tr><th>PO</th><th>Product</th><th class="ctr">Result</th><th>Failed items</th><th>Comments</th><th>Inspector</th><th>Date</th></tr></thead><tbody>${rows.map(({o,l})=>{ const q=l.qcPhys; let r='<span class="pill" style="background:var(--amber-50);color:var(--amber)">Pending</span>',fails='—'; if(q){ r=q.pass?'<span class="pill" style="background:var(--green-50);color:var(--green2)">Pass</span>':'<span class="pill" style="background:var(--red-50);color:var(--red)">Fail</span>'; fails=(q.checklist||[]).filter(c=>c.result==='fail').map(c=>c.item).join(', ')||'—'; } return `<tr><td><b>${o.po}</b></td><td>${l.brand}</td><td class="ctr">${r}</td><td>${fails}</td><td>${(q&&q.comments)||'—'}</td><td>${(q&&q.by)||'—'}</td><td>${(q&&q.date)||'—'}</td></tr>`; }).join('')}</tbody></table></div></div>`;
}

/* ---- Shipments ---- */
function rpShip(){ let sh=(state.shipments||[]).slice(); if(rpfMonth) sh=sh.filter(s=>(s.dispatch||'').slice(0,7)===rpfMonth); if(rpfClient){ const pos=new Set(state.orders.filter(o=>o.client===rpfClient).map(o=>o.po)); sh=sh.filter(s=>pos.has(s.po)); }
  if(!sh.length) return rpEmpty('No shipments recorded for this period.');
  const tot=sh.reduce((a,s)=>a+(s.kg||0),0);
  return `<div class="card"><h3>Shipments <span class="hint">${sh.length} dispatches · ${fmt(tot)} Kg/L</span></h3><div style="overflow:auto"><table><thead><tr><th>Date</th><th>PO</th><th>Product</th><th class="num">Qty</th><th>Destination</th><th>Carrier</th><th>Vehicle</th><th>DC #</th><th>Bilty</th><th>Delivered</th></tr></thead><tbody>${sh.map(s=>`<tr><td>${s.dispatch||'—'}${s.time?' '+s.time:''}</td><td><b>${s.po}</b></td><td>${s.brand}</td><td class="num">${fmt(s.kg||0)}</td><td>${s.destination||'—'}</td><td>${s.carrier||'—'}</td><td>${s.vehicle||'—'}</td><td>${s.dc||'—'}</td><td>${s.bilty||'—'}</td><td>${s.delivered||'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ---- Delay / Hold ---- */
function rpDelay(){ const items=[]; rpLines().forEach(({o,l})=>{ if(lineOverdue(o,l)){ const d=Math.round((TODAY-new Date(l.committed))/86400000); items.push({po:o.po,prod:l.brand,issue:'Overdue '+d+'d',detail:'Promised '+(l.committed||'—'),sev:'red'}); } if(l.qcLab&&l.qcLab.pass===false) items.push({po:o.po,prod:l.brand,issue:'Lab QC Fail',detail:(l.qcLab.reason||'—'),sev:'red'}); if(l.qcPhys&&l.qcPhys.fail) items.push({po:o.po,prod:l.brand,issue:'QA Physical Fail',detail:(l.qcPhys.checklist||[]).filter(c=>c.result==='fail').map(c=>c.item).join(', ')||'—',sev:'red'}); if((l.dispatched||0)>(l.ordered||0)+0.5) items.push({po:o.po,prod:l.brand,issue:'Over-supplied +'+fmt(l.dispatched-l.ordered),detail:'Ordered '+fmt(l.ordered)+' · supplied '+fmt(l.dispatched),sev:'amber'}); });
  if(!items.length) return rpEmpty('No delays or holds. Everything is on track.');
  return `<div class="card"><h3>Delays &amp; Holds <span class="hint">${items.length} flags</span></h3><div style="overflow:auto"><table><thead><tr><th>PO</th><th>Product</th><th class="ctr">Issue</th><th>Detail</th></tr></thead><tbody>${items.map(it=>`<tr><td><b>${it.po}</b></td><td>${it.prod}</td><td class="ctr"><span class="pill" style="background:${it.sev==='amber'?'var(--amber-50)':'var(--red-50)'};color:${it.sev==='amber'?'var(--amber)':'var(--red)'}">${it.issue}</span></td><td>${it.detail}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ---- Monthly Production (template-style) ---- */
function rpMonthly(){ const months=rpMonths(); const m=rpfMonth||months[0]||''; if(!m) return rpEmpty('No production logged yet.');
  const log=(state.productionLog||[]).filter(p=>(p.date||'').slice(0,7)===m); const pack=(state.packingLog||[]).filter(p=>(p.date||'').slice(0,7)===m); const sh=(state.shipments||[]).filter(s=>(s.dispatch||'').slice(0,7)===m);
  const prod=log.reduce((a,p)=>a+(p.kg||0),0), packed=pack.reduce((a,p)=>a+(p.kg||0),0), shipped=sh.reduce((a,s)=>a+(s.kg||0),0), batches=log.length;
  const brandPack={}; Object.values(SEED.catalog.brandsByClient||{}).forEach(arr=>arr.forEach(b=>{ if(brandPack[b.brand]==null&&b.pack) brandPack[b.brand]=b.pack; }));
  const byProd={}; log.forEach(p=>{const k=p.brand||p.base;byProd[k]=byProd[k]||{prod:0,pack:0,ship:0};byProd[k].prod+=p.kg||0;}); pack.forEach(p=>{const k=p.brand||p.base;byProd[k]=byProd[k]||{prod:0,pack:0,ship:0};byProd[k].pack+=p.kg||0;}); sh.forEach(s=>{const k=s.brand;byProd[k]=byProd[k]||{prod:0,pack:0,ship:0};byProd[k].ship+=s.kg||0;});
  const pk=Object.keys(byProd).sort((a,b)=>byProd[b].prod-byProd[a].prod);
  const byBrandPack={}; pack.forEach(p=>{const k=p.brand;byBrandPack[k]=(byBrandPack[k]||0)+(p.kg||0);}); const bk=Object.keys(byBrandPack).filter(k=>byBrandPack[k]>0).sort((a,b)=>byBrandPack[b]-byBrandPack[a]);
  const trend=months.slice(0,6).reverse().map(mm=>{ const lg=(state.productionLog||[]).filter(p=>(p.date||'').slice(0,7)===mm).reduce((a,p)=>a+(p.kg||0),0); const pc=(state.packingLog||[]).filter(p=>(p.date||'').slice(0,7)===mm).reduce((a,p)=>a+(p.kg||0),0); const sp=(state.shipments||[]).filter(s=>(s.dispatch||'').slice(0,7)===mm).reduce((a,s)=>a+(s.kg||0),0); return {mm,lg,pc,sp}; });
  const sel=`<div class="card" style="padding:12px 16px"><div class="fld" style="max-width:200px"><label>Report month</label><select onchange="rpfMonth=this.value;screenReports()">${months.map(x=>`<option ${x===m?'selected':''}>${x}</option>`).join('')}</select></div></div>`;
  const kpi=(l,v,d)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d||''}</div></div>`;
  const kpis=`<div class="kpis" style="grid-template-columns:repeat(4,1fr)">${kpi('Produced (Kg/L)',fmt(prod),m)}${kpi('Packed (Kg/L)',fmt(packed),prod?Math.round(packed/prod*100)+'% of produced':'')}${kpi('Shipped (Kg/L)',fmt(shipped),packed?Math.round(shipped/packed*100)+'% of packed':'')}${kpi('# Batches',batches.toLocaleString(),'production log entries')}</div>`;
  const note=`<div class="banner warn">Plan / Target, Attainment %, Variance, Avg Yield % and Downtime are <b>not captured yet</b>, so they are intentionally omitted (not shown as zero). Say the word and I'll add a light Plan &amp; Downtime input to unlock them.</div>`;
  const t1=`<div class="card"><h3>By product <span class="hint">${m}</span></h3><div style="overflow:auto"><table><thead><tr><th>Product</th><th class="num">Produced</th><th class="num">Packed</th><th class="num">Shipped</th></tr></thead><tbody>${pk.length?pk.map(k=>`<tr><td><b>${k}</b></td><td class="num">${fmt(byProd[k].prod)}</td><td class="num">${fmt(byProd[k].pack)}</td><td class="num">${fmt(byProd[k].ship)}</td></tr>`).join(''):'<tr><td colspan=4 class="muted">No entries</td></tr>'}</tbody></table></div></div>`;
  const t2=`<div class="card"><h3>Packing by brand <span class="hint">bags = Kg/L ÷ pack size</span></h3><div style="overflow:auto"><table><thead><tr><th>Brand</th><th class="num">Bags / Packs</th><th class="num">Kg/L Packed</th></tr></thead><tbody>${bk.length?bk.map(k=>`<tr><td><b>${k}</b></td><td class="num">${brandPack[k]?Math.round(byBrandPack[k]/brandPack[k]).toLocaleString():'—'}</td><td class="num">${fmt(byBrandPack[k])}</td></tr>`).join(''):'<tr><td colspan=3 class="muted">No packing logged</td></tr>'}</tbody></table></div></div>`;
  const t3=`<div class="card"><h3>Trend — last ${trend.length} months</h3><div style="overflow:auto"><table><thead><tr><th>Month</th><th class="num">Produced</th><th class="num">Packed</th><th class="num">Shipped</th><th class="num">Pack/Prod</th><th class="num">Ship/Pack</th></tr></thead><tbody>${trend.map(t=>`<tr><td><b>${t.mm}</b></td><td class="num">${fmt(t.lg)}</td><td class="num">${fmt(t.pc)}</td><td class="num">${fmt(t.sp)}</td><td class="num">${t.lg?Math.round(t.pc/t.lg*100):0}%</td><td class="num">${t.pc?Math.round(t.sp/t.pc*100):0}%</td></tr>`).join('')}</tbody></table></div></div>`;
  _rpLast={labels:pk.slice(0,14),data:pk.slice(0,14).map(k=>byProd[k].prod)};
  const chart=`<div class="card"><h3>Output by product — ${m}</h3><div style="height:240px"><canvas id="rpCanvas"></canvas></div></div>`;
  return sel+kpis+note+t1+t2+t3+chart;
}

/* ---- Action Log ---- */
function rpLog(){ let a=(state.audit||[]).slice(); if(rpfMonth) a=a.filter(x=>(x.t||'').slice(0,7)===rpfMonth); if(!a.length) return rpEmpty('No actions logged yet.');
  return `<div class="card"><h3>Action Log <span class="hint">${a.length} entries</span></h3><div style="overflow:auto;max-height:560px"><table><thead><tr><th>When</th><th>User</th><th>Module</th><th>PO</th><th>Product</th><th>Field</th><th>Value</th></tr></thead><tbody>${a.slice(0,400).map(x=>`<tr><td>${(x.t||'').replace('T',' ').slice(0,16)}</td><td>${x.user||'—'}</td><td>${x.module||'—'}</td><td>${x.po||'—'}</td><td>${x.brand||'—'}</td><td>${x.field||'—'}</td><td>${(x.val!=null?String(x.val):'—')}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ===================== AUTH & USERS (soft gate) ===================== */
function authed(){ return !!(state && state.currentUser); }
function allowedScreens(){ return SCREENS.filter(s=>s.owners.includes(state.role)); }
function renderApp(){
  const a=document.getElementById('authScreen'), sh=document.getElementById('appShell');
  if(!authed()){ if(sh)sh.style.display='none'; if(a){a.style.display='flex'; renderLogin();} }
  else { if(a)a.style.display='none'; if(sh)sh.style.display='flex'; render(); }
}
function renderLogin(msg){
  const el=document.getElementById('authScreen'); if(!el) return;
  el.innerHTML=`<div class="authcard">
    <div class="lhdr"><div class="lmark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg></div>
      <div><h2 style="font-size:18px">VAN Ops</h2><div class="lsub">Order → Shipment Control</div></div></div>
    <label>Username</label><input id="lg_user" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
    <label>Password</label><input id="lg_pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    ${msg?`<div class="autherr">${msg}</div>`:''}
    <button class="green lbtn" onclick="doLogin()">Sign in</button>
    <div style="font-size:10.5px;color:var(--mut);margin-top:14px;line-height:1.5">Internal access only. Contact the COO to add or reset an account.</div></div>`;
  const u=document.getElementById('lg_user'); if(u&&u.focus)u.focus();
}
async function doLogin(){
  const u=($('lg_user').value||'').trim().toLowerCase();
  const p=$('lg_pass').value||'';
  let r; try{ r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}); }catch(e){ renderLogin('Cannot reach the server. Check your connection and try again.'); return; }
  if(!r.ok){ renderLogin('Incorrect username or password.'); return; }
  const j=await r.json(); setSession(j.token, j.user);
  let loaded=false;
  try{ const sr=await fetch('/api/state',{cache:'no-store',headers:authHdr()}); if(sr.ok){ const sj=await sr.json(); _rev=sj.rev||0; if(sj.data&&sj.data.orders){ state=ensureState(sj.data); loaded=true; } else if((sj.rev||0)===0 && !sj.data){ state=buildFromSeed(); loaded=true; await saveNow(); } } }catch(e){}
  if(!loaded){ state=buildFromSeed(); }
  sessionInit(state); state.currentUser=j.user; state.role=j.user.role;
  const al=allowedScreens(); state.screen=(al[0]&&al[0].id)||'dash';
  logAction('Signed in'); save();
  renderApp(); startSync();
}
function logout(){ if(state.currentUser){ logAction('Signed out'); saveNow(); } setSession('',null); renderApp(); }

/* ---- Users & Access (COO only) ---- */
let uForm={name:'',username:'',password:'',role:'KAM'};
async function loadUsers(){ try{ const r=await fetch('/api/users',{headers:authHdr()}); if(r.status===401){ setSession('',null); renderApp(); return; } if(r.ok) usersList=await r.json(); }catch(e){} if(state.screen==='users') paintUsers(); }
function screenUsers(){ if(state.role!=='COO'){ $('view').innerHTML='<div class="banner warn">Users & Access is managed by the <b>COO</b> only.</div>'; return; } paintUsers(); loadUsers(); }
function paintUsers(){
  if(state.role!=='COO') return;
  const us=usersList||[]; const me=state.currentUser&&state.currentUser.username;
  $('view').innerHTML=`<div class="banner info">Add people and assign each a role. They sign in with their username + password and see only their role's screens. Passwords are stored <b>securely on the server</b> (hashed) and are never shown or sent to browsers.</div>
   <div class="card"><h3>Add a person</h3><div class="formgrid">
     <div class="fld"><label>Full name</label><input value="${uForm.name}" oninput="uForm.name=this.value" placeholder="e.g. Muhammad Imran"></div>
     <div class="fld"><label>Username</label><input value="${uForm.username}" oninput="uForm.username=this.value" placeholder="e.g. imran"></div>
     <div class="fld"><label>Password</label><input type="password" value="${uForm.password}" oninput="uForm.password=this.value" placeholder="set a password"></div>
     <div class="fld"><label>Role</label><select onchange="uForm.role=this.value">${SEED.roles.map(r=>`<option ${r===uForm.role?'selected':''}>${r}</option>`).join('')}</select></div>
   </div><button class="green" style="margin-top:13px" onclick="addUser()">Add person</button></div>
   <div class="card"><h3>People <span class="hint">${us.length} accounts</span></h3><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th class="ctr">Actions</th></tr></thead><tbody>${us.map(u=>`<tr><td><b>${u.name}</b>${u.username===me?' <span class="pill" style="background:var(--navy-50);color:var(--navy)">you</span>':''}</td><td>${u.username}</td><td>${u.role}</td><td class="ctr"><button class="sm ghost" onclick="openEditUser('${u.username}')">Edit</button> <button class="sm ghost" onclick="delUser('${u.username}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
async function addUser(){ const n=(uForm.name||'').trim(), u=(uForm.username||'').trim().toLowerCase(), p=uForm.password||'';
  if(!n||!u||!p){toast('Name, username and password are all required');return;}
  try{ const r=await fetch('/api/users',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHdr()),body:JSON.stringify({name:n,username:u,password:p,role:uForm.role})});
    if(r.status===409){toast('That username already exists');return;}
    if(!r.ok){toast('Could not add user');return;}
    logAction('Added user '+u+' as '+uForm.role); save();
    uForm={name:'',username:'',password:'',role:'KAM'}; toast('Added '+n); loadUsers();
  }catch(e){ toast('Network error'); }
}
async function delUser(username){ const u=(usersList||[]).find(x=>x.username===username); if(!u)return;
  if(state.currentUser&&state.currentUser.username===username){toast('You cannot delete your own account');return;}
  if(typeof confirm==='function' && !confirm('Delete '+u.name+'?')) return;
  try{ const r=await fetch('/api/users/'+encodeURIComponent(username),{method:'DELETE',headers:authHdr()});
    if(!r.ok){ const j=await r.json().catch(()=>({})); toast(j.error||'Could not delete'); return; }
    logAction('Deleted user '+username); save(); loadUsers();
  }catch(e){ toast('Network error'); }
}
let uEdit={username:'',name:'',newUsername:'',password:'',role:'KAM'};
function openEditUser(username){ if(state.role!=='COO')return; const u=(usersList||[]).find(x=>x.username===username); if(!u)return; uEdit={username:u.username,name:u.name,newUsername:u.username,password:'',role:u.role}; renderEditUser(); $('modalBg').classList.add('open'); }
function renderEditUser(){ const self=state.currentUser&&state.currentUser.username===uEdit.username;
  $('modal').innerHTML=`<div class="mh"><h2>Edit person</h2><div class="sub">${uEdit.username||''}${self?' · this is you':''}</div></div>
  <div class="mb"><div class="formgrid" style="grid-template-columns:1fr 1fr">
    <div class="fld"><label>Full name</label><input value="${uEdit.name}" oninput="uEdit.name=this.value"></div>
    <div class="fld"><label>Username</label><input value="${uEdit.newUsername}" oninput="uEdit.newUsername=this.value"></div>
    <div class="fld"><label>New password <span class="muted" style="text-transform:none">(blank = keep)</span></label><input type="password" value="${uEdit.password}" oninput="uEdit.password=this.value" placeholder="leave blank to keep"></div>
    <div class="fld"><label>Role</label><select onchange="uEdit.role=this.value">${SEED.roles.map(r=>`<option ${r===uEdit.role?'selected':''}>${r}</option>`).join('')}</select></div>
  </div><div class="muted" style="font-size:11px;margin-top:11px">Leave password blank to keep the current one. If you change your OWN account, you'll be signed out to sign in again.</div></div>
  <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="green" onclick="saveEditUser()">Save changes</button></div>`; }
async function saveEditUser(){ const old=uEdit.username; const n=(uEdit.name||'').trim(), un=(uEdit.newUsername||'').trim().toLowerCase();
  if(!n||!un){toast('Name and username are required');return;}
  const body={name:n,username:un,role:uEdit.role}; if(uEdit.password) body.password=uEdit.password;
  try{ const r=await fetch('/api/users/'+encodeURIComponent(old),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},authHdr()),body:JSON.stringify(body)});
    if(r.status===409){toast('That username already exists');return;}
    if(!r.ok){ const j=await r.json().catch(()=>({})); toast(j.error||'Could not save'); return; }
    logAction('Edited user '+un); save(); closeModal(); toast('Saved');
    if(state.currentUser && state.currentUser.username===old){ toast('Your account changed — please sign in again'); setTimeout(function(){ setSession('',null); renderApp(); },800); return; }
    loadUsers();
  }catch(e){ toast('Network error'); }
}

bootState();
</script>
</body></html>
